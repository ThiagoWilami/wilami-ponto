// Banco central em TEMPO REAL (Firestore) com fallback para localStorage.
// Cada "fatia" do estado (clts, freelas, escala, registros...) vira um documento
// em "wilami/{key}". onSnapshot mantém todos os aparelhos sincronizados ao vivo.
// ===== MULTI-CLIENTE (multiempresa): cada cliente tem dados ISOLADOS =====
// Cliente ativo: vem do parâmetro ?t= (links de ponto) ou do localStorage (painel).
// "" (vazio) = Cliente principal → usa os caminhos ATUAIS (nenhum dado é migrado).
const WP_TENANT = (function(){ try{ const u=new URLSearchParams(location.search); const t=(u.get("t")||"").trim(); if(t) return t; return (localStorage.getItem("wp_tenant")||"").trim(); }catch(e){ return ""; } })();
try{ window.__WPTENANT = WP_TENANT; }catch(e){}
// caminhos com namespace do cliente (cliente principal usa os caminhos legados)
function tDoc(key){ const db=window.__WPDB; return WP_TENANT ? db.collection("tenants").doc(WP_TENANT).collection("wilami").doc(key) : db.collection("wilami").doc(key); }
function tCol(name){ const db=window.__WPDB; return WP_TENANT ? db.collection("tenants").doc(WP_TENANT).collection(name) : db.collection(name); }
// Monta um link de ponto público carregando o cliente atual (?t=...) para o celular do colaborador.
function comTenantUrl(baseNoHash, hashPart){
  let u=String(baseNoHash||"");
  if(WP_TENANT){ u += (u.indexOf("?")>=0?"&":"?") + "t=" + encodeURIComponent(WP_TENANT); }
  return u + (hashPart?("#"+hashPart):"");
}
const tKey=(key)=> "wp_"+(WP_TENANT?WP_TENANT+"_":"")+key;
// Login por USUÁRIO ou e-mail → e-mail resolvido (mesmo critério da tela de login).
const emailDeLogin=(v)=>{ v=(v||"").trim(); return v.includes("@")?v.toLowerCase():(v.toLowerCase().replace(/\s+/g,"")+"@wilami.app"); };
// Chave de documento para o vínculo de acesso (por e-mail resolvido).
const emailKey=(v)=> emailDeLogin(v).replace(/[^a-z0-9]/g,"_");
// Cria a conta de acesso do gerente SEM deslogar o dono (usa um app Firebase secundário).
async function criarUsuarioAuth(email, senha){
  if(!window.firebase || !window.__WPCFG) throw new Error("sem-firebase");
  const SEC="wp-sec"; let sec;
  try{ sec = (window.firebase.apps||[]).find(a=>a && a.name===SEC) || window.firebase.initializeApp(window.__WPCFG, SEC); }
  catch(e){ sec = window.firebase.app(SEC); }
  const auth2=sec.auth();
  try{
    await auth2.createUserWithEmailAndPassword(emailDeLogin(email), senha);
    try{ await auth2.signOut(); }catch(_){}
    return { criado:true };
  }catch(e){
    try{ await auth2.signOut(); }catch(_){}
    if(e && e.code==="auth/email-already-in-use") return { criado:false, jaExiste:true };
    throw e;
  }
}

function usePersist(key, initial){
  const [v,setV]=useState(()=>{ try{ const s=localStorage.getItem(tKey(key)); return s!=null?JSON.parse(s):initial; }catch{ return initial; } });
  const remoto=useRef(false);
  useEffect(()=>{
    const db=window.__WPDB; if(!db) return;
    try{
      return tDoc(key).onSnapshot(function(snap){
        if(snap && snap.metadata && snap.metadata.hasPendingWrites) return; // ignora eco da própria escrita
        const d=snap && snap.exists ? snap.data() : null;
        if(d && Object.prototype.hasOwnProperty.call(d,"v")){ remoto.current=true; setV(d.v); }
      }, function(){ /* sem permissão/erro — segue com local */ });
    }catch(e){ return; }
  },[key]);
  const setBoth=(upd)=>{
    setV(prev=>{
      const nv = typeof upd==="function" ? upd(prev) : upd;
      try{ localStorage.setItem(tKey(key), JSON.stringify(nv)); }catch{}
      const db=window.__WPDB;
      if(db && !remoto.current){ try{ tDoc(key).set({v:nv}); }catch(e){} }
      remoto.current=false;
      return nv;
    });
  };
  return [v,setBoth];
}

  },[]);
  const add=(obj)=>{ const db=window.__WPDB; if(!db) return Promise.reject(new Error("sem-banco")); return db.collection("tenants").add(obj); };
  return [items,{add}];
}
function haversine(la1,lo1,la2,lo2){
  const R=6371000, r=Math.PI/180, dLa=(la2-la1)*r, dLo=(lo2-lo1)*r;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

const DOBRA_HORAS = 15; // ≥15h dentro da empresa numa jornada = dobra (2 turnos)
function calcTrabalho(punches){ // punches: [{acao,min}]
  const g=a=>{ const p=punches.find(x=>x.acao===a); return p?p.min:null; };
  const ent=g("Entrada"), sai=g("Saída");
  if(ent==null||sai==null) return null;
  const fim = sai<ent ? sai+1440 : sai;
  const ii=g("Início intervalo"), fi=g("Fim intervalo");
  const interv = (ii!=null&&fi!=null) ? Math.max(0,(fi<ii?fi+1440:fi)-ii) : 0;
  return Math.max(0, fim-ent-interv);
}
const JORNADA_CLT=480, TOL=10; // 8h e tolerância 10min (Art. 58 CLT)
// extras: minutos de hora extra "normal" (acima de 8h em dia útil)
// extras100: minutos de hora extra 100% (trabalho em dia de FOLGA) — Freela nunca gera extras.
function extrasDe(trabalhado, tipo, ehFolga){
  if(tipo!=="clt") return { extras:0, extras100:0, atraso:0 };
  if(ehFolga) return { extras:0, extras100:trabalhado, atraso:0 };   // folga trabalhada = 100%
  const saldo = trabalhado - JORNADA_CLT;
  return { extras: saldo>TOL?saldo:0, extras100:0, atraso: saldo<-TOL?-saldo:0 };
}
// folgaDe(grupo) → true se aquele colaborador estava de FOLGA naquele dia (opcional)
function apurarHoras(registros, folgaDe){ // agrupa por nome+dia e calcula
  const grupos={};
  registros.forEach(r=>{ if(r.min==null) return; const dkey=r.data||r.dia||"hoje"; const k=r.nome+"|"+dkey;
    (grupos[k]=grupos[k]||{nome:r.nome,tipo:r.tipo,dia:dkey,unidade:r.unidade,punches:[]}).punches.push({acao:r.acao,min:r.min}); });
  return Object.values(grupos).map(g=>{ const t=calcTrabalho(g.punches);
    const folga = folgaDe ? !!folgaDe(g) : false;
    if(t==null) return {...g,trabalhado:null,extras:0,extras100:0,atraso:0,folga,completo:false};
    return {...g,trabalhado:t,folga,...extrasDe(t,g.tipo,folga),completo:true}; });
}

function b64ToBytes(dataUrl){
  const b64=String(dataUrl||"").replace(/^data:[^;]+;base64,/,"");
  try{ const bin=atob(b64); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
  catch{ return new Uint8Array(); }
}
// gera um PDF de 1 página VÁLIDO (abre em qualquer leitor) p/ documentos de demonstração
function montarPDF(titulo, linhas){
  const esc=s=>String(s).replace(/([\\()])/g,"\\$1");
  const L=[titulo,"",...(linhas||[])];
  let body="BT /F1 13 Tf 60 780 Td 18 TL ";
  L.forEach(ln=>{ body+="("+esc(ln)+") Tj T* "; });
  body+="ET";
  const objs=[];
  objs[1]="<</Type/Catalog/Pages 2 0 R>>";
  objs[2]="<</Type/Pages/Kids[3 0 R]/Count 1>>";
  objs[3]="<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 5 0 R>>>>/Contents 4 0 R>>";
  objs[4]="<</Length "+body.length+">>\nstream\n"+body+"\nendstream";
  objs[5]="<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>";
  let pdf="%PDF-1.4\n"; const off=[];
  for(let i=1;i<=5;i++){ off[i]=pdf.length; pdf+=i+" 0 obj\n"+objs[i]+"\nendobj\n"; }
  const xref=pdf.length;
  pdf+="xref\n0 6\n0000000000 65535 f \n";
  for(let i=1;i<=5;i++) pdf+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  pdf+="trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n"+xref+"\n%%EOF";
  const bytes=new Uint8Array(pdf.length); for(let i=0;i<pdf.length;i++) bytes[i]=pdf.charCodeAt(i)&0xff;
  return bytes;
}

// Comprime imagem (dataURL) para caber no banco central — reduz p/ ~máx 640px JPEG.
function compressImg(dataUrl, max=640, q=0.62){
  return new Promise(function(res){
    try{
      const img=new Image();
      img.onload=function(){ let w=img.width,h=img.height; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
        const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
        try{ res(c.toDataURL("image/jpeg",q)); }catch(e){ res(dataUrl); } };
      img.onerror=function(){ res(dataUrl); };
      img.src=dataUrl;
    }catch(e){ res(dataUrl); }
  });
}

// Coleção PÚBLICA de registros de ponto (batidos pelo celular, SEM login).
// Cada batida é um documento próprio → o celular só CRIA (não sobrescreve nada).
// O painel "Ponto ao vivo" escuta em tempo real e mostra na hora.
function useRegistrosPub(){
  const [items,setItems]=useState([]);
  useEffect(()=>{
    const db=window.__WPDB; if(!db) return;
    try{
      return tCol("registros").orderBy("ts","desc").limit(300).onSnapshot(function(snap){
        const arr=[]; snap.forEach(function(d){ const x=d.data()||{}; arr.push({...x, id:d.id, _docId:d.id}); });
        setItems(arr);
      }, function(){ /* sem permissão/erro */ });
    }catch(e){}
  },[]);
  const add=(obj)=>{ const db=window.__WPDB; if(!db) return Promise.reject(new Error("sem-banco")); return tCol("registros").add(obj); };
  return [items,{add}];
}
// Coleção PÚBLICA de atestados enviados pelo colaborador (sem login) → vão para o dossiê em tempo real.

// Coleção PÚBLICA de solicitações de AJUSTE de ponto (colaborador pede sem login; gestor aprova/recusa).

// Semente inicial por espaço: o "Cliente principal" (legado) mantém os dados de demonstração;

  // ---- Multiempresa (vários grupos de restaurantes, dados isolados) ----

  const criarCliente=(nome,cor)=>{

  // ---- Login independente por cliente (dono x gerente vinculado a um cliente) ----

  useEffect(()=>{ const a=window.__WPAUTH; if(!a) return; return a.onAuthStateChanged(u=>setAuthUser(u)); },[]);
  // Config global (lista de DONOS) — vive SEMPRE no espaço principal (raiz), não é isolada por cliente.
  const [cfgGlobal,setCfgGlobal]=useState(()=> window.__WPDB ? null : {});
  useEffect(()=>{ const db=window.__WPDB; if(!db){ setCfgGlobal({}); return; }
    try{ return db.collection("wilami").doc("config").onSnapshot(function(s){ setCfgGlobal((s&&s.exists&&s.data().v)||{}); }, function(){ setCfgGlobal({}); }); }catch(e){ setCfgGlobal({}); }
  },[]);
  const donos = (cfgGlobal&&cfgGlobal.donos)||[];               // e-mails (chave normalizada) com acesso total
  const setDonos=(arr)=>{ const db=window.__WPDB; if(db){ try{ db.collection("wilami").doc("config").set({v:{...(cfgGlobal||{}),donos:arr}},{merge:true}); }catch(e){} } };
  // Vínculos de acesso: e-mail → cliente. Também na raiz (consultado por e-mail, antes de saber o cliente).

  },[]);

  // Identidade a exibir = SEMPRE a do próprio usuário logado (nunca o nome do dono).

  // Listas expostas = base (admin) + auto-cadastros do celular (mesclados por vínculo)

  const [escalaSeed,setEscalaSeed]=usePersist("escalaSeed",{});         // pids já semeados na auto-escala (nunca re-semear)
  const [registrosLocal,setRegistrosLocal]=usePersist("registros",[]);  // fallback sem banco

  const [cargosFreela,setCargosFreela]=usePersist("cargos",INIT_CARGOS_FREELA);
  const [dossie,setDossie]=usePersist("dossie",{});          // { "clt-1": {faltas:[],feedbacks:[]} }
  const [perfil,setPerfil]=useState("proprietario");         // papel simulado
  const [perms,setPerms]=useState(PERMS_INIT);
  const can=(cap)=> perfil==="proprietario" ? true : !!(perms[perfil] && perms[perfil][cap]);
  const salvarCargoFreela=(c)=>setCargosFreela(prev=> c.id ? prev.map(x=>x.id===c.id?{...x,...c}:x) : [...prev,{...c,id:nextId(prev)}]);
  const excluirCargoFreela=(id)=>setCargosFreela(prev=>prev.filter(x=>x.id!==id));

  const salvarUnidade=(u)=>setUnidades(prev=> u.id ? prev.map(x=>x.id===u.id?{...x,...u}:x)
    : (()=>{ const id=nextId(prev); setEscala(e=>({...e,[id]:escalaVaziaUnidade()})); return [...prev,{...u,id}]; })());
  const excluirUnidade=(id)=>{ setUnidades(prev=>prev.filter(x=>x.id!==id)); setEscala(prev=>{ const n={...prev}; delete n[id]; return n; }); };

  // Gera a escala fixa de um CLT, na SUA casa, a partir do DIA DE FOLGA escolhido pelo gerente.
  // A folga se repete toda semana nesse dia (6x1 = 1 folga; 5x2/6x2 = 2 folgas a partir do dia base).
  // soFaltantes=true → só adiciona nos dias ainda vazios (nunca sobrescreve edições do gerente).
  const gerarEscalaFixa=(pid,escalaTipo,unidadeId,soFaltantes,folgaDia)=>{
    const nFolgas = (escalaTipo==="5x2"||escalaTipo==="6x2") ? 2 : (escalaTipo==="12x36" ? 0 : 1);
    const base = (folgaDia==null) ? null : ((folgaDia%7)+7)%7;
    const ehFolgaDia=(d)=>{ if(base==null||nFolgas===0) return false; for(let k=0;k<nFolgas;k++){ if(((base+k)%7)===d) return true; } return false; };

  // freelancer escalado hoje em QUALQUER casa

/* ============================ LOGIN ============================ */
function LoginScreen({ onLogin }) {
  const [tab,setTab]=useState("colab");
  const irPonto=(m)=>{ window.location.hash="ponto-"+m; window.dispatchEvent(new HashChangeEvent("hashchange")); };
  const auth=typeof window!=="undefined"?window.__WPAUTH:null;
  const [email,setEmail]=useState("");
  const [senha,setSenha]=useState("");
  const [modo,setModo]=useState("entrar"); // entrar | criar
  const [erroAuth,setErroAuth]=useState("");
  const [carregando,setCarregando]=useState(false);
  const traduz=(c)=>({ "auth/invalid-email":"E-mail inválido.","auth/missing-password":"Digite a senha.","auth/weak-password":"A senha precisa ter ao menos 6 caracteres.","auth/email-already-in-use":"Este e-mail já tem conta — use Entrar.","auth/invalid-credential":"E-mail ou senha incorretos.","auth/user-not-found":"Conta não encontrada — crie uma conta.","auth/wrong-password":"Senha incorreta." }[c]||("Erro: "+c));
  // Permite login por USUÁRIO (ex.: "Wilami") ou por e-mail. Usuário vira e-mail interno.
  const emailLogin=emailDeLogin;
  const submeterAuth=async()=>{
    if(!auth){ onLogin(); return; }
    setErroAuth(""); setCarregando(true);
    try{
      const em=emailLogin(email);
      if(modo==="criar") await auth.createUserWithEmailAndPassword(em,senha);
      else await auth.signInWithEmailAndPassword(em,senha);
    }catch(e){ setErroAuth(traduz(e.code||"")); }
    setCarregando(false);
  };
  return <div className="min-h-screen grad-ink grad-hero grid lg:grid-cols-2">
    <div className="hidden lg:flex flex-col justify-between p-12 text-white">
      <Logo light size="text-2xl"/>
      <div className="max-w-md">
        <h1 className="text-4xl font-extrabold leading-tight">Registro de ponto digital feito para <span className="text-brand-300">restaurantes</span>.</h1>
        <p className="mt-4 text-white/70 text-lg">Selfie com validação facial, geolocalização com cerca eletrônica, escala visual e cálculo de horas conforme a CLT e a Portaria 671/2021.</p>
        <div className="mt-8 grid grid-cols-2 gap-3">
          {[["Selfie + facial",I.camera],["GPS + cerca",I.gps],["Escala visual",I.calendar],["Ponto ao vivo",I.broadcast]].map(([t,d])=>
            <div key={t} className="glass rounded-2xl p-4 flex items-center gap-3 text-slate-800">
              <div className="w-9 h-9 rounded-xl grad-brand grid place-items-center text-white"><Icon d={d} className="w-4 h-4"/></div>
              <span className="text-sm font-semibold">{t}</span>
            </div>)}
        </div>
      </div>
      <div className="flex items-center gap-2 text-white/50 text-sm"><Icon d={I.shield} className="w-4 h-4"/> Conforme LGPD · Dados criptografados</div>
    </div>
    <div className="flex items-center justify-center p-6">
      <Card className="w-full max-w-md p-8">
        <div className="lg:hidden mb-6"><Logo/></div>
        <div className="flex gap-2 p-1 bg-slate-100 rounded-xl mb-6">
          {[["colab","Registrar meu ponto"],["admin","Acesso do gestor"]].map(([k,l])=>
            <button key={k} onClick={()=>setTab(k)} className={cx("flex-1 py-2 rounded-lg text-sm font-semibold transition", tab===k?"bg-white shadow-soft text-brand-700":"text-slate-500")}>{l}</button>)}
        </div>
        {tab==="admin" ? <>
          <h2 className="text-xl font-bold text-slate-900">{modo==="criar"?"Criar conta do gestor":"Acesso do gestor"}</h2>
          <p className="text-slate-500 text-sm mt-1">{modo==="criar"?"Crie sua conta para gerenciar o sistema.":"Entre com seu e-mail e senha."}</p>
          <div className="mt-6 space-y-3">
            <Input placeholder="E-mail ou usuário (ex.: Wilami)" type="text" value={email} onChange={e=>setEmail(e.target.value)}/>
            <Input type="password" placeholder="Senha (mín. 6 caracteres)" value={senha} onChange={e=>setSenha(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")submeterAuth();}}/>
          </div>
          {erroAuth && <p className="text-sm text-rose-500 mt-3">{erroAuth}</p>}
          <Btn className="w-full mt-5" size="lg" onClick={submeterAuth} disabled={carregando} icon={I.arrow}>{carregando?"Aguarde…":(modo==="criar"?"Criar conta e entrar":"Entrar no painel")}</Btn>
          <button onClick={()=>{setModo(modo==="criar"?"entrar":"criar");setErroAuth("");}} className="w-full mt-3 text-sm text-brand-700 font-semibold hover:underline">{modo==="criar"?"Já tenho conta — Entrar":"Primeiro acesso? Criar conta do gestor"}</button>
          {!auth && <p className="text-xs text-amber-600 mt-3 text-center">Modo offline (sem login) — os dados ficam só neste aparelho.</p>}
        </> : <>
          <h2 className="text-xl font-bold text-slate-900">Registrar meu ponto</h2>
          <p className="text-slate-500 text-sm mt-1">Escolha seu vínculo e informe seu CPF. Só quem está na escala de hoje registra.</p>
          <div className="mt-6 space-y-3">
            <button onClick={()=>irPonto("clt")} className="w-full p-4 rounded-2xl border border-slate-200 hover:border-brand-400 hover:bg-brand-50/40 flex items-center gap-4 text-left transition">
              <div className="w-11 h-11 grad-brand rounded-xl grid place-items-center text-white"><Icon d={I.user}/></div>
              <div><div className="font-bold text-slate-900">Sou CLT</div><div className="text-sm text-slate-500">Registrar jornada · escala fixa</div></div>
              <Icon d={I.arrow} className="w-4 h-4 ml-auto text-slate-400"/>
            </button>
            <button onClick={()=>irPonto("free")} className="w-full p-4 rounded-2xl border border-slate-200 hover:border-free-400 hover:bg-free-50/40 flex items-center gap-4 text-left transition">
              <div className="w-11 h-11 bg-free-500 rounded-xl grid place-items-center text-white"><Icon d={I.coffee}/></div>
              <div><div className="font-bold text-slate-900">Sou Freelancer</div><div className="text-sm text-slate-500">Check-in/checkout · exige escala + cerca</div></div>
              <Icon d={I.arrow} className="w-4 h-4 ml-auto text-slate-400"/>
            </button>
          </div>
        </>}
      </Card>
    </div>
  </div>;
}

/* ============================ ESCALA VISUAL (POR UNIDADE) ============================ */
function EscalaVisual() {
  const { escala, setEscala, clts, freelas, unidades, can } = useStore();
  const toast=useContext(ToastCtx);
  const [uSel,setUSel]=useState(unidades[0]?.id);
  const [drag,setDrag]=useState(null);
  const [over,setOver]=useState(null);
  const [add,setAdd]=useState(null);
  const [setorF,setSetorF]=useState("todos");
  const [menu,setMenu]=useState(null); // {di,id}
  const editavel=can("escala");
  const nome=(pid,tipo)=>pessoaNome(pid,tipo,clts,freelas);
  const escU = escala[uSel] || escalaVaziaUnidade();
  const pessoaDe=(a)=>(a.tipo==="clt"?clts:freelas).find(p=>p.id===a.pid);
  const passaSetor=(a)=> setorF==="todos" || setorDe(pessoaDe(a))===setorF;

  const onDrop=(dia)=>{
    if(!drag||!editavel) return;
    setEscala(prev=>{ const u={...(prev[uSel]||escalaVaziaUnidade())};
      u[drag.from]=u[drag.from].filter(a=>a.id!==drag.aloc.id);
      u[dia]=[...(u[dia]||[]), {...drag.aloc}]; return {...prev,[uSel]:u}; });
    toast(`${nome(drag.aloc.pid,drag.aloc.tipo)} movido para ${DIAS[dia]}`);
    setDrag(null); setOver(null);
  };
  const remover=(dia,id)=>setEscala(prev=>{ const u={...prev[uSel]}; u[dia]=u[dia].filter(a=>a.id!==id); return {...prev,[uSel]:u}; });
  const setMarca=(dia,id,marca)=>setEscala(prev=>{ const u={...prev[uSel]}; u[dia]=u[dia].map(a=>a.id===id?{...a,marca}:a); return {...prev,[uSel]:u}; });
  const setTurnoTo=(dia,id,turno)=>setEscala(prev=>{ const u={...prev[uSel]}; u[dia]=u[dia].map(a=>a.id===id?{...a,turno,marca:turno==="folga"?null:a.marca}:a); return {...prev,[uSel]:u}; });
  const setHorario=(dia,id,h)=>setEscala(prev=>{ const u={...prev[uSel]}; u[dia]=u[dia].map(a=>a.id===id?{...a,h}:a); return {...prev,[uSel]:u}; });
  const [editH,setEditH]=useState(null); // {di,id,hi,hf}
  const addColab=(dia,pid,tipo)=>{ setEscala(prev=>{ const u={...(prev[uSel]||escalaVaziaUnidade())}; u[dia]=[...(u[dia]||[]),{id:(tipo==="clt"?"c":"f")+Date.now(),pid,tipo,turno:tipo==="clt"?turnoPorDia(dia):"noite"}]; return {...prev,[uSel]:u}; }); setAdd(null); toast("Colaborador inserido na escala desta casa"); };

  const tot=Object.values(escU).flat();
  const nClt=tot.filter(a=>a.tipo==="clt"&&a.turno!=="folga").length;
  const nFree=tot.filter(a=>a.tipo==="free").length;
  const nFolga=tot.filter(a=>a.turno==="folga").length;
  const uAtual=unidades.find(u=>u.id===uSel);

  // ===== Passador de datas: semana visível, "hoje" real e busca de data específica =====
  const [semanaBase,setSemanaBase]=useState(()=>segDaSemana(new Date())); // segunda-feira da semana exibida
  const datasSemana=[0,1,2,3,4,5,6].map(i=>addDias(semanaBase,i));
  const ehHoje=(di)=> ymd(datasSemana[di])===hojeStr();
  const labelDiaFull=(di)=>{ const d=datasSemana[di]; return `${DIAS[di]} ${d.getDate()}/${String(d.getMonth()+1).padStart(2,"0")}`; };
  const semanaLabel=`${datasSemana[0].getDate()} ${MESES_CURTO[datasSemana[0].getMonth()]} – ${datasSemana[6].getDate()} ${MESES_CURTO[datasSemana[6].getMonth()]}`;
  const semanaAtual = ymd(semanaBase)===ymd(segDaSemana(new Date()));
  const irParaData=(v)=>{ if(!v) return; const [y,m,dd]=v.split("-").map(Number); setSemanaBase(segDaSemana(new Date(y,m-1,dd))); };

  return <div className="fade-in">
    <PageHeader title="Escala por unidade" sub="Uma aba por casa · filtro por setor · layout compacto · menu (⋯) para turno, faltou, atrasou, folga">
      {editavel && <Btn icon={I.plus} onClick={()=>setAdd(HOJE_IDX)}>Incluir colaborador</Btn>}
    </PageHeader>

    {/* Abas das casas */}
    <div className="flex gap-2 overflow-x-auto pb-1 mb-4">
      {unidades.map(u=>
        <button key={u.id} onClick={()=>setUSel(u.id)}
          className={cx("shrink-0 px-4 py-2.5 rounded-xl text-sm font-semibold border transition flex items-center gap-2",
            uSel===u.id?"grad-brand text-white border-transparent shadow-glow":"bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>
          <span className="w-2.5 h-2.5 rounded-full" style={{background:uSel===u.id?"#fff":u.cor}}/>{u.nome}</button>)}
    </div>

    {!editavel && <div className="mb-4 p-3 rounded-xl bg-amber-50 text-amber-700 text-sm flex items-center gap-2"><Icon d={I.shield} className="w-4 h-4"/> Seu perfil ({/* */}somente leitura) não tem permissão para editar a escala.</div>}

    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      {[["CLT nesta casa",nClt,"brand",I.user],["Freelancers",nFree,"free",I.coffee],["Folgas",nFolga,"slate",I.sun],["Coberturas",tot.length,"green",I.check]].map(([l,v,t,d])=>
        <Card key={l} className="p-4 flex items-center gap-3">
          <div className={cx("w-10 h-10 rounded-xl grid place-items-center text-white", t==="brand"?"grad-brand":t==="free"?"bg-free-500":t==="green"?"bg-emerald-500":"bg-slate-400")}><Icon d={d} className="w-5 h-5"/></div>
          <div><div className="text-2xl font-extrabold text-slate-900 leading-none">{v}</div><div className="text-xs text-slate-500 mt-0.5">{l}</div></div>
        </Card>)}
    </div>

    {/* Filtro por setor */}
    <div className="flex flex-wrap gap-2 mb-3">
      <span className="flex items-center gap-1 text-xs font-bold text-slate-400 uppercase mr-1 self-center"><Icon d={I.filter} className="w-3.5 h-3.5"/>Setor</span>
      <button onClick={()=>setSetorF("todos")} className={cx("px-3 py-1.5 rounded-lg text-xs font-semibold border transition", setorF==="todos"?"grad-brand text-white border-transparent":"bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>Todos</button>
      {SETORES.map(([k,l,c])=><button key={k} onClick={()=>setSetorF(k)} className={cx("px-3 py-1.5 rounded-lg text-xs font-semibold border transition flex items-center gap-1.5", setorF===k?"text-white border-transparent":"bg-white border-slate-200 text-slate-600 hover:bg-slate-50")} style={setorF===k?{background:c}:{}}><span className="w-2 h-2 rounded-full" style={{background:setorF===k?"#fff":c}}/>{l}</button>)}
    </div>

    {/* Passador de datas — navegar semanas, ir para uma data e ver o dia atual marcado */}
    <div className="flex flex-wrap items-center gap-2 mb-3">
      <div className="flex items-center gap-1 bg-white border border-slate-200 rounded-xl p-1">
        <button onClick={()=>setSemanaBase(s=>addDias(s,-7))} className="w-8 h-8 rounded-lg grid place-items-center text-slate-500 hover:bg-slate-50" title="Semana anterior"><Icon d={I.arrow} className="w-4 h-4 rotate-180"/></button>
        <span className="px-2 text-sm font-semibold text-slate-700 tabular-nums whitespace-nowrap">{semanaLabel}</span>
        <button onClick={()=>setSemanaBase(s=>addDias(s,7))} className="w-8 h-8 rounded-lg grid place-items-center text-slate-500 hover:bg-slate-50" title="Próxima semana"><Icon d={I.arrow} className="w-4 h-4"/></button>
      </div>
      <Btn variant={semanaAtual?"soft":"ghost"} icon={I.calendar} onClick={()=>setSemanaBase(segDaSemana(new Date()))}>Semana de hoje</Btn>
      <label className="flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-sm text-slate-600">
        <Icon d={I.search} className="w-4 h-4 text-slate-400"/><span className="hidden sm:inline">Ir para data</span>
        <input type="date" value={ymd(semanaBase)} onChange={e=>irParaData(e.target.value)} className="outline-none bg-transparent text-slate-800"/>
      </label>
    </div>

    <Card className="p-3 overflow-x-auto">
      <div className="px-1 pb-2 text-sm font-semibold text-slate-500 flex items-center gap-2"><Icon d={I.pin} className="w-4 h-4" style={{color:uAtual?.cor}}/> Escala de <b className="text-slate-800">{uAtual?.nome}</b> · <span className="text-slate-400">{semanaLabel}</span></div>
      <div className="grid grid-cols-7 gap-3 min-w-[980px]">
        {DIAS.map((dia,di)=>
          <div key={di} onDragOver={e=>{e.preventDefault();setOver(di);}} onDragLeave={()=>setOver(o=>o===di?null:o)} onDrop={()=>onDrop(di)}
            className={cx("rounded-2xl p-2 min-h-[260px] bg-slate-50/70 transition", over===di&&"drag-over", ehHoje(di)&&"ring-2 ring-brand-300 bg-brand-50/40")}>
            <div className="flex items-center justify-between px-1 mb-2">
              <span className="text-sm font-bold text-slate-700">{labelDiaFull(di)}{ehHoje(di)&&<span className="ml-1 text-[10px] text-brand-600">• hoje</span>}</span>
              {editavel && <button onClick={()=>setAdd(di)} className="w-6 h-6 rounded-lg bg-white border border-slate-200 grid place-items-center text-slate-400 hover:text-brand-600 hover:border-brand-300"><Icon d={I.plus} className="w-3.5 h-3.5"/></button>}
            </div>
            <div className="space-y-1.5">
              {(escU[di]||[]).filter(passaSetor).map(a=>{ const t=TURNOS[a.turno]; const setor=SETOR_MAP[setorDe(pessoaDe(a))]; const aberto=menu&&menu.di===di&&menu.id===a.id;
                return <div key={a.id} className="relative">
                  <div draggable={editavel} onDragStart={()=>setDrag({aloc:a,from:di})} onDragEnd={()=>{setDrag(null);setOver(null);}}
                    className={cx("rounded-lg pl-2 pr-1 py-1.5 bg-white shadow-soft border border-slate-100 border-l-[3px]", editavel&&"cursor-grab", a.marca==="faltou"&&"opacity-70")}
                    style={{borderLeftColor:setor?.c||"#6366f1"}}>
                    <div className="flex items-center gap-1.5">
                      <Avatar name={nome(a.pid,a.tipo)} tone={a.tipo==="clt"?"brand":"free"} size="w-5 h-5"/>
                      <span className="text-[11px] font-semibold text-slate-800 flex-1 min-w-0 truncate">{nome(a.pid,a.tipo)}</span>
                      {editavel && <button onClick={()=>setMenu(aberto?null:{di,id:a.id})} className="text-slate-400 hover:text-slate-700 font-bold px-1 leading-none">⋯</button>}
                    </div>
                    <div className="flex items-center gap-1 mt-1 flex-wrap">
                      <span className="text-[9px] font-bold px-1.5 py-0.5 rounded" style={{background:(setor?.c||"#6366f1")+"22",color:setor?.c}}>{t.l}</span>
                      {a.turno!=="folga" && <span className="text-[9px] font-semibold text-slate-500 tabular-nums">{a.h||t.h}</span>}
                      {a.marca==="faltou" && <Badge tone="red">Faltou</Badge>}
                      {a.marca==="atrasou" && <Badge tone="amber">Atrasou</Badge>}
                    </div>
                  </div>
                  {aberto && <div className="absolute z-30 top-full left-0 mt-1 w-40 bg-white rounded-xl shadow-2xl border border-slate-100 p-1.5 text-xs">
                    <div className="px-2 py-1 text-[10px] font-bold text-slate-400 uppercase">Turno</div>
                    {[["manha","Manhã"],["tarde","Tarde"],["noite","Noite"],["folga","Folga"]].map(([k,l])=><button key={k} onClick={()=>{setTurnoTo(di,a.id,k);setMenu(null);}} className="w-full text-left px-2 py-1.5 rounded-lg hover:bg-slate-50">{l}</button>)}
                    {a.turno!=="folga" && <button onClick={()=>{ const cur=(a.h||t.h||"").split("–"); setEditH({di,id:a.id,hi:cur[0]||"08:00",hf:cur[1]||"16:00"}); setMenu(null); }} className="w-full text-left px-2 py-1.5 rounded-lg hover:bg-brand-50 text-brand-700 border-t border-slate-100 mt-1">Editar horário…</button>}
                    <div className="px-2 py-1 text-[10px] font-bold text-slate-400 uppercase border-t border-slate-100 mt-1">Marcar</div>
                    <button onClick={()=>{setMarca(di,a.id,"faltou");setMenu(null);}} className="w-full text-left px-2 py-1.5 rounded-lg hover:bg-rose-50 text-rose-600">Faltou</button>
                    <button onClick={()=>{setMarca(di,a.id,"atrasou");setMenu(null);}} className="w-full text-left px-2 py-1.5 rounded-lg hover:bg-amber-50 text-amber-600">Atrasou</button>
                    <button onClick={()=>{setMarca(di,a.id,null);setMenu(null);}} className="w-full text-left px-2 py-1.5 rounded-lg hover:bg-slate-50 text-slate-500">Limpar marca</button>
                    {can("excluir") && <button onClick={()=>{remover(di,a.id);setMenu(null);}} className="w-full text-left px-2 py-1.5 rounded-lg hover:bg-rose-50 text-rose-600 border-t border-slate-100 mt-1">Remover</button>}
                  </div>}
                </div>;})}
            </div>
          </div>)}
      </div>
    </Card>

    <Modal open={!!editH} onClose={()=>setEditH(null)}>
      {editH && <div className="p-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-bold text-slate-900">Editar horário — {labelDiaFull(editH.di)}</h3>
          <button onClick={()=>setEditH(null)} className="text-slate-400 hover:text-slate-600"><Icon d={I.x}/></button>
        </div>
        <div className="flex items-end gap-3">
          <Field label="Entrada"><Input type="time" value={editH.hi} onChange={e=>setEditH({...editH,hi:e.target.value})}/></Field>
          <span className="pb-3 text-slate-400">até</span>
          <Field label="Saída"><Input type="time" value={editH.hf} onChange={e=>setEditH({...editH,hf:e.target.value})}/></Field>
        </div>
        <div className="flex gap-2 mt-5">
          <Btn variant="ghost" className="flex-1" onClick={()=>setEditH(null)}>Cancelar</Btn>
          <Btn className="flex-1" icon={I.check} onClick={()=>{ setHorario(editH.di,editH.id,`${editH.hi}–${editH.hf}`); setEditH(null); toast("Horário atualizado"); }}>Salvar horário</Btn>
        </div>
      </div>}
    </Modal>

    <Modal open={add!==null} onClose={()=>setAdd(null)}>
      <div className="p-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-bold text-slate-900">Incluir colaborador em {uAtual?.nome} {add!==null&&`— ${labelDiaFull(add)}`}</h3>
          <button onClick={()=>setAdd(null)} className="text-slate-400 hover:text-slate-600"><Icon d={I.x}/></button>
        </div>
        <p className="text-sm text-slate-500 mb-4">Inclua um freelancer (cobertura) ou um CLT auto-cadastrado. Só quem está escalado consegue registrar ponto.</p>
        <div className="space-y-2 max-h-[50vh] overflow-y-auto">
          {[...freelas.filter(f=>f.status==="ativo").map(f=>({...f,_t:"free"})), ...clts.filter(c=>c._auto).map(c=>({...c,_t:"clt"}))].map(f=>
            <button key={f._t+f.id} onClick={()=>addColab(add,f.id,f._t)} className={cx("w-full flex items-center gap-3 p-3 rounded-xl border border-slate-200 transition", f._t==="clt"?"hover:border-brand-400 hover:bg-brand-50/40":"hover:border-free-400 hover:bg-free-50/40")}>
              <Avatar name={f.nome} src={f.foto} tone={f._t==="clt"?"brand":"free"}/>
              <div className="text-left flex-1"><div className="font-semibold text-slate-800 flex items-center gap-2">{f.nome} <Badge tone={f._t==="clt"?"brand":"free"}>{f._t==="clt"?"CLT":"Freela"}</Badge></div><div className="text-xs text-slate-500">{f.cargo} · casa base: {unidadeNome(f.unidade,unidades)}</div></div>
              <Icon d={I.plus} className={cx("w-4 h-4", f._t==="clt"?"text-brand-500":"text-free-500")}/>
            </button>)}
        </div>
      </div>
    </Modal>
  </div>;
}

/* ============================ PONTO AO VIVO (só registros reais) ============================ */
const STATUS = {
  trabalhando:{l:"Trabalhando",tone:"green",c:"#10b981"},
  pausa:{l:"Em almoço/pausa",tone:"amber",c:"#f59e0b"},
  encerrado:{l:"Encerrado",tone:"slate",c:"#94a3b8"},
  aguardando:{l:"Aguardando entrada",tone:"blue",c:"#0ea5e9"},
  faltou:{l:"Faltou",tone:"red",c:"#f43f5e"},
  folga:{l:"Folga",tone:"slate",c:"#cbd5e1"},
};
function PontoLive() {
  const { registros:registrosAll, clts, freelas, unidades, escala, pontoHist, valorFreela } = useStore();
  // Só os registros de HOJE alimentam o status ao vivo (a coleção persiste entre os dias).
  const _hoje=hojeStr();
  const registros = registrosAll.filter(r=>!r.data || r.data===_hoje);
  const [ambiente,setAmbiente]=useState("clt");   // 'clt' | 'free' — ambientes distintos
  const [casaFiltro,setCasaFiltro]=useState("todas"); // filtrar por unidade
  const [linkModal,setLinkModal]=useState(null); // null | 'clt' | 'free'
  const [detalhe,setDetalhe]=useState(null);     // modal de detalhe das abas (Trabalhando/Almoço/Faltas)
  const [abertoPid,setAbertoPid]=useState(null); // colaborador expandido (ver as 4 batidas do dia)
  const clock=useClock();
  // As 4 batidas do dia de um colaborador (em tempo real), na ordem canônica.
  const batidasDoDia=(nm)=>{ const meus=registros.filter(r=>r.nome===nm);
    const acoes = ambiente==="free" ? [["Entrada","Check-in"],["Saída","Checkout"]]
      : [["Entrada","Entrada"],["Início intervalo","Saída p/ almoço"],["Fim intervalo","Retorno do almoço"],["Saída","Saída final"]];
    return acoes.map(([canon,label])=>{ const r=meus.find(x=>x.acao===canon); return {label, hora:r?(r.hora||"").slice(0,5):null}; }); };
  const casaNome = casaFiltro==="todas" ? null : unidadeNome(casaFiltro,unidades);
  const toast=useContext(ToastCtx);
  const nome=(pid,tipo)=>pessoaNome(pid,tipo,clts,freelas);
  const ehFree=ambiente==="free";
  const hrefBase = (typeof window!=="undefined" ? window.location.href.split("#")[0] : "");
  const isLocalFile = hrefBase.startsWith("file:");
  // Endereço público do sistema (depois de publicado). Se estiver em arquivo local,
  // o gestor informa a URL pública para que o link funcione no celular do colaborador.
  const [pubUrl,setPubUrl]=useState("");
  const base = (pubUrl.trim() ? pubUrl.trim().replace(/#.*$/,"").replace(/\/+$/,"")+"/" : hrefBase);
  const linkDe=(m)=> comTenantUrl(base.replace(/#.*$/,""), "ponto-"+m);

  // turno de HOJE de uma pessoa (para saber se é dia de FOLGA)
  const turnoHojeDe=(pid,tipo)=>{ let t=null; Object.values(escala).forEach(dias=>{ (dias[HOJE_IDX]||[]).forEach(a=>{ if(a.pid===pid&&a.tipo===tipo) t=a.turno; }); }); return t; };

  // Escalados hoje do AMBIENTE + CASA selecionados (folga aparece marcada, mas não conta como falta)
  const escalados=[];
  Object.entries(escala).forEach(([uid,dias])=>{
    if(casaFiltro!=="todas" && Number(uid)!==casaFiltro) return;
    (dias[HOJE_IDX]||[]).forEach(a=>{ if(a.tipo!==ambiente) return; escalados.push({...a, unidadeId:Number(uid)}); });
  });
  // Casa os registros do dia com a pessoa escalada por pid → CPF → nome (robusto p/ status ao vivo)
  const cpfDe=(pid,tipo)=>{ const p=(tipo==="clt"?clts:freelas).find(x=>x.id===pid); return p?soDigitos(p.cpf):""; };
  const regsDe=(a)=>{ const nm=nome(a.pid,a.tipo); const idS=String(a.pid); const cpf=cpfDe(a.pid,a.tipo);
    return registros.filter(r=> (r.pid!=null && String(r.pid)===idS) || (cpf && r.cpf && String(r.cpf)===cpf) || r.nome===nm ); };
  const statusDe=(a)=>{
    if(a.marca==="faltou") return "faltou";
    const regs=regsDe(a); // mais recente primeiro
    if(!regs.length) return a.turno==="folga" ? "folga" : "aguardando";
    const last=regs[0].acao;
    return last==="Saída"?"encerrado" : last==="Início intervalo"?"pausa" : "trabalhando";
  };
  // Tempo em jornada em TEMPO REAL (desde a Entrada, atualiza a cada segundo com o relógio)
  const nowSec = clock.getHours()*3600 + clock.getMinutes()*60 + clock.getSeconds();
  const tempoDe=(a)=>{
    const regs=regsDe(a);
    const ent=regs.find(r=>r.acao==="Entrada");
    if(!ent || ent.min==null) return null;
    let d=nowSec - ent.min*60; if(d<0) d+=86400; return d; // segundos
  };
  const linhas=escalados.map(a=>({a, nm:nome(a.pid,a.tipo), st:statusDe(a), tempo:tempoDe(a), folgaTrab:a.turno==="folga"}));
  const cont=(s)=>linhas.filter(x=>x.st===s).length;
  // Resolve FOLGA pela escala DEFINIDA PELO GERENTE (turno marcado como "folga"), nunca automática.
  const folgaDe=(g)=>{ if(g.tipo!=="clt") return false; const p=clts.find(x=>x.nome===g.nome); if(!p) return false;
    return turnoHojeDe(p.id,"clt")==="folga"; };
  // Apuração de horas (histórico + registros reais de hoje), filtrada pelo ambiente
  const apuracao=apurarHoras([...pontoHist, ...registros], folgaDe).filter(x=>x.completo && x.tipo===ambiente && (!casaNome||x.unidade===casaNome));
  const freelaValorDe=(x)=>{ const f=freelas.find(ff=>ff.nome===x.nome); return f?valorFreela(f):0; };
  const totalValorFree=ehFree?apuracao.reduce((s,x)=>s+freelaValorDe(x),0):0;
  // abre o modal de detalhe de uma aba (lista de quem está naquele status)
  const abrirDetalhe=(st)=>{ const grupo=linhas.filter(x=>x.st===st); if(!grupo.length){ toast("Ninguém "+(STATUS[st]?.l||st).toLowerCase()+" agora"); return; }
    setDetalhe({ titulo:STATUS[st]?.l||st, itens:grupo.map(x=>({nm:x.nm, sub:unidadeNome(x.a.unidadeId,unidades), badge:x.a.tipo==="clt"?"CLT":"Freela", tone:x.a.tipo==="clt"?"brand":"free", extra:(st==="trabalhando"&&x.tempo!=null)?fmtHMS(x.tempo):null})) }); };
  // Comprovante do dia (todas as batidas de hoje) — imprimir/salvar PDF para enviar
  const comprovanteDoDia=()=>{
    const rows=registros.slice().reverse().map(r=>`<tr><td>${r.hora||""}</td><td>${r.nome||""}</td><td>${r.tipo==="clt"?"CLT":"Freela"}</td><td>${r.acao||""}</td><td>${r.unidade||""}</td></tr>`).join("")
      || `<tr><td colspan="5" style="text-align:center;color:#94a3b8">Nenhuma batida registrada hoje.</td></tr>`;
    if(imprimirDoc("Comprovante do dia", `<h1>Comprovante de Registros de Ponto</h1><div class="sub">${new Date().toLocaleDateString("pt-BR")} · todas as batidas do dia</div>
      <table><thead><tr><th>Hora</th><th>Colaborador</th><th>Vínculo</th><th>Registro</th><th>Unidade</th></tr></thead><tbody>${rows}</tbody></table>`)) toast("Comprovante do dia gerado");
  };
  // Folha de ponto mensal consolidada por colaborador (com campo de assinatura)
  const folhaDoMes=()=>{
    const mes=hojeStr().slice(0,7);
    const apur=apurarHoras([...pontoHist, ...registrosAll], folgaDe).filter(x=>x.completo && String(x.dia||"").slice(0,7)===mes);
    const porNome={};
    apur.forEach(x=>{ const g=(porNome[x.nome]=porNome[x.nome]||{nome:x.nome,tipo:x.tipo,dias:0,min:0,extra:0,extra100:0}); g.dias++; g.min+=x.trabalhado||0; g.extra+=x.extras||0; g.extra100+=x.extras100||0; });
    const rows=Object.values(porNome).map(g=>`<tr><td>${g.nome}</td><td>${g.tipo==="clt"?"CLT":"Freela"}</td><td>${g.dias}</td><td>${fmtHoras(g.min)}</td><td>${g.extra?fmtHoras(g.extra):"—"}</td><td>${g.extra100?fmtHoras(g.extra100):"—"}</td></tr>`).join("")
      || `<tr><td colspan="6" style="text-align:center;color:#94a3b8">Sem jornadas concluídas neste mês.</td></tr>`;
    if(imprimirDoc("Folha de ponto mensal", `<h1>Folha de Ponto — ${mes.split("-").reverse().join("/")}</h1><div class="sub">Consolidado mensal por colaborador · para conferência e assinatura</div>
      <table><thead><tr><th>Colaborador</th><th>Vínculo</th><th>Dias</th><th>Horas trabalhadas</th><th>Extras</th><th>Extra 100%</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="sign"><div>Assinatura do colaborador</div><div>Assinatura do gestor / responsável</div></div>`)) toast("Folha mensal gerada");
  };

  return <div className="fade-in">
    <PageHeader title="Ponto ao vivo" sub="Status em tempo real · ambientes separados CLT e Freela · o colaborador registra pelo link (WhatsApp)">
      <Btn variant="ghost" icon={I.doc} onClick={comprovanteDoDia}>Comprovante do dia</Btn>
      <Btn variant="ghost" icon={I.download} onClick={folhaDoMes}>Folha do mês</Btn>
      <Btn variant="ghost" icon={I.link} onClick={()=>setLinkModal("clt")}>Gerar link CLT</Btn>
      <Btn variant="free" icon={I.link} onClick={()=>setLinkModal("free")}>Gerar link Freelancer</Btn>
    </PageHeader>

    {/* Seletor de AMBIENTE: CLT | Freela (acompanhamento em tempo real separado) */}
    <div className="inline-flex p-1 bg-slate-100 rounded-xl mb-3">
      {[["clt","CLT","brand"],["free","Freela","free"]].map(([k,l,t])=>
        <button key={k} onClick={()=>setAmbiente(k)}
          className={cx("px-5 py-2 rounded-lg text-sm font-semibold transition", ambiente===k?(k==="clt"?"grad-brand text-white shadow-glow":"bg-free-500 text-white shadow"):"text-slate-500 hover:text-slate-700")}>
          {l}</button>)}
    </div>

    {/* Filtro por CASA */}
    <FiltroCasa casa={casaFiltro} setCasa={setCasaFiltro} unidades={unidades}/>

    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      <Card className="p-4 flex items-center gap-3">
        <span className="relative w-3 h-3"><span className="absolute inset-0 rounded-full bg-emerald-500 live-dot"/></span>
        <div><div className="text-sm font-bold text-slate-800">AO VIVO · {ehFree?"Freela":"CLT"}</div><div className="text-xs text-slate-400 tabular-nums">{clock.toLocaleTimeString("pt-BR")}</div></div>
      </Card>
      <Card className="p-4 cursor-pointer hover:shadow-glow hover:-translate-y-0.5 transition" onClick={()=>abrirDetalhe("trabalhando")}><div className="text-2xl font-extrabold text-emerald-600">{cont("trabalhando")}</div><div className="text-xs text-slate-500 flex items-center gap-1">Trabalhando <Icon d={I.arrow} className="w-3 h-3 text-slate-300"/></div></Card>
      <Card className="p-4 cursor-pointer hover:shadow-glow hover:-translate-y-0.5 transition" onClick={()=>abrirDetalhe("pausa")}><div className="text-2xl font-extrabold text-amber-600">{cont("pausa")}</div><div className="text-xs text-slate-500 flex items-center gap-1">Em almoço/pausa <Icon d={I.arrow} className="w-3 h-3 text-slate-300"/></div></Card>
      <Card className="p-4 cursor-pointer hover:shadow-glow hover:-translate-y-0.5 transition" onClick={()=>abrirDetalhe("faltou")}><div className="text-2xl font-extrabold text-rose-600">{cont("faltou")}</div><div className="text-xs text-slate-500 flex items-center gap-1">Faltas <Icon d={I.arrow} className="w-3 h-3 text-slate-300"/></div></Card>
    </div>

    <div className="grid lg:grid-cols-5 gap-4">
      {/* Painel de status */}
      <Card className="lg:col-span-3 overflow-hidden">
        <div className="px-5 py-3 border-b border-slate-100"><h3 className="font-bold text-slate-900 flex items-center gap-2"><Icon d={I.users} className="w-4 h-4 text-brand-500"/> Escalados de hoje — {ehFree?"Freelancers":"CLT"} · status ao vivo</h3></div>
        {linhas.length===0
          ? <div className="p-10 text-center text-slate-400">Nenhum {ehFree?"freelancer":"CLT"} escalado para hoje.</div>
          : <div className="divide-y divide-slate-50 max-h-[460px] overflow-auto">
              {linhas.map(({a,nm,st,tempo})=>{ const s=STATUS[st]; const aberto=abertoPid===a.id;
                return <div key={a.id}>
                  <div className="flex items-center gap-3 py-3 px-5 cursor-pointer hover:bg-slate-50/70" onClick={()=>setAbertoPid(aberto?null:a.id)}>
                  <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{background:s.c}}/>
                  <Avatar name={nm} tone={a.tipo==="clt"?"brand":"free"} size="w-9 h-9"/>
                  <div className="min-w-0"><div className="font-semibold text-slate-800 truncate">{nm}</div>
                    <div className="text-xs text-slate-500">{unidadeNome(a.unidadeId,unidades)} · {SETOR_MAP[setorDe((a.tipo==="clt"?clts:freelas).find(p=>p.id===a.pid))]?.l}</div></div>
                  <div className="ml-auto flex items-center gap-2">
                    {st==="trabalhando" && tempo!=null && <span className="flex items-center gap-1 text-xs font-bold text-emerald-600 tabular-nums" title="Tempo em jornada (ao vivo)"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 live-dot"/>{fmtHMS(tempo)}</span>}
                    <Badge tone={a.tipo==="clt"?"brand":"free"}>{a.tipo==="clt"?"CLT":"Freela"}</Badge>
                    <Badge tone={s.tone}>{s.l}</Badge>
                    <Icon d={aberto?I.x:I.plus} className="w-3.5 h-3.5 text-slate-300"/>
                  </div>
                </div>
                {aberto && <div className="px-5 pb-3 -mt-1">
                  <div className={cx("grid gap-2", ambiente==="free"?"grid-cols-2":"grid-cols-2 sm:grid-cols-4")}>
                    {batidasDoDia(nm).map((b,i)=><div key={i} className={cx("rounded-lg p-2 text-center border", b.hora?"bg-emerald-50 border-emerald-100":"bg-slate-50 border-slate-100")}>
                      <div className="text-[10px] uppercase tracking-wide text-slate-400 font-bold">{b.label}</div>
                      <div className={cx("text-sm font-bold tabular-nums", b.hora?"text-emerald-700":"text-slate-300")}>{b.hora||"—"}</div>
                    </div>)}
                  </div>
                </div>}
                </div>;})}
            </div>}
      </Card>

      {/* Feed de registros reais (do ambiente selecionado) */}
      <Card className="lg:col-span-2 overflow-hidden">
        <div className="px-5 py-3 border-b border-slate-100"><h3 className="font-bold text-slate-900 flex items-center gap-2"><Icon d={I.broadcast} className="w-4 h-4 text-emerald-500"/> Registros reais · {ehFree?"Freela":"CLT"}</h3></div>
        {registros.filter(r=>r.tipo===ambiente && (!casaNome||r.unidade===casaNome)).length===0
          ? <div className="p-8 text-center text-slate-400 text-sm"><Icon d={I.broadcast} className="w-9 h-9 mx-auto mb-2 text-slate-300"/> Nenhum registro de {ehFree?"freela":"CLT"} ainda hoje. Abra o link e bata entrada/saída com selfie.</div>
          : <div className="divide-y divide-slate-50 max-h-[460px] overflow-auto">
              {registros.filter(r=>r.tipo===ambiente && (!casaNome||r.unidade===casaNome)).map(r=>
                <div key={r.id} className="flex items-center gap-3 py-2.5 px-5 slide-in">
                  {r.foto ? <img src={r.foto} alt="selfie" className="w-8 h-8 rounded-lg object-cover ring-2 ring-emerald-200 shrink-0"/> : <Avatar name={r.nome} tone={r.tipo==="clt"?"brand":"free"} size="w-8 h-8"/>}
                  <div className="min-w-0"><div className="font-semibold text-slate-800 text-sm truncate">{r.nome}</div><div className="text-xs text-slate-500">{r.acao} · {r.unidade}</div></div>
                  <div className="ml-auto text-right"><div className="font-bold text-slate-900 tabular-nums text-sm">{r.hora}</div>
                    <span className="text-[10px] text-emerald-600 flex items-center gap-0.5 justify-end"><Icon d={I.camera} className="w-3 h-3"/><Icon d={I.gps} className="w-3 h-3"/></span></div>
                </div>)}
            </div>}
      </Card>
    </div>

    {/* Apuração — CLT: horas/extras (100% na folga) · Freela: valor do serviço (não é hora extra) */}
    <Card className="overflow-hidden mt-4">
      <div className="px-5 py-3 border-b border-slate-100 flex items-center justify-between">
        <h3 className="font-bold text-slate-900 flex items-center gap-2"><Icon d={I.clock} className="w-4 h-4 text-brand-500"/> {ehFree?"Apuração de freelancers — valor do serviço":"Apuração de horas & extras — CLT"}</h3>
        <span className="text-xs text-slate-400">{ehFree?"Freela: valor por jornada → Pagamentos/Financeiro":"CLT: base 8h · folga trabalhada = 100%"}</span>
      </div>
      {ehFree ? <div className="overflow-x-auto"><table className="w-full text-sm min-w-[560px]">
        <thead><tr className="text-left text-slate-400 border-b border-slate-100">{["Freelancer","Dia","Horas","Valor do serviço"].map(h=><th key={h} className="px-4 py-2.5 font-semibold">{h}</th>)}</tr></thead>
        <tbody className="divide-y divide-slate-50">
          {apuracao.map((x,i)=><tr key={i} className="hover:bg-slate-50/70">
            <td className="px-4 py-2.5"><div className="flex items-center gap-2"><Avatar name={x.nome} tone="free" size="w-7 h-7"/><span className="font-semibold text-slate-800">{x.nome}</span></div></td>
            <td className="px-4 py-2.5 text-slate-500">{fmtDataBR(x.dia)}</td>
            <td className="px-4 py-2.5 text-slate-700">{fmtHoras(x.trabalhado)}</td>
            <td className="px-4 py-2.5"><Badge tone="free">R$ {freelaValorDe(x).toLocaleString("pt-BR")}</Badge></td>
          </tr>)}
          {apuracao.length===0 && <tr><td colSpan="4" className="px-4 py-6 text-center text-slate-400">Sem jornadas de freela concluídas. Os valores entram em Pagamentos ao encerrar (checkout).</td></tr>}
          {apuracao.length>0 && <tr className="bg-free-50/40 font-bold"><td className="px-4 py-2.5" colSpan="3">Total a pagar (hoje)</td><td className="px-4 py-2.5 text-free-600">R$ {totalValorFree.toLocaleString("pt-BR")}</td></tr>}
        </tbody>
      </table></div>
      : <div className="overflow-x-auto"><table className="w-full text-sm min-w-[640px]">
        <thead><tr className="text-left text-slate-400 border-b border-slate-100">{["Colaborador","Dia","Horas trabalhadas","Extras","Extra 100% (folga)","Atraso"].map(h=><th key={h} className="px-4 py-2.5 font-semibold">{h}</th>)}</tr></thead>
        <tbody className="divide-y divide-slate-50">
          {apuracao.map((x,i)=><tr key={i} className="hover:bg-slate-50/70">
            <td className="px-4 py-2.5"><div className="flex items-center gap-2"><Avatar name={x.nome} tone="brand" size="w-7 h-7"/><span className="font-semibold text-slate-800">{x.nome}</span>{x.folga&&<Badge tone="amber">Folga</Badge>}</div></td>
            <td className="px-4 py-2.5 text-slate-500">{fmtDataBR(x.dia)}</td>
            <td className="px-4 py-2.5 font-bold text-slate-900">{fmtHoras(x.trabalhado)}</td>
            <td className="px-4 py-2.5">{x.extras>0?<Badge tone="green">+{fmtHoras(x.extras)}</Badge>:<span className="text-slate-400">—</span>}</td>
            <td className="px-4 py-2.5">{x.extras100>0?<Badge tone="amber">+{fmtHoras(x.extras100)} · 100%</Badge>:<span className="text-slate-400">—</span>}</td>
            <td className="px-4 py-2.5">{x.atraso>0?<Badge tone="red">-{fmtHoras(x.atraso)}</Badge>:<span className="text-slate-400">—</span>}</td>
          </tr>)}
          {apuracao.length===0 && <tr><td colSpan="6" className="px-4 py-6 text-center text-slate-400">Sem jornadas de CLT concluídas para apurar. Registre entrada e saída pelo link.</td></tr>}
        </tbody>
      </table></div>}
    </Card>

    {/* Modal: gerar/copiar link para enviar por WhatsApp (NÃO abre relógio local) */}
    <Modal open={!!linkModal} onClose={()=>setLinkModal(null)}>
      {linkModal && (()=>{ const url=linkDe(linkModal); const isClt=linkModal==="clt";
        const titulo=isClt?"Registro de Jornada — CLT":"Check-in / Checkout — Freelancer";
        const msg=`Olá! Registre seu ponto pelo link do Wilami Ponto (${isClt?"CLT":"Freelancer"}): ${url}`;
        return <div className="p-6">
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-lg font-bold text-slate-900">Gerar link · {titulo}</h3>
            <button onClick={()=>setLinkModal(null)} className="text-slate-400 hover:text-slate-600"><Icon d={I.x}/></button>
          </div>
          <p className="text-sm text-slate-500 mb-3">Envie este link para o colaborador registrar a jornada direto no celular dele — não abre relógio aqui.</p>
          {isLocalFile && !pubUrl.trim() && <div className="mb-3 p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-xs">
            <b>Atenção:</b> você está abrindo o arquivo localmente (<span className="font-mono">file://…</span>). Um link <span className="font-mono">file:///C:/Users/…</span> só existe no <b>seu computador</b> — no celular do colaborador ele não abre.<br/>
            Para o link funcionar em qualquer celular, o sistema precisa estar <b>publicado online</b> (ex.: Vercel). Depois de publicar, cole abaixo o endereço público e os links passam a funcionar:
          </div>}
          <div className="mb-3">
            <label className="text-xs font-semibold text-slate-500 block mb-1">Endereço público do sistema (após publicar)</label>
            <input value={pubUrl} onChange={e=>setPubUrl(e.target.value)} placeholder="https://seu-wilami-ponto.vercel.app" className="w-full px-3 py-2 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-brand-400 text-sm"/>
          </div>
          <div className={cx("p-3 rounded-xl text-xs font-mono break-all", isLocalFile && !pubUrl.trim() ? "bg-rose-50 text-rose-600" : "bg-slate-50 text-slate-600")}>{url}</div>
          <div className="flex flex-wrap gap-2 mt-4">
            <Btn variant={isClt?"primary":"free"} icon={I.copy} onClick={()=>{ copyText(url); toast(copyText(url)?"Link copiado":"Selecione e copie o link"); }}>Copiar link</Btn>
            <Btn variant="ghost" icon={I.copy} onClick={()=>{ copyText(msg); toast("Mensagem copiada p/ WhatsApp"); }}>Copiar mensagem</Btn>
            <a href={`https://wa.me/?text=${encodeURIComponent(msg)}`} target="_blank" rel="noopener" className="inline-flex items-center justify-center gap-2 text-sm font-semibold rounded-xl px-4 py-2.5 bg-emerald-500 text-white hover:bg-emerald-600"><Icon d={I.arrow} className="w-4 h-4"/>Enviar no WhatsApp</a>
          </div>
          <Btn variant="ghost" className="w-full mt-3" onClick={()=>setLinkModal(null)}>Cancelar</Btn>
        </div>; })()}
    </Modal>

    {/* Modal de DETALHE das abas (Trabalhando / Almoço / Faltas) — clique nos cards */}
    <Modal open={!!detalhe} onClose={()=>setDetalhe(null)}>
      {detalhe && <div className="p-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-bold text-slate-900">{detalhe.titulo} · {ehFree?"Freela":"CLT"} <span className="text-slate-400 font-semibold">({detalhe.itens.length})</span></h3>
          <button onClick={()=>setDetalhe(null)} className="text-slate-400 hover:text-slate-600"><Icon d={I.x}/></button>
        </div>
        <div className="space-y-2 max-h-[55vh] overflow-y-auto">
          {detalhe.itens.map((it,i)=>
            <div key={i} className="flex items-center gap-3 p-3 rounded-xl border border-slate-100 bg-slate-50/60">
              <Avatar name={it.nm} tone={it.tone}/>
              <div className="min-w-0 flex-1"><div className="font-semibold text-slate-800 truncate">{it.nm}</div><div className="text-xs text-slate-500">{it.sub}</div></div>
              {it.extra && <span className="text-xs font-bold text-emerald-600 tabular-nums">{it.extra}</span>}
              <Badge tone={it.tone}>{it.badge}</Badge>
            </div>)}
        </div>
      </div>}
    </Modal>
  </div>;
}

/* ============================ QUIOSQUE DE PONTO ============================ */
function PontoKiosk({ mode, onClose }) {
  const { unidades, clts, freelas, escala, registros, freelancerEscaladoHoje, addRegistro, salvarClt, salvarFreela, cadastrarPublico, enviarAtestado, enviarAjuste } = useStore();
  const ativos = mode==="clt" ? clts : freelas.filter(f=>f.status==="ativo");
  const [fluxo,setFluxo]=useState("escolha"); // escolha | registro | cadastro
  const [unidadeId,setUnidadeId]=useState(unidades[0]?.id);
  const [pid,setPid]=useState(null);
  const [cpf,setCpf]=useState("");
  const [cpfErr,setCpfErr]=useState("");
  const soDigitos=(s)=>(s||"").replace(/\D/g,"");
  // Escalado hoje? Comparação ROBUSTA: casa por id (string) OU por CPF (resolve o escalado→pessoa),
  // aceita qualquer casa e qualquer turno de trabalho (só bloqueia FOLGA). Assim, cadastrado + na escala = bate ponto.
  const escaladoHojePid=(p)=>{
    if(!p) return false;
    const alvoId=String(p.id); const alvoCpf=soDigitos(p.cpf); const lista=mode==="clt"?clts:freelas;
    const alvoNome=(p.nome||"").trim().toLowerCase();
    return Object.values(escala||{}).some(dias=>((dias&&dias[HOJE_IDX])||[]).some(a=>{
      if(a.turno==="folga") return false;
      if(a.tipo && a.tipo!==mode) return false;
      if(String(a.pid)===alvoId) return true;
      const pes=lista.find(x=>String(x.id)===String(a.pid));      // fallback por CPF e por NOME
      if(!pes) return false;
      if(alvoCpf.length===11 && soDigitos(pes.cpf)===alvoCpf) return true;
      return !!(alvoNome && (pes.nome||"").trim().toLowerCase()===alvoNome);
    }));
  };
  const buscarCpf=()=>{
    const d=soDigitos(cpf);
    if(d.length<11){ setCpfErr("Digite os 11 números do CPF."); return; }
    const p=ativos.find(x=>soDigitos(x.cpf)===d);
    if(!p){ setCpfErr("CPF não encontrado. Use “Fazer cadastro (1º acesso)”."); return; }
    if(!escaladoHojePid(p)){ setCpfErr(p.nome.split(" ")[0]+", você não está na escala de hoje — não é possível registrar ponto."); return; }
    setPid(p.id); setUnidadeId(p.unidade||unidades[0]?.id); setCpfErr("");
    setPainel(true); // vai para o PAINEL DE STATUS do colaborador (mostra estado + ações certas do tipo)
  };
  const [step,setStep]=useState(0); // 0 CPF · 1 selfie · 2 gps
  const [foto,setFoto]=useState(null);
  const [camErr,setCamErr]=useState(null);
  const [geo,setGeo]=useState(null);
  const [geoErr,setGeoErr]=useState(null);
  const [acao,setAcao]=useState("Entrada");     // ação canônica escolhida
  const [acaoLabel,setAcaoLabel]=useState("");  // rótulo amigável (ex.: "Saída para almoço")
  const [painel,setPainel]=useState(false);     // painel de status do colaborador
  const [comprovante,setComprovante]=useState(null); // comprovante digital da marcação
  const [cadOk,setCadOk]=useState(false);
  const [cadEnviando,setCadEnviando]=useState(false);
  const [cadErro,setCadErro]=useState("");
  // Envio de atestado pelo colaborador
  const [at,setAt]=useState({cpf:"",data:hojeStr(),horas:8,obs:"",arquivo:null,nomeArq:""});
  const [atStatus,setAtStatus]=useState(""); // "" | enviando | ok | erro
  const upAtestado=(file)=>{ if(!file) return; const rd=new FileReader(); rd.onload=async()=>{ const dados=file.type&&file.type.indexOf("image")===0?await compressImg(rd.result):rd.result; setAt(p=>({...p,arquivo:dados,nomeArq:file.name})); }; rd.readAsDataURL(file); };
  const enviarAtestadoColab=()=>{
    const d=(at.cpf||"").replace(/\D/g,"");
    const pessoa=(mode==="clt"?clts:freelas).find(x=>(x.cpf||"").replace(/\D/g,"")===d);
    if(d.length<11){ setAtStatus("cpf"); return; }
    if(!pessoa){ setAtStatus("naoencontrado"); return; }
    if(!at.arquivo){ setAtStatus("semarquivo"); return; }
    setAtStatus("enviando");
    Promise.resolve(enviarAtestado({ pid:String(pessoa.id), cpf:d, nome:pessoa.nome, tipo:"atestado", data:at.data, horas:Number(at.horas)||8, obs:at.obs, anexo:{nome:at.nomeArq,dados:at.arquivo}, ts:new Date().getTime() }))
      .then(()=>setAtStatus("ok")).catch(()=>setAtStatus("erro"));
  };
  // ---- Solicitação de AJUSTE de ponto pelo colaborador ----
  const acoesAjuste = mode==="free" ? [["Entrada","Check-in"],["Saída","Checkout"]]
    : [["Entrada","Entrada"],["Início intervalo","Saída para almoço"],["Fim intervalo","Retorno do almoço"],["Saída","Saída final"]];
  const [aj,setAj]=useState({cpf:"",data:hojeStr(),acao:"Entrada",hora:"08:00",motivo:""});
  const [ajStatus,setAjStatus]=useState(""); // "" | cpf | naoencontrado | semmotivo | enviando | ok | erro
  const enviarAjusteColab=()=>{
    const d=(aj.cpf||"").replace(/\D/g,"");
    const pessoa=(mode==="clt"?clts:freelas).find(x=>(x.cpf||"").replace(/\D/g,"")===d);
    if(d.length<11){ setAjStatus("cpf"); return; }
    if(!pessoa){ setAjStatus("naoencontrado"); return; }
    if(!(aj.motivo||"").trim()){ setAjStatus("semmotivo"); return; }
    const [hh,mm]=(aj.hora||"08:00").split(":").map(Number); const min=(hh||0)*60+(mm||0);
    const uni=(unidades.find(u=>u.id===pessoa.unidade)||unidades[0]||{}).nome||"";
    const rot=(acoesAjuste.find(a=>a[0]===aj.acao)||[])[1]||aj.acao;
    setAjStatus("enviando");
    Promise.resolve(enviarAjuste({ pid:String(pessoa.id), cpf:d, nome:pessoa.nome, tipo:mode, unidade:uni,
      acao:aj.acao, acaoLabel:rot, data:aj.data, hora:aj.hora, min, motivo:aj.motivo.trim(), status:"pendente", ts:new Date().getTime() }))
      .then(()=>setAjStatus("ok")).catch(()=>setAjStatus("erro"));
  };
  const videoRef=useRef(null); const streamRef=useRef(null);
  const clock=useClock();
  const accent = mode==="clt"?"brand":"free";
  const pSel=(mode==="clt"?clts:freelas).find(x=>x.id===pid);
  // LOCAL DINÂMICO: a casa vem do cadastro do colaborador identificado pelo CPF (não é fixo).
  const unidade=(pSel && unidades.find(u=>u.id===pSel.unidade)) || unidades.find(u=>u.id===unidadeId) || unidades[0];
  const escalado = mode==="clt" || (pid && freelancerEscaladoHoje(pid));

  const startCam=async()=>{ setCamErr(null);
    try{ const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}); streamRef.current=s; if(videoRef.current){videoRef.current.srcObject=s; await videoRef.current.play();} }
    catch{ setCamErr("Câmera indisponível neste ambiente. Use 'Simular selfie' para continuar a demonstração."); } };
  const stopCam=()=>{ streamRef.current?.getTracks().forEach(t=>t.stop()); streamRef.current=null; };
  useEffect(()=>{ if(fluxo==="registro"&&step===1&&!foto) startCam(); return stopCam; },[step,fluxo]);

  const capturar=()=>{ const v=videoRef.current;
    if(v&&v.videoWidth){ const c=document.createElement("canvas"); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext("2d").drawImage(v,0,0); compressImg(c.toDataURL("image/jpeg",0.8)).then(setFoto); }
    else setFoto("data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect width='300' height='300' fill='#1e1b4b'/><circle cx='150' cy='120' r='55' fill='${accent==="clt"?"#6366f1":"#f97316"}'/><rect x='80' y='190' width='140' height='90' rx='45' fill='${accent==="clt"?"#6366f1":"#f97316"}'/><text x='150' y='285' font-size='16' fill='#fff' text-anchor='middle' font-family='sans-serif'>selfie simulada</text></svg>`));
    stopCam(); };
  const pegarGeo=()=>{ setGeoErr(null);
    if(!navigator.geolocation){ setGeoErr("Geolocalização não suportada."); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>{ const {latitude,longitude}=pos.coords; const dist=haversine(latitude,longitude,unidade.lat,unidade.lng); setGeo({dist,ok:dist<=unidade.raio}); },
      ()=>{ setGeoErr("Permissão de GPS negada. Simulando posição dentro da cerca."); setGeo({dist:38,ok:true}); }, {enableHighAccuracy:true,timeout:8000}); };
  const simGeo=()=>setGeo({dist:42,ok:true});

  // ===== Estado do colaborador hoje (deriva das batidas reais) — casa por pid/CPF/nome =====
  const _hojeK=hojeStr();
  const meusRegs=(registros||[]).filter(r=> (r.pid&&pSel&&String(r.pid)===String(pSel.id)) || (r.cpf&&pSel&&soDigitos(r.cpf)===soDigitos(pSel.cpf)) || (pSel&&r.nome===pSel.nome))
    .filter(r=>!r.data||r.data===_hojeK); // mais recente primeiro
  const ultimaAcao=meusRegs[0]?.acao;
  const estado = !ultimaAcao ? "aguardando" : (ultimaAcao==="Saída"?"encerrado" : ultimaAcao==="Início intervalo"?"pausa" : "trabalhando");
  const segStartMin = meusRegs[0]?.min; // início do estado atual (para cronômetro)
  const entradaHoje = meusRegs.slice().reverse().find(r=>r.acao==="Entrada");
  // rótulos amigáveis por tipo
  const rotuloAcao=(a)=> mode==="free"
    ? (a==="Entrada"?"Check-in":a==="Saída"?"Checkout":a)
    : ({ "Entrada":"Entrada","Início intervalo":"Saída para almoço","Fim intervalo":"Retorno do almoço","Saída":"Saída final" }[a]||a);
  // ações disponíveis conforme TIPO + estado
  const acoesDisponiveis = mode==="free"
    ? (estado==="aguardando"?["Entrada"] : estado==="trabalhando"?["Saída"] : [])
    : (estado==="aguardando"?["Entrada"] : estado==="trabalhando"?["Início intervalo","Saída"] : estado==="pausa"?["Fim intervalo"] : []);

  // inicia uma marcação (selfie+GPS) para a ação escolhida no painel
  const iniciarAcao=(canon)=>{ setAcao(canon); setAcaoLabel(rotuloAcao(canon)); setFoto(null); setGeo(null); setGeoErr(null); setPainel(false); setStep(1); };
  // registra a ação escolhida e gera COMPROVANTE digital
  const registrarAcao=()=>{
    const now=new Date();
    const hora=now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    const protocolo=(soDigitos(pSel?.cpf).slice(-4)||"0000")+"-"+now.getTime().toString(36).slice(-5).toUpperCase();
    addRegistro({ nome: pSel?.nome || "Colaborador", pid: pSel?.id!=null?String(pSel.id):null, cpf: soDigitos(pSel?.cpf), tipo:mode, acao, unidade:unidade.nome, hora, geo:true, selfie:true, foto, protocolo });
    setComprovante({ acao, label:acaoLabel||rotuloAcao(acao), hora, unidade:unidade.nome, nome:pSel?.nome, protocolo, encerrou:acao==="Saída" });
    setStep(0);
  };
  const registrarCadastro=(dados)=>{
    // Grava no BANCO CENTRAL e só libera após confirmar a sincronização
    setCadEnviando(true); setCadErro("");
    Promise.resolve(cadastrarPublico({...dados, tipo:mode, status:"ativo"}))
      .then(()=>{ setCadEnviando(false); setCadOk(true); })
      .catch(()=>{ setCadEnviando(false); setCadErro("Não foi possível salvar seu cadastro no servidor. Verifique sua internet e tente novamente."); });
  };

  return <div className="fixed inset-0 z-50 grad-ink grad-hero flex items-center justify-center p-4">
    <button onClick={onClose} className="absolute top-4 right-4 w-10 h-10 rounded-xl bg-white/10 text-white grid place-items-center hover:bg-white/20"><Icon d={I.x}/></button>
    <div className="w-full max-w-md">
      <div className="flex justify-center mb-4"><Logo light/></div>
      <div className="text-center mb-3">
        <Badge tone={mode==="clt"?"brand":"free"}>{mode==="clt"?"Link CLT":"Link Freelancer"} · cadastro e registro</Badge>
      </div>
      <Card className="p-6 relative overflow-hidden">
        {comprovante ? <div className="py-8 text-center fade-in">
            <div className="w-20 h-20 mx-auto rounded-full bg-emerald-500 grid place-items-center text-white mb-4 shadow-glow"><Icon d={I.check} className="w-10 h-10" stroke={3}/></div>
            <h3 className="text-2xl font-extrabold text-slate-900">Marcação registrada!</h3>
            <p className="text-slate-500 mt-1">Comprovante digital do seu ponto</p>
            <div className="mt-4 mx-auto max-w-xs text-left rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm">
              <div className="flex justify-between py-1"><span className="text-slate-500">Colaborador</span><b className="text-slate-800">{comprovante.nome}</b></div>
              <div className="flex justify-between py-1"><span className="text-slate-500">Registro</span><b className="text-slate-800">{comprovante.label}</b></div>
              <div className="flex justify-between py-1"><span className="text-slate-500">Horário</span><b className="text-slate-800 tabular-nums">{comprovante.hora}</b></div>
              <div className="flex justify-between py-1"><span className="text-slate-500">Unidade</span><b className="text-slate-800">{comprovante.unidade}</b></div>
              <div className="flex justify-between py-1 border-t border-slate-200 mt-1 pt-2"><span className="text-slate-500">Protocolo</span><b className="text-slate-800 font-mono">{comprovante.protocolo}</b></div>
              <div className="flex items-center gap-1 justify-center mt-2 text-emerald-600 text-xs"><Icon d={I.check} className="w-3.5 h-3.5"/> Facial e GPS confirmados</div>
            </div>
            {comprovante.encerrou
              ? <Btn className="w-full mt-4" variant={accent==="clt"?"primary":"free"} onClick={onClose}>Concluir</Btn>
              : <Btn className="w-full mt-4" icon={I.arrow} variant={accent==="clt"?"primary":"free"} onClick={()=>{setComprovante(null);setPainel(true);}}>Ver meu status</Btn>}
            <Btn variant="ghost" className="w-full mt-2" onClick={onClose}>Fechar</Btn>
          </div>
        : painel ? <div className="fade-in">
            <div className="text-center mb-4">
              <div className="text-3xl font-extrabold tracking-tight text-slate-900 tabular-nums">{clock.toLocaleTimeString("pt-BR")}</div>
              <div className="text-slate-500 text-sm mt-1">{(pSel?.nome||"").split(" ").slice(0,2).join(" ")} · {mode==="clt"?"CLT":"Freelancer"} · {unidade?.nome}</div>
            </div>
            <div className={cx("rounded-2xl p-5 text-center mb-4", estado==="trabalhando"?"bg-emerald-50":estado==="pausa"?"bg-amber-50":estado==="encerrado"?"bg-slate-100":"bg-sky-50")}>
              <div className="text-xs font-bold uppercase tracking-wide mb-1" style={{color: estado==="trabalhando"?"#059669":estado==="pausa"?"#d97706":estado==="encerrado"?"#64748b":"#0284c7"}}>
                {estado==="trabalhando"?"Em período de trabalho":estado==="pausa"?"Em pausa / almoço":estado==="encerrado"?"Jornada encerrada":"Aguardando entrada"}</div>

            <div className="grid grid-cols-2 gap-2 mt-2">
              <Field label="Data do atestado"><Input type="date" value={at.data} onChange={e=>setAt({...at,data:e.target.value})}/></Field>
              <Field label="Horas/dia"><Input type="number" value={at.horas} onChange={e=>setAt({...at,horas:Number(e.target.value)})}/></Field>
            </div>
            <div className="mt-2">
              <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Documento (foto ou PDF)</label>
              <label className="mt-1 flex items-center gap-2 cursor-pointer p-3 rounded-xl border border-dashed border-slate-300 hover:border-sky-400">
                <Icon d={I.upload} className="w-5 h-5 text-slate-400"/>
                <span className="text-sm text-slate-600">{at.nomeArq||"Toque para anexar o atestado"}</span>
                <input type="file" accept="image/*,application/pdf" className="hidden" onChange={e=>upAtestado(e.target.files&&e.target.files[0])}/>
              </label>
            </div>
            {atStatus==="cpf" && <div className="mt-3 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">Digite os 11 números do CPF.</div>}
            {atStatus==="naoencontrado" && <div className="mt-3 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">CPF não encontrado. Faça o cadastro (1º acesso) primeiro.</div>}
            {atStatus==="semarquivo" && <div className="mt-3 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">Anexe o documento do atestado.</div>}
            {atStatus==="erro" && <div className="mt-3 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">Não foi possível enviar agora. Verifique a internet e tente de novo.</div>}
            <div className="flex gap-2 mt-4">
              <Btn variant="ghost" onClick={()=>setFluxo("escolha")}>Voltar</Btn>
              <Btn className="flex-1" icon={atStatus==="enviando"?null:I.check} disabled={atStatus==="enviando"} onClick={enviarAtestadoColab}>{atStatus==="enviando"?"Enviando…":"Enviar atestado"}</Btn>
            </div>
          </div>)
        : fluxo==="cadastro" ? <div className="fade-in -m-6"><ColabForm tipo={mode} onClose={()=>setFluxo("escolha")} onSalvar={registrarCadastro}/></div>
        : <>
          <div className="text-center mb-5">
            <div className="text-4xl font-extrabold tracking-tight text-slate-900 tabular-nums">{clock.toLocaleTimeString("pt-BR")}</div>
            <div className="text-slate-500 text-sm mt-1">{pSel ? <>Sua casa: <b className="text-slate-700">{unidade?.nome}</b></> : "Identifique-se pelo CPF"}</div>
          </div>

          {step===0 && <div className="fade-in">
            <div className="text-center mb-4">
              <div className="w-14 h-14 mx-auto rounded-2xl grad-brand grid place-items-center text-white mb-2"><Icon d={I.user} className="w-7 h-7"/></div>
              <p className="text-sm text-slate-500">Digite seu <b>CPF</b> para registrar o ponto. Só quem está na <b>escala de hoje</b> consegue bater.</p>
            </div>
            <Field label="Seu CPF">
              <Input value={cpf} inputMode="numeric" placeholder="000.000.000-00"
                onChange={e=>{setCpf(e.target.value); setCpfErr("");}}
                onKeyDown={e=>{ if(e.key==="Enter") buscarCpf(); }}/>
            </Field>
            {cpfErr && <div className="mt-3 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm flex items-center gap-2"><Icon d={I.x} className="w-4 h-4 shrink-0"/>{cpfErr}</div>}
            <Btn className="w-full mt-4" icon={I.arrow} variant={accent==="clt"?"primary":"free"} onClick={buscarCpf}>Continuar</Btn>
          </div>}

          {step===1 && <div className="fade-in">
            <div className="aspect-square rounded-2xl overflow-hidden bg-ink-900 relative grid place-items-center">
              {foto ? <img src={foto} className="w-full h-full object-cover"/> : <video ref={videoRef} className="w-full h-full object-cover" playsInline muted/>}
              {!foto && <div className="absolute inset-8 border-2 border-white/50 rounded-full pointer-events-none"/>}
            </div>
            {camErr && <p className="text-xs text-amber-600 mt-2">{camErr}</p>}
            <div className="mt-4 flex gap-2">
              {!foto ? <>
                  <Btn className="flex-1" icon={I.camera} onClick={capturar} variant={accent==="clt"?"primary":"free"}>Capturar selfie</Btn>
                  <label className="cursor-pointer">
                    <span className="inline-flex items-center gap-1 text-sm font-semibold rounded-xl px-4 py-2.5 border border-slate-200 text-slate-700 hover:bg-slate-50"><Icon d={I.upload} className="w-4 h-4"/>Foto</span>
                    <input type="file" accept="image/*" capture="user" className="hidden" onChange={e=>{ const fl=e.target.files&&e.target.files[0]; if(fl){ const rd=new FileReader(); rd.onload=async()=>{stopCam();setFoto(await compressImg(rd.result));}; rd.readAsDataURL(fl); } }}/>
                  </label>
                </>
                : <><Btn variant="ghost" onClick={()=>{setFoto(null);startCam();}}>Refazer</Btn>
                    <Btn className="flex-1" icon={I.arrow} onClick={()=>{setStep(2);pegarGeo();}} variant={accent==="clt"?"primary":"free"}>Continuar</Btn></>}
            </div>
            <p className="text-[11px] text-slate-400 mt-2 text-center">No celular, "Foto" abre a câmera. Em arquivo local (file://) a câmera ao vivo pode ficar indisponível — use "Foto".</p>

          {step===2 && <div className="fade-in">
            <div className="rounded-2xl border border-slate-200 overflow-hidden">
              <div className="h-32 relative grad-brand grid place-items-center">
                <div className="text-white text-center"><div className="w-12 h-12 mx-auto rounded-full bg-white/20 grid place-items-center tick"><Icon d={I.pin} className="w-6 h-6"/></div>

                <div>{geo ? (geo.ok
                  ? <Badge tone="green"><Icon d={I.check} className="w-3 h-3"/> Dentro da cerca</Badge>
                  : <Badge tone="red"><Icon d={I.x} className="w-3 h-3"/> Fora da cerca — bloqueado</Badge>)

              </div>
            </div>
            {geoErr && <p className="text-xs text-amber-600 mt-2">{geoErr}</p>}
            <div className="mb-3 mt-3 p-3 rounded-xl bg-slate-50 text-sm text-center">Você vai registrar: <b className="text-slate-900">{acaoLabel||rotuloAcao(acao)}</b></div>
