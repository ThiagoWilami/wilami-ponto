/* ============================ HOLERITES (upload da contabilidade → app do colaborador) ============================ */
function HoleritesPage(){
  const { clts, freelas, arquivos, acessosColab, can } = useStore();
  const toast=useContext(ToastCtx);
  const hoje=new Date(); const mesPassado=new Date(hoje.getFullYear(),hoje.getMonth()-1,1);
  const [comp,setComp]=useState(mesPassado.getFullYear()+"-"+String(mesPassado.getMonth()+1).padStart(2,"0"));
  const [tipoHol,setTipoHol]=useState("mensal");
  const [itens,setItens]=useState([]);        // pré-visualização antes de publicar
  const [proc,setProc]=useState("");          // mensagem de processamento
  const [pub,setPub]=useState(null);          // {feito,total}
  const [drag,setDrag]=useState(false);
  const editavel=can("documentos"), podeExcluir=can("excluir");
  const pessoas=[...clts.map(p=>({...p,_tipo:"clt"})), ...freelas.map(p=>({...p,_tipo:"free"}))];
  const keyDe=(p)=>donoKeyDe(p._tipo,p.id);
  const pessoaPorKey=(k)=>pessoas.find(p=>keyDe(p)===k);
  const tipoLabel=(HOLERITE_TIPOS.find(t=>t[0]===tipoHol)||[])[1]||"Holerite";
  const publicados=arquivos.filter(a=>a.categoria==="holerite" && a.competencia===comp);
  const jaTem=(k)=>publicados.some(a=>a.donoKey===k && (a.holeriteTipo||"mensal")===tipoHol);

  const processar=async(lista)=>{
    const files=Array.from(lista||[]); if(!files.length) return;
    const novos=[];
    for(let fi=0; fi<files.length; fi++){
      const f=files[fi];
      setProc("Lendo "+f.name+" ("+(fi+1)+"/"+files.length+")…");
      const bytes=new Uint8Array(await f.arrayBuffer());
      const pdf=/pdf/i.test(f.type)||/\.pdf$/i.test(f.name);
      const porArquivo=acharPessoaNoTexto(f.name.replace(/[_.\-]+/g," "), pessoas);
      let textos=null;
      if(pdf){ try{ textos=await textoPaginasPdf(bytes); }catch(e){ textos=null; } }
      if(textos && textos.length>1){
        // PDF com vários holerites: separa página a página pelo CPF/nome encontrado
        let grupo=null;
        textos.forEach((t,i)=>{
          const m=acharPessoaNoTexto(t,pessoas); const k=m?keyDe(m.pessoa):"";
          if(grupo && k && grupo.k===k){ grupo.paginas.push(i); return; }
          grupo={k, por:m?m.por:"", paginas:[i]}; novos.push({ id:Math.random().toString(36).slice(2), origem:f.name, mime:"application/pdf", bytes, total:textos.length, paginas:grupo.paginas, k:grupo.k, por:grupo.por });
        });
      } else {
        const m=(textos&&textos[0]&&acharPessoaNoTexto(textos[0],pessoas)) || porArquivo;
        novos.push({ id:Math.random().toString(36).slice(2), origem:f.name, mime:f.type||(pdf?"application/pdf":"application/octet-stream"), bytes, total:textos?textos.length:1, paginas:null,
          k:m?keyDe(m.pessoa):"", por:m?(m===porArquivo&&!(textos&&textos[0]&&acharPessoaNoTexto(textos[0],pessoas))?"nome do arquivo":m.por):"" });
      }
    }
    setProc(""); setItens(prev=>[...prev,...novos]);
    const sem=novos.filter(n=>!n.k).length;
    toast(novos.length+" holerite(s) lidos"+(sem?" · "+sem+" precisam de identificação manual":" · todos identificados"));
  };
  const bytesDoItem=async(it)=> (it.paginas && it.paginas.length<it.total) ? await extrairPaginasPdf(it.bytes, it.paginas) : it.bytes;
  const preview=async(it)=>{ const w=window.open("","_blank"); try{ const b=await bytesDoItem(it); const url=URL.createObjectURL(new Blob([b],{type:it.mime})); if(w) w.location.href=url; }catch(e){ if(w) w.close(); toast("Não foi possível abrir: "+(e.message||e)); } };
  const publicar=async()=>{
    const ok=itens.filter(it=>it.k); if(!ok.length) return;
    setPub({feito:0,total:ok.length}); let feitos=0; const restantes=[];
    for(const it of itens){
      if(!it.k){ restantes.push(it); continue; }
      const p=pessoaPorKey(it.k);
      try{
        const b=await bytesDoItem(it);
        const ext=/pdf/i.test(it.mime)?".pdf":(String(it.origem).match(/\.[a-z0-9]+$/i)||[""])[0];
        await arqSalvar({ nome:"Holerite "+tipoLabel+" "+fmtCompetencia(comp)+" - "+p.nome+ext, donoKey:it.k, donoTipo:p._tipo, donoId:String(p.id), donoNome:p.nome, cpf:soDigitos(p.cpf),
          pasta:"Holerites", categoria:"holerite", competencia:comp, holeriteTipo:tipoHol, visivelColab:true, origem:it.origem }, bytesParaDataUrl(b,it.mime));
        feitos++; setPub({feito:feitos,total:ok.length});
      }catch(e){ restantes.push(it); toast("Falha em "+p.nome+": "+erroBanco(e)); }
    }
    setItens(restantes); setPub(null);
    if(feitos) toast(feitos+" holerite(s) publicados no app dos colaboradores");
  };
  const semPin=[...new Set(itens.filter(it=>it.k&&!acessosColab[it.k]).map(it=>it.k))];
  const semHolerite=clts.filter(c=>!publicados.some(a=>a.donoKey===donoKeyDe("clt",c.id)));

  return <div className="fade-in">
    <PageHeader title="Holerites" sub="Suba os holerites da contabilidade — o sistema identifica cada colaborador e libera no app dele"/>
    {editavel && <Card className="p-5 mb-4">
      <div className="grid sm:grid-cols-3 gap-3 mb-4">
        <Field label="Competência"><Input type="month" value={comp} onChange={e=>setComp(e.target.value)}/></Field>
        <Field label="Tipo"><Select value={tipoHol} onChange={e=>setTipoHol(e.target.value)}>{HOLERITE_TIPOS.map(([k,l])=><option key={k} value={k}>{l}</option>)}</Select></Field>
        <div className="flex items-end"><label className="w-full cursor-pointer">
          <span className="w-full inline-flex items-center justify-center gap-2 text-sm font-semibold text-white grad-brand px-4 py-2.5 rounded-xl shadow-glow"><Icon d={I.upload} className="w-4 h-4"/>Selecionar PDFs</span>
          <input type="file" multiple accept="application/pdf,image/*" className="hidden" onChange={e=>{ processar(e.target.files); e.target.value=""; }}/>
        </label></div>
      </div>
      <div onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);processar(e.dataTransfer.files);}}
        className={cx("p-6 rounded-2xl border-2 border-dashed text-center transition", drag?"drag-over border-brand-300":"border-slate-200")}>
        {proc ? <div className="text-brand-700 font-semibold text-sm flex items-center justify-center gap-2"><span className="w-4 h-4 rounded-full border-2 border-brand-200 border-t-brand-600 animate-spin"/>{proc}</div>
        : <><div className="w-12 h-12 mx-auto rounded-2xl grad-gold grid place-items-center text-white mb-2"><Icon d={I.receipt}/></div>
          <div className="font-semibold text-slate-800">Arraste aqui os holerites enviados pela contabilidade</div>
          <div className="text-sm text-slate-500 mt-1">Aceita <b>um PDF por colaborador</b> ou <b>um PDF único com todos</b> — o sistema separa as páginas pelo CPF ou nome de cada um.</div></>}
      </div>
    </Card>}

    {itens.length>0 && <Card className="p-5 mb-4">
      <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
        <h3 className="font-bold text-slate-900">Conferência antes de publicar · {tipoLabel} {fmtCompetencia(comp)}</h3>
        <div className="flex gap-2">
          <Btn size="sm" variant="ghost" onClick={()=>setItens([])}>Descartar</Btn>
          <Btn size="sm" icon={pub?null:I.check} disabled={!!pub||!itens.some(i=>i.k)} onClick={publicar}>{pub?("Publicando "+pub.feito+"/"+pub.total+"…"):("Publicar "+itens.filter(i=>i.k).length+" no app")}</Btn>
        </div>
      </div>
      {semPin.length>0 && <div className="mb-3 p-3 rounded-xl bg-amber-50 text-amber-800 text-sm flex items-start gap-2"><Icon d={I.key} className="w-4 h-4 mt-0.5 shrink-0"/>
        <span>{semPin.length} colaborador(es) ainda não têm PIN de acesso ao app: <b>{semPin.map(k=>(pessoaPorKey(k)||{}).nome).join(", ")}</b>. O holerite fica guardado e aparece assim que o acesso for liberado (em Arquivos &amp; pastas).</span></div>}
      <div className="space-y-2">
        {itens.map(it=>{ const p=it.k&&pessoaPorKey(it.k);
          return <div key={it.id} className={cx("p-3 rounded-xl border flex flex-wrap items-center gap-3", it.k?"border-slate-200":"border-rose-200 bg-rose-50/40")}>
            <div className={cx("w-9 h-9 rounded-lg grid place-items-center shrink-0", it.k?"bg-emerald-50 text-emerald-600":"bg-rose-100 text-rose-500")}><Icon d={it.k?I.check:I.help} className="w-4 h-4"/></div>
            <div className="flex-1 min-w-[180px]">
              <div className="text-sm font-semibold text-slate-800 break-all">{it.origem}{it.paginas&&it.total>1&&<span className="text-slate-400 font-normal"> · pág. {it.paginas.map(x=>x+1).join(", ")} de {it.total}</span>}</div>
              <div className="text-xs mt-0.5">{it.k ? <span className="text-emerald-700">Identificado por {it.por||"seleção manual"}</span> : <span className="text-rose-600 font-semibold">Não identificado — escolha o colaborador</span>}
                {it.k && jaTem(it.k) && <span className="text-amber-600"> · já existe um holerite desta competência para essa pessoa</span>}</div>
            </div>
            <div className="w-full sm:w-64"><Select value={it.k} onChange={e=>setItens(arr=>arr.map(x=>x.id===it.id?{...x,k:e.target.value,por:e.target.value?"seleção manual":""}:x))}>
              <option value="">— escolher colaborador —</option>
              {pessoas.map(pp=><option key={keyDe(pp)} value={keyDe(pp)}>{pp.nome} · {TIPO_ROTULO[pp._tipo]}{pp.cpf?" · "+pp.cpf:""}</option>)}
            </Select></div>
            <button title="Ver" onClick={()=>preview(it)} className="w-8 h-8 rounded-lg grid place-items-center text-slate-500 hover:bg-slate-100"><Icon d={I.eye} className="w-4 h-4"/></button>
            <button title="Remover" onClick={()=>setItens(arr=>arr.filter(x=>x.id!==it.id))} className="w-8 h-8 rounded-lg grid place-items-center text-slate-400 hover:text-rose-500 hover:bg-rose-50"><Icon d={I.x} className="w-4 h-4"/></button>
          </div>; })}
      </div>
    </Card>}

    <Card className="p-5">

const FORMAS_PAG_PJ=["Pix","Transferência (TED)","Boleto","Dinheiro"];
// Meses (AAAA-MM) do período em que o contrato do PJ está vigente
function pjMesesNoPeriodo(pj, ini, fim){
  if(!ini||!fim) return [];
  const out=[]; let [y,m]=ini.slice(0,7).split("-").map(Number); const [yf,mf]=fim.slice(0,7).split("-").map(Number);
  while(y<yf || (y===yf && m<=mf)){ const ym=y+"-"+String(m).padStart(2,"0");
    const iniOk=!pj.inicio || pj.inicio.slice(0,7)<=ym; const fimOk=!pj.fim || pj.fim.slice(0,7)>=ym;
    if(iniOk && fimOk) out.push(ym); m++; if(m>12){ m=1; y++; } }
  return out;
}
// Data de vencimento do PJ no mês (dia de pagamento limitado ao último dia do mês)
function pjVencimento(pj, ym){
  const dia=Number(pj.diaPagamento)||0; if(!dia||!ym) return "";
  const [y,m]=ym.split("-").map(Number); const ult=new Date(y,m,0).getDate();
  return ym+"-"+String(Math.min(dia,ult)).padStart(2,"0");
}
const pjAtivoNoPeriodo=(pj,ini,fim)=> pj.status!=="encerrado" || pjMesesNoPeriodo(pj,ini,fim).length>0;

function PortalColab({onClose}){
  const { clts, freelas, pjs } = useStore();
  const [doc,setDoc]=useState(""); const [pin,setPin]=useState("");
  const [erro,setErro]=useState(""); const [entrando,setEntrando]=useState(false);
  const [sessao,setSessao]=useState(()=>{ try{ return JSON.parse(sessionStorage.getItem(tKey("portal"))||"null"); }catch(e){ return null; } });
  const [arqs,setArqs]=useState(null);
  const [abrindo,setAbrindo]=useState("");
  const todos=[...clts.map(p=>({tipo:"clt",p})), ...freelas.map(p=>({tipo:"free",p})), ...pjs.map(p=>({tipo:"pj",p}))];
  const eu=sessao && todos.find(x=>donoKeyDe(x.tipo,x.p.id)===sessao.key);
  const bloqKey=tKey("portal_bloq");
  const entrar=async()=>{
    setErro(""); const d=soDigitos(doc);
    if(!(d.length===11||d.length===14)){ setErro("Digite seu CPF (11 números) ou CNPJ (14 números)."); return; }
    if(!/^\d{4,8}$/.test(pin)){ setErro("Digite o PIN que você recebeu do RH."); return; }
    let bloq={n:0,ate:0}; try{ bloq=JSON.parse(localStorage.getItem(bloqKey)||'{"n":0,"ate":0}'); }catch(e){}
    if(bloq.ate>Date.now()){ setErro("Muitas tentativas. Aguarde alguns minutos e tente de novo."); return; }
    const achado=todos.find(x=>soDigitos(x.p.cpf)===d || (x.tipo==="pj" && soDigitos(x.p.cnpj)===d));
    if(!achado){ setErro("Documento não encontrado. Confira os números ou fale com o RH."); return; }
    const key=donoKeyDe(achado.tipo,achado.p.id);
    if(!window.__WPDB){ setErro("Sem conexão com o sistema. Tente novamente."); return; }
    setEntrando(true);
    try{
      const s=await nCol("acessosColab").doc(key).get();
      if(!s.exists){ setErro("Seu acesso ainda não foi liberado. Peça seu PIN ao RH."); setEntrando(false); return; }
      const h=await pinHash(d,pin);
      if(h!==(s.data()||{}).hash){
        bloq.n=(bloq.n||0)+1; if(bloq.n>=5){ bloq={n:0,ate:Date.now()+5*60*1000}; }
        try{ localStorage.setItem(bloqKey,JSON.stringify(bloq)); }catch(e){}
        setErro("PIN incorreto."); setEntrando(false); return;
      }
      try{ localStorage.removeItem(bloqKey); }catch(e){}
      const ss={key, doc:d}; setSessao(ss); try{ sessionStorage.setItem(tKey("portal"),JSON.stringify(ss)); }catch(e){}
      setPin("");
    }catch(e){ setErro("Não foi possível entrar agora. Tente novamente."); }
    setEntrando(false);
  };
  const sair=()=>{ setSessao(null); setArqs(null); try{ sessionStorage.removeItem(tKey("portal")); }catch(e){} };
  useEffect(()=>{ if(!sessao||!window.__WPDB) return;
    try{ return nCol("arquivos").where("donoKey","==",sessao.key).onSnapshot(function(snap){ const a=[]; snap.forEach(function(d){ const x={...(d.data()||{}),id:d.id}; if(x.visivelColab) a.push(x); }); setArqs(a); }, function(){ setArqs([]); }); }catch(e){ setArqs([]); }
  },[sessao&&sessao.key]);
  const abrir=async(a)=>{ setAbrindo(a.id); try{ await arqAbrir(a); if(!a.vistoEm) arqAtualizar(a.id,{vistoEm:Date.now()}).catch(()=>{}); }catch(e){ alert("Não foi possível abrir o arquivo."); } setAbrindo(""); };
  const hol=(arqs||[]).filter(a=>a.categoria==="holerite").sort((a,b)=>String(b.competencia||"").localeCompare(String(a.competencia||""))||(b.ts||0)-(a.ts||0));
  const outros=(arqs||[]).filter(a=>a.categoria!=="holerite").sort((a,b)=>(b.ts||0)-(a.ts||0));
  const Linha=({a,destaque})=> <button onClick={()=>abrir(a)} className="w-full flex items-center gap-3 p-3.5 rounded-2xl border border-slate-200 bg-white hover:border-brand-300 hover:bg-brand-50/30 text-left transition">

function ConfigMarca(){
  const { marca, setMarca } = useStore();
  const toast=useContext(ToastCtx);
  const m=marca||{};
  const upLogo=async(file)=>{
    if(!file) return;
    const du=await lerArquivoDataUrl(file);
    if(/svg/i.test(file.type)){ if(du.length>400000){ toast("SVG muito grande"); return; } setMarca({...m,logo:du}); toast("Logo atualizado"); return; }
    const img=new Image(); img.onload=()=>{ const max=480, s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); setMarca({...m,logo:c.toDataURL("image/png")}); toast("Logo atualizado"); };
    img.src=du;
  };
  return <Card className="p-5">
    <h3 className="font-bold text-slate-900 mb-4 flex items-center gap-2"><Icon d={I.edit} className="w-4 h-4 text-brand-600"/>Marca da empresa</h3>
    <div className="grid sm:grid-cols-2 gap-3 mb-4">
      <div className="rounded-2xl border border-slate-100 p-4 grid place-items-center bg-white"><Logo/></div>
      <div className="rounded-2xl p-4 grid place-items-center grad-ink"><Logo light/></div>
    </div>
    <div className="flex flex-wrap gap-2 items-center">
      <label className="cursor-pointer"><span className="inline-flex items-center gap-1.5 text-sm font-semibold text-white grad-brand px-3.5 py-2 rounded-xl"><Icon d={I.upload} className="w-4 h-4"/>{m.logo?"Trocar logo":"Enviar logo (PNG/SVG)"}</span>
        <input type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" className="hidden" onChange={e=>{ upLogo(e.target.files&&e.target.files[0]); e.target.value=""; }}/></label>
      {m.logo && <Btn size="sm" variant="ghost" onClick={()=>{ setMarca({...m,logo:null}); toast("Voltou ao símbolo WILAMI"); }}>Usar símbolo WILAMI</Btn>}

      <Field label="Nome exibido"><Input value={m.nome||""} placeholder="WILAMI" onChange={e=>setMarca({...m,nome:e.target.value})}/></Field>
      {m.logo && <label className="flex items-center gap-2 text-sm text-slate-600 pb-2.5"><input type="checkbox" checked={m.mostrarNome!==false} onChange={e=>setMarca({...m,mostrarNome:e.target.checked})}/> Mostrar o nome ao lado do logo</label>}
    </div>
    <p className="text-xs text-slate-400 mt-3">O logo aparece no painel, na tela de login, no app de ponto e no app “Meus documentos”. Use PNG com fundo transparente para o melhor resultado.</p>
  </Card>;
}

        <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Conexão</div>

          : <div className="mt-2 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">{teste.erro}{teste.info&&teste.info.consentUrl&&<> — <a className="underline font-semibold" href={teste.info.consentUrl} target="_blank" rel="noreferrer">autorizar o app no DocuSign</a></>}</div>)}
        <details className="mt-3 text-sm text-slate-600"><summary className="cursor-pointer font-semibold text-slate-700">Como configurar (uma vez)</summary>
          <ol className="list-decimal pl-5 mt-2 space-y-1 text-xs">

/* ============================ CARGOS & FUNÇÕES (descritivo de função) ============================ */
const DESCRITIVO_LINHAS=(t)=> String(t||"").split(/\n+/).map(l=>l.replace(/^\s*[-•*\d.)]+\s*/,"").trim()).filter(Boolean);
// Turnos/períodos do cargo (ex.: Manhã 07:00–15:20, Noite 18:00–02:20). Cargos antigos com um só horário viram um turno.
const TURNOS_SUGERIDOS=["Manhã","Tarde","Noite","Madrugada","Intermediário","Fim de semana"];
const turnosDe=(c)=>{ if(!c) return []; if(Array.isArray(c.turnos)&&c.turnos.length) return c.turnos; return (c.horario||c.escala)?[{nome:"Padrão",horario:c.horario||"",escala:c.escala||""}]:[]; };
const rotuloTurno=(t)=>[t.nome, t.horario, t.escala?(ESCALAS[t.escala]||t.escala):""].filter(Boolean).join(" · ");
const CARGO_VAZIO={ nome:"", tipo:"clt", setor:"salao", escala:"6x1", horario:"", salarioBase:"", beneficios:"", requisitos:"", descritivo:"", obs:"", objetoContrato:"", clausulasOff:[], clausulaEspecifica:"" };
function CargoForm({inicial,onSalvar,onClose,nomesUsados}){
  const { modeloContratoPJ } = useStore();
  const opcionais=((modeloContratoPJ||MODELO_PJ_PADRAO).clausulas||[]).filter(x=>x.opcional && !x.especifica);
  const [c,setC]=useState(()=>{ const b={...CARGO_VAZIO, ...(inicial||{})}; const ts=turnosDe(inicial).filter(t=>!(t.nome==="Padrão"&&!t.horario)); return {...b, turnos: ts.length?ts.map(t=>({...t})):[{nome:"Manhã",horario:"",escala:b.escala||"6x1"}]}; });
  const setTurno=(i,k,v)=>setC(p=>({...p,turnos:p.turnos.map((t,j)=>j===i?{...t,[k]:v}:t)}));
  const set=(k,v)=>setC(p=>({...p,[k]:v}));
  const nomeOk=c.nome.trim().length>=2 && !(nomesUsados||[]).some(n=>n.toLowerCase()===c.nome.trim().toLowerCase() && (!inicial||n!==inicial.nome));
  const ta="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-brand-400 text-sm";
  return <div className="p-6">
    <div className="flex items-center justify-between mb-4"><h3 className="text-lg font-bold text-slate-900">{inicial&&inicial.nome?"Editar cargo":"Novo cargo"}</h3><button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon d={I.x}/></button></div>
    <div className="grid sm:grid-cols-2 gap-3">
      <Field label="Nome do cargo *"><Input value={c.nome} onChange={e=>set("nome",e.target.value)} placeholder="Ex.: Auxiliar de Cozinha" disabled={!!(inicial&&inicial._padrao)}/></Field>
      <Field label="Vínculo"><Select value={c.tipo} onChange={e=>set("tipo",e.target.value)}><option value="clt">CLT</option><option value="pj">Prestador PJ</option></Select></Field>
      <Field label="Setor"><Select value={c.setor} onChange={e=>set("setor",e.target.value)}>{SETORES.map(([k,l])=><option key={k} value={k}>{l}</option>)}</Select></Field>
      <Field label={c.tipo==="pj"?"Valor mensal (R$)":"Salário base (R$)"}><Input type="number" value={c.salarioBase} onChange={e=>set("salarioBase",e.target.value)}/></Field>
    </div>
    <div className="mt-4 p-4 rounded-2xl border border-slate-200 bg-slate-50/50">
      <div className="flex items-center justify-between mb-1"><div className="text-xs font-bold text-slate-500 uppercase tracking-wide flex items-center gap-1.5"><Icon d={I.clock} className="w-3.5 h-3.5"/>Turnos / períodos</div>
        <button type="button" onClick={()=>setC(p=>({...p,turnos:[...p.turnos,{nome:TURNOS_SUGERIDOS.find(n=>!p.turnos.some(t=>t.nome===n))||"",horario:"",escala:(p.turnos[0]&&p.turnos[0].escala)||"6x1"}]}))} className="text-xs font-semibold text-brand-700 hover:underline flex items-center gap-1"><Icon d={I.plus} className="w-3.5 h-3.5"/>Adicionar turno</button></div>
      <p className="text-xs text-slate-400 mb-3">O mesmo cargo pode ter pessoas de manhã, à tarde ou à noite. Cadastre cada período; no convite você escolhe o turno da vaga.</p>
      <datalist id="turnos-sugeridos">{TURNOS_SUGERIDOS.map(n=><option key={n} value={n}/>)}</datalist>
      <div className="space-y-2">{c.turnos.map((t,i)=><div key={i} className="grid grid-cols-[1fr_1.4fr_1.2fr_auto] gap-2 items-center">
        <Input value={t.nome} onChange={e=>setTurno(i,"nome",e.target.value)} list="turnos-sugeridos" placeholder="Turno" aria-label="Nome do turno"/>
        <Input value={t.horario} onChange={e=>setTurno(i,"horario",e.target.value)} placeholder="Ex.: 07:00 às 15:20" aria-label="Horário do turno"/>
        <Select value={t.escala} onChange={e=>setTurno(i,"escala",e.target.value)} aria-label="Escala do turno">{Object.entries(ESCALAS).map(([k,l])=><option key={k} value={k}>{l}</option>)}<option value="">— não se aplica —</option></Select>
        <button type="button" title="Remover turno" disabled={c.turnos.length<=1} onClick={()=>setC(p=>({...p,turnos:p.turnos.filter((_,j)=>j!==i)}))} className="w-8 h-8 rounded-lg grid place-items-center text-slate-400 hover:text-rose-500 hover:bg-rose-50 disabled:opacity-30"><Icon d={I.trash} className="w-4 h-4"/></button>
      </div>)}</div>
    </div>
    <div className="grid gap-3 mt-3">
      <Field label="Descritivo de função — uma atividade por linha *"><textarea rows={7} value={c.descritivo} onChange={e=>set("descritivo",e.target.value)} className={ta} placeholder={"Preparar os insumos conforme ficha técnica\nManter a praça limpa e organizada\nControlar validade e etiquetagem dos produtos"}/></Field>
      <Field label="Requisitos da vaga"><textarea rows={3} value={c.requisitos} onChange={e=>set("requisitos",e.target.value)} className={ta} placeholder="Ex.: experiência de 6 meses em cozinha; disponibilidade aos finais de semana"/></Field>
      <Field label="Benefícios"><textarea rows={2} value={c.beneficios} onChange={e=>set("beneficios",e.target.value)} className={ta} placeholder="Ex.: vale-transporte, refeição no local, uniforme"/></Field>
    </div>
    {c.tipo==="pj" && <div className="mt-4 p-4 rounded-2xl border border-brand-200 bg-brand-50/40">
      <div className="text-xs font-bold text-brand-700 uppercase mb-1 flex items-center gap-1.5"><Icon d={I.doc} className="w-3.5 h-3.5"/>Contrato PJ deste cargo</div>
      <p className="text-xs text-slate-500 mb-3">O contrato usa o modelo-base (Documentos → Modelo de contrato PJ). Aqui você define o que muda para este cargo. As atribuições do contrato vêm do descritivo de função acima.</p>
      <Field label="Objeto do contrato (serviço)"><Input value={c.objetoContrato||""} onChange={e=>set("objetoContrato",e.target.value)} placeholder={"Ex.: Gestão e Operação de Bar"}/></Field>
      {opcionais.length>0 && <div className="mt-3"><div className="text-xs font-semibold text-slate-600 mb-1.5">Cláusulas que entram neste contrato</div>

// Termo de ciência do descritivo de função (PDF) — gerado no envio do cadastro
async function pdfTermoFuncao({nome, cpf, empresa, vaga, aceitoEm}){
  const PDFLib=await carregarPdfLib();
  const doc=await PDFLib.PDFDocument.create();
  const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica), bold=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
  const limpo=(t)=>String(t||"").replace(/[^\x20-\x7E -ÿ–—‘’“”•…]/g,"");
  let pg=doc.addPage([595,842]); let y=790; const X=56, W=483;
  const linha=(txt,{f=font,size=10.5,cor=[0.15,0.18,0.22],gap=4}={})=>{
    const palavras=limpo(txt).split(/\s+/); let atual="";
    const emite=(s)=>{ if(y<70){ pg=doc.addPage([595,842]); y=790; } pg.drawText(s,{x:X,y,size,font:f,color:PDFLib.rgb(...cor)}); y-=size+gap; };
    palavras.forEach(w=>{ const t=atual?atual+" "+w:w; if(f.widthOfTextAtSize(t,size)>W && atual){ emite(atual); atual=w; } else atual=t; });
    if(atual) emite(atual);
  };
  linha("TERMO DE CIÊNCIA E CONCORDÂNCIA — DESCRITIVO DE FUNÇÃO",{f:bold,size:13,cor:[0.12,0.3,0.12],gap:10});
  linha((empresa||"WILAMI")+" · "+(vaga.unidadeNome||""),{size:9.5,cor:[0.4,0.45,0.5],gap:14});
  linha("Colaborador(a): "+nome,{f:bold});
  if(cpf) linha("CPF: "+cpf);
  linha("Cargo: "+vaga.cargo+(vaga.setorNome?" · Setor: "+vaga.setorNome:""));
  if(vaga.turno) linha("Turno: "+vaga.turno);
  if(vaga.escala) linha("Escala: "+vaga.escala+(vaga.horario?" · Horário: "+vaga.horario:""));
  else if(vaga.horario) linha("Horário: "+vaga.horario);
  if(vaga.salario) linha("Remuneração: "+fmtBRL(Number(vaga.salario)));
  y-=8; linha("Atividades da função:",{f:bold,gap:6});
  DESCRITIVO_LINHAS(vaga.descritivo).forEach(l=>linha("•  "+l));
  if(vaga.requisitos){ y-=6; linha("Requisitos:",{f:bold,gap:6}); linha(vaga.requisitos); }
  y-=12;
  linha("Declaro que li o descritivo de função acima, que compreendi as atividades que vou executar no cargo de "+vaga.cargo+" e que estou de acordo com elas.",{gap:8});
  linha("Aceite registrado eletronicamente em "+new Date(aceitoEm).toLocaleString("pt-BR")+" pelo link de cadastro enviado pela empresa.",{size:9.5,cor:[0.4,0.45,0.5]});
  return bytesParaDataUrl(await doc.save(),"application/pdf");
}

// Número por extenso (pt-BR) — inteiros até 999.999.999
function extensoNum(n){
  n=Math.floor(Math.abs(Number(n)||0)); if(n===0) return "zero";
  const U=["","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
  const D=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
  const C=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
  const ate999=(x)=>{ if(x===100) return "cem"; const c=Math.floor(x/100), r=x%100, p=[]; if(c) p.push(C[c]); if(r){ if(r<20) p.push(U[r]); else { p.push(D[Math.floor(r/10)]+(r%10?" e "+U[r%10]:"")); } } return p.join(" e "); };
  const partes=[]; const mi=Math.floor(n/1e6), mil=Math.floor((n%1e6)/1000), r=n%1000;
  if(mi) partes.push(mi===1?"um milhão":ate999(mi)+" milhões");
  if(mil) partes.push(mil===1?"mil":ate999(mil)+" mil");
  if(r) partes.push(ate999(r));
  if(partes.length>1){ const ult=partes.pop(); return partes.join(", ")+((r<100||r%100===0)&&r?" e ":" ")+ult; }
  return partes[0];
}
function extensoReais(v){
  v=Math.round((Number(v)||0)*100); const re=Math.floor(v/100), ce=v%100;
  const pr=re? extensoNum(re)+(re===1?" real":(re%1e6===0?" de reais":" reais")) : "";
  const pc=ce? extensoNum(ce)+(ce===1?" centavo":" centavos") : "";
  return [pr,pc].filter(Boolean).join(" e ") || "zero reais";
}

  const valor=Number(extras.valor!=null?extras.valor:pj.valor)||0, dia=Number(extras.diaPagamento||pj.diaPagamento)||10, aviso=Number(extras.avisoPrevio||empresa.avisoPrevio)||30;
  const campos={ OBJETO:objeto.toUpperCase(), ATRIBUICOES:atrib, CONTRATANTE_QUALIFICACAO:qualContratante, CONTRATADA_QUALIFICACAO:qualContratada,
    CONTRATANTE_NOME:(empresa.razao||"").toUpperCase(), CONTRATADA_NOME:(pj.nome||"").toUpperCase(), VALOR:fmtBRL(valor), VALOR_EXTENSO:extensoReais(valor),
    DIA_PAGAMENTO:String(dia).padStart(2,"0"), DIA_PAGAMENTO_EXTENSO:extensoNum(dia), AVISO_PREVIO:String(aviso), AVISO_PREVIO_EXTENSO:extensoNum(aviso),
    FORO:empresa.foro||"São Paulo/SP", CIDADE:empresa.cidade||"São Paulo/SP", DATA:dataExtenso(extras.data), CLAUSULA_ESPECIFICA:"" };
  const sub=(t,N)=> String(t||"").replace(/\{\{N\}\}/g,String(N)).replace(/\{\{([A-Z_]+)\}\}/g,(m,k)=> campos[k]!=null?campos[k]:m);
  const off=new Set(cargo.clausulasOff||[]);
  const especifica=String(cargo.clausulaEspecifica||"").trim();
  const ativas=(modelo.clausulas||[]).filter(c=> c.especifica ? !!especifica : !(c.opcional && off.has(c.id)));
  const blocos=[{t:"titulo",x:sub(modelo.titulo)},{t:"qual",x:"CONTRATANTE: "+qualContratante},{t:"qual",x:"CONTRATADA: "+qualContratada},{t:"p",x:sub(modelo.intro)}];
  ativas.forEach((c,i)=>{ const N=i+1;
    blocos.push({t:"clausula",x:"CLÁUSULA "+(ORDINAIS_F[i]||String(N))});
    blocos.push({t:"subtitulo",x:sub(c.titulo)});
    const corpo = c.especifica ? especifica.split(/\n+/).map((l,j)=> /^\d+\.\d+\.|^[a-z]\)/.test(l.trim())?l.trim():(N+"."+(j+1)+". "+l.trim())).join("\n") : sub(c.texto,N);
    corpo.split("\n").filter(l=>l.trim()).forEach(l=>blocos.push({t:/^[a-z]\)/.test(l.trim())?"item":"p",x:sub(l,N)}));
  });
  blocos.push({t:"local",x:campos.CIDADE+", "+campos.DATA+"."});
  blocos.push({t:"assin",x:"CONTRATANTE",n:(empresa.razao||"").toUpperCase(),d:empresa.cnpj?"CNPJ: "+empresa.cnpj:"",r:empresa.representante||"Representante Legal"});
  blocos.push({t:"assin",x:"CONTRATADA",n:(pj.nome||"").toUpperCase(),d:[pj.cnpj&&"CNPJ: "+pj.cnpj, pj.cpf&&"CPF: "+pj.cpf].filter(Boolean).join(" · "),r:resp||pj.nome||""});
  blocos.push({t:"testemunhas"});
  return blocos;
}
async function pdfContratoPJ(blocos){
  const PDFLib=await carregarPdfLib();
  const doc=await PDFLib.PDFDocument.create();
  const font=await doc.embedFont(PDFLib.StandardFonts.TimesRoman), bold=await doc.embedFont(PDFLib.StandardFonts.TimesRomanBold);
  const limpo=(t)=>String(t||"").replace(/[^\x20-\x7E\u00A0-\u00FF–—‘’“”•…]/g,"");
  const X=64, W=467; let pg=doc.addPage([595,842]); let y=780;
  const nova=()=>{ pg=doc.addPage([595,842]); y=780; };
  const escrever=(txt,{f=font,size=11,gap=3.5,indent=0,centro=false}={})=>{
    const palavras=limpo(txt).split(/\s+/).filter(Boolean); let atual=""; const linhas=[];
    palavras.forEach(w=>{ const t=atual?atual+" "+w:w; if(f.widthOfTextAtSize(t,size)>W-indent && atual){ linhas.push(atual); atual=w; } else atual=t; });
    if(atual) linhas.push(atual);
    linhas.forEach(l=>{ if(y<64) nova(); const lw=f.widthOfTextAtSize(l,size); pg.drawText(l,{x:centro?X+(W-lw)/2:X+indent,y,size,font:f}); y-=size+gap; });
  };
  blocos.forEach(b=>{
    if(b.t==="titulo"){ escrever(b.x,{f:bold,size:13,centro:true,gap:6}); y-=10; }
    else if(b.t==="qual"){ escrever(b.x,{gap:3.5}); y-=6; }
    else if(b.t==="clausula"){ y-=10; if(y<120) nova(); escrever(b.x,{f:bold,size:11.5}); }
    else if(b.t==="subtitulo"){ escrever(b.x,{f:bold,size:11.5,gap:6}); }
    else if(b.t==="item"){ escrever(b.x,{indent:18}); }
    else if(b.t==="p"){ escrever(b.x); y-=2; }
    else if(b.t==="local"){ y-=16; escrever(b.x); y-=20; }
    else if(b.t==="assin"){ if(y<150) nova(); y-=26; pg.drawLine({start:{x:X,y},end:{x:X+280,y},thickness:0.7}); y-=14;
      escrever(b.x,{f:bold,size:10.5}); if(b.n) escrever(b.n,{size:10.5}); if(b.d) escrever(b.d,{size:10}); if(b.r) escrever(b.r,{size:10}); y-=6; }
    else if(b.t==="testemunhas"){ if(y<170) nova(); y-=14; escrever("TESTEMUNHAS",{f:bold,size:10.5,gap:10});
      ["1.","2."].forEach(n=>{ escrever(n+" Nome: ___________________________________",{size:10.5,gap:8}); escrever("CPF: ______________________   Assinatura: ______________________",{size:10.5,gap:14}); }); }
  });
  return bytesParaDataUrl(await doc.save(),"application/pdf");
}

/* ---------- Gerar contrato de um prestador ---------- */
function GerarContratoModal({pj,onClose}){
  const { modeloContratoPJ, empresaContratante:_empSalva, cargosDesc, salvarPj } = useStore();
  const empresaContratante=empresaEfetiva(_empSalva);
  const toast=useContext(ToastCtx);
  const cargosPJ=(cargosDesc||[]).filter(c=>c.tipo==="pj");
  const [cargoNome,setCargoNome]=useState(()=> (cargosPJ.find(c=>c.nome===pj.servico)||cargosPJ[0]||{}).nome||"");
  const [extras,setExtras]=useState({ valor:pj.valor||0, diaPagamento:pj.diaPagamento||10, avisoPrevio:(empresaContratante&&empresaContratante.avisoPrevio)||30, data:hojeStr() });
  const [gerando,setGerando]=useState(false);
  const cargo=cargosPJ.find(c=>c.nome===cargoNome)||{nome:pj.servico||"prestação de serviços", descritivo:""};
  const blocos=montarContratoPJ({modelo:modeloContratoPJ, empresa:empresaContratante, pj, cargo, extras});
  const avisos=[]; if(!(empresaContratante&&empresaContratante.razao)) avisos.push("Preencha os dados da empresa contratante em Documentos → Modelo de contrato PJ.");
  if(!pj.cnpj) avisos.push("O prestador está sem CNPJ."); if(!pj.endereco && !(pj.ficha&&pj.ficha.logradouro)) avisos.push("O prestador está sem endereço (edite os dados dele).");
  if(!DESCRITIVO_LINHAS(cargo.descritivo).length) avisos.push("O cargo não tem descritivo — as atribuições sairão genéricas.");
  const gerar=async()=>{
    setGerando(true);
    try{
      const du=await pdfContratoPJ(blocos);
      const tipoKey=String(pj.id).indexOf("auto_")===0?"pj-"+pj.id:"pj-"+pj.id;
      await arqSalvar({ nome:"Contrato de prestação de serviços - "+cargo.nome+" - "+pj.nome+".pdf", donoKey:tipoKey, donoTipo:"pj", donoId:String(pj.id), donoNome:pj.nome, cpf:soDigitos(pj.cpf||pj.cnpj),
        pasta:"Contrato de prestação de serviço", categoria:"contrato", visivelColab:true, origem:"modelo" }, du);
      if(cargo.nome && pj.servico!==cargo.nome) salvarPj({...pj, servico:cargo.nome});
      toast("Contrato gerado e salvo na pasta — clique em Assinar para enviar pelo DocuSign"); onClose();
    }catch(e){ toast("Não foi possível gerar o contrato: "+erroBanco(e)); }
    setGerando(false);
  };
  return <Modal open onClose={onClose} wide>
    <div className="p-6">
      <div className="flex items-center justify-between mb-4"><h3 className="text-lg font-bold text-slate-900">Gerar contrato — {pj.nome}</h3><button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon d={I.x}/></button></div>
      <div className="grid sm:grid-cols-4 gap-3">
        <div className="sm:col-span-2"><Field label="Cargo / serviço (define as cláusulas)"><Select value={cargoNome} onChange={e=>setCargoNome(e.target.value)}>{cargosPJ.length===0&&<option value="">— crie cargos PJ em Cargos & funções —</option>}{cargosPJ.map(c=><option key={c.nome}>{c.nome}</option>)}</Select></Field></div>
        <Field label="Valor mensal (R$)"><Input type="number" value={extras.valor} onChange={e=>setExtras({...extras,valor:Number(e.target.value)})}/></Field>
        <Field label="Dia do pagamento"><Input type="number" min="1" max="31" value={extras.diaPagamento} onChange={e=>setExtras({...extras,diaPagamento:Number(e.target.value)})}/></Field>
        <Field label="Aviso prévio (dias)"><Input type="number" value={extras.avisoPrevio} onChange={e=>setExtras({...extras,avisoPrevio:Number(e.target.value)})}/></Field>
        <Field label="Data do contrato"><Input type="date" value={extras.data} onChange={e=>setExtras({...extras,data:e.target.value})}/></Field>
      </div>
      {avisos.length>0 && <div className="mt-3 p-3 rounded-xl bg-amber-50 text-amber-800 text-sm space-y-0.5">{avisos.map((a,i)=><div key={i}>• {a}</div>)}</div>}
      <div className="mt-4 max-h-[45vh] overflow-y-auto rounded-xl border border-slate-200 bg-white p-5 text-[13px] leading-relaxed text-slate-800 font-serif">
        {blocos.map((b,i)=> b.t==="titulo"?<p key={i} className="font-bold text-center mb-3">{b.x}</p> : b.t==="clausula"?<p key={i} className="font-bold mt-3">{b.x}</p> : b.t==="subtitulo"?<p key={i} className="font-bold mb-1">{b.x}</p> : b.t==="item"?<p key={i} className="pl-4">{b.x}</p> : b.t==="qual"?<p key={i} className="mb-2"><b>{b.x.split(":")[0]}:</b>{b.x.slice(b.x.indexOf(":")+1)}</p> : b.t==="assin"?<div key={i} className="mt-6"><div className="w-64 border-t border-slate-500 pt-1 font-bold">{b.x}</div><div>{b.n}</div><div className="text-xs text-slate-500">{b.d}</div>{b.r&&<div className="text-xs text-slate-600">{b.r}</div>}</div> : b.t==="testemunhas"?<p key={i} className="mt-6 font-bold">TESTEMUNHAS: 1. ______________ 2. ______________</p> : <p key={i} className={cx("mb-1", b.t==="local"&&"mt-5")}>{b.x}</p>)}
      </div>
      <div className="flex gap-2 mt-4"><Btn variant="ghost" onClick={onClose}>Cancelar</Btn><Btn className="flex-1" icon={gerando?null:I.doc} disabled={gerando} onClick={gerar}>{gerando?"Gerando…":"Gerar PDF e salvar na pasta do prestador"}</Btn></div>
    </div>
  </Modal>;
}

// Assinatura desenhada com o dedo/mouse
function AssinaturaPad({onChange}){
  const ref=useRef(null); const desenhando=useRef(false); const [vazio,setVazio]=useState(true);
  useEffect(()=>{ const c=ref.current; if(!c) return; const r=c.getBoundingClientRect(); const dpr=window.devicePixelRatio||1;
    c.width=r.width*dpr; c.height=r.height*dpr; const ctx=c.getContext("2d"); ctx.scale(dpr,dpr); ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#0f172a"; },[]);
  // Pointer events: funcionam igual no dedo (Android/iPhone), caneta e mouse; touch-none impede a página de rolar.
  const pos=(e)=>{ const r=ref.current.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  const ini=(e)=>{ desenhando.current=true; try{ ref.current.setPointerCapture(e.pointerId); }catch(_){} const ctx=ref.current.getContext("2d"); const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+0.1,p.y+0.1); ctx.stroke(); };
  const mov=(e)=>{ if(!desenhando.current) return; const ctx=ref.current.getContext("2d"); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); if(vazio) setVazio(false); };
  const fim=()=>{ if(!desenhando.current) return; desenhando.current=false; onChange && onChange(vazio?null:ref.current.toDataURL("image/png")); };
  const limpar=()=>{ const c=ref.current; c.getContext("2d").clearRect(0,0,c.width,c.height); setVazio(true); onChange && onChange(null); };
  useEffect(()=>{ if(!vazio && !desenhando.current) onChange && onChange(ref.current.toDataURL("image/png")); },[vazio]); // eslint-disable-line
  return <div>
    <div className="relative rounded-2xl border-2 border-dashed border-slate-300 bg-white">
      <canvas ref={ref} className="w-full h-40 touch-none rounded-2xl cursor-crosshair" onPointerDown={ini} onPointerMove={mov} onPointerUp={fim} onPointerCancel={fim} style={{touchAction:"none"}}/>
      {vazio && <div className="absolute inset-0 grid place-items-center pointer-events-none text-slate-300 text-sm">Assine aqui com o dedo</div>}
      <div className="absolute left-6 right-6 bottom-8 border-b border-slate-300 pointer-events-none"/>
    </div>
    <div className="flex justify-end mt-1"><button onClick={limpar} className="text-xs font-semibold text-slate-500 hover:text-slate-800">Limpar assinatura</button></div>
  </div>;
}
// PDF do termo assinado (texto + dados + assinatura desenhada + registro eletrônico)
async function pdfTermoAssinado({cfg, nome, cpf, rg, cargo, unidade, assinatura, em}){
  const PDFLib=await carregarPdfLib();
  const doc=await PDFLib.PDFDocument.create();
  const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica), bold=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
  const limpo=(t)=>String(t||"").replace(/[^\x20-\x7E -ÿ–—‘’“”•…]/g,"").replace(/[“”]/g,'"');
  const X=56, W=483; let pg=doc.addPage([595,842]); let y=790;
  const nova=()=>{ pg=doc.addPage([595,842]); y=790; };
  const esc=(txt,{f=font,size=9.8,gap=3,centro=false}={})=>{ const ws=limpo(txt).split(/\s+/).filter(Boolean); let a=""; const ls=[];
    ws.forEach(w=>{ const t=a?a+" "+w:w; if(f.widthOfTextAtSize(t,size)>W&&a){ ls.push(a); a=w; } else a=t; }); if(a) ls.push(a);
    ls.forEach(l=>{ if(y<60) nova(); const lw=f.widthOfTextAtSize(l,size); pg.drawText(l,{x:centro?X+(W-lw)/2:X,y,size,font:f}); y-=size+gap; }); };
  esc((cfg&&cfg.titulo)||TERMO_IMAGEM_PADRAO.titulo,{f:bold,size:12.5,centro:true,gap:8}); y-=6;
  const dados=[["NOME COMPLETO",nome],["CPF",cpf],["RG",rg],["CARGO/FUNÇÃO",cargo],["EMPRESA / UNIDADE",unidade]];
  termoTexto(cfg).split("\n").filter(Boolean).forEach((l,i)=>{
    if(l.startsWith("# ")){ y-=5; esc(l.slice(2),{f:bold,size:10.5,gap:4}); }
    else { esc(l); y-=2; }
    if(i===0){ y-=4; dados.forEach(([k,v])=>esc(k+": "+(v||"—"),{f:bold,size:9.8})); y-=4; }
  });
  y-=14; if(y<230) nova();
  esc((cfg&&cfg.cidade||"São Paulo")+", "+dataExtenso(ymd(new Date(em)))+".",{size:10}); y-=12;
  try{ const png=await doc.embedPng(assinatura); const h=60, w=Math.min(220, png.width*(h/png.height)); pg.drawImage(png,{x:X,y:y-h,width:w,height:h}); y-=h+2; }catch(e){}
  pg.drawLine({start:{x:X,y},end:{x:X+260,y},thickness:0.7}); y-=13;
  esc("COLABORADOR(A): "+nome,{f:bold,size:10}); if(cpf) esc("CPF: "+cpf,{size:9.5});
  y-=10; esc("Assinado eletronicamente em "+new Date(em).toLocaleString("pt-BR")+" pelo link enviado pela empresa, com aceite expresso (\"Li e autorizo\") e assinatura desenhada pelo(a) próprio(a) colaborador(a).",{size:8.5,gap:2});
  return bytesParaDataUrl(await doc.save(),"application/pdf");
}

// Documentos pedidos no link, por tipo de vínculo. "chave" casa com DOC_TIPOS (pasta do colaborador) quando existir.
const CONVITE_DOCS = {
  clt: [
    { k:"cnh_rg", l:"RG ou CNH (frente e verso)", obrig:true },
    { k:"cpf", l:"CPF (se não constar no RG/CNH)" },
    { k:"comprovante_residencia", l:"Comprovante de residência", obrig:true },
    { k:"ctps", l:"Carteira de Trabalho (CTPS Digital)" },
    { k:"titulo_eleitor", l:"Título de eleitor" },
    { k:"reservista", l:"Certificado de reservista (homens)" },
    { k:"comprovante_bancario", l:"Comprovante bancário ou Pix" },
  ],
  pj: [
    { k:"cartao_cnpj", l:"Cartão CNPJ", obrig:true },
    { k:"contrato_social", l:"Contrato social ou CCMEI" },
    { k:"cnh_rg", l:"RG ou CNH do responsável", obrig:true },
    { k:"comprovante_residencia", l:"Comprovante de endereço" },
    { k:"comprovante_bancario", l:"Comprovante bancário ou Pix" },
  ],
};
// Ordem de confiança ao juntar campos lidos de vários documentos (o 1º que tiver o campo ganha).
const PRIORIDADE_DOC = ["cartao_cnpj","ccmei","contrato_social","rg","cnh","cpf","ctps","pis","titulo_eleitor","reservista","comprovante_residencia","comprovante_bancario","certidao_nascimento_casamento","cartao_sus","diploma","historico_escolar","outro"];
const CAMPOS_ENDERECO = ["cep","logradouro","numero","complemento","bairro","cidade","uf"];
function juntarLeituras(leituras){
  const ord=[...leituras].sort((a,b)=>PRIORIDADE_DOC.indexOf(a.tipoDocumento)-PRIORIDADE_DOC.indexOf(b.tipoDocumento));
  const out={};
  // endereço vem inteiro do mesmo documento (prioriza o comprovante de residência)
  const comEnd=[...ord.filter(l=>l.tipoDocumento==="comprovante_residencia"), ...ord].find(l=>l.campos && l.campos.logradouro);
  if(comEnd) CAMPOS_ENDERECO.forEach(k=>{ if(comEnd.campos[k]) out[k]=comEnd.campos[k]; });
  ord.forEach(l=>{ Object.entries(l.campos||{}).forEach(([k,v])=>{ if(v && String(v).trim() && out[k]==null && !CAMPOS_ENDERECO.includes(k)) out[k]=String(v).trim(); }); });
  return out;
}
const gerarTokenConvite=()=>{ const a=new Uint8Array(18); crypto.getRandomValues(a); return Array.from(a).map(b=>"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"[b%62]).join(""); };
const linkConvite=(token)=> comTenantUrl(location.origin+location.pathname, "convite/"+token);
function useConvites(ativo){
  const [items,setItems]=useState([]);
  useEffect(()=>{ const db=window.__WPDB; if(!db||!ativo) return;
    try{ return nCol("convites").onSnapshot(function(snap){ const a=[]; snap.forEach(function(d){ a.push({...(d.data()||{}), id:d.id}); }); a.sort((x,y)=>(y.criadoEm||0)-(x.criadoEm||0)); setItems(a); }, function(){}); }catch(e){}
  },[ativo]);
  return items;
}
// Lê um arquivo com a IA (via /api/extrair). Imagens são reduzidas antes do envio.
async function lerDocumentoIA(arquivo, esperado, convite){
  let du=arquivo.dados, mime=arquivo.mime;
  if(/^image\//.test(mime)){ du=await compressImg(du,1600,0.85); mime="image/jpeg"; }
  const user=window.__WPAUTH&&window.__WPAUTH.currentUser;
  const token=user? await user.getIdToken().catch(()=>"") : "";
  const r=await fetch("/api/extrair",{ method:"POST", headers:{"Content-Type":"application/json", ...(token?{Authorization:"Bearer "+token}:{})},
    body:JSON.stringify({ mime, base64:du.split(",")[1], esperado, convite:convite||"", tenant:WP_TENANT||"" }) });
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ const err=new Error((j&&j.erro)||("Erro "+r.status)); err.status=r.status; throw err; }
  return j;
}

    <div className="text-xs font-bold text-slate-400 uppercase mt-5 mb-2">Documentos enviados ({docs.length})</div>
    <div className="grid sm:grid-cols-2 gap-2">
      {docs.map(a=><button key={a.id} onClick={()=>arqAbrir(a).catch(e=>toast(e.message))} className="flex items-center gap-2 p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-left">
        <Icon d={I.doc} className="w-4 h-4 text-brand-600 shrink-0"/><span className="text-sm text-slate-700 truncate flex-1">{a.nome}</span><Icon d={I.eye} className="w-4 h-4 text-slate-400"/></button>)}
    </div>
  </div>;
}

/* ---------- Página pública: o candidato envia documentos e confere os dados ---------- */
function ConviteCadastro({onClose}){
  const { termoImagemCfg, unidades } = useStore();
  const token=(location.hash.replace("#","").split("/")[1]||"").trim();
  const [conv,setConv]=useState(undefined);  // undefined = carregando · null = inválido
  const [etapa,setEtapa]=useState("inicio"); // inicio | vaga | docs | lendo | form | termo | enviando | ok
  const [aceiteFn,setAceiteFuncao]=useState(false);
  const [arqs,setArqs]=useState({});         // { slot: [{nome,mime,dados}] }
  const [foto,setFoto]=useState("");
  const [f,setF]=useState({});
  const [auto,setAuto]=useState({});         // campos preenchidos pela leitura automática
  const [avisos,setAvisos]=useState([]);
  const [prog,setProg]=useState({feito:0,total:0});
  const [erro,setErro]=useState("");
  const [aceite,setAceite]=useState(false);
  useEffect(()=>{ const db=window.__WPDB; if(!db||!token){ setConv(null); return; }
    nCol("convites").doc(token).get().then(s=>{ const d=s.exists?s.data():null; setConv(d && d.status==="aberto" && !(d.expira<Date.now()) ? d : (d?{...d,_fechado:true}:null)); }).catch(()=>setConv(null));
  },[token]);
  const tipo=(conv&&conv.tipo)||"clt";
  const vaga=conv&&conv.vaga; const temVaga=!!(vaga && DESCRITIVO_LINHAS(vaga.descritivo).length);
  const etapaVis = etapa==="inicio" ? (temVaga?"vaga":"docs") : etapa;
  const slots=CONVITE_DOCS[tipo]||CONVITE_DOCS.clt;
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const [processando,setProcessando]=useState(0);
  const addArq=async(slot,files)=>{
    const lista=Array.from(files||[]); if(!lista.length) return;
    setProcessando(n=>n+lista.length);
    const lst=[], falhas=[];
    for(const file of lista){
      try{ lst.push(await prepararArquivo(file)); }
      catch(e){ falhas.push((file.name||"arquivo")+": "+e.message); }
      finally{ setProcessando(n=>Math.max(0,n-1)); }
    }
    if(lst.length) setArqs(p=>({...p,[slot]:[...(p[slot]||[]),...lst]}));
    if(falhas.length) setErro(prev=>[prev,"Não foi possível usar "+falhas.join(" · ")].filter(Boolean).join("\n"));
  };
  const rmArq=(slot,i)=>setArqs(p=>({...p,[slot]:(p[slot]||[]).filter((_,j)=>j!==i)}));
  const faltaObrig=slots.filter(s=>s.obrig && !(arqs[s.k]||[]).length);
  const lerTudo=async()=>{
    setErro(""); const fila=[]; slots.forEach(s=>(arqs[s.k]||[]).forEach(a=>fila.push({a,esperado:s.l})));
    setEtapa("lendo"); setProg({feito:0,total:fila.length});
    const leituras=[], av=[]; let semIA=false, i=0;
    const worker=async()=>{ while(i<fila.length){ const it=fila[i++];
      try{ const r=await lerDocumentoIA(it.a,it.esperado,token); leituras.push(r); if(r.observacao) av.push(it.a.nome+": "+r.observacao); else if(r.legivel===false) av.push(it.a.nome+": não foi possível ler com clareza."); }
      catch(e){ if(e.status===501) semIA=true; else av.push(it.a.nome+": "+e.message); }
      setProg(p=>({...p,feito:p.feito+1})); } };
    await Promise.all([worker(),worker(),worker()]);
    const dados=juntarLeituras(leituras);
    if(tipo==="pj"){ dados.responsavel=dados.nome||""; }
    const base={ ...dados, telefone:dados.telefone||"", email:dados.email||"", tipoPix:dados.pix?"Aleatória":"CPF" };
    setF(base); setAuto(Object.fromEntries(Object.keys(dados).map(k=>[k,true])));
    setAvisos(semIA?["A leitura automática ainda não está ativada — preencha os dados abaixo."]:av);
    setEtapa("form");
  };
  const obrigForm = tipo==="pj" ? [["razaoSocial","Razão social"],["cnpj","CNPJ"],["responsavel","Responsável"],["telefone","Telefone"],["email","E-mail"]]
    : [["nome","Nome completo"],["cpf","CPF"],["nascimento","Nascimento"],["telefone","Telefone"]];
  const faltaForm=obrigForm.filter(([k])=>!String(f[k]||"").trim()).map(([,l])=>l);
  if(tipo==="clt" && !foto) faltaForm.push("selfie");
  if(!aceite) faltaForm.push("aceite LGPD");
  const enviar=async(assinaturaTermo)=>{
    setEtapa("enviando"); setErro("");
    try{
      const ref=tCol("cadastros").doc();
      const donoKey=tipo+"-auto_"+ref.id;
      const nomePessoa = tipo==="pj" ? (f.razaoSocial||"").trim() : (f.nome||"").trim();
      const docs={};
      for(const s of slots){ for(const a of (arqs[s.k]||[])){
        const id=await arqSalvar({ nome:s.l.replace(/\s*\(.*\)$/,"")+" - "+a.nome, donoKey, donoTipo:tipo, donoId:"auto_"+ref.id, donoNome:nomePessoa, cpf:soDigitos(f.cpf||f.cnpj),
          pasta: tipo==="pj" && ["cartao_cnpj","contrato_social"].includes(s.k) ? "Documentos da empresa" : "Documentos pessoais", categoria:"documento", visivelColab:false, origem:"convite" }, a.dados);
        if(!docs[s.k]) docs[s.k]={ nome:a.nome, arquivoId:id };
      } }
      const ficha={...f}; delete ficha.tipoPix;
      const endereco=[f.logradouro,f.numero,f.complemento,f.bairro,f.cidade&&(f.cidade+(f.uf?"/"+f.uf:"")),f.cep].filter(Boolean).join(", ");
      const comum={ tel:f.telefone||"", email:(f.email||"").trim().toLowerCase(), tipoPix:f.tipoPix||"CPF", pix:f.pix||"", banco:[f.banco,f.agencia&&("ag. "+f.agencia),f.conta&&("c/c "+f.conta)].filter(Boolean).join(" "),
        endereco, ficha, docs, origem:"convite", conviteId:token, status:"ativo", criadoEm:Date.now() };
      if(temVaga){
        comum.aceiteFuncao={ cargo:vaga.cargo, turno:vaga.turno||"", horario:vaga.horario||"", descritivo:vaga.descritivo, aceitoEm:Date.now(), nome:nomePessoa };
        if(vaga.turno) comum.turno=vaga.turno; if(vaga.horario) comum.horario=vaga.horario;
        try{ const du=await pdfTermoFuncao({ nome:nomePessoa, cpf:f.cpf||"", empresa:vaga.empresa, vaga, aceitoEm:comum.aceiteFuncao.aceitoEm });
          comum.aceiteFuncao.arquivoId=await arqSalvar({ nome:"Termo de ciência - descritivo de função ("+vaga.cargo+").pdf", donoKey, donoTipo:tipo, donoId:"auto_"+ref.id, donoNome:nomePessoa, cpf:soDigitos(f.cpf||f.cnpj),
            pasta:tipo==="pj"?"Contrato de prestação de serviço":"Contratos", categoria:"termo_funcao", visivelColab:true, origem:"convite" }, du);
        }catch(e){ /* o aceite fica registrado mesmo se o PDF falhar */ }
      }
      // Termo de uso de imagem assinado no próprio link
      if(assinaturaTermo){
        try{ const r=await salvarTermoAssinado({ cfg:termoImagemCfg, donoKey, donoTipo:tipo, donoId:"auto_"+ref.id, nome:tipo==="pj"?(f.responsavel||nomePessoa):nomePessoa, cpf:f.cpf||"", rg:f.rg||"",
            cargo:(vaga&&vaga.cargo)||conv.cargo||conv.servico||"", unidade:(vaga&&vaga.unidadeNome)||(conv.unidade==null||conv.unidade==="todas"?"Todas as casas":unidadeNome(conv.unidade,unidades))||"", assinatura:assinaturaTermo });
          comum.termoImagem={ assinadoEm:r.em, arquivoId:r.arquivoId };
        }catch(e){ comum.termoImagem={ assinadoEm:Date.now(), erroPdf:true }; }
      }
      const dados = tipo==="pj"
        ? { ...comum, tipo:"pj", nome:nomePessoa, cnpj:f.cnpj||"", responsavel:f.responsavel||"", cpf:f.cpf||"", servico:conv.servico||f.atividade||"", valor:Number(conv.valor)||0, diaPagamento:5, formaPagamento:"Pix", unidade:conv.unidade==null?"todas":conv.unidade, inicio:"" }
        : { ...comum, tipo:"clt", nome:nomePessoa, cpf:f.cpf||"", cargo:conv.cargo||CARGOS[0], setor:SETOR_POR_CARGO[conv.cargo]||"salao", escala:"6x1", folgaDia:6, unidade:conv.unidade, salario:Number(conv.salario)||0, vt:0, admissao:"", foto };
      await ref.set(dados);
      await nCol("convites").doc(token).set({ status:"preenchido", preenchidoEm:Date.now(), pessoaKey:donoKey, nome:nomePessoa },{merge:true}).catch(()=>{});
      setEtapa("ok");
    }catch(e){ setErro("Não foi possível enviar agora. Verifique sua internet e tente novamente."); setEtapa("termo"); }
  };
  const Campo=({k,l,tipoInput,col})=> <Field label={<span className="flex items-center gap-1">{l}{auto[k]&&f[k]&&<span className="text-[10px] normal-case font-bold text-brand-600 bg-brand-50 px-1.5 rounded">lido do documento</span>}</span>}>
    <Input type={tipoInput||"text"} value={f[k]||""} onChange={e=>set(k,e.target.value)} className={cx(col, auto[k]&&f[k]?"!border-brand-200 bg-brand-50/30":"")}/></Field>;

  const casca=(conteudo)=> <div className="min-h-screen grad-ink grad-hero flex items-start justify-center p-4 py-8"><div className="w-full max-w-2xl"><div className="flex justify-center mb-5"><Logo light/></div><Card className="p-6">{conteudo}</Card></div></div>;
  if(conv===undefined) return casca(<div className="py-10 text-center"><div className="w-8 h-8 mx-auto rounded-full border-2 border-slate-200 border-t-brand-600 animate-spin"/></div>);
  if(!conv || conv._fechado) return casca(<div className="py-6 text-center">
    <div className="w-14 h-14 mx-auto rounded-2xl bg-slate-100 text-slate-500 grid place-items-center mb-3"><Icon d={I.lock} className="w-7 h-7"/></div>
    <h2 className="text-xl font-bold text-slate-900">{conv&&conv.status==="preenchido"?"Cadastro já enviado":"Link indisponível"}</h2>
    <p className="text-slate-500 text-sm mt-1">{conv&&conv.status==="preenchido"?"Este link já foi usado. Se precisar corrigir algo, fale com a empresa.":"Este link expirou ou foi cancelado. Peça um novo link à empresa."}</p>
    <Btn variant="ghost" className="mt-4" onClick={onClose}>Fechar</Btn></div>);
  if(etapa==="ok") return casca(<div className="py-8 text-center">
    <div className="w-20 h-20 mx-auto rounded-full bg-emerald-500 grid place-items-center text-white mb-4 shadow-glow"><Icon d={I.check} className="w-10 h-10" stroke={3}/></div>
    <h2 className="text-2xl font-extrabold text-slate-900">Cadastro enviado!</h2>
    <p className="text-slate-500 mt-1">Recebemos seus dados e documentos. A empresa vai entrar em contato com os próximos passos.</p></div>);
  if(etapa==="lendo" || etapa==="enviando") return casca(<div className="py-10 text-center">
    <div className="w-12 h-12 mx-auto rounded-full border-4 border-slate-200 border-t-brand-600 animate-spin mb-4"/>
    <h3 className="text-lg font-bold text-slate-900">{etapa==="lendo"?"Lendo seus documentos…":"Enviando seu cadastro…"}</h3>
    {etapa==="lendo" && <p className="text-slate-500 text-sm mt-1">{prog.feito} de {prog.total} arquivo(s) · isso pode levar alguns segundos</p>}</div>);

  const cabec=<div className="mb-5">
    <div className="text-xs font-bold uppercase tracking-wide text-free-600">Cadastro {tipo==="pj"?"de prestador PJ":"de colaborador CLT"}</div>
    <h2 className="text-xl font-extrabold text-slate-900 mt-1">{etapaVis==="vaga"?"Conheça a vaga":etapaVis==="docs"?"Envie seus documentos":etapaVis==="termo"?"Termo de uso de imagem":"Confira seus dados"}</h2>
    {(()=>{ const passos=temVaga?["vaga","docs","form","termo"]:["docs","form","termo"]; const at=passos.indexOf(etapaVis);
      return <div className="flex gap-2 mt-3">{passos.map((t,i)=><div key={t} className={cx("flex-1 h-1.5 rounded-full", at>=i?"grad-brand":"bg-slate-200")}/>)}</div>; })()}
  </div>;

  if(etapaVis==="vaga") return casca(<>{cabec}
    <div className="rounded-2xl border border-slate-200 overflow-hidden">
      <div className="p-4 bg-slate-50 border-b border-slate-100">
        <div className="text-lg font-extrabold text-slate-900">{vaga.cargo}</div>
        <div className="text-sm text-slate-500">{[vaga.unidadeNome, vaga.setorNome].filter(Boolean).join(" · ")}</div>
        <div className="flex flex-wrap gap-1.5 mt-2">
          {vaga.turno && <Badge tone="amber"><Icon d={I.clock} className="w-3 h-3"/>Turno: {vaga.turno}</Badge>}
          {vaga.escala && <Badge tone="brand"><Icon d={I.calendar} className="w-3 h-3"/>{vaga.escala}</Badge>}
          {vaga.horario && <Badge tone="slate"><Icon d={I.clock} className="w-3 h-3"/>{vaga.horario}</Badge>}
          {Number(vaga.salario)>0 && <Badge tone="green"><Icon d={I.wallet} className="w-3 h-3"/>{fmtBRL(Number(vaga.salario))}</Badge>}
        </div>
      </div>
      <div className="p-4 space-y-4 text-sm">
        <div><div className="text-xs font-bold text-slate-400 uppercase mb-1.5">Descritivo de função — o que você vai fazer</div>
          <ul className="space-y-1.5">{DESCRITIVO_LINHAS(vaga.descritivo).map((l,i)=><li key={i} className="flex gap-2 text-slate-700"><Icon d={I.check} className="w-4 h-4 text-brand-600 shrink-0 mt-0.5"/><span>{l}</span></li>)}</ul></div>
        {vaga.requisitos && <div><div className="text-xs font-bold text-slate-400 uppercase mb-1">Requisitos</div><p className="text-slate-700 whitespace-pre-line">{vaga.requisitos}</p></div>}
        {vaga.beneficios && <div><div className="text-xs font-bold text-slate-400 uppercase mb-1">Benefícios</div><p className="text-slate-700 whitespace-pre-line">{vaga.beneficios}</p></div>}
      </div>
    </div>
    <label className={cx("mt-4 flex items-start gap-3 p-4 rounded-2xl border-2 cursor-pointer transition", aceiteFn?"border-brand-400 bg-brand-50/50":"border-slate-200 hover:border-slate-300")}>
      <input type="checkbox" checked={aceiteFn} onChange={e=>setAceiteFuncao(e.target.checked)} className="mt-0.5 w-5 h-5 accent-green-700 shrink-0"/>
      <span className="text-sm text-slate-700"><b>Li o descritivo de função e estou de acordo</b> com as atividades que vou executar no cargo de {vaga.cargo}.</span>
    </label>
    <Btn className="w-full mt-4" size="lg" icon={I.arrow} disabled={!aceiteFn} onClick={()=>setEtapa("docs")}>Estou de acordo — continuar</Btn>
  </>);

  if(etapaVis==="docs") return casca(<>{cabec}

          {lst.length>0 && <div className="flex flex-wrap gap-1.5 mt-2 pl-12">{lst.map((a,i)=><span key={i} className="inline-flex items-center gap-1 text-[11px] bg-white border border-slate-200 rounded-full pl-2 pr-1 py-0.5 max-w-full"><span className="truncate max-w-[160px]">{a.nome}</span><button onClick={()=>rmArq(s.k,i)} className="text-slate-400 hover:text-rose-500"><Icon d={I.x} className="w-3 h-3"/></button></span>)}</div>}
        </div>; })}
    </div>
    {erro && <p className="text-sm text-rose-500 mt-3">{erro}</p>}
    {faltaObrig.length>0 && <p className="text-xs text-slate-400 mt-3">Obrigatório: {faltaObrig.map(s=>s.l).join(", ")}</p>}

  </>);

  if(etapaVis==="termo") return casca(<>{cabec}
    <EtapaTermoImagem cfg={termoImagemCfg} nome={tipo==="pj"?(f.responsavel||f.razaoSocial):f.nome} onVoltar={()=>setEtapa("form")} onAssinar={(ass)=>enviar(ass)}/>

      <div className="text-xs font-bold text-slate-400 uppercase mb-2">Responsável</div>
      <div className="grid sm:grid-cols-2 gap-3 mb-4">{Campo({k:"responsavel",l:"Nome do responsável *"})}{Campo({k:"cpf",l:"CPF do responsável"})}{Campo({k:"rg",l:"RG"})}{Campo({k:"nascimento",l:"Nascimento",tipoInput:"date"})}</div>
    </> : <>
      <div className="text-xs font-bold text-slate-400 uppercase mb-2">Dados pessoais</div>
      <div className="grid sm:grid-cols-2 gap-3 mb-4">{Campo({k:"nome",l:"Nome completo *"})}{Campo({k:"cpf",l:"CPF *"})}{Campo({k:"rg",l:"RG"})}{Campo({k:"rgOrgao",l:"Órgão emissor"})}{Campo({k:"nascimento",l:"Nascimento *",tipoInput:"date"})}{Campo({k:"mae",l:"Nome da mãe"})}{Campo({k:"pis",l:"PIS/NIS"})}{Campo({k:"ctpsNumero",l:"CTPS nº"})}{Campo({k:"tituloEleitor",l:"Título de eleitor"})}{Campo({k:"cnhNumero",l:"CNH nº"})}</div>
    </>}
    <div className="text-xs font-bold text-slate-400 uppercase mb-2">Endereço</div>
    <div className="grid sm:grid-cols-3 gap-3 mb-4">{Campo({k:"cep",l:"CEP"})}<div className="sm:col-span-2">{Campo({k:"logradouro",l:"Rua / avenida"})}</div>{Campo({k:"numero",l:"Número"})}{Campo({k:"complemento",l:"Complemento"})}{Campo({k:"bairro",l:"Bairro"})}{Campo({k:"cidade",l:"Cidade"})}{Campo({k:"uf",l:"UF"})}</div>
    <div className="text-xs font-bold text-slate-400 uppercase mb-2">Contato e pagamento</div>
    <div className="grid sm:grid-cols-2 gap-3 mb-4">{Campo({k:"telefone",l:"Telefone / WhatsApp *"})}{Campo({k:"email",l:"E-mail"+(tipo==="pj"?" *":""),tipoInput:"email"})}

    {tipo==="clt" && <div className="mb-4 p-3 rounded-2xl border border-slate-200 flex items-center gap-3">

      <div className="flex-1"><div className="text-sm font-semibold text-slate-800">Selfie para o registro de ponto *</div><div className="text-xs text-slate-500">Usada como referência facial ao bater o ponto.</div></div>

        <input type="file" accept="image/*" capture="user" className="hidden" onChange={async e=>{ const file=e.target.files&&e.target.files[0]; e.target.value=""; if(!file) return; setErro("");
          try{ setFoto(await fotoDeArquivo(file)); }catch(err){ setErro("Selfie: "+err.message); } }}/></label>
    </div>}
    <label className="flex items-start gap-2 text-sm text-slate-600"><input type="checkbox" checked={aceite} onChange={e=>setAceite(e.target.checked)} className="mt-0.5 w-4 h-4 accent-green-700"/>
      <span>Autorizo o uso dos meus dados e documentos para fins de cadastro, admissão e cumprimento de obrigações legais (LGPD).</span></label>
    {erro && <p className="text-sm text-rose-500 mt-3">{erro}</p>}
    {faltaForm.length>0 && <p className="text-xs text-slate-400 mt-3">Falta: {faltaForm.join(", ")}</p>}
    <div className="flex gap-2 mt-4"><Btn variant="ghost" onClick={()=>setEtapa("docs")}>Voltar</Btn><Btn className="flex-1" size="lg" icon={I.arrow} disabled={faltaForm.length>0} onClick={()=>{ setErro(""); setEtapa("termo"); }}>Continuar</Btn></div>
  </>);
}

/* ============================ PROTEÇÃO CONTRA TELA BRANCA ============================ */
class ErroTela extends React.Component{
  constructor(p){ super(p); this.state={erro:null}; }
  static getDerivedStateFromError(erro){ return {erro}; }
  componentDidCatch(erro,info){ try{ console.error("Erro na tela:",erro,info&&info.componentStack); }catch(e){} }
  componentDidUpdate(prev){ if(prev.chave!==this.props.chave && this.state.erro) this.setState({erro:null}); }
  render(){
    if(!this.state.erro) return this.props.children;
    return <div className="max-w-lg mx-auto mt-10 text-center">
      <div className="w-14 h-14 mx-auto rounded-2xl bg-amber-50 text-amber-500 grid place-items-center mb-3"><Icon d={I.help} className="w-7 h-7"/></div>
      <h2 className="text-xl font-bold text-slate-900">Esta tela encontrou um problema</h2>
      <p className="text-slate-500 text-sm mt-1">Os seus dados estão salvos. Volte ao painel ou recarregue a página. Se continuar, envie esta mensagem ao suporte:</p>
      <pre className="mt-3 p-3 rounded-xl bg-slate-100 text-left text-xs text-slate-600 whitespace-pre-wrap break-all">{String(this.state.erro&&this.state.erro.message||this.state.erro)}</pre>
      <div className="flex gap-2 justify-center mt-4">
        {this.props.onVoltar && <Btn variant="ghost" onClick={()=>{ this.setState({erro:null}); this.props.onVoltar(); }}>Voltar ao painel</Btn>}
        <Btn onClick={()=>location.reload()}>Recarregar</Btn>
      </div>
    </div>;
  }
}

/* ============================ AJUSTES DE PONTO (aprovação do gestor) ============================ */
function AjustesPonto(){
  const { ajustes, resolverAjuste, addRegistro } = useStore();
  const toast=useContext(ToastCtx);
  const [aba,setAba]=useState("pendente"); // pendente | resolvidos
  const [editHora,setEditHora]=useState({}); // {docId: "HH:MM"}
  const pend=(ajustes||[]).filter(a=>a.status==="pendente"||!a.status);
  const lista=(ajustes||[]).filter(a=> aba==="pendente" ? (a.status==="pendente"||!a.status) : a.status!=="pendente");
  const aprovar=(a, horaOverride)=>{
    const hora = horaOverride || a.hora || "08:00";
    const [hh,mm]=hora.split(":").map(Number); const min=(hh||0)*60+(mm||0);
    addRegistro({ nome:a.nome, pid:a.pid, cpf:a.cpf, tipo:a.tipo, acao:a.acao, unidade:a.unidade, hora:hora+":00", min, data:a.data, dia:a.data, geo:true, selfie:false, foto:null, ajuste:true });
    resolverAjuste(a._docId||a.id, {status:"aprovado", horaFinal:hora, resolvidoTs:new Date().getTime()});
    toast("Ajuste aprovado e lançado no ponto");
  };
  const recusar=(a)=>{ resolverAjuste(a._docId||a.id, {status:"recusado", resolvidoTs:new Date().getTime()}); toast("Solicitação recusada"); };
  return <div className="fade-in">
    <PageHeader title="Ajustes de ponto" sub="Solicitações de correção enviadas pelos colaboradores · aprovar, ajustar o horário ou recusar"/>
    <div className="inline-flex p-1 bg-slate-100 rounded-xl mb-4">
      {[["pendente","Pendentes ("+pend.length+")"],["resolvidos","Resolvidos"]].map(([k,l])=>
        <button key={k} onClick={()=>setAba(k)} className={cx("px-5 py-2 rounded-lg text-sm font-semibold transition", aba===k?"grad-brand text-white shadow-glow":"text-slate-500 hover:text-slate-700")}>{l}</button>)}
    </div>
    <div className="space-y-3">
      {lista.length===0 && <Card className="p-8 text-center text-slate-400 text-sm">{aba==="pendente"?"Nenhuma solicitação pendente. 👍":"Nenhum ajuste resolvido ainda."}</Card>}
      {lista.map(a=>{ const editing=editHora[a._docId]!==undefined; const pendente=a.status==="pendente"||!a.status;
        return <Card key={a._docId} className="p-4">
          <div className="flex items-start gap-3 flex-wrap">
            <Avatar name={a.nome} tone={a.tipo==="clt"?"brand":"free"}/>
            <div className="flex-1 min-w-[180px]">
              <div className="font-bold text-slate-900 flex items-center gap-2">{a.nome} <Badge tone={a.tipo==="clt"?"brand":"free"}>{a.tipo==="clt"?"CLT":"Freela"}</Badge></div>
              <div className="text-sm text-slate-600 mt-0.5"><b>{a.acaoLabel||a.acao}</b> · {fmtDataBR(a.data)} · <b className="tabular-nums">{a.hora}</b>{a.unidade?` · ${a.unidade}`:""}</div>
              <div className="text-xs text-slate-500 mt-1">Motivo: {a.motivo||"—"}</div>
            </div>
            {pendente
              ? (editing
                ? <div className="flex items-center gap-1"><input type="time" value={editHora[a._docId]} onChange={e=>setEditHora(h=>({...h,[a._docId]:e.target.value}))} className="px-2 py-1.5 rounded-lg border border-slate-300 text-sm"/><Btn size="sm" icon={I.check} onClick={()=>{aprovar(a, editHora[a._docId]); setEditHora(h=>{const n={...h};delete n[a._docId];return n;});}}>Salvar</Btn></div>
                : <div className="flex gap-2 flex-wrap">
                    <Btn size="sm" variant="primary" icon={I.check} onClick={()=>aprovar(a)}>Aprovar</Btn>
                    <Btn size="sm" variant="ghost" icon={I.edit} onClick={()=>setEditHora(h=>({...h,[a._docId]:a.hora}))}>Ajustar hora</Btn>
                    <Btn size="sm" variant="ghost" className="text-rose-500" icon={I.x} onClick={()=>recusar(a)}>Recusar</Btn>
                  </div>)
              : <Badge tone={a.status==="aprovado"?"green":"red"}>{a.status==="aprovado"?("Aprovado"+(a.horaFinal?" · "+a.horaFinal:"")):"Recusado"}</Badge>}
          </div>
        </Card>; })}
    </div>
  </div>;
}

// Seletor de cliente (multiempresa) — troca entre grupos de restaurantes e cria novo cliente.
function ClienteSwitcher(){
  const { clientes, clienteAtivo, criarCliente, trocarCliente, acesso } = useStore();
  const toast=useContext(ToastCtx);
  const [openList,setOpenList]=useState(false);
  // Gerente vinculado a um cliente: vê apenas o seu espaço (rótulo fixo, sem troca).
  if(acesso && acesso.pronto && !acesso.ehDono){
    return <div className="mb-2 flex items-center gap-2 px-2 py-2 rounded-xl bg-white/5">
      <span className="w-6 h-6 rounded-lg shrink-0" style={{background:clienteAtivo?.cor||"#6366f1"}}/>
      <div className="flex-1 min-w-0"><div className="text-[10px] uppercase tracking-wider text-white/40 font-bold">Cliente</div>
        <div className="text-sm font-semibold truncate">{clienteAtivo?.nome||"Cliente"}</div></div>
    </div>;
  }
  const [novo,setNovo]=useState(false);
  const [nome,setNome]=useState("");
  const [cor,setCor]=useState("#6366f1");
  const [salvando,setSalvando]=useState(false);
  const cores=["#6366f1","#f97316","#10b981","#0ea5e9","#e11d48","#a855f7","#f59e0b"];
  const criar=()=>{
    if(!nome.trim()){ toast("Dê um nome ao cliente (grupo de restaurantes)."); return; }
    if(!window.__WPDB){ toast("Cadastro de clientes exige conexão com o banco (online)."); return; }
    setSalvando(true);
    criarCliente(nome.trim(),cor).then(()=>{ /* recarrega no novo espaço */ })
      .catch(()=>{ setSalvando(false); toast("Não foi possível criar o cliente agora."); });
  };
  return <div className="mb-2">
    <button onClick={()=>setOpenList(v=>!v)} className="w-full flex items-center gap-2 px-2 py-2 rounded-xl text-white/80 hover:bg-white/10 transition">
      <span className="w-6 h-6 rounded-lg shrink-0" style={{background:clienteAtivo?.cor||"#6366f1"}}/>
      <div className="flex-1 min-w-0 text-left"><div className="text-[10px] uppercase tracking-wider text-white/40 font-bold">Cliente</div>
        <div className="text-sm font-semibold truncate">{clienteAtivo?.nome||"Cliente principal"}</div></div>
      <Icon d={I.chevron||I.arrow} className="w-4 h-4 text-white/50"/>
    </button>
    {openList && <div className="mt-1 bg-white/5 rounded-xl p-1.5 border border-white/10">
      {clientes.map(c=>
        <button key={c.id||"principal"} onClick={()=>{ if(c.id!==clienteAtivo?.id) trocarCliente(c.id); }}
          className={cx("w-full flex items-center gap-2 px-2 py-1.5 rounded-lg text-sm transition",
            c.id===clienteAtivo?.id?"bg-white/15 text-white":"text-white/70 hover:bg-white/10")}>
          <span className="w-4 h-4 rounded shrink-0" style={{background:c.cor}}/>
          <span className="truncate flex-1 text-left">{c.nome}</span>
          {c.id===clienteAtivo?.id && <span className="w-1.5 h-1.5 rounded-full bg-brand-400"/>}
        </button>)}
      <button onClick={()=>{setNovo(true);setOpenList(false);}}
        className="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg text-sm text-brand-300 hover:bg-white/10 mt-0.5">
        <Icon d={I.plus} className="w-4 h-4"/>Novo cliente</button>
    </div>}
    <Modal open={novo} onClose={()=>!salvando&&setNovo(false)}>
      <div className="p-6">
        <h3 className="text-lg font-bold text-ink-900">Novo cliente</h3>
        <p className="text-sm text-slate-500 mt-1">Cadastre outro grupo de restaurantes. Os dados (unidades, colaboradores, ponto, relatórios) ficam totalmente separados dos demais clientes.</p>
        <div className="mt-4 space-y-3">
          <Field label="Nome do cliente / grupo"><Input value={nome} onChange={e=>setNome(e.target.value)} placeholder="Ex.: Grupo Sabor & Cia" autoFocus/></Field>
          <Field label="Cor de identificação">
            <div className="flex gap-2 flex-wrap">{cores.map(c=>
              <button key={c} onClick={()=>setCor(c)} className={cx("w-8 h-8 rounded-lg border-2",cor===c?"border-ink-900":"border-transparent")} style={{background:c}}/>)}</div>
          </Field>
        </div>
        <div className="mt-6 flex gap-2 justify-end">
          <button onClick={()=>setNovo(false)} disabled={salvando} className="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100">Cancelar</button>
          <button onClick={criar} disabled={salvando} className="px-4 py-2.5 rounded-xl text-sm font-bold text-white bg-brand-500 hover:bg-brand-600 disabled:opacity-60">{salvando?"Criando…":"Criar e abrir"}</button>
        </div>

  </div>;
