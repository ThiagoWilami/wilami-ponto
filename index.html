              <Btn className="flex-1" size="lg" disabled={!geo||!geo.ok} icon={I.check} onClick={registrarAcao} variant={accent==="clt"?"primary":"free"}>Bater ponto — {acaoLabel||rotuloAcao(acao)}</Btn>
            </div>
          </div>}
        </>}
      </Card>
      <p className="text-center text-white/50 text-xs mt-4 flex items-center justify-center gap-1"><Icon d={I.shield} className="w-3 h-3"/> Conforme Portaria 671/2021 · comprovante por e-mail</p>
    </div>
  </div>;
}

/* ============================ FORM DE COLABORADOR ============================ */
function ColabForm({ tipo, inicial, onSalvar, onClose }) {
  const { unidades, cargosFreela } = useStore();
  const cg0 = cargosFreela[0];
  const [f,setF]=useState(inicial || (tipo==="clt"
    ? { nome:"", cargo:CARGOS[0], setor:"salao", escala:"6x1", folgaDia:6, unidade:unidades[0]?.id, admissao:"", salario:0, cpf:"", tel:"", tipoPix:"CPF", pix:"", banco:"", foto:"", docs:{} }
    : { nome:"", cargo:cg0?.nome||"", setor:"salao", unidade:unidades[0]?.id, valor:cg0?.valor||0, cpf:"", tel:"", tipoPix:"CPF", pix:"", banco:"", foto:"" }));
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  // Foto do colaborador no CADASTRO (referência facial). Usa input de arquivo/câmera:
  // funciona em file://, no PC e abre a câmera no celular (capture="user").
  const upFoto=(file)=>{ if(!file) return; const rd=new FileReader(); rd.onload=async()=>set("foto", await compressImg(rd.result)); rd.readAsDataURL(file); };
  const setCargoClt=(cg)=>setF(p=>({...p,cargo:cg,setor:SETOR_POR_CARGO[cg]||p.setor}));
  const setCargoFree=(nm)=>{ const c=cargosFreela.find(x=>x.nome===nm); setF(p=>({...p,cargo:nm,valor:c?c.valor:p.valor,setor:SETOR_POR_CARGO[nm]||p.setor})); };
  const upDoc=(k,file)=>{ if(!file) return; const rd=new FileReader();
    rd.onload=async()=>{ const dados=file.type&&file.type.indexOf("image")===0?await compressImg(rd.result):rd.result; setF(p=>({...p,docs:{...(p.docs||{}),[k]:{nome:file.name,dados}}})); };
    rd.readAsDataURL(file); };
  const rmDoc=(k)=>setF(p=>{ const d={...(p.docs||{})}; delete d[k]; return {...p,docs:d}; });
  const [showDocs,setShowDocs]=useState(false);
  const nDocsUp=DOC_TIPOS.filter(([k])=>f.docs&&f.docs[k]).length;
  const nomeOk=f.nome.trim().length>=2;
  // Lista clara do que falta — evita "botão desativado sem explicação"
  const faltando=[];
  if(!nomeOk) faltando.push("nome");
  if(!f.foto) faltando.push("foto");
  if(!(f.cpf||"").trim()) faltando.push("CPF");
  if(tipo==="free"){
    if(!f.cargo) faltando.push("cargo");
    if(!f.tipoPix) faltando.push("tipo Pix");
    if(!(f.pix||"").trim()) faltando.push("chave Pix");
    if(!(f.banco||"").trim()) faltando.push("nome do banco");
  }
  const valido = faltando.length===0;
  const req=(l)=> l+" *";
  return <div className="flex flex-col max-h-[85vh]">
    {/* Cabeçalho fixo com botão de VOLTAR intuitivo */}
    <div className="flex items-center gap-2 px-5 py-3 border-b border-slate-100 shrink-0">
      <button onClick={onClose} className="flex items-center gap-1 text-sm font-semibold text-slate-600 hover:text-slate-900 -ml-1 pr-2"><Icon d={I.arrow} className="w-4 h-4 rotate-180"/>Voltar</button>
      <h3 className="text-base font-bold text-slate-900 ml-1">{inicial?"Editar":tipo==="clt"?"Contratar CLT":"Novo freelancer"}</h3>
      <button onClick={onClose} className="ml-auto text-slate-400 hover:text-slate-600"><Icon d={I.x}/></button>
    </div>
    {/* Corpo rolável */}
    <div className="overflow-y-auto px-5 py-4">
    {/* Foto do colaborador (OBRIGATÓRIA) — referência facial do check-in */}
    <div className={cx("flex items-center gap-3 mb-3 p-3 rounded-2xl border", f.foto?"border-emerald-200 bg-emerald-50/40":"border-rose-200 bg-rose-50/40")}>
      <div className="w-16 h-16 rounded-2xl overflow-hidden bg-white ring-1 ring-slate-200 grid place-items-center shrink-0">
        {f.foto ? <img src={f.foto} alt="foto" className="w-full h-full object-cover"/> : <Icon d={I.camera} className="w-6 h-6 text-slate-300"/>}
      </div>
      <div className="flex-1 min-w-0">
        <div className="text-sm font-semibold text-slate-800">Foto do colaborador <span className="text-rose-500">*</span></div>
        <div className="text-xs text-slate-500 mb-2">{f.foto?"Foto adicionada ✓":"Obrigatória — tire uma foto ou envie do dispositivo."}</div>
        <div className="flex gap-2">
          <label className="cursor-pointer">
            <span className="inline-flex items-center gap-1 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 px-3 py-1.5 rounded-lg"><Icon d={I.camera} className="w-3.5 h-3.5"/>{f.foto?"Trocar foto":"Tirar/enviar foto"}</span>
            <input type="file" accept="image/*" capture="user" className="hidden" onChange={e=>upFoto(e.target.files&&e.target.files[0])}/>
          </label>
          {f.foto && <button onClick={()=>set("foto","")} className="text-xs font-semibold text-slate-500 hover:text-rose-500 px-2">Remover</button>}
        </div>
      </div>
    </div>
    <div className="grid sm:grid-cols-2 gap-3">
      <div className="sm:col-span-2"><Field label={req("Nome e sobrenome")}><Input value={f.nome} onChange={e=>set("nome",e.target.value)} placeholder="Ex.: João da Silva"/></Field></div>
      {tipo==="clt" ? <>
        <Field label="Cargo / função"><Select value={f.cargo} onChange={e=>setCargoClt(e.target.value)}>{CARGOS.map(c=><option key={c}>{c}</option>)}</Select></Field>
        <Field label="Setor"><Select value={f.setor} onChange={e=>set("setor",e.target.value)}>{SETORES.map(([k,l])=><option key={k} value={k}>{l}</option>)}</Select></Field>
        <Field label="Unidade (casa)"><Select value={f.unidade} onChange={e=>set("unidade",Number(e.target.value))}>{unidades.map(u=><option key={u.id} value={u.id}>{u.nome}</option>)}</Select></Field>
        <Field label="Escala fixa"><Select value={f.escala} onChange={e=>set("escala",e.target.value)}>{Object.entries(ESCALAS).map(([k,v])=><option key={k} value={k}>{v}</option>)}</Select></Field>
        <Field label="Dia da folga (referência)"><Select value={f.folgaDia==null?"":f.folgaDia} onChange={e=>set("folgaDia",e.target.value===""?null:Number(e.target.value))}>
          {DIAS.map((d,i)=><option key={i} value={i}>{["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"][i]}</option>)}
        </Select></Field>
        <Field label="Admissão"><Input type="date" value={f.admissao} onChange={e=>set("admissao",e.target.value)}/></Field>
        <Field label="Salário mensal (R$)"><Input type="number" value={f.salario||0} onChange={e=>set("salario",Number(e.target.value))} placeholder="Ex.: 2200"/></Field>
      </> : <>
        <Field label={req("Cargo")}><Select value={f.cargo} onChange={e=>setCargoFree(e.target.value)}>{cargosFreela.map(c=><option key={c.id} value={c.nome}>{c.nome}</option>)}</Select></Field>
        <Field label="Valor por jornada"><div className="px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm font-semibold text-slate-700">R$ {Number(f.valor||0).toLocaleString("pt-BR")} <span className="font-normal text-slate-400 text-xs">(do cargo)</span></div></Field>
        <Field label="Unidade (casa)"><Select value={f.unidade} onChange={e=>set("unidade",Number(e.target.value))}>{unidades.map(u=><option key={u.id} value={u.id}>{u.nome}</option>)}</Select></Field>
        <Field label="Telefone"><Input value={f.tel} onChange={e=>set("tel",e.target.value)} placeholder="(00) 00000-0000"/></Field>
      </>}
      <Field label={req("CPF")}><Input value={f.cpf} onChange={e=>set("cpf",e.target.value)} placeholder="000.000.000-00"/></Field>
      {tipo==="clt" && <Field label="Telefone"><Input value={f.tel} onChange={e=>set("tel",e.target.value)} placeholder="(00) 00000-0000"/></Field>}
      <Field label={req("Tipo de Pix")}><Select value={f.tipoPix} onChange={e=>set("tipoPix",e.target.value)}>{PIX_TIPOS.map(t=><option key={t}>{t}</option>)}</Select></Field>
      <Field label={req("Chave Pix")}><Input value={f.pix} onChange={e=>set("pix",e.target.value)} placeholder="conforme o tipo de Pix"/></Field>
      <Field label={req("Nome do Banco")}><Input value={f.banco} onChange={e=>set("banco",e.target.value)} placeholder="Ex.: Nubank, Itaú, Caixa"/></Field>
    </div>

    {tipo==="clt" && <div className="mt-4">
      <button onClick={()=>setShowDocs(v=>!v)} className="w-full flex items-center gap-2 text-xs font-semibold text-slate-600 hover:text-slate-900 py-2 px-3 rounded-xl bg-slate-50 border border-slate-200">
        <Icon d={I.doc} className="w-3.5 h-3.5"/> Documentos (opcional) {nDocsUp>0 && <Badge tone="green">{nDocsUp} enviado(s)</Badge>}
        <Icon d={I.arrow} className={cx("w-3.5 h-3.5 ml-auto transition", showDocs?"rotate-90":"rotate-0")}/>
      </button>
      {showDocs && <div className="grid sm:grid-cols-2 gap-2 mt-2">
        {DOC_TIPOS.map(([k,l])=>{ const arq=f.docs?.[k];
          return <div key={k} className={cx("flex items-center gap-2.5 p-2.5 rounded-xl border", arq?"border-emerald-200 bg-emerald-50/40":"border-slate-200")}>
            <div className={cx("w-8 h-8 rounded-lg grid place-items-center shrink-0", arq?"bg-emerald-100 text-emerald-600":"bg-slate-100 text-slate-400")}><Icon d={I.doc} className="w-4 h-4"/></div>
            <div className="flex-1 min-w-0"><div className="text-sm font-semibold text-slate-800">{l}</div>
              {arq ? <div className="text-xs text-emerald-700 truncate flex items-center gap-1"><Icon d={I.check} className="w-3 h-3"/>{docNome(arq)}</div>
                   : <div className="text-xs text-slate-400">Não enviado</div>}</div>
            {arq && <button onClick={()=>rmDoc(k)} className="text-slate-300 hover:text-rose-500 shrink-0"><Icon d={I.x} className="w-4 h-4"/></button>}
            <label className="cursor-pointer shrink-0">
              <span className="inline-flex items-center gap-1 text-xs font-semibold text-brand-700 bg-brand-50 hover:bg-brand-100 px-2.5 py-1.5 rounded-lg"><Icon d={I.upload} className="w-3.5 h-3.5"/>{arq?"Trocar":"Enviar"}</span>
              <input type="file" accept="image/*,application/pdf" capture="environment" className="hidden" onChange={e=>upDoc(k,e.target.files&&e.target.files[0])}/>
            </label>
          </div>;})}
      </div>}
    </div>}
    {tipo==="clt" && !inicial && <p className="text-xs text-slate-500 mt-3 flex items-center gap-1"><Icon d={I.calendar} className="w-3.5 h-3.5"/> Ao cadastrar, o CLT entra automaticamente na escala fixa ({f.escala}) da sua casa.</p>}
    </div>
    {/* Rodapé fixo — sempre visível, com o que falta */}
    <div className="border-t border-slate-100 px-5 py-3 shrink-0 bg-white rounded-b-3xl">
      {!valido && <p className="text-xs text-rose-500 mb-2 text-center">Falta preencher: <b>{faltando.join(", ")}</b></p>}
      <div className="flex gap-2">
        <Btn variant="ghost" onClick={onClose}>Voltar</Btn>
        <Btn className="flex-1" disabled={!valido} icon={I.check} variant={tipo==="clt"?"primary":"free"} onClick={()=>onSalvar(f)}>{inicial?"Salvar alterações":"Cadastrar"}</Btn>
      </div>
    </div>
  </div>;
}

/* ============================ COLABORADORES CLT ============================ */
function ColaboradoresCLT() {
  const { clts, salvarClt, excluirColab, unidades, registros, pontoHist, can } = useStore();
  const toast=useContext(ToastCtx);
  const bancoDe=(c)=>{ const meus=apurarHoras([...pontoHist, ...(registros||[])]).filter(x=>x.tipo==="clt"&&x.completo&&x.nome===c.nome);
    const extras=meus.reduce((s,x)=>s+(x.extras||0)+(x.extras100||0),0), atraso=meus.reduce((s,x)=>s+(x.atraso||0),0), not=meus.reduce((s,x)=>s+minutosNoturnos(x.punches||[]),0);
    return {extras,atraso,not,saldo:extras-atraso}; };
  const [q,setQ]=useState("");
  const [form,setForm]=useState(null); // {inicial?} aberto p/ cadastro/edição
  const [pasta,setPasta]=useState(null); // colaborador aberto
  const [tab,setTab]=useState("dados");
  const [confirmar,setConfirmar]=useState(null);
  const [casa,setCasa]=useState("todas");
  const list=clts.filter(c=>c.nome.toLowerCase().includes(q.toLowerCase()) && (casa==="todas"||c.unidade===casa));

  return <div className="fade-in">
    <PageHeader title="Colaboradores CLT" sub="Escala fixa automática · pasta individual · cadastro, edição e exclusão">
      <Btn icon={I.plus} onClick={()=>setForm({})}>Contratar CLT</Btn>
    </PageHeader>
    <Card className="p-2 mb-3"><div className="flex items-center gap-2 px-3 py-2">
      <Icon d={I.search} className="w-4 h-4 text-slate-400"/>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar colaborador…" className="flex-1 outline-none text-sm bg-transparent"/>
    </div></Card>
    <FiltroCasa casa={casa} setCasa={setCasa} unidades={unidades}/>
    <Card className="overflow-hidden">
      <div className="overflow-x-auto"><table className="w-full text-sm min-w-[760px]">
        <thead><tr className="text-left text-slate-400 border-b border-slate-100">
          {["Colaborador","Cargo","Escala","Unidade","Banco","Docs",""].map(h=><th key={h} className="px-4 py-3 font-semibold">{h}</th>)}
        </tr></thead>
        <tbody className="divide-y divide-slate-50">
          {list.map(c=>{ const docsOk=Object.values(c.docs).filter(Boolean).length; const docsTot=Object.keys(c.docs).length;
            return <tr key={c.id} className="hover:bg-slate-50/70">
              <td className="px-4 py-3"><button onClick={()=>{setPasta(c);setTab("dados");}} className="flex items-center gap-3 text-left"><Avatar name={c.nome} src={c.foto} tone="brand"/><span className="font-semibold text-slate-800">{c.nome}</span></button></td>
              <td className="px-4 py-3 text-slate-600">{c.cargo}</td>
              <td className="px-4 py-3"><Badge tone="brand">{c.escala}</Badge></td>
              <td className="px-4 py-3 text-slate-600">{unidadeNome(c.unidade,unidades)}</td>
              <td className="px-4 py-3"><span className={cx("font-semibold", c.banco.startsWith("-")?"text-rose-600":"text-emerald-600")}>{c.banco}</span></td>
              <td className="px-4 py-3"><Badge tone={docsOk===docsTot?"green":"amber"}>{docsOk}/{docsTot}</Badge></td>
              <td className="px-4 py-3"><div className="flex gap-1 justify-end">
                <button onClick={()=>setForm({inicial:c})} className="w-8 h-8 rounded-lg hover:bg-slate-100 grid place-items-center text-slate-500"><Icon d={I.edit} className="w-4 h-4"/></button>
                {can("excluir") && <button onClick={()=>setConfirmar(c)} className="w-8 h-8 rounded-lg hover:bg-rose-50 grid place-items-center text-slate-400 hover:text-rose-500"><Icon d={I.trash} className="w-4 h-4"/></button>}
              </div></td>
            </tr>;})}
          {list.length===0 && <tr><td colSpan="7" className="px-4 py-8 text-center text-slate-400">Nenhum colaborador. Clique em “Contratar CLT”.</td></tr>}
        </tbody>
      </table></div>
    </Card>

    <Modal open={!!form} onClose={()=>setForm(null)} wide>
      {form && <ColabForm tipo="clt" inicial={form.inicial} onClose={()=>setForm(null)}
        onSalvar={(dados)=>{ salvarClt(form.inicial?{...form.inicial,...dados}:dados); setForm(null); toast(form.inicial?"Colaborador atualizado":"CLT contratado e escalado"); }}/>}
    </Modal>

    <Modal open={!!confirmar} onClose={()=>setConfirmar(null)}>
      {confirmar && <div className="p-6 text-center">
        <div className="w-14 h-14 mx-auto rounded-full bg-rose-50 text-rose-500 grid place-items-center mb-3"><Icon d={I.trash} className="w-7 h-7"/></div>
        <h3 className="text-lg font-bold text-slate-900">Excluir {confirmar.nome}?</h3>
        <p className="text-slate-500 text-sm mt-1">O colaborador e suas alocações na escala serão removidos.</p>
        <div className="flex gap-2 mt-5"><Btn variant="ghost" className="flex-1" onClick={()=>setConfirmar(null)}>Cancelar</Btn>
          <Btn variant="danger" className="flex-1" icon={I.trash} onClick={()=>{excluirColab(confirmar.id,"clt");setConfirmar(null);toast("Colaborador excluído");}}>Excluir</Btn></div>
      </div>}
    </Modal>

    <Modal open={!!pasta} onClose={()=>setPasta(null)} wide>
      {pasta && <div>
        <div className="grad-brand grad-hero p-6 text-white rounded-t-3xl relative">
          <button onClick={()=>setPasta(null)} className="absolute top-4 right-4 text-white/80 hover:text-white"><Icon d={I.x}/></button>
          <div className="flex items-center gap-4">
            <Avatar name={pasta.nome} tone="free" size="w-16 h-16"/>
            <div><h3 className="text-2xl font-extrabold">{pasta.nome}</h3>
              <p className="text-white/80">{pasta.cargo} · {unidadeNome(pasta.unidade,unidades)}</p>
              <div className="flex gap-2 mt-2"><Badge tone="slate">{ESCALAS[pasta.escala]}</Badge></div></div>
          </div>
        </div>
        <div className="px-6 pt-4 flex gap-1 border-b border-slate-100">
          {[["dados","Dados"],["docs","Documentos"],["escala","Banco de horas"]].map(([k,l])=>
            <button key={k} onClick={()=>setTab(k)} className={cx("px-4 py-2.5 text-sm font-semibold border-b-2 -mb-px", tab===k?"border-brand-500 text-brand-700":"border-transparent text-slate-400 hover:text-slate-600")}>{l}</button>)}
        </div>
        <div className="p-6">
          {tab==="dados" && <div className="grid sm:grid-cols-2 gap-4">
            {[["Cargo",pasta.cargo],["Escala",ESCALAS[pasta.escala]],["Unidade",unidadeNome(pasta.unidade,unidades)],["Admissão",pasta.admissao?fmtDataBR(pasta.admissao):"—"],["Salário mensal",pasta.salario?("R$ "+Number(pasta.salario).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})):"—"],["CPF",pasta.cpf||"—"],["Telefone",pasta.tel||"—"],["Chave Pix",pasta.pix||"—"]].map(([l,v])=>
              <div key={l} className="p-4 rounded-xl bg-slate-50"><div className="text-xs text-slate-400 font-semibold uppercase">{l}</div><div className="font-semibold text-slate-800 mt-1">{v}</div></div>)}
            <div className="sm:col-span-2"><Btn variant="ghost" icon={I.edit} onClick={()=>{setForm({inicial:pasta});setPasta(null);}}>Editar dados</Btn></div>
          </div>}
          {tab==="docs" && <div className="space-y-3">
            <p className="text-sm text-slate-500">Documentos criptografados (LGPD): contrato, exames, carteira de trabalho e identidade.</p>
            {[["contrato","Contrato de trabalho"],["exames","Exames admissionais (ASO)"],["ctps","Carteira de Trabalho"],["rg","RG / CPF"]].map(([k,l])=>
              <div key={k} className="flex items-center gap-3 p-3 rounded-xl border border-slate-200">
                <div className={cx("w-9 h-9 rounded-lg grid place-items-center", pasta.docs[k]?"bg-emerald-50 text-emerald-600":"bg-slate-100 text-slate-400")}><Icon d={I.doc} className="w-4 h-4"/></div>
                <div className="flex-1"><div className="font-semibold text-slate-800 text-sm">{l}</div><div className="text-xs text-slate-400">{pasta.docs[k]?"Enviado":"Pendente"}</div></div>
                {pasta.docs[k]?<Badge tone="green">OK</Badge>:<Btn size="sm" variant="soft" icon={I.upload} onClick={()=>toast("Upload simulado (S3/Firebase)")}>Enviar</Btn>}
              </div>)}
          </div>}
          {tab==="escala" && (()=>{ const b=bancoDe(pasta); return <div className="grid sm:grid-cols-2 gap-4">
            <Card className="p-4"><div className="text-sm text-slate-500">Banco de horas (saldo)</div>
              <div className={cx("text-3xl font-extrabold mt-1", b.saldo<0?"text-rose-600":"text-emerald-600")}>{fmtSaldo(b.saldo)}</div>
              <div className="text-xs text-slate-400 mt-1">extras − atrasos, das batidas reais</div></Card>
            <Card className="p-4"><div className="space-y-2 text-sm mt-1">
              <div className="flex justify-between"><span className="text-slate-500">Horas extras</span><b>{b.extras?fmtHoras(b.extras):"0h00"}</b></div>
              <div className="flex justify-between"><span className="text-slate-500">Atrasos</span><b className="text-rose-600">{b.atraso?fmtHoras(b.atraso):"0h00"}</b></div>
              <div className="flex justify-between"><span className="text-slate-500">Adicional noturno</span><b>{b.not?fmtHoras(b.not):"0h00"}</b></div></div></Card>
          </div>; })()}
        </div>
      </div>}
    </Modal>
  </div>;
}

/* ============================ FREELANCERS ============================ */

/* ============================ RELATÓRIOS ============================ */
// minuto pertence ao horário noturno (22:00–05:00, Art. 73 CLT)?
const ehMinNoturno=(m)=>{ const x=((m%1440)+1440)%1440; return x>=1320 || x<300; };
function minutosNoturnos(punches){ const g=a=>{ const p=punches.find(x=>x.acao===a); return p?p.min:null; };
  const ent=g("Entrada"), sai=g("Saída"); if(ent==null||sai==null) return 0;
  const fim=sai<ent?sai+1440:sai; let c=0; for(let m=ent;m<fim;m++){ if(ehMinNoturno(m)) c++; } return c; }
const fmtSaldo=(min)=> (min<0?"-":"+")+fmtHoras(min);
function Relatorios() {
  const { clts, freelas, unidades, registros, pontoHist, getDossie } = useStore();
  const toast=useContext(ToastCtx);
  const [f,setF]=useState("extras");
  const [casa,setCasa]=useState("todas");
  const filtros=[["extras","Horas extras"],["atrasos","Atrasos & faltas"],["banco","Banco de horas"],["noturno","Adicional noturno"]];
  const cols={extras:["Colaborador","Horas extras","Escala"],atrasos:["Colaborador","Atrasos & faltas","Escala"],banco:["Colaborador","Saldo de horas","Escala"],noturno:["Colaborador","Horas noturnas","Escala"]};
  // Apuração REAL das batidas (CLT) — extras, atraso e noturno vêm dos registros; faltas do dossiê.
  const apur=apurarHoras([...pontoHist, ...registros]).filter(x=>x.tipo==="clt" && x.completo);
  const dados = clts.filter(c=>casa==="todas"||c.unidade===casa).map(c=>{
    const meus=apur.filter(x=>x.nome===c.nome);
    const extrasMin=meus.reduce((s,x)=>s+(x.extras||0)+(x.extras100||0),0);
    const atrasoMin=meus.reduce((s,x)=>s+(x.atraso||0),0);
    const notMin=meus.reduce((s,x)=>s+minutosNoturnos(x.punches||[]),0);
    const dos=getDossie("clt-"+c.id);
    const faltasQtd=(dos.faltas||[]).filter(x=>x.tipo==="falta"&&x.descontar).length;
    const atrasosQtd=(dos.faltas||[]).filter(x=>x.tipo==="atraso").length;
    return { c, extrasMin, atrasoMin, notMin, faltasQtd, atrasosQtd, saldoMin: extrasMin-atrasoMin };
  });
  const val=(d)=> f==="extras" ? (d.extrasMin?fmtHoras(d.extrasMin):"—")
    : f==="atrasos" ? ((d.atrasoMin?fmtHoras(d.atrasoMin):"0h00")+(d.faltasQtd?` · ${d.faltasQtd} falta(s)`:""))
    : f==="banco" ? fmtSaldo(d.saldoMin)
    : (d.notMin?fmtHoras(d.notMin):"—");
  const neg=(d)=> f==="banco" ? d.saldoMin<0 : f==="atrasos" ? (d.atrasoMin>0||d.faltasQtd>0) : false;
  const exportar=()=>{
    const cab="Colaborador;Escala;Horas_extras;Atrasos;Faltas;Saldo_banco_horas;Horas_noturnas";
    const corpo=dados.map(d=>`${d.c.nome};${d.c.escala};${fmtHoras(d.extrasMin)};${fmtHoras(d.atrasoMin)};${d.faltasQtd};${fmtSaldo(d.saldoMin)};${fmtHoras(d.notMin)}`).join("\n");
    const blob=new Blob([cab+"\n"+corpo],{type:"text/csv"}); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="relatorio-clt.csv"; a.click(); URL.revokeObjectURL(url);
    toast("Relatório consolidado exportado");
  };
  return <div className="fade-in">
    <PageHeader title="Relatórios" sub="Cálculo conforme CLT e Portaria 671/2021 · consolidado para folha">
      <Btn variant="ghost" icon={I.download} onClick={exportar}>Exportar</Btn>
    </PageHeader>
    <div className="flex flex-wrap gap-2 mb-3">
      {filtros.map(([k,l])=><button key={k} onClick={()=>setF(k)} className={cx("px-4 py-2 rounded-xl text-sm font-semibold border transition", f===k?"grad-brand text-white border-transparent shadow-glow":"bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>{l}</button>)}
    </div>
    <FiltroCasa casa={casa} setCasa={setCasa} unidades={unidades}/>
    {f==="noturno" && <div className="mb-3 text-xs text-slate-400">Adicional noturno: horas trabalhadas entre 22h e 5h (Art. 73 CLT) — calculado das batidas reais.</div>}
    {f==="banco" && <div className="mb-3 text-xs text-slate-400">Saldo do banco de horas = horas extras − atrasos (das batidas reais).</div>}
    <Card className="overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm min-w-[520px]">
      <thead><tr className="text-left text-slate-400 border-b border-slate-100">{cols[f].map(h=><th key={h} className="px-4 py-3 font-semibold">{h}</th>)}</tr></thead>
      <tbody className="divide-y divide-slate-50">
        {dados.map((d,i)=><tr key={i} className="hover:bg-slate-50/70">
          <td className="px-4 py-3"><div className="flex items-center gap-2"><Avatar name={d.c.nome} src={d.c.foto} tone="brand" size="w-7 h-7"/><span className="font-semibold text-slate-800">{d.c.nome}</span></div></td>
          <td className={cx("px-4 py-3 font-semibold tabular-nums", neg(d)?"text-rose-600":"text-slate-700")}>{val(d)}</td>
          <td className="px-4 py-3"><Badge tone="brand">{d.c.escala}</Badge></td>
        </tr>)}
        {dados.length===0 && <tr><td colSpan="3" className="px-4 py-8 text-center text-slate-400">Nenhum colaborador CLT nesta casa.</td></tr>}
      </tbody></table></div></Card>
  </div>;
}

function UnidadeForm({ inicial, onSalvar, onClose }) {
  const [u,setU]=useState(inicial || { nome:"", end:"", lat:-23.55, lng:-46.63, raio:100, cor:"#6366f1" });
  const set=(k,v)=>setU(p=>({...p,[k]:v}));
  const cores=["#6366f1","#f97316","#10b981","#0ea5e9","#e11d48","#8b5cf6"];
  const [geoMsg,setGeoMsg]=useState(null);      // {tone:'ok'|'erro'|'buscando', txt}
  const [buscando,setBuscando]=useState(false);
  // Usa a localização ATUAL do dispositivo (GPS/Wi-Fi) para preencher latitude/longitude.
  const usarLocalAtual=()=>{
    if(!navigator.geolocation){ setGeoMsg({tone:"erro",txt:"Seu dispositivo não suporta geolocalização."}); return; }
    setBuscando(true); setGeoMsg({tone:"buscando",txt:"Obtendo a localização do dispositivo…"});
    navigator.geolocation.getCurrentPosition(
      pos=>{ const {latitude,longitude,accuracy}=pos.coords;
        setU(p=>({...p, lat:Number(latitude.toFixed(6)), lng:Number(longitude.toFixed(6))}));
        setBuscando(false);
        setGeoMsg({tone:"ok",txt:"Localização capturada"+(accuracy?` (precisão ~${Math.round(accuracy)} m)`:"")+". Confira no mapa e ajuste a cerca se precisar."}); },
      err=>{ setBuscando(false);
        setGeoMsg({tone:"erro",txt: err && err.code===1 ? "Permissão de localização negada. Autorize o acesso no navegador e tente de novo." : "Não foi possível obter a localização agora. Tente novamente."}); },
      {enableHighAccuracy:true, timeout:10000, maximumAge:0});
  };
  const temCoord = Number.isFinite(u.lat) && Number.isFinite(u.lng) && !(u.lat===0 && u.lng===0);
  // Mapa do Google embutido (sem chave de API) mostrando o ponto marcado.
  const mapSrc = temCoord ? `https://www.google.com/maps?q=${u.lat},${u.lng}&z=16&hl=pt-BR&output=embed` : null;
  const mapLink = temCoord ? `https://www.google.com/maps?q=${u.lat},${u.lng}` : null;
  return <div className="p-6">
    <div className="flex items-center justify-between mb-5">
      <h3 className="text-lg font-bold text-slate-900">{inicial?"Editar unidade":"Nova unidade (casa)"}</h3>
      <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon d={I.x}/></button>
    </div>
    <div className="space-y-4">
      <Field label="Nome da casa"><Input value={u.nome} onChange={e=>set("nome",e.target.value)} placeholder="Ex.: Caktus Osasco"/></Field>
      <Field label="Endereço"><Input value={u.end} onChange={e=>set("end",e.target.value)} placeholder="Rua, número — Cidade/UF"/></Field>

      <Btn variant="ghost" className="w-full" icon={I.gps} onClick={usarLocalAtual} disabled={buscando}>
        {buscando?"Obtendo localização…":"Usar minha localização atual"}
      </Btn>
      {geoMsg && <div className={cx("text-xs rounded-lg px-3 py-2 flex items-center gap-2",
        geoMsg.tone==="ok"?"bg-emerald-50 text-emerald-700":geoMsg.tone==="erro"?"bg-rose-50 text-rose-600":"bg-slate-50 text-slate-500")}>
        {geoMsg.tone==="buscando" && <span className="w-3.5 h-3.5 rounded-full border-2 border-slate-300 border-t-slate-500 animate-spin shrink-0"/>}
        <span>{geoMsg.txt}</span></div>}

      <div className="grid grid-cols-3 gap-3">
        <Field label="Latitude"><Input type="number" step="0.000001" value={u.lat} onChange={e=>set("lat",Number(e.target.value))}/></Field>
        <Field label="Longitude"><Input type="number" step="0.000001" value={u.lng} onChange={e=>set("lng",Number(e.target.value))}/></Field>
        <Field label="Cerca (m)"><Input type="number" value={u.raio} onChange={e=>set("raio",Number(e.target.value))}/></Field>
      </div>

      {mapSrc && <div>
        <div className="flex items-center justify-between mb-1.5">
          <span className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Localização no mapa</span>
          <a href={mapLink} target="_blank" rel="noopener" className="text-xs font-semibold text-brand-600 hover:underline flex items-center gap-1"><Icon d={I.link} className="w-3 h-3"/>Abrir no Google Maps</a>
        </div>
        <div className="rounded-xl overflow-hidden border border-slate-200 bg-slate-50">
          <iframe key={u.lat+","+u.lng} title="mapa" src={mapSrc} className="w-full" style={{height:220,border:0}} loading="lazy" referrerPolicy="no-referrer-when-downgrade"/>
        </div>
        <p className="text-[11px] text-slate-400 mt-1.5">O pino marca a coordenada. A cerca virtual ({u.raio} m) é o raio em volta desse ponto.</p>
      </div>}

      <Field label="Cor"><div className="flex gap-2">{cores.map(c=><button key={c} onClick={()=>set("cor",c)} className={cx("w-8 h-8 rounded-lg shadow", u.cor===c&&"ring-2 ring-offset-2 ring-slate-400")} style={{background:c}}/>)}</div></Field>
    </div>
    <div className="flex gap-2 mt-6"><Btn variant="ghost" className="flex-1" onClick={onClose}>Cancelar</Btn>
      <Btn className="flex-1" icon={I.check} disabled={!u.nome.trim()} onClick={()=>onSalvar(u)}>{inicial?"Salvar":"Criar unidade"}</Btn></div>
  </div>;

    <Modal open={!!confirmar} onClose={()=>setConfirmar(null)}>

}

/* ============================ RELATÓRIOS FINANCEIROS ============================ */
function Financeiro() {
  const { freelasComPagamentos:freelas, clts, unidades, registros, pontoHist, getDossie, cltExtraAjuste, setCltExtra } = useStore();
  const toast=useContext(ToastCtx);
  const [aba,setAba]=useState("clt");                 // "clt" (folha) | "freela" (pagamentos)
  const _mr=mesAtualRange();
  const [ini,setIni]=useState(_mr.ini);
  const [fim,setFim]=useState(_mr.fim);
  const [uni,setUni]=useState(unidades[0]?.id ?? "todas");
  const uNome = uni==="todas"?"Todas as casas":unidadeNome(Number(uni),unidades);
  const naData=(d)=> (!ini||d>=ini) && (!fim||d<=fim);
  const fmtD=(ds)=>ds.map(d=>d.slice(8,10)+"/"+d.slice(5,7)).join(", ");

  /* ===================== FOLHA CLT (fechamento e pagamento) ===================== */
  // Apuração REAL das batidas no período (extras normais, extras 100% em folga e adicional noturno).
  const apurCLT = apurarHoras([...pontoHist, ...registros]).filter(x=>x.tipo==="clt" && x.completo && naData(x.dia));
  const linhasCLT = clts.filter(c=>uni==="todas"||c.unidade===Number(uni)).map(c=>{
    const meus=apurCLT.filter(x=>x.nome===c.nome);
    const extrasMin=meus.reduce((s,x)=>s+(x.extras||0),0);
    const extras100Min=meus.reduce((s,x)=>s+(x.extras100||0),0);
    const notMin=meus.reduce((s,x)=>s+minutosNoturnos(x.punches||[]),0);
    const salario=Number(c.salario||0);
    const vHora=salario? salario/220 : 0;              // hora normal (44h/sem → 220h/mês)
    const vDia =salario? salario/30  : 0;
    // Horas extras: 50% em dia útil, 100% em folga trabalhada (Art. 59 CLT). Gerente pode sobrescrever o valor.
    const extrasCalc=(extrasMin/60)*vHora*1.5 + (extras100Min/60)*vHora*2;
    const ymRef=(ini||hojeStr()).slice(0,7);
    const extraOverride = cltExtraAjuste[c.id+"|"+ymRef];
    const extrasVal = extraOverride!=null ? Number(extraOverride) : extrasCalc;
    const extrasEditado = extraOverride!=null;
    const notVal=(notMin/60)*vHora*0.2;                // adicional noturno 20% (Art. 73 CLT)
    // Descontos lançados no dossiê dentro do período
    const dos=getDossie("clt-"+c.id);
    const faltas=(dos.faltas||[]).filter(x=>x.tipo==="falta" && x.descontar && naData(x.data));
    const atrasosD=(dos.faltas||[]).filter(x=>x.tipo==="atraso" && x.descontar && naData(x.data));
    const descFaltas=faltas.length*vDia;
    const descAtrasos=atrasosD.reduce((s,x)=>s+vHora*(Number(x.horas)||0),0);
    const descontos=descFaltas+descAtrasos;
    const proventos=salario+extrasVal+notVal;
    const liquido=proventos-descontos;
    return { id:c.id, nome:c.nome, foto:c.foto, pix:c.pix, escala:c.escala, salario, vHora,
      extrasMin, extras100Min, extrasHoras:extrasMin+extras100Min, extrasVal, extrasEditado, notMin, notVal,
      descontos, faltasQtd:faltas.length, atrasosQtd:atrasosD.length, liquido, semSalario:!salario };
  });
  const cltFolha=linhasCLT.reduce((s,l)=>s+l.liquido,0);
  const cltExtras=linhasCLT.reduce((s,l)=>s+l.extrasVal,0);
  const cltSalarios=linhasCLT.reduce((s,l)=>s+l.salario,0);

  /* ===================== PAGAMENTO FREELANCERS ===================== */
  const dentroFree=(j)=> naData(j.data) && (uni==="todas"||j.unidade===Number(uni));
  const linhasFree = freelas.map(fr=>{ const js=(fr.jornadasHist||[]).filter(dentroFree);
    return { id:fr.id, nome:fr.nome, pix:fr.pix, dias:js.length, total:js.reduce((s,j)=>s+j.valor,0), datas:js.map(j=>j.data).sort() };
  }).filter(l=>l.dias>0);
  const freeTotal=linhasFree.reduce((s,l)=>s+l.total,0);
  const freeDias=linhasFree.reduce((s,l)=>s+l.dias,0);

  /* ===================== WhatsApp ===================== */
  const whatsCLT=(l)=>`*${l.nome}* (CLT)\nSalário base: ${fmtBRL(l.salario)}\nHoras extras: ${fmtHoras(l.extrasHoras)} = ${fmtBRL(l.extrasVal)}${l.notVal?`\nAdic. noturno: ${fmtBRL(l.notVal)}`:""}${l.descontos?`\nDescontos: -${fmtBRL(l.descontos)}`:""}\n*Líquido a pagar: ${fmtBRL(l.liquido)}*\nPix: ${l.pix||"—"}`;
  const whatsFree=(l)=>`*${l.nome}*\nValor acumulado: ${fmtBRL(l.total)}\nDias trabalhados: ${l.dias}\nDatas: ${fmtD(l.datas)}\nPix: ${l.pix||"—"}`;
  const copiarUm=(txt)=>{ copyText(txt); toast("Copiado para enviar no WhatsApp"); };
  const copiarTodos=()=>{
    if(aba==="clt"){ const txt=`💼 *Folha CLT — ${uNome}*\n_${fmtDataBR(ini)} a ${fmtDataBR(fim)}_\n\n`+linhasCLT.map(whatsCLT).join("\n\n")+`\n\n*Total líquido: ${fmtBRL(cltFolha)}*`;
      copyText(txt); toast(`${linhasCLT.length} colaboradores CLT copiados`); }
    else { const txt=`💰 *Pagamento freelancers — ${uNome}*\n_${fmtDataBR(ini)} a ${fmtDataBR(fim)}_\n\n`+linhasFree.map(whatsFree).join("\n\n")+`\n\n*Total: ${fmtBRL(freeTotal)}* (${freeDias} dias)`;
      copyText(txt); toast(`${linhasFree.length} freelancers copiados`); }
  };

  /* ===================== Excel ===================== */
  const exportarExcel=async()=>{
    if(!window.ExcelJS){ toast("Biblioteca Excel não carregada — verifique a conexão"); return; }
    const wb=new ExcelJS.Workbook();
    const azul="FF6366F1", cinza="FFEEF2FF";
    // --- Aba 1: Folha CLT ---
    const wc=wb.addWorksheet("Folha CLT");
    wc.columns=[{width:30},{width:16},{width:14},{width:18},{width:16},{width:16},{width:18},{width:22}];
    wc.mergeCells("A1:H1"); const tc=wc.getCell("A1"); tc.value=`Folha de fechamento CLT — ${uNome}`; tc.font={bold:true,size:15,color:{argb:"FF1E1B4B"}};
    wc.mergeCells("A2:H2"); wc.getCell("A2").value=`Período: ${fmtDataBR(ini)} a ${fmtDataBR(fim)}`; wc.getCell("A2").font={italic:true,color:{argb:"FF64748B"}};
    const hc=wc.addRow(["Colaborador","Salário base","Horas extras","Valor extras","Adic. noturno","Descontos","Líquido a pagar","Pix"]);
    hc.eachCell(cell=>{ cell.font={bold:true,color:{argb:"FFFFFFFF"}}; cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:azul}}; cell.alignment={horizontal:"center"}; });
    linhasCLT.forEach(l=>{ const r=wc.addRow([l.nome,l.salario,fmtHoras(l.extrasHoras),l.extrasVal,l.notVal,-l.descontos,l.liquido,l.pix||""]);
      [2,4,5,6,7].forEach(i=>r.getCell(i).numFmt='"R$" #,##0.00'); r.getCell(7).font={bold:true}; });
    const tcTot=wc.addRow(["TOTAL",cltSalarios,"",cltExtras,"","",cltFolha,""]); tcTot.eachCell(cell=>{ cell.font={bold:true}; cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:cinza}}; });
    [2,4,7].forEach(i=>tcTot.getCell(i).numFmt='"R$" #,##0.00');
    // --- Aba 2: Pagamento freelancers ---
    const wf=wb.addWorksheet("Freelancers");
    wf.columns=[{width:30},{width:16},{width:20},{width:22},{width:36}];
    wf.mergeCells("A1:E1"); const tf=wf.getCell("A1"); tf.value=`Pagamento freelancers — ${uNome}`; tf.font={bold:true,size:15,color:{argb:"FF1E1B4B"}};
    wf.mergeCells("A2:E2"); wf.getCell("A2").value=`Período: ${fmtDataBR(ini)} a ${fmtDataBR(fim)}`; wf.getCell("A2").font={italic:true,color:{argb:"FF64748B"}};
    const hf=wf.addRow(["Colaborador","Dias trabalhados","Valor a pagar","Pix","Datas trabalhadas"]);
    hf.eachCell(cell=>{ cell.font={bold:true,color:{argb:"FFFFFFFF"}}; cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFEA580C"}}; cell.alignment={horizontal:"center"}; });
    linhasFree.forEach(l=>{ const r=wf.addRow([l.nome,l.dias,l.total,l.pix||"",fmtD(l.datas)]); r.getCell(3).numFmt='"R$" #,##0.00'; r.getCell(3).font={bold:true}; });
    const tfTot=wf.addRow(["TOTAL",freeDias,freeTotal,"",""]); tfTot.eachCell(cell=>{ cell.font={bold:true}; cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFF1E8"}}; }); tfTot.getCell(3).numFmt='"R$" #,##0.00';
    const buf=await wb.xlsx.writeBuffer(); const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=`folha_${uNome.replace(/\s+/g,"-")}_${ini}.xlsx`; a.click(); URL.revokeObjectURL(url);
    toast("Excel gerado: Folha CLT + Freelancers");
  };

  const abas=[["clt","Folha CLT"],["freela","Pagamento freelancers"]];
  return <div className="fade-in">
    <PageHeader title="Relatórios financeiros" sub="Folha CLT (salário + extras) e pagamento de freelancers · filtro por período e casa · Excel · WhatsApp">
      <Btn variant="ghost" icon={I.copy} onClick={copiarTodos}>Copiar p/ WhatsApp</Btn>
      <Btn icon={I.download} onClick={exportarExcel}>Exportar Excel</Btn>
    </PageHeader>
    <div className="flex flex-wrap gap-2 mb-3">
      {abas.map(([k,l])=><button key={k} onClick={()=>setAba(k)} className={cx("px-4 py-2 rounded-xl text-sm font-semibold border transition", aba===k?"grad-brand text-white border-transparent shadow-glow":"bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>{l}</button>)}
    </div>
    <Card className="p-4 mb-4"><div className="flex flex-wrap items-end gap-3">
      <div className="flex items-center gap-2 text-slate-400"><Icon d={I.filter} className="w-4 h-4"/><span className="text-xs font-bold uppercase">Filtros (obrigatórios)</span></div>
      <Field label="De"><Input type="date" value={ini} onChange={e=>setIni(e.target.value)}/></Field>
      <Field label="Até"><Input type="date" value={fim} onChange={e=>setFim(e.target.value)}/></Field>

        <option value="todas">Todas as casas</option>{unidades.map(u=><option key={u.id} value={u.id}>{u.nome}</option>)}
      </Select></Field>

    {aba==="clt" ? <>
      <div className="grid sm:grid-cols-3 gap-3 mb-4">
        <StatCard icon={I.wallet} label="Folha líquida CLT" value={fmtBRL(cltFolha)} tone="brand"/>
        <StatCard icon={I.chart} label="Valor em horas extras" value={fmtBRL(cltExtras)} tone="amber"/>
        <StatCard icon={I.user} label="Colaboradores CLT" value={linhasCLT.length} tone="green"/>
      </div>
      <Card className="overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm min-w-[860px]">
        <thead><tr className="text-left text-slate-400 border-b border-slate-100">{["Colaborador","Salário base","Horas extras","Adic. noturno","Descontos","Líquido a pagar","Pix","WhatsApp"].map(h=><th key={h} className="px-4 py-3 font-semibold">{h}</th>)}</tr></thead>

                {l.extrasEditado && <span className="text-[10px] text-amber-600" title="Ajustado manualmente">editado</span>}
              </div></td>

            <td className={cx("px-4 py-3 tabular-nums",l.descontos>0?"text-rose-600 font-semibold":"text-slate-400")}>{l.descontos>0?"-"+fmtBRL(l.descontos):"—"}</td>
            <td className="px-4 py-3 font-extrabold text-slate-900 tabular-nums">{fmtBRL(l.liquido)}</td>
            <td className="px-4 py-3 font-mono text-xs text-slate-500">{l.pix||"—"}</td>

/* ============================ DOSSIÊ DO COLABORADOR ============================ */

  const [q,setQ]=useState("");
  const [casa,setCasa]=useState("todas");

  const editavel=can("documentos");
  const todos=[...clts.map(c=>({tipo:"clt",p:c})),...freelas.map(f=>({tipo:"free",p:f}))]
    .filter(x=>x.p.nome.toLowerCase().includes(q.toLowerCase()) && (casa==="todas"||x.p.unidade===casa));
  const key = sel && `${sel.tipo}-${sel.p.id}`;
  const dos = sel ? getDossie(key) : {faltas:[],feedbacks:[],anexos:[]};
  // colaborador ATUAL do store (para refletir uploads em tempo real)
  const pAtual = sel ? ((sel.tipo==="clt"?clts:freelas).find(x=>x.id===sel.p.id) || sel.p) : null;
  const docsAtual = pAtual?.docs || {};
  // Atestados enviados pelo COLABORADOR (link) → entram no dossiê em tempo real (abonados)
  const atestadosColab = (sel && atestados) ? atestados.filter(a=> String(a.pid)===String(sel.p.id) || (soD(a.cpf) && pAtual && soD(a.cpf)===soD(pAtual.cpf)))
    .map(a=>({ id:"at_"+(a._docId||a.id), data:a.data||hojeStr(), tipo:"atestado", horas:a.horas||8, obs:a.obs||"Atestado enviado pelo colaborador", anexo:a.anexo, descontar:false, _fromColab:true })) : [];

  const [nf,setNf]=useState({data:hojeStr(),tipo:"falta",horas:8,descontar:true,obs:""});
  const [nb,setNb]=useState({data:hojeStr(),tipo:"elogio",autor:"Gestor",texto:""});
  const salvarFalta=()=>{
    const jaTemData=[...atestadosColab, ...dos.faltas].some(f=>f.data===nf.data);
    if(jaTemData){ toast("Já existe um registro nessa data — cada data deve ser única."); return; }
    addFalta(key,{...nf}); setNf({...nf,obs:""}); toast("Registro adicionado");
  };
  const salvarFeedback=()=>{ if(!nb.texto.trim())return; addFeedback(key,nb); setNb({...nb,texto:""}); toast("Feedback adicionado ao livro de recordações"); };
  const upDocDossie=(k,file)=>{ if(!file) return; const rd=new FileReader();
    rd.onload=async()=>{ const dados=file.type&&file.type.indexOf("image")===0?await compressImg(rd.result):rd.result; anexarDoc(sel.tipo,sel.p.id,k,{nome:file.name,dados}); toast("Documento anexado à pasta"); };
    rd.readAsDataURL(file); };
  const upAnexo=(categoria,file)=>{ if(!file) return; const rd=new FileReader();
    rd.onload=async()=>{ const arquivo=file.type&&file.type.indexOf("image")===0?await compressImg(rd.result):rd.result; addAnexo(key,{categoria,nome:file.name,data:"2026-07-20",arquivo}); toast("Documento adicional anexado"); };
    rd.readAsDataURL(file); };

  // Cada DATA é única no dossiê: remove duplicatas (mantém o 1º — atestado tem prioridade sobre falta)
  const faltasView = (()=>{ const seen=new Set(), out=[]; [...atestadosColab, ...dos.faltas].forEach(f=>{ if(seen.has(f.data)) return; seen.add(f.data); out.push(f); }); return out; })();
  // ===== Cálculo de desconto conforme CLT (precisa do salário mensal do colaborador) =====
  const salarioMensal = Number(pAtual?.salario||0);
  const valorDia = salarioMensal ? salarioMensal/30 : 0;      // valor de 1 dia (falta) = salário ÷ 30
  const valorHora = salarioMensal ? salarioMensal/220 : 0;    // valor da hora (atraso) = salário ÷ 220 (jornada mensal 44h/sem)
  const descontoDe=(f)=>{ if(f.tipo==="atestado" || !f.descontar) return 0;
    if(f.tipo==="atraso") return valorHora*(Number(f.horas)||0);
    return valorDia*((Number(f.horas)||0)/8); }; // falta: proporcional a dias (horas/8)
  const fmtR$=(v)=> v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  const historico = sel ? [
    ...faltasView.map(f=>({t:"Falta/Atestado",data:f.data,desc:`${f.tipo==="atestado"?"Atestado":f.tipo==="atraso"?"Atraso":"Falta"} · ${f.horas}h${f.tipo==="atestado"?" · abonado":f.descontar?" · desconto":""}${f._fromColab?" · via app":""}${f.obs?` — ${f.obs}`:""}`,tone:"amber"})),
    ...dos.feedbacks.map(f=>({t:"Feedback",data:f.data,desc:`${f.tipo} (${f.autor}): ${f.texto}`,tone:"brand"})),
    ...(dos.anexos||[]).map(a=>({t:"Anexo",data:a.data,desc:`${a.categoria}: ${a.nome}`,tone:"brand"})),
  ].sort((a,b)=>b.data.localeCompare(a.data)) : [];

  const extrairPasta=async()=>{
    if(!window.JSZip){ toast("Biblioteca de ZIP não carregada — verifique a conexão"); return; }
    const zip=new JSZip();
    const fAtest=zip.folder("Atestados");
    const fFicha=zip.folder("Ficha de registro");
    const fContrato=zip.folder("Contrato de trabalho");
    const fImg=zip.folder("Imagens dos documentos");
    const fAssin=zip.folder("Documentos assinados");
    // Ficha de registro (dados cadastrais)
    const ficha={ colaborador:pAtual.nome, vinculo:sel.tipo==="clt"?"CLT":"Freelancer", cargo:pAtual.cargo,
      unidade:unidadeNome(pAtual.unidade,unidades), cpf:pAtual.cpf, tipoPix:pAtual.tipoPix, pix:pAtual.pix, banco:pAtual.banco,
      faltas:dos.faltas, feedbacks:dos.feedbacks };
    fFicha.file("ficha_registro.json", JSON.stringify(ficha,null,2));
    // Foto do colaborador (referência facial capturada no cadastro)
    if(pAtual.foto) fImg.file("foto_perfil.jpg", b64ToBytes(pAtual.foto), {binary:true});
    // Imagens dos documentos — grava BYTES REAIS quando enviados; senão gera um PDF válido
    DOC_TIPOS.filter(([k])=>docsAtual[k]).forEach(([k,l])=>{
      const v=docsAtual[k], nome=docNome(v), dados=docDados(v);
      if(dados){ // arquivo real (imagem/pdf) — abre sem falha
        fImg.file(nome, b64ToBytes(dados), {binary:true});
        if(k==="ctps") fAssin.file(nome, b64ToBytes(dados), {binary:true});
      } else { // demonstração — PDF de referência válido
        const pn=nome.replace(/\.[^.]+$/,"")+".pdf";
        const pdf=montarPDF("Documento: "+l, ["Colaborador: "+pAtual.nome, "Arquivo de referência: "+nome, "", "Documento de demonstração — envie o arquivo real no cadastro para", "que a imagem/PDF original seja incluída aqui."]);
        fImg.file(pn, pdf, {binary:true});
        if(k==="ctps") fAssin.file(pn, pdf, {binary:true});
      }
    });
    fContrato.file("contrato_"+pAtual.nome.replace(/\s+/g,"-")+".pdf",
      montarPDF("Contrato de trabalho", ["Colaborador: "+pAtual.nome, "Cargo: "+(pAtual.cargo||"—"), "Unidade: "+unidadeNome(pAtual.unidade,unidades), "Admissão: "+(pAtual.admissao||"—"), "Vínculo: "+(sel.tipo==="clt"?"CLT":"Freelancer")]), {binary:true});
    // Anexos por categoria — bytes reais quando houver; senão PDF válido
    (dos.anexos||[]).forEach(a=>{ const alvo = a.categoria==="atestado"?fAtest : a.categoria==="advertencia"?fAssin : fImg;
      if(a.arquivo){ alvo.file(a.nome, b64ToBytes(a.arquivo), {binary:true}); }
      else { alvo.file(a.nome.replace(/\.[^.]+$/,"")+".pdf", montarPDF("Anexo — "+a.categoria, ["Arquivo: "+a.nome, "Colaborador: "+pAtual.nome, "Data: "+(a.data||"—")]), {binary:true}); }
    });
    const blob=await zip.generateAsync({type:"blob"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=`pasta_${pAtual.nome.replace(/\s+/g,"-")}.zip`; a.click(); URL.revokeObjectURL(url);
    toast("Pasta extraída em .zip (com subpastas)");
  };
  const nDocs=DOC_TIPOS.filter(([k])=>docsAtual[k]).length;

  return <div className="fade-in">
    <PageHeader title="Dossiê do colaborador" sub="Pasta individual · documentos · faltas e atestados · feedbacks (livro de recordações) · histórico exportável"/>
    {!editavel && <div className="mb-4 p-3 rounded-xl bg-amber-50 text-amber-700 text-sm flex items-center gap-2"><Icon d={I.shield} className="w-4 h-4"/> Seu perfil pode consultar, mas não tem permissão para editar documentos/registros.</div>}
    <Card className="p-2 mb-3"><div className="flex items-center gap-2 px-3 py-2">
      <Icon d={I.search} className="w-4 h-4 text-slate-400"/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar colaborador…" className="flex-1 outline-none text-sm bg-transparent"/>
    </div></Card>
    <FiltroCasa casa={casa} setCasa={setCasa} unidades={unidades}/>
    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
      {todos.length===0 && <p className="text-sm text-slate-400 col-span-full text-center py-6">Nenhum colaborador nesta casa.</p>}
      {todos.map(({tipo,p})=>
        <button key={tipo+p.id} onClick={()=>{setSel({tipo,p});setTab("docs");}} className="text-left">
          <Card className="p-4 flex items-center gap-3 hover:border-brand-300 transition">
            <Avatar name={p.nome} src={p.foto} tone={tipo==="clt"?"brand":"free"}/>
            <div className="flex-1 min-w-0"><div className="font-bold text-slate-900 truncate">{p.nome}</div><div className="text-xs text-slate-500">{p.cargo} · {unidadeNome(p.unidade,unidades)}</div></div>
            <Badge tone={tipo==="clt"?"brand":"free"}>{tipo==="clt"?"CLT":"Freela"}</Badge>
          </Card>
        </button>)}
    </div>

    <Modal open={!!sel} onClose={()=>setSel(null)} wide>
      {sel && <div>
        <div className="grad-ink grad-hero p-6 text-white rounded-t-3xl relative">
          <button onClick={()=>setSel(null)} className="absolute top-4 left-4 flex items-center gap-1 text-white/85 hover:text-white text-sm font-semibold"><Icon d={I.arrow} className="w-4 h-4 rotate-180"/>Voltar</button>
          <button onClick={()=>setSel(null)} className="absolute top-4 right-4 text-white/80 hover:text-white"><Icon d={I.x}/></button>
          <div className="flex items-center gap-4 mt-6">
            <button onClick={()=>{ if(pAtual?.foto) setFotoZoom(pAtual.foto); }} className={cx("rounded-2xl overflow-hidden ring-2 ring-white/40 shrink-0", pAtual?.foto&&"cursor-zoom-in hover:ring-white/80 transition")} title={pAtual?.foto?"Ver foto ampliada":""}>
              {pAtual?.foto ? <img src={pAtual.foto} alt={sel.p.nome} className="w-16 h-16 object-cover"/> : <Avatar name={sel.p.nome} tone={sel.tipo==="clt"?"brand":"free"} size="w-16 h-16"/>}
            </button>
            <div className="flex-1 min-w-0"><h3 className="text-2xl font-extrabold truncate">{sel.p.nome}</h3>
              <p className="text-white/80">{sel.p.cargo} · {unidadeNome(sel.p.unidade,unidades)} · {sel.tipo==="clt"?"CLT":"Freelancer"}</p></div>
            <Btn variant="soft" icon={I.download} onClick={extrairPasta}>Extrair pasta</Btn>
          </div>
        </div>
        <div className="px-6 pt-4 flex gap-1 border-b border-slate-100 overflow-x-auto">
          {[["docs","Documentos"],["faltas","Faltas & Atestados"],["fb","Feedbacks"],["hist","Histórico"]].map(([k,l])=>
            <button key={k} onClick={()=>setTab(k)} className={cx("px-4 py-2.5 text-sm font-semibold border-b-2 -mb-px whitespace-nowrap", tab===k?"border-brand-500 text-brand-700":"border-transparent text-slate-400 hover:text-slate-600")}>{l}</button>)}
        </div>
        <div className="p-6">
          {tab==="docs" && <div className="space-y-4">
            <div className="flex items-center justify-between">
              <p className="text-sm text-slate-500 flex items-center gap-1.5"><Icon d={I.doc} className="w-4 h-4 text-brand-500"/> Pasta de arquivos — criptografada (LGPD)</p>
              <Badge tone={nDocs>0?"green":"slate"}>{nDocs}/{DOC_TIPOS.length} enviados</Badge>
            </div>
            <div className="grid sm:grid-cols-2 gap-2">
              {DOC_TIPOS.map(([k,l])=>{ const arq=docsAtual[k];
                return <div key={k} className={cx("flex items-center gap-2.5 p-3 rounded-xl border", arq?"border-emerald-200 bg-emerald-50/40":"border-slate-200")}>
                  <div className={cx("w-9 h-9 rounded-lg grid place-items-center shrink-0", arq?"bg-emerald-100 text-emerald-600":"bg-slate-100 text-slate-400")}><Icon d={I.doc} className="w-4 h-4"/></div>
                  <div className="flex-1 min-w-0"><div className="font-semibold text-slate-800 text-sm">{l}</div>
                    {arq ? <div className="text-xs text-emerald-700 truncate flex items-center gap-1"><Icon d={I.check} className="w-3 h-3"/>{docNome(arq)}</div>
                         : <div className="text-xs text-slate-400">Não enviado</div>}</div>
                  {arq && <Badge tone="green">OK</Badge>}
                  {editavel && <label className="cursor-pointer shrink-0">
                    <span className="inline-flex items-center gap-1 text-xs font-semibold text-brand-700 bg-brand-50 hover:bg-brand-100 px-2.5 py-1.5 rounded-lg"><Icon d={I.upload} className="w-3.5 h-3.5"/>{arq?"Trocar":"Enviar"}</span>
                    <input type="file" accept="image/*,application/pdf" capture="environment" className="hidden" onChange={e=>upDocDossie(k,e.target.files&&e.target.files[0])}/>
                  </label>}
                </div>;})}
            </div>

            {/* Anexos adicionais: atestados, advertências */}
            <div className="pt-2 border-t border-slate-100">
              <div className="flex items-center justify-between mb-2">
                <span className="text-sm font-semibold text-slate-700">Documentos adicionais (atestados, advertências)</span>
                {editavel && <div className="flex gap-1.5">
                  {[["atestado","Atestado"],["advertencia","Advertência"],["outro","Outro"]].map(([cat,lbl])=>
                    <label key={cat} className="cursor-pointer">
                      <span className="inline-flex items-center gap-1 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 px-2.5 py-1.5 rounded-lg"><Icon d={I.plus} className="w-3.5 h-3.5"/>{lbl}</span>
                      <input type="file" accept="image/*,application/pdf" capture="environment" className="hidden" onChange={e=>upAnexo(cat,e.target.files&&e.target.files[0])}/>
                    </label>)}
                </div>}
              </div>
              <div className="space-y-2">
                {(dos.anexos||[]).length===0 && <p className="text-xs text-slate-400 text-center py-3">Nenhum documento adicional anexado.</p>}
                {(dos.anexos||[]).map(a=>
                  <div key={a.id} className="flex items-center gap-2.5 p-2.5 rounded-xl border border-slate-200">
                    <div className="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 grid place-items-center shrink-0"><Icon d={I.doc} className="w-4 h-4"/></div>
                    <div className="flex-1 min-w-0"><div className="text-sm font-semibold text-slate-800 truncate">{a.nome}</div><div className="text-xs text-slate-400">{fmtDataBR(a.data)}</div></div>
                    <Badge tone={a.categoria==="advertencia"?"red":a.categoria==="atestado"?"blue":"slate"}>{a.categoria}</Badge>
                  </div>)}
              </div>
            </div>
          </div>}

          {tab==="faltas" && <div>
            <div className="mb-3 p-3.5 rounded-xl bg-slate-50 border border-slate-100 text-xs text-slate-600">
              <div className="font-bold text-slate-700 mb-1 flex items-center gap-1.5"><Icon d={I.shield} className="w-4 h-4 text-brand-500"/>Como o desconto é calculado (CLT)</div>
              <ul className="space-y-0.5 list-disc pl-4">
                <li><b>Falta injustificada:</b> desconta o dia = <b>salário ÷ 30</b> por dia (proporcional às horas ÷ 8). Pode ainda gerar perda do <b>DSR</b> da semana (Lei 605/49).</li>
                <li><b>Atraso:</b> não desconta por padrão; se marcado, desconto = <b>salário ÷ 220 × horas</b> (jornada mensal de 44h/sem).</li>
                <li><b>Atestado:</b> falta justificada — <b>dia abonado</b>, sem desconto.</li>
              </ul>
              {!salarioMensal && <div className="mt-2 text-amber-600 font-semibold flex items-center gap-1"><Icon d={I.x} className="w-3.5 h-3.5"/>Defina o <b>salário mensal</b> no cadastro do colaborador para calcular os valores.</div>}
              {!!salarioMensal && <div className="mt-2 text-slate-400">Base: salário R$ {fmtR$(salarioMensal)} · dia R$ {fmtR$(valorDia)} · hora R$ {fmtR$(valorHora)}</div>}
            </div>
            {editavel && <Card className="p-4 mb-4 bg-slate-50/60">
              <div className="grid sm:grid-cols-4 gap-2 items-end">
                <Field label="Data"><Input type="date" value={nf.data} onChange={e=>setNf({...nf,data:e.target.value})}/></Field>
                <Field label="Tipo"><Select value={nf.tipo} onChange={e=>{ const t=e.target.value; setNf({...nf,tipo:t,descontar: t==="falta"}); }}><option value="falta">Falta</option><option value="atraso">Atraso</option><option value="atestado">Atestado (abona)</option></Select></Field>
                <Field label="Horas"><Input type="number" value={nf.horas} onChange={e=>setNf({...nf,horas:Number(e.target.value)})}/></Field>
                {nf.tipo==="atestado"
                  ? <div className="flex items-center gap-2 text-sm pb-2.5 text-emerald-600 font-semibold"><Icon d={I.check} className="w-4 h-4"/> Abonado</div>
                  : <label className="flex items-center gap-2 text-sm pb-2.5"><input type="checkbox" checked={nf.descontar} onChange={e=>setNf({...nf,descontar:e.target.checked})}/> Descontar {nf.tipo==="atraso"&&<span className="text-slate-400 text-xs">(opcional)</span>}</label>}
              </div>
              <div className="flex gap-2 mt-2"><Input value={nf.obs} onChange={e=>setNf({...nf,obs:e.target.value})} placeholder="Observação (opcional)"/><Btn icon={I.plus} onClick={salvarFalta}>Registrar</Btn></div>
            </Card>}
            <div className="space-y-2">
              {faltasView.length===0 && <p className="text-sm text-slate-400 text-center py-4">Nenhuma falta, atraso ou atestado registrado.</p>}
              {faltasView.map(f=>{ const lbl=f.tipo==="atestado"?"Atestado":f.tipo==="atraso"?"Atraso":"Falta"; const abona=f.tipo==="atestado";
                const desc=descontoDe(f);
                return <div key={f.id} className="flex items-center gap-3 p-3 rounded-xl border border-slate-200">
                  <Badge tone={abona?"blue":f.tipo==="atraso"?"slate":"amber"}>{lbl}</Badge>
                  <div className="flex-1"><div className="text-sm font-semibold text-slate-800">{fmtDataBR(f.data)} · {f.horas}h {f.obs&&`— ${f.obs}`} {f._fromColab&&<Badge tone="brand">via app</Badge>}</div>
                    {f.anexo&&<a href={f.anexo.dados} download={f.anexo.nome} className="text-xs text-brand-600 hover:underline flex items-center gap-1 mt-0.5"><Icon d={I.doc} className="w-3 h-3"/>{f.anexo.nome||"documento"}</a>}</div>
                  {abona?<Badge tone="blue">Abonado</Badge>
                    : !f.descontar?<Badge tone="green">Sem desconto</Badge>
                    : salarioMensal?<Badge tone="red">Desconto R$ {fmtR$(desc)}</Badge>
                    : <Badge tone="amber">Defina o salário</Badge>}
                </div>;})}
            </div>
          </div>}

          {tab==="fb" && <div>
            <p className="text-sm text-slate-500 mb-3">Livro de recordações: elogios, pontos de atenção e anotações comportamentais.</p>
            {editavel && <Card className="p-4 mb-4 bg-slate-50/60">
              <div className="grid sm:grid-cols-3 gap-2">
                <Field label="Data"><Input type="date" value={nb.data} onChange={e=>setNb({...nb,data:e.target.value})}/></Field>
                <Field label="Tipo"><Select value={nb.tipo} onChange={e=>setNb({...nb,tipo:e.target.value})}><option value="elogio">Elogio</option><option value="atenção">Atenção</option><option value="nota">Nota</option></Select></Field>
                <Field label="Autor"><Input value={nb.autor} onChange={e=>setNb({...nb,autor:e.target.value})}/></Field>
              </div>
              <div className="flex gap-2 mt-2"><Input value={nb.texto} onChange={e=>setNb({...nb,texto:e.target.value})} placeholder="Escreva o feedback…"/><Btn icon={I.plus} onClick={salvarFeedback}>Adicionar</Btn></div>
            </Card>}
            <div className="space-y-2">
              {dos.feedbacks.length===0 && <p className="text-sm text-slate-400 text-center py-4">Nenhum feedback ainda.</p>}
              {dos.feedbacks.map(f=>
                <div key={f.id} className="p-3 rounded-xl border border-slate-200">
                  <div className="flex items-center gap-2 mb-1"><Badge tone={f.tipo==="elogio"?"green":f.tipo==="atenção"?"amber":"slate"}>{f.tipo}</Badge><span className="text-xs text-slate-400">{fmtDataBR(f.data)} · {f.autor}</span></div>
                  <p className="text-sm text-slate-700">{f.texto}</p>
                </div>)}
            </div>
          </div>}

          {tab==="hist" && <div>
            <div className="flex justify-end mb-3"><Btn size="sm" variant="ghost" icon={I.download} onClick={extrairPasta}>Exportar histórico</Btn></div>
            <div className="space-y-2">
              {historico.length===0 && <p className="text-sm text-slate-400 text-center py-4">Sem registros no histórico.</p>}
              {historico.map((h,i)=>
                <div key={i} className="flex gap-3 p-3 rounded-xl bg-slate-50">
                  <div className={cx("w-2 rounded-full", h.tone==="amber"?"bg-amber-400":"bg-brand-400")}/>
                  <div className="flex-1"><div className="text-xs text-slate-400">{fmtDataBR(h.data)} · {h.t}</div><div className="text-sm text-slate-700">{h.desc}</div></div>
                </div>)}
            </div>
          </div>}
        </div>
      </div>}
    </Modal>

    {/* Foto ampliada em tela cheia */}
    {fotoZoom && <div className="fixed inset-0 z-[60] bg-black/85 flex items-center justify-center p-4" onClick={()=>setFotoZoom(null)}>
      <button className="absolute top-5 right-5 w-11 h-11 rounded-xl bg-white/15 text-white grid place-items-center hover:bg-white/25"><Icon d={I.x}/></button>
      <img src={fotoZoom} alt="foto" className="max-w-full max-h-full rounded-2xl object-contain shadow-2xl" onClick={e=>e.stopPropagation()}/>
    </div>}
  </div>;
}

/* ============================ EQUIPE & PERMISSÕES ============================ */
function Equipe() {
  const { perfil, setPerfil, perms, setPerms, can } = useStore();
  const toast=useContext(ToastCtx);
  const [membros,setMembros]=useState([
    {id:1,nome:"Wilami Gestor",papel:"proprietario",email:"gestor@wilami.com",unid:"Todas"},

function MembroCriar({onClose}) {
  const { unidades, tenantAtual, acessosOps } = useStore();
  const toast=useContext(ToastCtx);
  const [nome,setNome]=useState("");
  const [login,setLogin]=useState("");
  const [senha,setSenha]=useState("");
  const [uni,setUni]=useState("todas");
  const [criando,setCriando]=useState(false);
  const [feito,setFeito]=useState(null);
  const gerar=()=>setSenha(Math.random().toString(36).slice(2,8)+Math.floor(Math.random()*90+10));
  const nomeUni=(u)=> (u==null||u==="todas")?"Todas as casas":((unidades.find(x=>String(x.id)===String(u))||{}).nome||"Casa");
  const criar=async()=>{
    if(!window.__WPDB){ toast("Recurso disponível no modo online (com banco)."); return; }
    if(!login.trim()){ toast("Informe o login (e-mail ou usuário) do gerente."); return; }
    if(senha && senha.length<6){ toast("A senha precisa ter ao menos 6 caracteres."); return; }
    setCriando(true);
    try{
      let jaExiste=false;
      if(senha){ const r=await criarUsuarioAuth(login,senha); jaExiste=!!r.jaExiste; }
      await acessosOps.set(login,{tenant:tenantAtual, unidade:uni, nome, papel:"gerente"});
      setFeito({ login:emailDeLogin(login), senha, casa:nomeUni(uni), jaExiste, semSenha:!senha });
      toast(jaExiste?"Conta já existia — vínculo salvo":"Acesso do gerente criado");
    }catch(e){ const c=e&&e.code; toast(c==="auth/invalid-email"?"E-mail inválido.":c==="auth/weak-password"?"Senha muito fraca (mín. 6).":"Não foi possível criar o acesso agora."); }
    setCriando(false);
  };
  const copiar=()=>{ if(!feito) return; copyText(`Acesso ao Wilami Ponto\nLink: ${location.origin}/\nLogin: ${feito.login}${feito.senha?`\nSenha: ${feito.senha}`:""}\nCasa: ${feito.casa}\n\nEntre em "Acesso do gestor" com esses dados.`); toast("Credenciais copiadas p/ WhatsApp"); };
  return <div className="p-6">
    <div className="flex items-center justify-between mb-1"><h3 className="text-lg font-bold text-slate-900">Criar acesso de gerente</h3>
      <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon d={I.x}/></button></div>
    <p className="text-sm text-slate-500 mb-4">Cria o login e a senha do gerente — <b>não envia e-mail</b>. Ele vê e gerencia apenas a casa escolhida.</p>
    {!feito ? <>
      <div className="space-y-3">
        <Field label="Nome do gerente"><Input value={nome} onChange={e=>setNome(e.target.value)} placeholder="Ex.: João Silva"/></Field>
        <Field label="Login (e-mail ou usuário)"><Input value={login} onChange={e=>setLogin(e.target.value)} placeholder="ex.: joao ou joao@email.com"/></Field>
        <Field label="Senha (mín. 6)"><div className="flex gap-2"><Input value={senha} onChange={e=>setSenha(e.target.value)} placeholder="defina uma senha"/><Btn variant="ghost" size="sm" onClick={gerar}>Gerar</Btn></div></Field>
        <Field label="Casa (unidade) que ele cuida"><Select value={uni} onChange={e=>setUni(e.target.value)}>
          <option value="todas">Todas as casas</option>{unidades.map(u=><option key={u.id} value={u.id}>{u.nome}</option>)}
        </Select></Field>
      </div>
      <div className="flex gap-2 mt-6"><Btn variant="ghost" className="flex-1" onClick={onClose}>Cancelar</Btn>
        <Btn className="flex-1" icon={I.user} disabled={criando} onClick={criar}>{criando?"Criando…":"Criar acesso"}</Btn></div>
    </> : <>
      <div className="p-4 rounded-xl bg-emerald-50 border border-emerald-100">
        <div className="flex items-center gap-2 text-emerald-700 font-bold text-sm mb-2"><Icon d={I.check} className="w-4 h-4"/>{feito.jaExiste?"Conta já existia — vínculo salvo":feito.semSenha?"Vínculo salvo (sem criar senha)":"Acesso criado com sucesso"}</div>
        <div className="text-sm text-slate-700 space-y-0.5">
          <div>Link: <b>{location.origin}/</b></div>
          <div>Login: <b>{feito.login}</b></div>
          {feito.senha && <div>Senha: <b>{feito.senha}</b></div>}
          <div>Casa: <b>{feito.casa}</b></div>
        </div>
        <Btn className="mt-3" size="sm" variant="soft" icon={I.copy} onClick={copiar}>Copiar credenciais p/ WhatsApp</Btn>
      </div>
      <div className="flex gap-2 mt-5"><Btn variant="ghost" className="flex-1" onClick={onClose}>Fechar</Btn>
        <Btn className="flex-1" icon={I.plus} onClick={()=>{setFeito(null);setNome("");setLogin("");setSenha("");setUni("todas");}}>Criar outro</Btn></div>
    </>}
  </div>;
}

/* ============================ AJUSTES DE PONTO (aprovação do gestor) ============================ */
function AjustesPonto(){
  const { ajustes, resolverAjuste, addRegistro } = useStore();
  const toast=useContext(ToastCtx);
  const [aba,setAba]=useState("pendente"); // pendente | resolvidos
  const [editHora,setEditHora]=useState({}); // {docId: "HH:MM"}
  const pend=(ajustes||[]).filter(a=>a.status==="pendente"||!a.status);
  const lista=(ajustes||[]).filter(a=> aba==="pendente" ? (a.status==="pendente"||!a.status) : a.status!=="pendente");
  const aprovar=(a, horaOverride)=>{
    const hora = horaOverride || a.hora || "08:00";
    const [hh,mm]=hora.split(":").map(Number); const min=(hh||0)*60+(mm||0);
    addRegistro({ nome:a.nome, pid:a.pid, cpf:a.cpf, tipo:a.tipo, acao:a.acao, unidade:a.unidade, hora:hora+":00", min, data:a.data, dia:a.data, geo:true, selfie:false, foto:null, ajuste:true });
    resolverAjuste(a._docId||a.id, {status:"aprovado", horaFinal:hora, resolvidoTs:new Date().getTime()});
    toast("Ajuste aprovado e lançado no ponto");
  };
  const recusar=(a)=>{ resolverAjuste(a._docId||a.id, {status:"recusado", resolvidoTs:new Date().getTime()}); toast("Solicitação recusada"); };
  return <div className="fade-in">
    <PageHeader title="Ajustes de ponto" sub="Solicitações de correção enviadas pelos colaboradores · aprovar, ajustar o horário ou recusar"/>
    <div className="inline-flex p-1 bg-slate-100 rounded-xl mb-4">
      {[["pendente","Pendentes ("+pend.length+")"],["resolvidos","Resolvidos"]].map(([k,l])=>
        <button key={k} onClick={()=>setAba(k)} className={cx("px-5 py-2 rounded-lg text-sm font-semibold transition", aba===k?"grad-brand text-white shadow-glow":"text-slate-500 hover:text-slate-700")}>{l}</button>)}
    </div>
    <div className="space-y-3">
      {lista.length===0 && <Card className="p-8 text-center text-slate-400 text-sm">{aba==="pendente"?"Nenhuma solicitação pendente. 👍":"Nenhum ajuste resolvido ainda."}</Card>}
      {lista.map(a=>{ const editing=editHora[a._docId]!==undefined; const pendente=a.status==="pendente"||!a.status;
        return <Card key={a._docId} className="p-4">
          <div className="flex items-start gap-3 flex-wrap">
            <Avatar name={a.nome} tone={a.tipo==="clt"?"brand":"free"}/>
            <div className="flex-1 min-w-[180px]">
              <div className="font-bold text-slate-900 flex items-center gap-2">{a.nome} <Badge tone={a.tipo==="clt"?"brand":"free"}>{a.tipo==="clt"?"CLT":"Freela"}</Badge></div>
              <div className="text-sm text-slate-600 mt-0.5"><b>{a.acaoLabel||a.acao}</b> · {fmtDataBR(a.data)} · <b className="tabular-nums">{a.hora}</b>{a.unidade?` · ${a.unidade}`:""}</div>
              <div className="text-xs text-slate-500 mt-1">Motivo: {a.motivo||"—"}</div>
            </div>
            {pendente
              ? (editing
                ? <div className="flex items-center gap-1"><input type="time" value={editHora[a._docId]} onChange={e=>setEditHora(h=>({...h,[a._docId]:e.target.value}))} className="px-2 py-1.5 rounded-lg border border-slate-300 text-sm"/><Btn size="sm" icon={I.check} onClick={()=>{aprovar(a, editHora[a._docId]); setEditHora(h=>{const n={...h};delete n[a._docId];return n;});}}>Salvar</Btn></div>
                : <div className="flex gap-2 flex-wrap">
                    <Btn size="sm" variant="primary" icon={I.check} onClick={()=>aprovar(a)}>Aprovar</Btn>
                    <Btn size="sm" variant="ghost" icon={I.edit} onClick={()=>setEditHora(h=>({...h,[a._docId]:a.hora}))}>Ajustar hora</Btn>
                    <Btn size="sm" variant="ghost" className="text-rose-500" icon={I.x} onClick={()=>recusar(a)}>Recusar</Btn>
                  </div>)
              : <Badge tone={a.status==="aprovado"?"green":"red"}>{a.status==="aprovado"?("Aprovado"+(a.horaFinal?" · "+a.horaFinal:"")):"Recusado"}</Badge>}
          </div>
        </Card>; })}
    </div>
  </div>;
}
