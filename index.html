/* ============================ RELATÓRIOS FINANCEIROS ============================ */
function Financeiro() {
  const { freelasComPagamentos:freelas, clts, pjs, pagamentosPJ, unidades, registros, pontoHist, getDossie, cltExtraAjuste, setCltExtra, gorjetasCLT, setGorjetaCLT, acesso, escala, escalaOv, atestados, faltaDescontoDesde, vtDiaPagamento } = useStore();
  const podeSigilo = !acesso || acesso.podeSigilo;   // sem contexto (offline) → mostra tudo
  const _clock=useClock(60000);
  const toast=useContext(ToastCtx);
  const [aba,setAba]=useState("clt");                 // "clt" (folha) | "freela" (pagamentos)
  const _mr=mesAtualRange();
  const [ini,setIni]=useState(_mr.ini);
  const [fim,setFim]=useState(_mr.fim);
  const [uni,setUni]=useState(unidades[0]?.id ?? "todas");
  const uNome = uni==="todas"?"Todas as casas":unidadeNome(Number(uni),unidades);
  const naData=(d)=> (!ini||d>=ini) && (!fim||d<=fim);
  const fmtD=(ds)=>ds.map(d=>d.slice(8,10)+"/"+d.slice(5,7)).join(", ");

  /* ===================== FOLHA CLT / FREELA FIXO (salário mensal + extras) ===================== */
  // Apuração REAL das batidas no período (extras normais, extras 100% em folga e adicional noturno).
  const apurCLT = apurarHoras([...pontoHist, ...registros]).filter(x=>x.tipo==="clt" && x.completo && naData(x.dia));
  const ymRef=(ini||hojeStr()).slice(0,7);
  const _nowMin=_clock.getHours()*60+_clock.getMinutes();
  const faltasCtx={ escala, escalaOv, registros:[...pontoHist,...registros], atestados, ini, fim, hoje:hojeStr(), nowMin:_nowMin, desde:faltaDescontoDesde };
  const folhaCtx={ apurCLT, cltExtraAjuste, gorjetasCLT, ymRef, getDossie, naData, faltasCtx };
  const folhaDe=(lista)=> lista.filter(c=>uni==="todas"||c.unidade===Number(uni)).map(c=>calcFolhaLinha(c, folhaCtx));
  const cltsReais = clts.filter(c=>c.vinculo!=="fixo" && c.vinculo!=="confianca");
  const fixos = clts.filter(c=>c.vinculo==="fixo");
  const linhasCLTreais = folhaDe(cltsReais);
  const linhasFixo = folhaDe(fixos);
  // linhas exibidas conforme a aba (clt = folha CLT; fixo = folha freela fixo)
  const linhasCLT = aba==="fixo" ? linhasFixo : linhasCLTreais;
  const cltFolha=linhasCLT.reduce((s,l)=>s+l.liquido,0);
  const cltExtras=linhasCLT.reduce((s,l)=>s+l.extrasVal,0);
  const cltSalarios=linhasCLT.reduce((s,l)=>s+l.salario,0);
  const cltVT=linhasCLT.reduce((s,l)=>s+(l.vt||0),0);
  const cltGorjetas=linhasCLT.reduce((s,l)=>s+(l.gorjeta||0),0);
  const cltReposicao=linhasCLT.reduce((s,l)=>s+(l.reposicao||0),0);

  /* ===================== GERÊNCIA & DIRETORIA (cargo de confiança, sem ponto) ===================== */
  // Salário mensal fixo, sem apuração de ponto. Filtro por casa considera "todas as casas".
  const confs = clts.filter(c=>c.vinculo==="confianca" && (uni==="todas"||c.unidade===Number(uni)||c.unidade==="todas"||c.unidade==null));
  const linhasConf = confs.map(c=>({ id:c.id, nome:c.nome, foto:c.foto, cargo:c.cargo, pix:c.pix, salario:Number(c.salario||0),
    sigiloso:!!c.sigiloso, oculto:(!!c.sigiloso && !podeSigilo), semSalario:!Number(c.salario||0),
    unidade:(c.unidade==="todas"||c.unidade==null)?"Todas as casas":unidadeNome(c.unidade,unidades) }))
    .sort((a,b)=>b.salario-a.salario);
  // Total da folha de confiança conta apenas o que o usuário PODE ver (linhas sigilosas ocultas não somam).
  const confFolhaVisivel = linhasConf.filter(l=>!l.oculto).reduce((s,l)=>s+l.salario,0);
  const confOcultos = linhasConf.filter(l=>l.oculto).length;

  /* ===================== PAGAMENTO FREELANCERS ===================== */
  const dentroFree=(j)=> naData(j.data) && (uni==="todas"||j.unidade===Number(uni));
  const daCasa=(fr)=> uni==="todas" || Number(fr.unidade)===Number(uni);
  const linhasFree = freelas.map(fr=>{ const js=(fr.jornadasHist||[]).filter(dentroFree);
    return { id:fr.id, nome:fr.nome, pix:fr.pix, unidade:fr.unidade, dias:js.length, total:js.reduce((s,j)=>s+j.valor,0), datas:js.map(j=>j.data).sort() };
  // mostra quem trabalhou no período E também os freelancers cadastrados na casa (mesmo sem jornada), p/ a folha nunca ficar vazia sem explicação
  }).filter(l=> l.dias>0 || daCasa(l)).sort((a,b)=>b.total-a.total);
  const freeTotal=linhasFree.reduce((s,l)=>s+l.total,0);
  const freeDias=linhasFree.reduce((s,l)=>s+l.dias,0);

  /* ===================== PRESTADORES PJ (valor mensal, sem ponto) ===================== */
  const ymIni=(ini||hojeStr()).slice(0,7);
  const linhasPJ = (pjs||[]).filter(pj=>pjAtivoNoPeriodo(pj,ini,fim) && (uni==="todas"||pj.unidade===Number(uni)||pj.unidade==="todas"||pj.unidade==null)).map(pj=>{
    const meses=pjMesesNoPeriodo(pj,ini,fim); const total=Number(pj.valor||0)*meses.length;
    const pago=(pagamentosPJ[String(pj.id)]||[]).filter(p=>{ const r=p.ref||p.data||""; return naData(r) || r.slice(0,7)===ymIni; }).reduce((s2,p)=>s2+Number(p.valor||0),0);
    return { id:pj.id, nome:pj.nome, cnpj:pj.cnpj||"", servico:pj.servico||"Prestação de serviço", pix:pj.pix||"", banco:pj.banco||"", forma:pj.formaPagamento||"Pix",
      valorMensal:Number(pj.valor||0), meses:meses.length, total, pago, saldo:total-pago, venc:pjVencimento(pj,ymIni), dia:pj.diaPagamento,
      unidade:(pj.unidade==="todas"||pj.unidade==null)?"Todas as casas":unidadeNome(pj.unidade,unidades), semValor:!Number(pj.valor||0) };
  }).sort((a,b)=>b.total-a.total);
  const pjTotal=linhasPJ.reduce((s2,l)=>s2+l.total,0);
  const pjPago=linhasPJ.reduce((s2,l)=>s2+l.pago,0);

  /* ===================== RESUMO GERAL (custo total de pessoal no período) ===================== */
  const _liq=(ls)=>ls.reduce((s2,l)=>s2+l.liquido,0);
  const resumo=[["clt","Folha CLT",_liq(linhasCLTreais)],["fixo","Freela Fixo",_liq(linhasFixo)],["confianca","Gerência & Diretoria",confFolhaVisivel],["freela","Freelancers",freeTotal],["pj","Prestadores PJ",pjTotal]];
  const custoTotal=resumo.reduce((s2,r)=>s2+r[2],0);

  /* ===================== WhatsApp ===================== */
  const rotuloFolha = aba==="fixo"?"Freela Fixo":"CLT";
  const whatsCLT=(l)=>`*${l.nome}* (${rotuloFolha})\nSalário base: ${fmtBRL(l.salario)}\nHoras extras: ${fmtHoras(l.extrasHoras)} = ${fmtBRL(l.extrasVal)}${l.notVal?`\nAdic. noturno: ${fmtBRL(l.notVal)}`:""}${l.gorjeta?`\nGorjetas: ${fmtBRL(l.gorjeta)}`:""}${l.reposicao?`\nReposição (salário combinado ${fmtBRL(l.combinado)}): +${fmtBRL(l.reposicao)}`:""}${l.vt?`\nVale Transporte: ${fmtBRL(l.vt)} (desconto 6%: -${fmtBRL(l.vtDesconto)})`:""}${l.faltasQtd?`\nFaltas: ${l.faltasQtd} = -${fmtBRL(l.descFaltas)}`:""}${l.dsrQtd?`\nDSR perdido (${l.dsrQtd} sem.): -${fmtBRL(l.descDSR)}`:""}${l.descontos?`\nDescontos totais: -${fmtBRL(l.descontos)}`:""}\n*Líquido a pagar: ${fmtBRL(l.liquido)}*\nPix: ${l.pix||"—"}`;
  const whatsFree=(l)=>`*${l.nome}*\nValor acumulado: ${fmtBRL(l.total)}\nDias trabalhados: ${l.dias}\nDatas: ${fmtD(l.datas)}\nPix: ${l.pix||"—"}`;
  const whatsPJ=(l)=>`*${l.nome}* (PJ${l.cnpj?" · CNPJ "+l.cnpj:""})\nServiço: ${l.servico}\nValor: ${fmtBRL(l.total)}${l.meses>1?` (${l.meses} meses × ${fmtBRL(l.valorMensal)})`:""}\nVencimento: ${l.venc?fmtDataBR(l.venc):"—"} · ${l.forma}\nPix: ${l.pix||"—"}`;
  const whatsConf=(l)=>`*${l.nome}* (${l.cargo})\nSalário mensal: ${fmtBRL(l.salario)}\nPix: ${l.pix||"—"}`;
  const copiarUm=(txt)=>{ copyText(txt); toast("Copiado para enviar no WhatsApp"); };
  const copiarTodos=()=>{
    if(aba==="clt"||aba==="fixo"){ const txt=`💼 *Folha ${rotuloFolha} — ${uNome}*\n_${fmtDataBR(ini)} a ${fmtDataBR(fim)}_\n\n`+linhasCLT.map(whatsCLT).join("\n\n")+`\n\n*Total líquido: ${fmtBRL(cltFolha)}*`;
      copyText(txt); toast(`${linhasCLT.length} lançamentos copiados`); }
    else if(aba==="confianca"){ const vis=linhasConf.filter(l=>!l.oculto);
      const txt=`🛡️ *Gerência & Diretoria — ${uNome}*\n\n`+vis.map(whatsConf).join("\n\n")+`\n\n*Total: ${fmtBRL(confFolhaVisivel)}*`+(confOcultos>0?`\n\n_(${confOcultos} pagamento(s) sigiloso(s) não incluídos)_`:"");
      copyText(txt); toast(`${vis.length} cargo(s) de confiança copiados`); }
    else if(aba==="pj"){ const txt=`🤝 *Prestadores PJ — ${uNome}*\n_${fmtDataBR(ini)} a ${fmtDataBR(fim)}_\n\n`+linhasPJ.map(whatsPJ).join("\n\n")+`\n\n*Total: ${fmtBRL(pjTotal)}*`;
      copyText(txt); toast(`${linhasPJ.length} prestador(es) PJ copiados`); }
    else { const txt=`💰 *Pagamento freelancers — ${uNome}*\n_${fmtDataBR(ini)} a ${fmtDataBR(fim)}_\n\n`+linhasFree.map(whatsFree).join("\n\n")+`\n\n*Total: ${fmtBRL(freeTotal)}* (${freeDias} dias)`;
      copyText(txt); toast(`${linhasFree.length} freelancers copiados`); }
  };

  /* ===================== Excel ===================== */
  const exportarExcel=async()=>{
    if(!window.ExcelJS){ toast("Biblioteca Excel não carregada — verifique a conexão"); return; }
    const wb=new ExcelJS.Workbook();
    const cinza="FFEEF2FF";
    // helper: escreve uma folha (CLT ou Freela Fixo) com salário + extras
    const addFolha=(nomeAba,titulo,linhas,cabecor)=>{
      const wc=wb.addWorksheet(nomeAba);
      wc.columns=[{width:30},{width:16},{width:14},{width:18},{width:16},{width:14},{width:16},{width:16},{width:18},{width:22}];
      wc.mergeCells("A1:J1"); const tc=wc.getCell("A1"); tc.value=`${titulo} — ${uNome}`; tc.font={bold:true,size:15,color:{argb:"FF1E1B4B"}};
      wc.mergeCells("A2:J2"); wc.getCell("A2").value=`Período: ${fmtDataBR(ini)} a ${fmtDataBR(fim)}`; wc.getCell("A2").font={italic:true,color:{argb:"FF64748B"}};
      const hc=wc.addRow(["Colaborador","Salário base","Horas extras","Valor extras","Adic. noturno","Gorjetas","Reposição","Descontos","Líquido a pagar","Pix"]);
      hc.eachCell(cell=>{ cell.font={bold:true,color:{argb:"FFFFFFFF"}}; cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:cabecor}}; cell.alignment={horizontal:"center"}; });
      linhas.forEach(l=>{ const r=wc.addRow([l.nome,l.salario,fmtHoras(l.extrasHoras),l.extrasVal,l.notVal,l.gorjeta||0,l.reposicao||0,-l.descontos,l.liquido,l.pix||""]);
        [2,4,5,6,7,8,9].forEach(i=>r.getCell(i).numFmt='"R$" #,##0.00'); r.getCell(9).font={bold:true}; });
      const T=linhas.reduce((s,l)=>s+l.liquido,0), S=linhas.reduce((s,l)=>s+l.salario,0), E=linhas.reduce((s,l)=>s+l.extrasVal,0);
      const RP=linhas.reduce((s,l)=>s+(l.reposicao||0),0);
      const tot=wc.addRow(["TOTAL",S,"",E,"","",RP,"",T,""]); tot.eachCell(cell=>{ cell.font={bold:true}; cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:cinza}}; });
      [2,4,7,9].forEach(i=>tot.getCell(i).numFmt='"R$" #,##0.00');
    };
    addFolha("Folha CLT","Folha de fechamento CLT",linhasCLTreais,"FF6366F1");
    addFolha("Freela Fixo","Folha Freela Fixo",linhasFixo,"FFEA580C");
    // --- Aba: Pagamento freelancers ---
    const wf=wb.addWorksheet("Freelancers");
    wf.columns=[{width:30},{width:16},{width:20},{width:22},{width:36}];
    wf.mergeCells("A1:E1"); const tf=wf.getCell("A1"); tf.value=`Pagamento freelancers — ${uNome}`; tf.font={bold:true,size:15,color:{argb:"FF1E1B4B"}};
    wf.mergeCells("A2:E2"); wf.getCell("A2").value=`Período: ${fmtDataBR(ini)} a ${fmtDataBR(fim)}`; wf.getCell("A2").font={italic:true,color:{argb:"FF64748B"}};
    const hf=wf.addRow(["Colaborador","Dias trabalhados","Valor a pagar","Pix","Datas trabalhadas"]);
    hf.eachCell(cell=>{ cell.font={bold:true,color:{argb:"FFFFFFFF"}}; cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFEA580C"}}; cell.alignment={horizontal:"center"}; });
    linhasFree.forEach(l=>{ const r=wf.addRow([l.nome,l.dias,l.total,l.pix||"",fmtD(l.datas)]); r.getCell(3).numFmt='"R$" #,##0.00'; r.getCell(3).font={bold:true}; });
    const tfTot=wf.addRow(["TOTAL",freeDias,freeTotal,"",""]); tfTot.eachCell(cell=>{ cell.font={bold:true}; cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFF1E8"}}; }); tfTot.getCell(3).numFmt='"R$" #,##0.00';
    // --- Aba: Gerência & Diretoria (cargo de confiança) — pagamentos sigilosos ocultos p/ quem não é diretor/financeira ---
    if(linhasConf.length){
      const wg=wb.addWorksheet("Gerencia e Diretoria");
      wg.columns=[{width:30},{width:20},{width:18},{width:18},{width:24}];
      wg.mergeCells("A1:E1"); const tg=wg.getCell("A1"); tg.value=`Gerência & Diretoria — ${uNome}`; tg.font={bold:true,size:15,color:{argb:"FF1E1B4B"}};
      const hg=wg.addRow(["Nome","Cargo","Casa","Salário mensal","Pix"]);
      hg.eachCell(cell=>{ cell.font={bold:true,color:{argb:"FFFFFFFF"}}; cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF4338CA"}}; cell.alignment={horizontal:"center"}; });
      linhasConf.forEach(l=>{ const r=wg.addRow([l.nome,l.cargo,l.unidade, l.oculto?"(sigiloso)":l.salario, l.oculto?"":(l.pix||"")]); if(!l.oculto){ r.getCell(4).numFmt='"R$" #,##0.00'; r.getCell(4).font={bold:true}; } });
      const gTot=wg.addRow(["TOTAL"+(podeSigilo?"":" (visível)"),"","",confFolhaVisivel,""]); gTot.eachCell(cell=>{ cell.font={bold:true}; cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFEEF2FF"}}; }); gTot.getCell(4).numFmt='"R$" #,##0.00';
    }
    // --- Aba: Prestadores PJ ---
    if(linhasPJ.length){
      const wp=wb.addWorksheet("Prestadores PJ");
      wp.columns=[{width:32},{width:22},{width:26},{width:20},{width:16},{width:10},{width:16},{width:16},{width:16},{width:14},{width:26}];
      wp.mergeCells("A1:K1"); const tp=wp.getCell("A1"); tp.value=`Prestadores PJ — ${uNome}`; tp.font={bold:true,size:15,color:{argb:"FF1E3E1D"}};
      wp.mergeCells("A2:K2"); wp.getCell("A2").value=`Período: ${fmtDataBR(ini)} a ${fmtDataBR(fim)}`; wp.getCell("A2").font={italic:true,color:{argb:"FF64748B"}};
      const hp=wp.addRow(["Prestador","CNPJ","Serviço","Casa","Valor mensal","Meses","Valor do período","Pago","Saldo","Vencimento","Pix / forma"]);
      hp.eachCell(cell=>{ cell.font={bold:true,color:{argb:"FFFFFFFF"}}; cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF0369A1"}}; cell.alignment={horizontal:"center"}; });
      linhasPJ.forEach(l=>{ const r=wp.addRow([l.nome,l.cnpj,l.servico,l.unidade,l.valorMensal,l.meses,l.total,l.pago,l.saldo,l.venc?fmtDataBR(l.venc):"",(l.pix||"")+" · "+l.forma]);
        [5,7,8,9].forEach(i=>r.getCell(i).numFmt='"R$" #,##0.00'); r.getCell(7).font={bold:true}; });
      const pt=wp.addRow(["TOTAL","","","","","",pjTotal,pjPago,pjTotal-pjPago,"",""]); pt.eachCell(cell=>{ cell.font={bold:true}; cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFE0F2FE"}}; }); [7,8,9].forEach(i=>pt.getCell(i).numFmt='"R$" #,##0.00');
    }
    // --- Aba: Resumo geral ---
    const wr=wb.addWorksheet("Resumo geral");
    wr.columns=[{width:30},{width:20},{width:12}];
    wr.mergeCells("A1:C1"); wr.getCell("A1").value=`Custo de pessoal — ${uNome}`; wr.getCell("A1").font={bold:true,size:15,color:{argb:"FF1E3E1D"}};
    wr.mergeCells("A2:C2"); wr.getCell("A2").value=`Período: ${fmtDataBR(ini)} a ${fmtDataBR(fim)}`; wr.getCell("A2").font={italic:true,color:{argb:"FF64748B"}};
    const hr=wr.addRow(["Categoria","Valor","%"]); hr.eachCell(cell=>{ cell.font={bold:true,color:{argb:"FFFFFFFF"}}; cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF2F6F2A"}}; });
    resumo.forEach(([,l,v])=>{ const r=wr.addRow([l,v,custoTotal?v/custoTotal:0]); r.getCell(2).numFmt='"R$" #,##0.00'; r.getCell(3).numFmt='0.0%'; });
    const rt=wr.addRow(["TOTAL"+(podeSigilo?"":" (visível)"),custoTotal,1]); rt.eachCell(cell=>{ cell.font={bold:true}; }); rt.getCell(2).numFmt='"R$" #,##0.00'; rt.getCell(3).numFmt='0.0%';
    const buf=await wb.xlsx.writeBuffer(); const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=`folha_${uNome.replace(/\s+/g,"-")}_${ini}.xlsx`; a.click(); URL.revokeObjectURL(url);
    toast("Excel gerado: Folha CLT + Freela Fixo + Freelancers + Diretoria + PJ + Resumo geral");
  };

  const abas=[["clt","Folha CLT"],["fixo","Freela Fixo"],["confianca","Gerência & Diretoria"],["freela","Pagamento freelancers"],["pj","Prestadores PJ"]];
  return <div className="fade-in">
    <PageHeader title="Relatórios financeiros" sub="Folha CLT · Freela Fixo · Gerência & Diretoria · freelancers · prestadores PJ · filtro por período e casa · Excel · WhatsApp">
      <Btn variant="ghost" icon={I.copy} onClick={copiarTodos}>Copiar p/ WhatsApp</Btn>
      <Btn icon={I.download} onClick={exportarExcel}>Exportar Excel</Btn>
    </PageHeader>
    <div className="flex flex-wrap gap-2 mb-3">
      {abas.map(([k,l])=><button key={k} onClick={()=>setAba(k)} className={cx("px-4 py-2 rounded-xl text-sm font-semibold border transition", aba===k?"grad-brand text-white border-transparent shadow-glow":"bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>{l}</button>)}
    </div>
    <Card className="p-4 mb-4"><div className="flex flex-wrap items-end gap-3">
      <div className="flex items-center gap-2 text-slate-400"><Icon d={I.filter} className="w-4 h-4"/><span className="text-xs font-bold uppercase">Filtros (obrigatórios)</span></div>
      <Field label="De"><Input type="date" value={ini} onChange={e=>setIni(e.target.value)}/></Field>
      <Field label="Até"><Input type="date" value={fim} onChange={e=>setFim(e.target.value)}/></Field>
      <Field label="Casa (unidade)"><Select value={uni} onChange={e=>setUni(e.target.value)}>
        <option value="todas">Todas as casas</option>{unidades.map(u=><option key={u.id} value={u.id}>{u.nome}</option>)}
      </Select></Field>
    </div></Card>

    <Card className="p-4 mb-4">
      <div className="flex flex-wrap items-baseline justify-between gap-2 mb-3">
        <div className="text-xs font-bold text-slate-400 uppercase tracking-wide">Custo total de pessoal · {uNome}</div>
        <div className="text-2xl font-extrabold text-slate-900 tabular-nums">{fmtBRL(custoTotal)}{!podeSigilo && confOcultos>0 && <span className="text-xs font-semibold text-slate-400 ml-1">(visível)</span>}</div>
      </div>
      {custoTotal>0 && <div className="flex h-2.5 rounded-full overflow-hidden bg-slate-100 mb-3">
        {resumo.map(([k,,v],i)=> v>0 && <div key={k} style={{width:(v/custoTotal*100)+"%", background:["#2f6f2a","#d39520","#64748b","#e7b136","#0369a1"][i]}} title={k}/>)}
      </div>}
      <div className="grid grid-cols-2 md:grid-cols-5 gap-2">
        {resumo.map(([k,l,v],i)=><button key={k} onClick={()=>setAba(k)} className={cx("text-left p-2.5 rounded-xl border transition", aba===k?"border-brand-300 bg-brand-50/50":"border-slate-100 hover:bg-slate-50")}>
          <div className="flex items-center gap-1.5 text-xs text-slate-500"><span className="w-2 h-2 rounded-full" style={{background:["#2f6f2a","#d39520","#64748b","#e7b136","#0369a1"][i]}}/>{l}</div>
          <div className="font-bold text-slate-900 tabular-nums text-sm mt-0.5">{fmtBRL(v)}</div>
          <div className="text-[11px] text-slate-400">{custoTotal?Math.round(v/custoTotal*100):0}% do total</div>
        </button>)}
      </div>
    </Card>

    {aba==="pj" ? <>
      <div className="grid sm:grid-cols-3 gap-3 mb-4">
        <StatCard icon={I.wallet} label="Total PJ no período" value={fmtBRL(pjTotal)} tone="blue"/>
        <StatCard icon={I.check} label="Já pago" value={fmtBRL(pjPago)} tone="green"/>
        <StatCard icon={I.briefcase} label="Prestadores PJ" value={linhasPJ.length} tone="brand"/>
      </div>
      <Card className="overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm min-w-[860px]">
        <thead><tr className="text-left text-slate-400 border-b border-slate-100">{["Prestador","Serviço","Casa","Valor mensal","Valor do período","Pago","Vencimento","Pix","WhatsApp"].map(h=><th key={h} className="px-4 py-3 font-semibold">{h}</th>)}</tr></thead>
        <tbody className="divide-y divide-slate-50">
          {linhasPJ.map(l=>{ const venc=l.saldo>0&&l.venc&&l.venc<hojeStr(); return <tr key={l.id} className="hover:bg-slate-50/70">
            <td className="px-4 py-3"><div className="flex items-center gap-2"><Avatar name={l.nome} tone="slate" size="w-7 h-7"/><div><div className="font-semibold text-slate-800">{l.nome}</div><div className="text-[11px] text-slate-400 font-mono">{l.cnpj||"—"}</div>{l.semValor&&<div className="text-[11px] text-amber-600">defina o valor no cadastro</div>}</div></div></td>
            <td className="px-4 py-3 text-slate-600">{l.servico}</td>
            <td className="px-4 py-3 text-slate-600">{l.unidade}</td>
            <td className="px-4 py-3 tabular-nums text-slate-700">{fmtBRL(l.valorMensal)}</td>
            <td className="px-4 py-3 font-extrabold text-slate-900 tabular-nums">{fmtBRL(l.total)}{l.meses>1&&<div className="text-[10px] font-normal text-slate-400">{l.meses} meses</div>}</td>
            <td className="px-4 py-3 tabular-nums text-emerald-600">{l.pago>0?fmtBRL(l.pago):"—"}</td>
            <td className={cx("px-4 py-3 text-xs font-semibold", l.saldo<=0?"text-emerald-600":venc?"text-rose-600":"text-slate-600")}>{l.saldo<=0?"Pago":l.venc?(venc?"Vencido ":"")+fmtDataBR(l.venc):"—"}<div className="font-normal text-slate-400">{l.forma}</div></td>
            <td className="px-4 py-3 font-mono text-xs text-slate-500">{l.pix||"—"}</td>
            <td className="px-4 py-3"><Btn size="sm" variant="soft" icon={I.copy} onClick={()=>copiarUm(whatsPJ(l))}>Copiar</Btn></td>
          </tr>; })}
          {linhasPJ.length===0 && <tr><td colSpan="9" className="px-4 py-8 text-center text-slate-400">Nenhum prestador PJ ativo neste período/casa. Cadastre em “Prestadores PJ”.</td></tr>}
        </tbody>
        {linhasPJ.length>0 && <tfoot><tr className="border-t-2 border-slate-100 bg-slate-50/60"><td className="px-4 py-3 font-bold" colSpan="4">Total</td><td className="px-4 py-3 font-extrabold text-sky-700 tabular-nums">{fmtBRL(pjTotal)}</td><td className="px-4 py-3 font-bold text-emerald-600 tabular-nums">{fmtBRL(pjPago)}</td><td colSpan="3"/></tr></tfoot>}
      </table></div></Card>
      <p className="text-xs text-slate-400 mt-3">Valor mensal do contrato × meses de vigência no período. Registre os pagamentos (inclusive parciais) em <b>Pagamentos → Prestadores PJ</b>.</p>
    </> : (aba==="clt"||aba==="fixo") ? <>
      <div className="grid sm:grid-cols-3 gap-3 mb-4">
        <StatCard icon={I.wallet} label={aba==="fixo"?"Folha líquida Freela Fixo":"Folha líquida CLT"} value={fmtBRL(cltFolha)} tone={aba==="fixo"?"free":"brand"}/>
        <StatCard icon={I.chart} label="Valor em horas extras" value={fmtBRL(cltExtras)} tone="amber"/>
        <StatCard icon={I.refresh} label="Reposição (salário combinado)" value={fmtBRL(cltReposicao)} tone={cltReposicao>0?"amber":"green"}/>
      </div>
      <Card className="overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm min-w-[1100px]">
        <thead><tr className="text-left text-slate-400 border-b border-slate-100">{["Colaborador","Salário base","Horas extras","Adic. noturno","Gorjetas","Reposição","VT","Descontos","Líquido a pagar","Pix","WhatsApp"].map(h=><th key={h} className="px-4 py-3 font-semibold">{h}</th>)}</tr></thead>
        <tbody className="divide-y divide-slate-50">
          {linhasCLT.map(l=><tr key={l.id} className="hover:bg-slate-50/70">
            <td className="px-4 py-3"><div className="flex items-center gap-2"><Avatar name={l.nome} src={l.foto} tone="brand" size="w-7 h-7"/><div><div className="font-semibold text-slate-800">{l.nome}</div>{l.semSalario && <div className="text-[11px] text-amber-600">defina o salário no cadastro</div>}</div></div></td>
            <td className="px-4 py-3 tabular-nums text-slate-700">{fmtBRL(l.salario)}</td>
            <td className="px-4 py-3 tabular-nums">
              <div className="flex items-center gap-1.5"><span className="font-semibold text-slate-800">{fmtHoras(l.extrasHoras)}</span>
                <span className="text-slate-400 text-xs">R$</span>
                <input type="number" defaultValue={Math.round(l.extrasVal*100)/100} key={l.extrasVal} onBlur={e=>setCltExtra(l.id,(ini||hojeStr()).slice(0,7), e.target.value)} title="Valor das horas extras (editável)" className={cx("w-20 px-2 py-1 rounded-lg border text-sm", l.extrasEditado?"border-amber-300 bg-amber-50":"border-slate-200")}/>
                {l.extrasEditado && <span className="text-[10px] text-amber-600" title="Ajustado manualmente">editado</span>}
              </div></td>
            <td className="px-4 py-3 tabular-nums text-slate-600">{l.notVal>0?fmtBRL(l.notVal):"—"}</td>
            <td className="px-4 py-3 tabular-nums"><div className="flex items-center gap-1"><span className="text-slate-400 text-xs">R$</span>
              <input type="number" min="0" defaultValue={l.gorjeta||""} key={"g"+l.id+ymRef+l.gorjeta} placeholder="0" onBlur={e=>setGorjetaCLT(l.id,ymRef,e.target.value)} title="Gorjetas do mês" className="w-20 px-2 py-1 rounded-lg border border-slate-200 text-sm"/></div></td>
            <td className="px-4 py-3 tabular-nums" title={l.combinado>0?`Combinado ${fmtBRL(l.combinado)} − recebido ${fmtBRL(l.recebido)} (salário + extras + noturno + gorjetas)`:""}>
              {l.combinado>0 ? (l.reposicao>0 ? <div><span className="font-bold text-amber-600 whitespace-nowrap">+{fmtBRL(l.reposicao)}</span><div className="text-[10px] text-slate-400">combinado {fmtBRL(l.combinado)}</div></div>
                : <div><span className="text-emerald-600 text-xs font-semibold">atingiu</span><div className="text-[10px] text-slate-400">combinado {fmtBRL(l.combinado)}</div></div>) : <span className="text-slate-300">—</span>}</td>
            <td className="px-4 py-3 tabular-nums text-slate-600">{l.vt>0?<div><span className="text-slate-700 font-semibold">{fmtBRL(l.vt)}</span><div className="text-[10px] font-normal text-slate-400">−6% = {fmtBRL(l.vtDesconto)}</div></div>:"—"}</td>
            <td className={cx("px-4 py-3 tabular-nums",l.descontos>0?"text-rose-600 font-semibold":"text-slate-400")} title={l.descontos>0?`${l.faltasQtd} falta(s)=-${fmtBRL(l.descFaltas)} · DSR ${l.dsrQtd} sem.=-${fmtBRL(l.descDSR)}${l.vtDesconto>0?` · VT 6%=-${fmtBRL(l.vtDesconto)}`:""}`:""}>
              {l.descontos>0?"-"+fmtBRL(l.descontos):"—"}
              {(l.faltasQtd>0||l.dsrQtd>0||l.vtDesconto>0) && <div className="text-[10px] font-normal text-rose-400">{l.faltasQtd>0?`${l.faltasQtd} falta`:""}{l.dsrQtd>0?` +${l.dsrQtd} DSR`:""}{l.vtDesconto>0?`${l.faltasQtd>0||l.dsrQtd>0?" +":""}VT`:""}</div>}
            </td>
            <td className="px-4 py-3 font-extrabold text-slate-900 tabular-nums">{fmtBRL(l.liquido)}</td>
            <td className="px-4 py-3 font-mono text-xs text-slate-500">{l.pix||"—"}</td>
            <td className="px-4 py-3"><Btn size="sm" variant="soft" icon={I.copy} onClick={()=>copiarUm(whatsCLT(l))}>Copiar</Btn></td>
          </tr>)}
          {linhasCLT.length===0 && <tr><td colSpan="11" className="px-4 py-8 text-center text-slate-400">Nenhum {aba==="fixo"?"freela fixo":"colaborador CLT"} nesta casa.</td></tr>}
        </tbody>
        {linhasCLT.length>0 && <tfoot><tr className="border-t-2 border-slate-100 bg-slate-50/60">
          <td className="px-4 py-3 font-bold">Total</td><td className="px-4 py-3 font-bold tabular-nums">{fmtBRL(cltSalarios)}</td>
          <td className="px-4 py-3 font-bold text-emerald-700 tabular-nums">{fmtBRL(cltExtras)}</td><td/>
          <td className="px-4 py-3 font-bold text-slate-600 tabular-nums">{cltGorjetas>0?fmtBRL(cltGorjetas):""}</td>
          <td className="px-4 py-3 font-bold text-amber-600 tabular-nums">{cltReposicao>0?fmtBRL(cltReposicao):""}</td>
          <td className="px-4 py-3 font-bold text-slate-600 tabular-nums">{cltVT>0?fmtBRL(cltVT):""}</td>
          <td/><td className="px-4 py-3 font-extrabold text-brand-700 tabular-nums">{fmtBRL(cltFolha)}</td><td colSpan="2"/></tr></tfoot>}
      </table></div></Card>
      <p className="text-xs text-slate-400 mt-3">{aba==="fixo"?"Freela Fixo: salário mensal definido pelo gerente + extras (50% dia útil, 100% folga) e adicional noturno 20%. ":"Extras: 50% em dia útil e 100% em folga trabalhada (Art. 59) · adicional noturno 20% entre 22h e 5h (Art. 73) · base da hora = salário ÷ 220. "}O valor das horas extras é editável. Gorjetas: lance o valor do mês de cada um. Reposição = salário combinado com a Diretoria − (salário + extras + adicional noturno + gorjetas), quando faltar; ela já entra no líquido (as gorjetas não, pois são repassadas à parte). Cadastre em “Colaboradores CLT & Freela Fixo”.</p>
      {cltVT>0 && <div className="mt-2 p-3 rounded-xl bg-brand-50 text-brand-700 text-xs flex items-center gap-2"><Icon d={I.wallet} className="w-4 h-4"/> Vale Transporte: total de {fmtBRL(cltVT)} no período · desconto legal de 6% já aplicado no líquido · <b>pagamento no dia {vtDiaPagamento} de cada mês</b> (ajuste em Configurações).</div>}
    </> : aba==="confianca" ? <>
      <div className="grid sm:grid-cols-3 gap-3 mb-4">
        <StatCard icon={I.wallet} label="Folha da diretoria/gerência" value={fmtBRL(confFolhaVisivel)} tone="brand"/>
        <StatCard icon={I.user} label="Cargos de confiança" value={linhasConf.length} tone="green"/>
        <StatCard icon={I.shield} label="Pagamentos sigilosos" value={linhasConf.filter(l=>l.sigiloso).length} tone="amber"/>
      </div>
      {!podeSigilo && confOcultos>0 && <div className="mb-3 p-3 rounded-xl bg-amber-50 text-amber-700 text-xs flex items-center gap-2"><Icon d={I.shield} className="w-4 h-4"/> {confOcultos} pagamento(s) de diretoria estão <b>ocultos</b> — o valor é visível apenas para o Diretor e a Diretora Financeira.</div>}
      <Card className="overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm min-w-[680px]">
        <thead><tr className="text-left text-slate-400 border-b border-slate-100">{["Nome","Cargo","Casa","Salário mensal","Pix",""].map(h=><th key={h} className="px-4 py-3 font-semibold">{h}</th>)}</tr></thead>
        <tbody className="divide-y divide-slate-50">
          {linhasConf.map(l=><tr key={l.id} className="hover:bg-slate-50/70">
            <td className="px-4 py-3"><div className="flex items-center gap-2"><Avatar name={l.nome} src={l.foto} tone="slate" size="w-7 h-7"/><span className="font-semibold text-slate-800">{l.nome}</span>{l.sigiloso&&<Badge tone="amber">sigiloso</Badge>}</div></td>
            <td className="px-4 py-3 text-slate-600">{l.cargo}</td>
            <td className="px-4 py-3 text-slate-600">{l.unidade}</td>
            <td className="px-4 py-3 font-extrabold text-slate-900 tabular-nums">
              {l.oculto ? <span className="inline-flex items-center gap-1 text-slate-400 font-semibold"><Icon d={I.lock||I.shield} className="w-3.5 h-3.5"/>••••••</span>
                : (l.semSalario ? <span className="text-amber-600 text-xs font-semibold">defina o salário no cadastro</span> : fmtBRL(l.salario))}
            </td>
            <td className="px-4 py-3 font-mono text-xs text-slate-500">{l.oculto?"—":(l.pix||"—")}</td>
            <td className="px-4 py-3">{!l.oculto && <Btn size="sm" variant="soft" icon={I.copy} onClick={()=>copiarUm(whatsConf(l))}>Copiar</Btn>}</td>
          </tr>)}
          {linhasConf.length===0 && <tr><td colSpan="6" className="px-4 py-8 text-center text-slate-400">Nenhum cargo de confiança cadastrado. Cadastre em “Colaboradores CLT & Freela Fixo” → “Cargo de confiança”.</td></tr>}
        </tbody>
        {linhasConf.length>0 && <tfoot><tr className="border-t-2 border-slate-100 bg-slate-50/60">
          <td className="px-4 py-3 font-bold" colSpan="3">Total {podeSigilo?"":"(visível)"}</td>
          <td className="px-4 py-3 font-extrabold text-brand-700 tabular-nums">{fmtBRL(confFolhaVisivel)}</td><td colSpan="2"/></tr></tfoot>}
      </table></div></Card>
      <p className="text-xs text-slate-400 mt-3">Cargos de confiança (gerentes/diretoria) não batem ponto: recebem salário mensal fixo. Os pagamentos marcados como <b>sigilosos</b> só têm o valor visível para o Diretor e a Diretora Financeira.</p>
    </> : <>
      <div className="grid sm:grid-cols-3 gap-3 mb-4">
        <StatCard icon={I.wallet} label="Total a pagar (freelas)" value={fmtBRL(freeTotal)} tone="free"/>
        <StatCard icon={I.calendar} label="Dias trabalhados" value={freeDias} tone="brand"/>
        <StatCard icon={I.coffee} label="Freelancers" value={linhasFree.length} tone="green"/>
      </div>
      <Card className="overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm min-w-[640px]">
        <thead><tr className="text-left text-slate-400 border-b border-slate-100">{["Colaborador","Dias trab.","Valor a pagar","Datas trabalhadas","Pix","WhatsApp"].map(h=><th key={h} className="px-4 py-3 font-semibold">{h}</th>)}</tr></thead>
        <tbody className="divide-y divide-slate-50">
          {linhasFree.map(l=><tr key={l.id} className="hover:bg-slate-50/70">
            <td className="px-4 py-3"><div className="flex items-center gap-2"><Avatar name={l.nome} tone="free" size="w-7 h-7"/><span className="font-semibold text-slate-800">{l.nome}</span></div></td>
            <td className="px-4 py-3">{l.dias}</td>
            <td className="px-4 py-3 font-bold text-slate-900 tabular-nums">{fmtBRL(l.total)}</td>
            <td className="px-4 py-3 text-xs text-slate-500 max-w-[220px]">{fmtD(l.datas)}</td>
            <td className="px-4 py-3 font-mono text-xs text-slate-500">{l.pix||"—"}</td>
            <td className="px-4 py-3"><Btn size="sm" variant="soft" icon={I.copy} onClick={()=>copiarUm(whatsFree(l))}>Copiar</Btn></td>
          </tr>)}
          {linhasFree.length===0 && <tr><td colSpan="6" className="px-4 py-8 text-center text-slate-400">Sem lançamentos no filtro selecionado.</td></tr>}
        </tbody>
        {linhasFree.length>0 && <tfoot><tr className="border-t-2 border-slate-100 bg-slate-50/60"><td className="px-4 py-3 font-bold">Total</td><td className="px-4 py-3 font-bold">{freeDias}</td><td className="px-4 py-3 font-extrabold text-free-700 tabular-nums">{fmtBRL(freeTotal)}</td><td colSpan="3"/></tr></tfoot>}
      </table></div></Card>
    </>}
  </div>;
}

/* ============================ DOSSIÊ DO COLABORADOR ============================ */
function Dossie() {
  const { clts, freelas, unidades, dossie, getDossie, addFalta, addFeedback, addAnexo, anexarDoc, can, atestados, arquivos } = useStore();
  const arqDoc=(v)=> v && typeof v==="object" && v.arquivoId ? arquivos.find(a=>a.id===v.arquivoId) : null;
  const soD=(s)=>(s||"").replace(/\D/g,"");
  const toast=useContext(ToastCtx);
  const [sel,setSel]=useState(null); // {tipo,pessoa}
  const [tab,setTab]=useState("docs");
  const [q,setQ]=useState("");
  const [casa,setCasa]=useState("todas");
  const [fotoZoom,setFotoZoom]=useState(null); // foto ampliada em tela cheia
  const editavel=can("documentos");
  const todos=[...clts.map(c=>({tipo:"clt",p:c})),...freelas.map(f=>({tipo:"free",p:f}))]
    .filter(x=>x.p.nome.toLowerCase().includes(q.toLowerCase()) && (casa==="todas"||x.p.unidade===casa));
  const key = sel && `${sel.tipo}-${sel.p.id}`;
  const dos = sel ? getDossie(key) : {faltas:[],feedbacks:[],anexos:[]};
  // colaborador ATUAL do store (para refletir uploads em tempo real)
  const pAtual = sel ? ((sel.tipo==="clt"?clts:freelas).find(x=>x.id===sel.p.id) || sel.p) : null;
  const docsAtual = pAtual?.docs || {};
  // Atestados enviados pelo COLABORADOR (link) → entram no dossiê em tempo real (abonados)
  const atestadosColab = (sel && atestados) ? atestados.filter(a=> String(a.pid)===String(sel.p.id) || (soD(a.cpf) && pAtual && soD(a.cpf)===soD(pAtual.cpf)))
    .map(a=>({ id:"at_"+(a._docId||a.id), data:a.data||hojeStr(), tipo:"atestado", horas:a.horas||8, obs:a.obs||"Atestado enviado pelo colaborador", anexo:a.anexo, descontar:false, _fromColab:true })) : [];

  const [nf,setNf]=useState({data:hojeStr(),tipo:"falta",horas:8,descontar:true,obs:""});
  const [nb,setNb]=useState({data:hojeStr(),tipo:"elogio",autor:"Gestor",texto:""});
  const salvarFalta=()=>{
    const jaTemData=[...atestadosColab, ...dos.faltas].some(f=>f.data===nf.data);
    if(jaTemData){ toast("Já existe um registro nessa data — cada data deve ser única."); return; }
    addFalta(key,{...nf}); setNf({...nf,obs:""}); toast("Registro adicionado");
  };
  const salvarFeedback=()=>{ if(!nb.texto.trim())return; addFeedback(key,nb); setNb({...nb,texto:""}); toast("Feedback adicionado ao livro de recordações"); };
  const upDocDossie=(k,file)=>{ if(!file) return; const rd=new FileReader();
    rd.onload=async()=>{ const dados=file.type&&file.type.indexOf("image")===0?await compressImg(rd.result):rd.result; anexarDoc(sel.tipo,sel.p.id,k,{nome:file.name,dados}); toast("Documento anexado à pasta"); };
    rd.readAsDataURL(file); };
  const upAnexo=(categoria,file)=>{ if(!file) return; const rd=new FileReader();
    rd.onload=async()=>{ const arquivo=file.type&&file.type.indexOf("image")===0?await compressImg(rd.result):rd.result; addAnexo(key,{categoria,nome:file.name,data:"2026-07-20",arquivo}); toast("Documento adicional anexado"); };
    rd.readAsDataURL(file); };

  // Cada DATA é única no dossiê: remove duplicatas (mantém o 1º — atestado tem prioridade sobre falta)
  const faltasView = (()=>{ const seen=new Set(), out=[]; [...atestadosColab, ...dos.faltas].forEach(f=>{ if(seen.has(f.data)) return; seen.add(f.data); out.push(f); }); return out; })();
  // ===== Cálculo de desconto conforme CLT (precisa do salário mensal do colaborador) =====
  const salarioMensal = Number(pAtual?.salario||0);
  const valorDia = salarioMensal ? salarioMensal/30 : 0;      // valor de 1 dia (falta) = salário ÷ 30
  const valorHora = salarioMensal ? salarioMensal/220 : 0;    // valor da hora (atraso) = salário ÷ 220 (jornada mensal 44h/sem)
  const descontoDe=(f)=>{ if(f.tipo==="atestado" || !f.descontar) return 0;
    if(f.tipo==="atraso") return valorHora*(Number(f.horas)||0);
    return valorDia*((Number(f.horas)||0)/8); }; // falta: proporcional a dias (horas/8)
  const fmtR$=(v)=> v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  const historico = sel ? [
    ...faltasView.map(f=>({t:"Falta/Atestado",data:f.data,desc:`${f.tipo==="atestado"?"Atestado":f.tipo==="atraso"?"Atraso":"Falta"} · ${f.horas}h${f.tipo==="atestado"?" · abonado":f.descontar?" · desconto":""}${f._fromColab?" · via app":""}${f.obs?` — ${f.obs}`:""}`,tone:"amber"})),
    ...dos.feedbacks.map(f=>({t:"Feedback",data:f.data,desc:`${f.tipo} (${f.autor}): ${f.texto}`,tone:"brand"})),
    ...(dos.anexos||[]).map(a=>({t:"Anexo",data:a.data,desc:`${a.categoria}: ${a.nome}`,tone:"brand"})),
  ].sort((a,b)=>b.data.localeCompare(a.data)) : [];

  const extrairPasta=async()=>{
    if(!window.JSZip){ toast("Biblioteca de ZIP não carregada — verifique a conexão"); return; }
    const zip=new JSZip();
    const fAtest=zip.folder("Atestados");
    const fFicha=zip.folder("Ficha de registro");
    const fContrato=zip.folder("Contrato de trabalho");
    const fImg=zip.folder("Imagens dos documentos");
    const fAssin=zip.folder("Documentos assinados");
    // Ficha de registro (dados cadastrais)
    const ficha={ ...(pAtual.ficha||{}), colaborador:pAtual.nome, vinculo:sel.tipo==="clt"?"CLT":"Freelancer", cargo:pAtual.cargo,
      unidade:unidadeNome(pAtual.unidade,unidades), cpf:pAtual.cpf, tipoPix:pAtual.tipoPix, pix:pAtual.pix, banco:pAtual.banco,
      faltas:dos.faltas, feedbacks:dos.feedbacks };
    fFicha.file("ficha_registro.json", JSON.stringify(ficha,null,2));
    // Foto do colaborador (referência facial capturada no cadastro)
    if(pAtual.foto) fImg.file("foto_perfil.jpg", b64ToBytes(pAtual.foto), {binary:true});
    // Imagens dos documentos — grava BYTES REAIS quando enviados; senão gera um PDF válido
    for(const [k,l] of DOC_TIPOS.filter(([k])=>docsAtual[k])){
      const v=docsAtual[k], nome=docNome(v), meta=arqDoc(v), dados=docDados(v) || (meta ? await arqConteudo(meta).catch(()=>null) : null);
      if(dados){ // arquivo real (imagem/pdf) — abre sem falha
        fImg.file(nome, b64ToBytes(dados), {binary:true});
        if(k==="ctps") fAssin.file(nome, b64ToBytes(dados), {binary:true});
      } else { // demonstração — PDF de referência válido
        const pn=nome.replace(/\.[^.]+$/,"")+".pdf";
        const pdf=montarPDF("Documento: "+l, ["Colaborador: "+pAtual.nome, "Arquivo de referência: "+nome, "", "Documento de demonstração — envie o arquivo real no cadastro para", "que a imagem/PDF original seja incluída aqui."]);
        fImg.file(pn, pdf, {binary:true});
        if(k==="ctps") fAssin.file(pn, pdf, {binary:true});
      }
    }
    fContrato.file("contrato_"+pAtual.nome.replace(/\s+/g,"-")+".pdf",
      montarPDF("Contrato de trabalho", ["Colaborador: "+pAtual.nome, "Cargo: "+(pAtual.cargo||"—"), "Unidade: "+unidadeNome(pAtual.unidade,unidades), "Admissão: "+(pAtual.admissao||"—"), "Vínculo: "+(sel.tipo==="clt"?"CLT":"Freelancer")]), {binary:true});
    // Anexos por categoria — bytes reais quando houver; senão PDF válido
    (dos.anexos||[]).forEach(a=>{ const alvo = a.categoria==="atestado"?fAtest : a.categoria==="advertencia"?fAssin : fImg;
      if(a.arquivo){ alvo.file(a.nome, b64ToBytes(a.arquivo), {binary:true}); }
      else { alvo.file(a.nome.replace(/\.[^.]+$/,"")+".pdf", montarPDF("Anexo — "+a.categoria, ["Arquivo: "+a.nome, "Colaborador: "+pAtual.nome, "Data: "+(a.data||"—")]), {binary:true}); }
    });
    const blob=await zip.generateAsync({type:"blob"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=`pasta_${pAtual.nome.replace(/\s+/g,"-")}.zip`; a.click(); URL.revokeObjectURL(url);
    toast("Pasta extraída em .zip (com subpastas)");
  };
  const nDocs=DOC_TIPOS.filter(([k])=>docsAtual[k]).length;

  return <div className="fade-in">
    <PageHeader title="Dossiê do colaborador" sub="Pasta individual · documentos · faltas e atestados · feedbacks (livro de recordações) · histórico exportável"/>
    {!editavel && <div className="mb-4 p-3 rounded-xl bg-amber-50 text-amber-700 text-sm flex items-center gap-2"><Icon d={I.shield} className="w-4 h-4"/> Seu perfil pode consultar, mas não tem permissão para editar documentos/registros.</div>}
    <Card className="p-2 mb-3"><div className="flex items-center gap-2 px-3 py-2">
      <Icon d={I.search} className="w-4 h-4 text-slate-400"/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar colaborador…" className="flex-1 outline-none text-sm bg-transparent"/>
    </div></Card>
    <FiltroCasa casa={casa} setCasa={setCasa} unidades={unidades}/>
    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
      {todos.length===0 && <p className="text-sm text-slate-400 col-span-full text-center py-6">Nenhum colaborador nesta casa.</p>}
      {todos.map(({tipo,p})=>
        <button key={tipo+p.id} onClick={()=>{setSel({tipo,p});setTab("docs");}} className="text-left">
          <Card className="p-4 flex items-center gap-3 hover:border-brand-300 transition">
            <Avatar name={p.nome} src={p.foto} tone={tipo==="clt"?"brand":"free"}/>
            <div className="flex-1 min-w-0"><div className="font-bold text-slate-900 truncate">{p.nome}</div><div className="text-xs text-slate-500">{p.cargo} · {unidadeNome(p.unidade,unidades)}</div></div>
            <Badge tone={tipo==="clt"?"brand":"free"}>{tipo==="clt"?"CLT":"Freela"}</Badge>
          </Card>
        </button>)}
    </div>

    <Modal open={!!sel} onClose={()=>setSel(null)} wide>
      {sel && <div>
        <div className="grad-ink grad-hero p-6 text-white rounded-t-3xl relative">
          <button onClick={()=>setSel(null)} className="absolute top-4 left-4 flex items-center gap-1 text-white/85 hover:text-white text-sm font-semibold"><Icon d={I.arrow} className="w-4 h-4 rotate-180"/>Voltar</button>
          <button onClick={()=>setSel(null)} className="absolute top-4 right-4 text-white/80 hover:text-white"><Icon d={I.x}/></button>
          <div className="flex items-center gap-4 mt-6">
            <button onClick={()=>{ if(pAtual?.foto) setFotoZoom(pAtual.foto); }} className={cx("rounded-2xl overflow-hidden ring-2 ring-white/40 shrink-0", pAtual?.foto&&"cursor-zoom-in hover:ring-white/80 transition")} title={pAtual?.foto?"Ver foto ampliada":""}>
              {pAtual?.foto ? <img src={pAtual.foto} alt={sel.p.nome} className="w-16 h-16 object-cover"/> : <Avatar name={sel.p.nome} tone={sel.tipo==="clt"?"brand":"free"} size="w-16 h-16"/>}
            </button>
            <div className="flex-1 min-w-0"><h3 className="text-2xl font-extrabold truncate">{sel.p.nome}</h3>
              <p className="text-white/80">{sel.p.cargo} · {unidadeNome(sel.p.unidade,unidades)} · {sel.tipo==="clt"?"CLT":"Freelancer"}</p></div>
            <Btn variant="soft" icon={I.download} onClick={extrairPasta}>Extrair pasta</Btn>
          </div>
        </div>
        <div className="px-6 pt-4 flex gap-1 border-b border-slate-100 overflow-x-auto">
          {[["docs","Documentos"],["pastas","Pastas & holerites"],["faltas","Faltas & Atestados"],["fb","Feedbacks"],["hist","Histórico"]].map(([k,l])=>

            {pAtual && pAtual.ficha && Object.keys(pAtual.ficha).length>0 && <div className="p-3 rounded-xl border border-brand-100 bg-brand-50/30">

          {tab==="faltas" && <div>

              <ul className="space-y-0.5 list-disc pl-4">
                <li><b>Falta injustificada:</b> desconta o dia = <b>salário ÷ 30</b> por dia (proporcional às horas ÷ 8). Pode ainda gerar perda do <b>DSR</b> da semana (Lei 605/49).</li>
                <li><b>Atraso:</b> não desconta por padrão; se marcado, desconto = <b>salário ÷ 220 × horas</b> (jornada mensal de 44h/sem).</li>
                <li><b>Atestado:</b> falta justificada — <b>dia abonado</b>, sem desconto.</li>

              {!!salarioMensal && <div className="mt-2 text-slate-400">Base: salário R$ {fmtR$(salarioMensal)} · dia R$ {fmtR$(valorDia)} · hora R$ {fmtR$(valorHora)}</div>}

                <Field label="Tipo"><Select value={nf.tipo} onChange={e=>{ const t=e.target.value; setNf({...nf,tipo:t,descontar: t==="falta"}); }}><option value="falta">Falta</option><option value="atraso">Atraso</option><option value="atestado">Atestado (abona)</option></Select></Field>
                <Field label="Horas"><Input type="number" value={nf.horas} onChange={e=>setNf({...nf,horas:Number(e.target.value)})}/></Field>
                {nf.tipo==="atestado"
                  ? <div className="flex items-center gap-2 text-sm pb-2.5 text-emerald-600 font-semibold"><Icon d={I.check} className="w-4 h-4"/> Abonado</div>
                  : <label className="flex items-center gap-2 text-sm pb-2.5"><input type="checkbox" checked={nf.descontar} onChange={e=>setNf({...nf,descontar:e.target.checked})}/> Descontar {nf.tipo==="atraso"&&<span className="text-slate-400 text-xs">(opcional)</span>}</label>}
              </div>
              <div className="flex gap-2 mt-2"><Input value={nf.obs} onChange={e=>setNf({...nf,obs:e.target.value})} placeholder="Observação (opcional)"/><Btn icon={I.plus} onClick={salvarFalta}>Registrar</Btn></div>

                const desc=descontoDe(f);
                return <div key={f.id} className="flex items-center gap-3 p-3 rounded-xl border border-slate-200">
                  <Badge tone={abona?"blue":f.tipo==="atraso"?"slate":"amber"}>{lbl}</Badge>
                  <div className="flex-1"><div className="text-sm font-semibold text-slate-800">{fmtDataBR(f.data)} · {f.horas}h {f.obs&&`— ${f.obs}`} {f._fromColab&&<Badge tone="brand">via app</Badge>}</div>
                    {f.anexo&&<a href={f.anexo.dados} download={f.anexo.nome} className="text-xs text-brand-600 hover:underline flex items-center gap-1 mt-0.5"><Icon d={I.doc} className="w-3 h-3"/>{f.anexo.nome||"documento"}</a>}</div>
                  {abona?<Badge tone="blue">Abonado</Badge>
                    : !f.descontar?<Badge tone="green">Sem desconto</Badge>
                    : salarioMensal?<Badge tone="red">Desconto R$ {fmtR$(desc)}</Badge>
                    : <Badge tone="amber">Defina o salário</Badge>}
                </div>;})}
            </div>
          </div>}

          {tab==="fb" && <div>
            <p className="text-sm text-slate-500 mb-3">Livro de recordações: elogios, pontos de atenção e anotações comportamentais.</p>
            {editavel && <Card className="p-4 mb-4 bg-slate-50/60">
              <div className="grid sm:grid-cols-3 gap-2">
                <Field label="Data"><Input type="date" value={nb.data} onChange={e=>setNb({...nb,data:e.target.value})}/></Field>
                <Field label="Tipo"><Select value={nb.tipo} onChange={e=>setNb({...nb,tipo:e.target.value})}><option value="elogio">Elogio</option><option value="atenção">Atenção</option><option value="nota">Nota</option></Select></Field>
                <Field label="Autor"><Input value={nb.autor} onChange={e=>setNb({...nb,autor:e.target.value})}/></Field>
              </div>
              <div className="flex gap-2 mt-2"><Input value={nb.texto} onChange={e=>setNb({...nb,texto:e.target.value})} placeholder="Escreva o feedback…"/><Btn icon={I.plus} onClick={salvarFeedback}>Adicionar</Btn></div>
            </Card>}
            <div className="space-y-2">
              {dos.feedbacks.length===0 && <p className="text-sm text-slate-400 text-center py-4">Nenhum feedback ainda.</p>}
              {dos.feedbacks.map(f=>
                <div key={f.id} className="p-3 rounded-xl border border-slate-200">
                  <div className="flex items-center gap-2 mb-1"><Badge tone={f.tipo==="elogio"?"green":f.tipo==="atenção"?"amber":"slate"}>{f.tipo}</Badge><span className="text-xs text-slate-400">{fmtDataBR(f.data)} · {f.autor}</span></div>
                  <p className="text-sm text-slate-700">{f.texto}</p>
                </div>)}
            </div>
          </div>}

          {tab==="hist" && <div>
            <div className="flex justify-end mb-3"><Btn size="sm" variant="ghost" icon={I.download} onClick={extrairPasta}>Exportar histórico</Btn></div>
            <div className="space-y-2">
              {historico.length===0 && <p className="text-sm text-slate-400 text-center py-4">Sem registros no histórico.</p>}
              {historico.map((h,i)=>
                <div key={i} className="flex gap-3 p-3 rounded-xl bg-slate-50">
                  <div className={cx("w-2 rounded-full", h.tone==="amber"?"bg-amber-400":"bg-brand-400")}/>
                  <div className="flex-1"><div className="text-xs text-slate-400">{fmtDataBR(h.data)} · {h.t}</div><div className="text-sm text-slate-700">{h.desc}</div></div>
                </div>)}
            </div>
          </div>}
        </div>
      </div>}
    </Modal>

    {/* Foto ampliada em tela cheia */}
    {fotoZoom && <div className="fixed inset-0 z-[60] bg-black/85 flex items-center justify-center p-4" onClick={()=>setFotoZoom(null)}>
      <button className="absolute top-5 right-5 w-11 h-11 rounded-xl bg-white/15 text-white grid place-items-center hover:bg-white/25"><Icon d={I.x}/></button>
      <img src={fotoZoom} alt="foto" className="max-w-full max-h-full rounded-2xl object-contain shadow-2xl" onClick={e=>e.stopPropagation()}/>
    </div>}
  </div>;
}

/* ============================ EQUIPE & PERMISSÕES ============================ */
function Equipe() {
  const { perfil, setPerfil, perms, setPerms, can } = useStore();
  const toast=useContext(ToastCtx);
  const [membros,setMembros]=useState([
    {id:1,nome:"Wilami Gestor",papel:"proprietario",email:"gestor@wilami.com",unid:"Todas"},
    {id:2,nome:"Roberto Dias",papel:"gerente",email:"roberto@wilami.com",unid:"Caktus Osasco"},
    {id:3,nome:"Marina Costa",papel:"rh_financeiro",email:"marina@wilami.com",unid:"Todas"},
  ]);
  const [form,setForm]=useState(null); // {inicial?}
  const podeGerir=can("equipe");

  const salvar=(m)=>{ setMembros(prev=> m.id?prev.map(x=>x.id===m.id?{...x,...m}:x):[...prev,{...m,id:Date.now()}]); setForm(null); toast(m.id?"Membro atualizado":"Convite enviado"); };
  const excluir=(id)=>{ setMembros(prev=>prev.filter(x=>x.id!==id)); toast("Membro removido"); };
  const toggleCap=(papel,cap)=>setPerms(prev=>({...prev,[papel]:{...prev[papel],[cap]:!prev[papel][cap]}}));

  return <div className="fade-in">
    <PageHeader title="Equipe & permissões" sub="Editar membros · restringir acessos por papel · Gerente inclui e ajusta, mas não apaga">
      <Field label="Perfil ativo (aplica as permissões)"><Select value={perfil} onChange={e=>setPerfil(e.target.value)}>{Object.entries(PAPEIS).map(([k,v])=><option key={k} value={k}>{v}</option>)}</Select></Field>
      {podeGerir && <Btn icon={I.plus} onClick={()=>setForm({inicial:null})} className="self-end">Convidar</Btn>}
    </PageHeader>

    <div className="grid lg:grid-cols-2 gap-4">
      <div className="space-y-3">
        {membros.map((m)=>
          <Card key={m.id} className="p-4 flex items-center gap-4">
            <Avatar name={m.nome} tone={m.papel==="proprietario"?"brand":"slate"} size="w-12 h-12"/>
            <div className="flex-1 min-w-0"><div className="font-bold text-slate-900">{m.nome}</div><div className="text-sm text-slate-500 truncate">{m.email}</div><div className="text-xs text-slate-400">{m.unid}</div></div>
            <Badge tone={m.papel==="proprietario"?"brand":"slate"}>{PAPEIS[m.papel]}</Badge>
            {podeGerir && m.papel!=="proprietario" && <div className="flex gap-1">
              <button onClick={()=>setForm({inicial:m})} className="w-8 h-8 rounded-lg hover:bg-slate-100 grid place-items-center text-slate-500"><Icon d={I.edit} className="w-4 h-4"/></button>
              {can("excluir") && <button onClick={()=>excluir(m.id)} className="w-8 h-8 rounded-lg hover:bg-rose-50 grid place-items-center text-slate-400 hover:text-rose-500"><Icon d={I.trash} className="w-4 h-4"/></button>}
            </div>}
          </Card>)}
      </div>

      <Card className="p-5">
        <h3 className="font-bold text-slate-900 mb-1">Permissões por papel</h3>
        <p className="text-sm text-slate-500 mb-4">Ex.: o Gerente edita a escala, mas não acessa documentos.</p>
        <div className="overflow-x-auto"><table className="w-full text-sm">
          <thead><tr className="text-left text-slate-400"><th className="py-2">Acesso</th><th className="text-center">Gerente</th><th className="text-center">RH/Fin.</th></tr></thead>
          <tbody className="divide-y divide-slate-50">
            {CAPS.map(([cap,label])=>
              <tr key={cap}><td className="py-2.5 text-slate-700">{label}</td>
                {["gerente","rh_financeiro"].map(papel=>
                  <td key={papel} className="text-center py-2.5">
                    <button onClick={()=>podeGerir&&toggleCap(papel,cap)} className={cx("w-9 h-5 rounded-full inline-flex p-0.5 transition", perms[papel][cap]?"grad-brand":"bg-slate-300", !podeGerir&&"opacity-60")}>
                      <span className={cx("w-4 h-4 bg-white rounded-full transition", perms[papel][cap]&&"translate-x-4")}/>
                    </button>
                  </td>)}
              </tr>)}
          </tbody>
        </table></div>
        <div className="mt-4 p-3 rounded-xl bg-brand-50 text-brand-700 text-xs flex items-center gap-2"><Icon d={I.shield} className="w-4 h-4"/> Perfil atual simulado: <b>{PAPEIS[perfil]}</b>. Troque em "Ver como" e navegue para ver as restrições na prática (Escala e Dossiê).</div>
      </Card>
    </div>

    <Modal open={!!form} onClose={()=>setForm(null)}>
      {form && <MembroForm inicial={form.inicial} onClose={()=>setForm(null)} onSalvar={salvar}/>}
    </Modal>
  </div>;
}
// Router sem hooks: edição de membro legado vs. criação de acesso real.
function MembroForm({inicial,onClose,onSalvar}) {
  return inicial ? <MembroEdit inicial={inicial} onClose={onClose} onSalvar={onSalvar}/> : <MembroCriar onClose={onClose}/>;
}
function MembroEdit({inicial,onClose,onSalvar}) {
  const [m,setM]=useState(inicial); const set=(k,v)=>setM(p=>({...p,[k]:v}));
  return <div className="p-6">
    <div className="flex items-center justify-between mb-5"><h3 className="text-lg font-bold text-slate-900">Editar membro</h3>
      <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon d={I.x}/></button></div>
    <div className="space-y-4">
      <Field label="Nome"><Input value={m.nome} onChange={e=>set("nome",e.target.value)}/></Field>
      <Field label="E-mail"><Input value={m.email} onChange={e=>set("email",e.target.value)}/></Field>
    </div>
    <div className="flex gap-2 mt-6"><Btn variant="ghost" className="flex-1" onClick={onClose}>Cancelar</Btn>
      <Btn className="flex-1" icon={I.check} disabled={!m.nome} onClick={()=>onSalvar(m)}>Salvar</Btn></div>
  </div>;
}
function MembroCriar({onClose}) {
  const { unidades, tenantAtual, acessosOps } = useStore();
  const toast=useContext(ToastCtx);
  const [nome,setNome]=useState("");
  const [login,setLogin]=useState("");
  const [senha,setSenha]=useState("");
  const [uni,setUni]=useState("todas");
  const [criando,setCriando]=useState(false);
  const [feito,setFeito]=useState(null);
  const gerar=()=>setSenha(Math.random().toString(36).slice(2,8)+Math.floor(Math.random()*90+10));
  const nomeUni=(u)=> (u==null||u==="todas")?"Todas as casas":((unidades.find(x=>String(x.id)===String(u))||{}).nome||"Casa");
  const criar=async()=>{
    if(!window.__WPDB){ toast("Recurso disponível no modo online (com banco)."); return; }
    if(!login.trim()){ toast("Informe o login (e-mail ou usuário) do gerente."); return; }
    if(senha && senha.length<6){ toast("A senha precisa ter ao menos 6 caracteres."); return; }
    setCriando(true);
    try{
      let jaExiste=false;
      if(senha){ const r=await criarUsuarioAuth(login,senha); jaExiste=!!r.jaExiste; }
      await acessosOps.set(login,{tenant:tenantAtual, unidade:uni, nome, papel:"gerente"});
      setFeito({ login:emailDeLogin(login), senha, casa:nomeUni(uni), jaExiste, semSenha:!senha });
      toast(jaExiste?"Conta já existia — vínculo salvo":"Acesso do gerente criado");
    }catch(e){ const c=e&&e.code; toast(c==="auth/invalid-email"?"E-mail inválido.":c==="auth/weak-password"?"Senha muito fraca (mín. 6).":"Não foi possível criar o acesso agora."); }
    setCriando(false);
  };
  const copiar=()=>{ if(!feito) return; copyText(`Acesso ao Wilami Ponto\nLink: ${location.origin}/\nLogin: ${feito.login}${feito.senha?`\nSenha: ${feito.senha}`:""}\nCasa: ${feito.casa}\n\nEntre em "Acesso do gestor" com esses dados.`); toast("Credenciais copiadas p/ WhatsApp"); };
  return <div className="p-6">
    <div className="flex items-center justify-between mb-1"><h3 className="text-lg font-bold text-slate-900">Criar acesso de gerente</h3>
      <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon d={I.x}/></button></div>
    <p className="text-sm text-slate-500 mb-4">Cria o login e a senha do gerente — <b>não envia e-mail</b>. Ele vê e gerencia apenas a casa escolhida.</p>
    {!feito ? <>
      <div className="space-y-3">
        <Field label="Nome do gerente"><Input value={nome} onChange={e=>setNome(e.target.value)} placeholder="Ex.: João Silva"/></Field>
        <Field label="Login (e-mail ou usuário)"><Input value={login} onChange={e=>setLogin(e.target.value)} placeholder="ex.: joao ou joao@email.com"/></Field>
        <Field label="Senha (mín. 6)"><div className="flex gap-2"><Input value={senha} onChange={e=>setSenha(e.target.value)} placeholder="defina uma senha"/><Btn variant="ghost" size="sm" onClick={gerar}>Gerar</Btn></div></Field>
        <Field label="Casa (unidade) que ele cuida"><Select value={uni} onChange={e=>setUni(e.target.value)}>
          <option value="todas">Todas as casas</option>{unidades.map(u=><option key={u.id} value={u.id}>{u.nome}</option>)}
        </Select></Field>
      </div>
      <div className="flex gap-2 mt-6"><Btn variant="ghost" className="flex-1" onClick={onClose}>Cancelar</Btn>
        <Btn className="flex-1" icon={I.user} disabled={criando} onClick={criar}>{criando?"Criando…":"Criar acesso"}</Btn></div>
    </> : <>
      <div className="p-4 rounded-xl bg-emerald-50 border border-emerald-100">

// Sincroniza o status de um envelope DocuSign; quando todos assinam, salva o PDF assinado na mesma pasta.
async function sincronizarAssinatura(arq){
  const env=arq.assinatura&&arq.assinatura.envelopeId; if(!env) return null;
  const j=await docusignApi("envelope",{params:{id:env}});
  const patch={...arq.assinatura, status:j.status||arq.assinatura.status, signatarios:j.signatarios||arq.assinatura.signatarios, atualizadoEm:Date.now()};
  if(j.status==="completed" && !arq.assinatura.assinadoArquivoId){
    const d=await docusignApi("documento",{params:{id:env}});
    const base=String(arq.nome||"documento").replace(/\.pdf$/i,"");
    patch.assinadoArquivoId=await arqSalvar({ nome:base+" (assinado).pdf", donoKey:arq.donoKey, donoTipo:arq.donoTipo, donoId:arq.donoId, donoNome:arq.donoNome, cpf:arq.cpf||"",
      pasta:arq.pasta, categoria:"contrato_assinado", visivelColab:true, origemId:arq.id }, "data:application/pdf;base64,"+d.base64);
    patch.concluidoEm=Date.now();
  }
  await arqAtualizar(arq.id,{assinatura:patch});
  return patch;
}

function PastasPessoa({tipo, pessoa}){
  const { arquivos, pastasExtra, criarPasta, removerPasta, can } = useStore();
  const toast=useContext(ToastCtx);
  const key=donoKeyDe(tipo,pessoa.id);
  const meus=arquivos.filter(a=>a.donoKey===key);
  const pastas=[...new Set([...(PASTAS_PADRAO[tipo]||PASTAS_PADRAO.clt), ...(pastasExtra[key]||[]), ...meus.map(a=>a.pasta).filter(Boolean)])];
  const [pasta,setPasta]=useState(null);
  const [enviando,setEnviando]=useState(0);
  const [nova,setNova]=useState(null);       // nome da nova pasta (null = fechado)
  const [assinar,setAssinar]=useState(null); // arquivo a enviar p/ assinatura
  const [ocupado,setOcupado]=useState("");   // id do arquivo em operação
  const [drag,setDrag]=useState(false);
  const editavel=can("documentos"), podeExcluir=can("excluir");
  const semBanco=!window.__WPDB;
  const doPasta=meus.filter(a=>a.pasta===pasta);
  const enviar=async(lista)=>{
    const files=Array.from(lista||[]); if(!files.length||!pasta) return;
    setEnviando(files.length); let ok=0;
    for(const f of files){
      try{
        let du=await lerArquivoDataUrl(f);
        if(f.type && f.type.indexOf("image/")===0 && f.size>900*1024) du=await compressImg(du,1800,0.82);
        await arqSalvar({ nome:f.name, donoKey:key, donoTipo:tipo, donoId:String(pessoa.id), donoNome:pessoa.nome, cpf:soDigitos(pessoa.cpf||pessoa.cnpj),
          pasta, categoria:pasta==="Holerites"?"holerite":"documento", visivelColab:pasta==="Holerites" }, du);
        ok++;
      }catch(e){ toast("Não foi possível enviar "+f.name+": "+erroBanco(e)); }
      setEnviando(n=>n-1);
    }
    if(ok) toast(ok===1?"Arquivo salvo na pasta "+pasta:ok+" arquivos salvos na pasta "+pasta);
  };
  const acao=async(a,fn,msg)=>{ setOcupado(a.id); try{ await fn(); if(msg) toast(msg); }catch(e){ toast("Falha: "+erroBanco(e)); } setOcupado(""); };
  const excluir=(a)=>{ if(!confirm("Excluir “"+a.nome+"” definitivamente?")) return; acao(a,()=>arqRemover(a),"Arquivo excluído"); };
  const contar=(p)=>meus.filter(a=>a.pasta===p).length;

  if(semBanco) return <div className="p-4 rounded-xl bg-amber-50 text-amber-700 text-sm">As pastas de arquivos precisam da conexão com o banco central (Firebase).</div>;

  if(!pasta) return <div>
    <div className="flex items-center justify-between mb-3">
      <p className="text-sm text-slate-500 flex items-center gap-1.5"><Icon d={I.folder} className="w-4 h-4 text-brand-600"/>{meus.length} arquivo(s) em {pastas.length} pastas</p>
      {editavel && (nova==null
        ? <Btn size="sm" variant="ghost" icon={I.plus} onClick={()=>setNova("")}>Nova pasta</Btn>
        : <div className="flex gap-1.5"><Input autoFocus value={nova} onChange={e=>setNova(e.target.value)} placeholder="Nome da pasta" className="!py-1.5 w-44"
              onKeyDown={e=>{ if(e.key==="Enter"&&nova.trim()){ criarPasta(key,nova.trim()); setNova(null); toast("Pasta criada"); } if(e.key==="Escape") setNova(null); }}/>
            <Btn size="sm" onClick={()=>{ if(nova.trim()){ criarPasta(key,nova.trim()); toast("Pasta criada"); } setNova(null); }}>Criar</Btn></div>)}
    </div>
    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
      {pastas.map(p=>{ const n=contar(p); const custom=(pastasExtra[key]||[]).includes(p);
        return <div key={p} className="relative group">
          <button onClick={()=>setPasta(p)} className="w-full text-left p-3.5 rounded-2xl border border-slate-200 hover:border-brand-300 hover:bg-brand-50/40 transition">
            <div className={cx("w-10 h-10 rounded-xl grid place-items-center mb-2", n?"grad-gold text-white":"bg-slate-100 text-slate-400")}><Icon d={I.folder} className="w-5 h-5"/></div>
            <div className="font-semibold text-slate-800 text-sm leading-tight">{p}</div>
            <div className="text-xs text-slate-400 mt-0.5">{n} arquivo(s){p==="Holerites"&&" · visível no app"}</div>
          </button>
          {custom && n===0 && podeExcluir && <button onClick={()=>removerPasta(key,p)} title="Remover pasta vazia" className="absolute top-2 right-2 w-7 h-7 rounded-lg text-slate-300 hover:text-rose-500 hover:bg-rose-50 hidden group-hover:grid place-items-center"><Icon d={I.trash} className="w-3.5 h-3.5"/></button>}
        </div>; })}
    </div>
  </div>;

  return <div>
    <div className="flex items-center gap-2 mb-3 flex-wrap">
      <button onClick={()=>setPasta(null)} className="flex items-center gap-1 text-sm font-semibold text-slate-500 hover:text-slate-800"><Icon d={I.arrow} className="w-4 h-4 rotate-180"/>Pastas</button>
      <span className="text-slate-300">/</span>
      <span className="font-bold text-slate-900 flex items-center gap-1.5"><Icon d={I.folder} className="w-4 h-4 text-free-500"/>{pasta}</span>
      {editavel && <label className="ml-auto cursor-pointer">
        <span className="inline-flex items-center gap-1.5 text-sm font-semibold text-white grad-brand px-3.5 py-2 rounded-xl shadow-glow"><Icon d={I.upload} className="w-4 h-4"/>Enviar arquivos</span>
        <input type="file" multiple className="hidden" onChange={e=>{ enviar(e.target.files); e.target.value=""; }}/>
      </label>}
    </div>
    {editavel && <div onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);enviar(e.dataTransfer.files);}}
      className={cx("mb-3 p-4 rounded-2xl border-2 border-dashed text-center text-sm transition", drag?"drag-over border-brand-300":"border-slate-200 text-slate-400")}>
      {enviando>0 ? <span className="text-brand-700 font-semibold">Enviando {enviando} arquivo(s)…</span> : <>Arraste arquivos para cá (PDF, imagens, Word…) — até {fmtBytes(ARQ_MAX_BYTES)} cada</>}
    </div>}
    <div className="space-y-2">
      {doPasta.length===0 && <p className="text-sm text-slate-400 text-center py-6">Pasta vazia.</p>}
      {doPasta.map(a=>{ const ass=a.assinatura; const pend=ass&&ass.envelopeId&&!["completed","declined","voided"].includes(ass.status);
        return <div key={a.id} className={cx("p-3 rounded-xl border flex flex-wrap items-center gap-2.5", ocupado===a.id?"opacity-60":"", "border-slate-200")}>
          <div className={cx("w-9 h-9 rounded-lg grid place-items-center shrink-0", ehPdf(a)?"bg-rose-50 text-rose-500":ehImg(a)?"bg-sky-50 text-sky-500":"bg-slate-100 text-slate-500")}><Icon d={I.doc} className="w-4 h-4"/></div>
          <div className="flex-1 min-w-[160px]">
            <div className="text-sm font-semibold text-slate-800 break-all">{a.nome}</div>
            <div className="text-xs text-slate-400 flex flex-wrap gap-x-2">{fmtBytes(a.tamanho)} · {new Date(a.ts||0).toLocaleDateString("pt-BR")}{a.competencia&&<span>· {fmtCompetencia(a.competencia)}</span>}{a.vistoEm&&<span className="text-emerald-600">· visto pelo colaborador {new Date(a.vistoEm).toLocaleDateString("pt-BR")}</span>}</div>
            <div className="flex flex-wrap gap-1 mt-1">
              {a.visivelColab && <Badge tone="green"><Icon d={I.eye} className="w-3 h-3"/>No app</Badge>}
              <AssinaturaBadge a={ass}/>
              {a.categoria==="contrato_assinado" && <Badge tone="green"><Icon d={I.check} className="w-3 h-3"/>Via assinada</Badge>}
            </div>
          </div>
          <div className="flex items-center gap-1">
            <button title="Visualizar" onClick={()=>acao(a,()=>arqAbrir(a))} className="w-8 h-8 rounded-lg grid place-items-center text-slate-500 hover:bg-slate-100"><Icon d={I.eye} className="w-4 h-4"/></button>
            <button title="Baixar" onClick={()=>acao(a,()=>arqBaixar(a))} className="w-8 h-8 rounded-lg grid place-items-center text-slate-500 hover:bg-slate-100"><Icon d={I.download} className="w-4 h-4"/></button>
            {editavel && <button title={a.visivelColab?"Ocultar do app do colaborador":"Liberar no app do colaborador"} onClick={()=>acao(a,()=>arqAtualizar(a.id,{visivelColab:!a.visivelColab}),a.visivelColab?"Ocultado do app":"Liberado no app do colaborador")}
              className={cx("w-8 h-8 rounded-lg grid place-items-center hover:bg-slate-100", a.visivelColab?"text-emerald-600":"text-slate-400")}><Icon d={a.visivelColab?I.eye:I.eyeOff} className="w-4 h-4"/></button>}
            {editavel && ehPdf(a) && !ass && a.categoria!=="contrato_assinado" && <Btn size="sm" variant="soft" icon={I.sign} onClick={()=>setAssinar(a)}>Assinar</Btn>}
            {editavel && pend && <button title="Atualizar status da assinatura" onClick={()=>acao(a,()=>sincronizarAssinatura(a),"Status da assinatura atualizado")} className="w-8 h-8 rounded-lg grid place-items-center text-brand-600 hover:bg-brand-50"><Icon d={I.refresh} className="w-4 h-4"/></button>}
            {podeExcluir && <button title="Excluir" onClick={()=>excluir(a)} className="w-8 h-8 rounded-lg grid place-items-center text-slate-400 hover:text-rose-500 hover:bg-rose-50"><Icon d={I.trash} className="w-4 h-4"/></button>}
          </div>
          {ass && ass.signatarios && ass.signatarios.length>0 && <div className="w-full pl-11 flex flex-wrap gap-1.5">
            {ass.signatarios.map((sg,i)=><span key={i} className={cx("text-[11px] px-2 py-0.5 rounded-full border", sg.status==="completed"?"border-emerald-200 bg-emerald-50 text-emerald-700":sg.status==="declined"?"border-rose-200 bg-rose-50 text-rose-700":"border-slate-200 text-slate-500")}>
              {sg.status==="completed"?"✓ ":""}{sg.nome}{sg.status==="completed"?"":sg.status==="declined"?" · recusou":" · pendente"}</span>)}

function AssinaturaModal({arq, pessoa, tipo, onClose}){
  const { assinaturaCfg } = useStore();
  const toast=useContext(ToastCtx);
  const nomePessoa = tipo==="pj" ? (pessoa.responsavel||pessoa.nome) : pessoa.nome;
  const [sigs,setSigs]=useState(()=>[
    { nome:nomePessoa||"", email:pessoa.email||"", papel:tipo==="pj"?"Contratada ("+(pessoa.nome||"PJ")+")":"Colaborador", on:true },
    ...((assinaturaCfg&&assinaturaCfg.signatarios)||[]).map(s=>({...s, on:true})),
  ]);
  const [assunto,setAssunto]=useState("Assinatura: "+String(arq.nome||"").replace(/\.pdf$/i,""));
  const [mensagem,setMensagem]=useState("Olá! Segue o documento para assinatura eletrônica. Qualquer dúvida, estamos à disposição.");
  const [pagina,setPagina]=useState(true);
  const [status,setStatus]=useState(""); // "" | enviando | erro
  const [erro,setErro]=useState(null);
  const setSig=(i,k,v)=>setSigs(arr=>arr.map((s,j)=>j===i?{...s,[k]:v}:s));
  const ativos=sigs.filter(s=>s.on);
  const emailOk=(e)=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||"").trim());
  const invalidos=ativos.filter(s=>!s.nome.trim()||!emailOk(s.email));
  const enviar=async()=>{
    if(!ativos.length||invalidos.length) return;
    setStatus("enviando"); setErro(null);
    try{
      let du=await arqConteudo(arq);
      const lista=ativos.map(s=>({nome:s.nome.trim(), email:s.email.trim().toLowerCase(), papel:s.papel||""}));
      if(pagina) du=await pdfComPaginaAssinaturas(du, arq.nome, lista);
      const j=await docusignApi("enviar",{ body:{ nome:arq.nome, base64:du.split(",")[1], signatarios:lista, assunto, mensagem } });
      await arqAtualizar(arq.id,{ assinatura:{ provedor:"docusign", envelopeId:j.envelopeId, status:j.status||"sent", enviadoEm:Date.now(), signatarios:lista.map(s=>({...s,status:"sent"})) } });
      toast("Enviado para assinatura — cada signatário recebe um e-mail do DocuSign");
      onClose();
    }catch(e){ setErro(e); setStatus("erro"); }
  };
  const marcarManual=async()=>{
    try{ await arqAtualizar(arq.id,{ assinatura:{ provedor:"manual", status:"manual", concluidoEm:Date.now(), signatarios:ativos.map(s=>({nome:s.nome,email:s.email,status:"completed"})) } }); toast("Marcado como assinado"); onClose(); }
    catch(e){ toast(e.message||"Falha"); }
  };
  return <Modal open onClose={onClose} wide>
    <div className="p-6">
      <div className="flex items-start gap-3 mb-4">
        <div className="w-11 h-11 rounded-xl grad-brand grid place-items-center text-white shrink-0"><Icon d={I.sign}/></div>
        <div className="flex-1 min-w-0"><h3 className="text-lg font-bold text-slate-900">Solicitar assinatura (DocuSign)</h3>
          <p className="text-sm text-slate-500 break-all">{arq.nome}</p></div>
        <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon d={I.x}/></button>
      </div>
      <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Signatários (todos assinam o mesmo documento)</div>
      <div className="space-y-2">
        {sigs.map((s,i)=><div key={i} className={cx("grid sm:grid-cols-[auto_1fr_1fr_auto] gap-2 items-center p-2.5 rounded-xl border", s.on?"border-slate-200":"border-slate-100 opacity-60")}>
          <input type="checkbox" checked={s.on} onChange={e=>setSig(i,"on",e.target.checked)} className="w-4 h-4 accent-green-700"/>
          <Input value={s.nome} onChange={e=>setSig(i,"nome",e.target.value)} placeholder="Nome completo"/>
          <Input value={s.email} onChange={e=>setSig(i,"email",e.target.value)} placeholder="e-mail" className={s.on&&s.email&&!emailOk(s.email)?"!border-rose-300":""}/>
          <span className="text-xs text-slate-400 sm:w-36 truncate" title={s.papel}>{s.papel||"—"}</span>
        </div>)}
      </div>
      <button onClick={()=>setSigs(a=>[...a,{nome:"",email:"",papel:"Testemunha",on:true}])} className="mt-2 text-sm font-semibold text-brand-700 hover:underline flex items-center gap-1"><Icon d={I.plus} className="w-4 h-4"/>Adicionar signatário</button>
      {invalidos.length>0 && <p className="text-xs text-rose-500 mt-2">Preencha nome e e-mail válido de todos os signatários marcados.</p>}
      <div className="grid gap-3 mt-4">
        <Field label="Assunto do e-mail"><Input value={assunto} onChange={e=>setAssunto(e.target.value)}/></Field>
        <Field label="Mensagem"><textarea value={mensagem} onChange={e=>setMensagem(e.target.value)} rows={2} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-brand-400 text-sm"/></Field>
        <label className="flex items-start gap-2 text-sm text-slate-600"><input type="checkbox" checked={pagina} onChange={e=>setPagina(e.target.checked)} className="mt-0.5 w-4 h-4 accent-green-700"/>
          <span>Adicionar <b>página de assinaturas</b> ao final do PDF (recomendado — o DocuSign posiciona a assinatura de cada um automaticamente)</span></label>
      </div>
      {status==="erro" && erro && <div className="mt-4 p-3.5 rounded-xl bg-rose-50 text-rose-700 text-sm">
        <div className="font-semibold">{erro.message}</div>
        {erro.info && erro.info.consentUrl && <div className="mt-1">É preciso autorizar o app uma única vez: <a className="underline font-semibold" href={erro.info.consentUrl} target="_blank" rel="noreferrer">conceder permissão no DocuSign</a> e depois tentar de novo.</div>}
        {erro.status===501 && <div className="mt-1 text-rose-600/90">Configure as credenciais do DocuSign na Vercel (veja Configurações → Assinatura eletrônica). Enquanto isso, você pode coletar as assinaturas fora do sistema e marcar como assinado.</div>}
      </div>}
      <div className="flex flex-wrap gap-2 mt-5">
        <Btn variant="ghost" onClick={marcarManual} icon={I.check}>Já foi assinado (marcar manualmente)</Btn>
        <Btn className="flex-1" icon={status==="enviando"?null:I.sign} disabled={status==="enviando"||!ativos.length||invalidos.length>0} onClick={enviar}>{status==="enviando"?"Enviando…":"Enviar para assinatura"}</Btn>
      </div>
    </div>
  </Modal>;
}

/* ============================ ACESSO DO COLABORADOR AO APP (PIN) ============================ */
function AcessoAppColab({tipo, pessoa}){
  const { acessosColab, can } = useStore();
  const toast=useContext(ToastCtx);
  const key=donoKeyDe(tipo,pessoa.id);
  const ac=acessosColab[key];
  const docLogin=soDigitos(pessoa.cpf)||soDigitos(pessoa.cnpj);
  const [pinNovo,setPinNovo]=useState(null);
  const [gerando,setGerando]=useState(false);
  const link=comTenantUrl(location.origin+location.pathname,"meus-docs");
  const gerar=async()=>{
    if(!(docLogin.length===11||docLogin.length===14)){ toast("Cadastre o CPF"+(tipo==="pj"?" ou CNPJ":"")+" antes de liberar o acesso."); return; }
    setGerando(true);
    try{ const pin=gerarPin(); await definirPinColab(key,docLogin,pin,{nome:pessoa.nome,tipo}); setPinNovo(pin); }
    catch(e){ toast("Não foi possível gerar o PIN: "+erroBanco(e)); }
    setGerando(false);
  };
  return <div className="p-3.5 rounded-2xl border border-slate-200 bg-slate-50/60 flex flex-wrap items-center gap-3">
    <div className={cx("w-10 h-10 rounded-xl grid place-items-center shrink-0", ac?"bg-emerald-100 text-emerald-600":"bg-slate-200 text-slate-500")}><Icon d={I.key} className="w-5 h-5"/></div>
    <div className="flex-1 min-w-[180px]">
      <div className="text-sm font-semibold text-slate-800">Acesso ao app “Meus documentos”</div>
      <div className="text-xs text-slate-500">{ac ? <>Liberado · PIN definido em {new Date(ac.atualizadoEm||0).toLocaleDateString("pt-BR")}</> : "Ainda não liberado — gere um PIN para o colaborador ver holerites e documentos."}</div>
    </div>
    {can("documentos") && <Btn size="sm" variant={ac?"ghost":"primary"} icon={I.key} disabled={gerando} onClick={gerar}>{gerando?"Gerando…":ac?"Gerar novo PIN":"Liberar acesso"}</Btn>}
    {pinNovo && <Modal open onClose={()=>setPinNovo(null)}>
      <div className="p-6 text-center">
        <div className="w-14 h-14 mx-auto rounded-2xl grad-brand grid place-items-center text-white mb-3"><Icon d={I.key} className="w-7 h-7"/></div>
        <h3 className="text-lg font-bold text-slate-900">PIN de {pessoa.nome.split(" ")[0]}</h3>
        <p className="text-sm text-slate-500 mt-1">Entregue este PIN pessoalmente. Ele aparece só agora — depois, apenas um novo PIN pode ser gerado.</p>
        <div className="my-5 text-4xl font-extrabold tracking-[.35em] text-brand-700 tabular-nums">{pinNovo}</div>
        <div className="text-left text-sm bg-slate-50 rounded-xl p-3 space-y-1">
          <div>1. Acesse: <b className="break-all">{link}</b></div>
          <div>2. Informe o {docLogin.length===14?"CNPJ":"CPF"} e o PIN acima.</div>
          <div>3. Holerites e documentos liberados aparecem lá.</div>
        </div>
        <div className="flex gap-2 mt-4">
          <Btn variant="ghost" className="flex-1" icon={I.copy} onClick={()=>{ copyText("Seu acesso aos holerites e documentos:\n"+link+"\n"+(docLogin.length===14?"CNPJ":"CPF")+": o seu\nPIN: "+pinNovo); toast("Instruções copiadas"); }}>Copiar instruções</Btn>
          <Btn className="flex-1" onClick={()=>setPinNovo(null)}>Pronto</Btn>
        </div>
      </div>
    </Modal>}
  </div>;
}
