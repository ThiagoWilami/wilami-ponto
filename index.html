            <Btn variant="ghost" className="w-full mt-4" onClick={onClose}>Cancelar</Btn>
          </div>
        : fluxo==="ajuste" ? (ajStatus==="ok" ? <div className="fade-in text-center py-10">
            <div className="w-20 h-20 mx-auto rounded-full bg-emerald-500 grid place-items-center text-white mb-4 shadow-glow"><Icon d={I.check} className="w-10 h-10" stroke={3}/></div>
            <h3 className="text-2xl font-extrabold text-slate-900">Solicitação enviada!</h3>
            <p className="text-slate-500 mt-1">Seu pedido de ajuste foi enviado ao gestor. Você será avisado quando for aprovado.</p>
            <Btn variant="ghost" className="w-full mt-4" onClick={onClose}>Fechar</Btn>
          </div>
          : <div className="fade-in">
            <div className="text-center mb-4">
              <div className="w-14 h-14 mx-auto rounded-2xl bg-amber-500 grid place-items-center text-white mb-2"><Icon d={I.edit} className="w-7 h-7"/></div>
              <h3 className="text-lg font-bold text-slate-900">Solicitar ajuste de ponto</h3>
              <p className="text-sm text-slate-500">Identifique-se e informe a marcação que precisa ser corrigida. O gestor aprova.</p>
            </div>
            <Field label="Seu CPF"><Input value={aj.cpf} inputMode="numeric" placeholder="000.000.000-00" onChange={e=>{setAj({...aj,cpf:e.target.value}); setAjStatus("");}}/></Field>
            <div className="grid grid-cols-2 gap-2 mt-2">
              <Field label="Data"><Input type="date" value={aj.data} onChange={e=>setAj({...aj,data:e.target.value})}/></Field>
              <Field label="Horário correto"><Input type="time" value={aj.hora} onChange={e=>setAj({...aj,hora:e.target.value})}/></Field>
            </div>
            <Field label="Qual marcação?"><Select value={aj.acao} onChange={e=>setAj({...aj,acao:e.target.value})}>{acoesAjuste.map(([v,l])=><option key={v} value={v}>{l}</option>)}</Select></Field>
            <Field label="Motivo"><Input value={aj.motivo} onChange={e=>setAj({...aj,motivo:e.target.value})} placeholder="Ex.: esqueci de bater a saída"/></Field>
            {ajStatus==="cpf" && <div className="mt-3 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">Digite os 11 números do CPF.</div>}
            {ajStatus==="naoencontrado" && <div className="mt-3 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">CPF não encontrado. Faça o cadastro (1º acesso) primeiro.</div>}
            {ajStatus==="semmotivo" && <div className="mt-3 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">Descreva o motivo do ajuste.</div>}
            {ajStatus==="erro" && <div className="mt-3 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">Não foi possível enviar agora. Tente novamente.</div>}
            <div className="flex gap-2 mt-4">
              <Btn variant="ghost" onClick={()=>setFluxo("escolha")}>Voltar</Btn>
              <Btn className="flex-1" icon={ajStatus==="enviando"?null:I.check} disabled={ajStatus==="enviando"} onClick={enviarAjusteColab}>{ajStatus==="enviando"?"Enviando…":"Enviar solicitação"}</Btn>
            </div>
          </div>)
        : fluxo==="atestado" ? (atStatus==="ok" ? <div className="fade-in text-center py-10">
            <div className="w-20 h-20 mx-auto rounded-full bg-emerald-500 grid place-items-center text-white mb-4 shadow-glow"><Icon d={I.check} className="w-10 h-10" stroke={3}/></div>
            <h3 className="text-2xl font-extrabold text-slate-900">Atestado enviado!</h3>
            <p className="text-slate-500 mt-1">Seu atestado foi enviado ao gestor e o dia será abonado. Ele já aparece no seu dossiê.</p>
            <Btn variant="ghost" className="w-full mt-4" onClick={onClose}>Fechar</Btn>
          </div>
          : <div className="fade-in">
            <div className="text-center mb-4">
              <div className="w-14 h-14 mx-auto rounded-2xl bg-sky-500 grid place-items-center text-white mb-2"><Icon d={I.doc} className="w-7 h-7"/></div>
              <h3 className="text-lg font-bold text-slate-900">Enviar atestado</h3>
              <p className="text-sm text-slate-500">Identifique-se pelo CPF e anexe o atestado. O dia será abonado automaticamente.</p>
            </div>
            <Field label="Seu CPF"><Input value={at.cpf} inputMode="numeric" placeholder="000.000.000-00" onChange={e=>{setAt({...at,cpf:e.target.value}); setAtStatus("");}}/></Field>
            <div className="grid grid-cols-2 gap-2 mt-2">
              <Field label="Data do atestado"><Input type="date" value={at.data} onChange={e=>setAt({...at,data:e.target.value})}/></Field>
              <Field label="Horas/dia"><Input type="number" value={at.horas} onChange={e=>setAt({...at,horas:Number(e.target.value)})}/></Field>
            </div>
            <div className="mt-2">
              <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Documento (foto ou PDF)</label>
              <label className="mt-1 flex items-center gap-2 cursor-pointer p-3 rounded-xl border border-dashed border-slate-300 hover:border-sky-400">
                <Icon d={I.upload} className="w-5 h-5 text-slate-400"/>
                <span className="text-sm text-slate-600">{at.nomeArq||"Toque para anexar o atestado"}</span>
                <input type="file" accept="image/*,application/pdf" className="hidden" onChange={e=>upAtestado(e.target.files&&e.target.files[0])}/>
              </label>
            </div>
            {atStatus==="cpf" && <div className="mt-3 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">Digite os 11 números do CPF.</div>}
            {atStatus==="naoencontrado" && <div className="mt-3 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">CPF não encontrado. Faça o cadastro (1º acesso) primeiro.</div>}
            {atStatus==="semarquivo" && <div className="mt-3 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">Anexe o documento do atestado.</div>}
            {atStatus==="erro" && <div className="mt-3 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm">Não foi possível enviar agora. Verifique a internet e tente de novo.</div>}
            <div className="flex gap-2 mt-4">
              <Btn variant="ghost" onClick={()=>setFluxo("escolha")}>Voltar</Btn>
              <Btn className="flex-1" icon={atStatus==="enviando"?null:I.check} disabled={atStatus==="enviando"} onClick={enviarAtestadoColab}>{atStatus==="enviando"?"Enviando…":"Enviar atestado"}</Btn>
            </div>
          </div>)
        : fluxo==="cadastro" ? <div className="fade-in -m-6"><ColabForm tipo={mode} onClose={()=>setFluxo("escolha")} onSalvar={registrarCadastro}/></div>
        : <>
          <div className="text-center mb-5">
            <div className="text-4xl font-extrabold tracking-tight text-slate-900 tabular-nums">{clock.toLocaleTimeString("pt-BR")}</div>
            <div className="text-slate-500 text-sm mt-1">{pSel ? <>Sua casa: <b className="text-slate-700">{unidade?.nome}</b></> : "Identifique-se pelo CPF"}</div>
          </div>

          {step===0 && <div className="fade-in">
            <div className="text-center mb-4">
              <div className="w-14 h-14 mx-auto rounded-2xl grad-brand grid place-items-center text-white mb-2"><Icon d={I.user} className="w-7 h-7"/></div>
              <p className="text-sm text-slate-500">Digite seu <b>CPF</b> para registrar o ponto. Só quem está na <b>escala de hoje</b> consegue bater.</p>
            </div>
            <Field label="Seu CPF">
              <Input value={cpf} inputMode="numeric" placeholder="000.000.000-00"
                onChange={e=>{setCpf(e.target.value); setCpfErr("");}}
                onKeyDown={e=>{ if(e.key==="Enter") buscarCpf(); }}/>
            </Field>
            {cpfErr && <div className="mt-3 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm flex items-center gap-2"><Icon d={I.x} className="w-4 h-4 shrink-0"/>{cpfErr}</div>}
            <Btn className="w-full mt-4" icon={I.arrow} variant={accent==="clt"?"primary":"free"} onClick={buscarCpf}>Continuar</Btn>
          </div>}

          {step===1 && <div className="fade-in">
            <div className="aspect-square rounded-2xl overflow-hidden bg-ink-900 relative grid place-items-center">
              {foto ? <img src={foto} className="w-full h-full object-cover"/> : <video ref={videoRef} className="w-full h-full object-cover" playsInline muted/>}
              {!foto && <div className="absolute inset-8 border-2 border-white/50 rounded-full pointer-events-none"/>}
            </div>
            {camErr && <p className="text-xs text-amber-600 mt-2">{camErr}</p>}
            <div className="mt-4 flex gap-2">
              {!foto ? <>
                  <Btn className="flex-1" icon={I.camera} onClick={capturar} variant={accent==="clt"?"primary":"free"}>Capturar selfie</Btn>
                  <label className="cursor-pointer">
                    <span className="inline-flex items-center gap-1 text-sm font-semibold rounded-xl px-4 py-2.5 border border-slate-200 text-slate-700 hover:bg-slate-50"><Icon d={I.upload} className="w-4 h-4"/>Foto</span>
                    <input type="file" accept="image/*" capture="user" className="hidden" onChange={async e=>{ const fl=e.target.files&&e.target.files[0]; e.target.value=""; if(!fl) return; try{ const ft=await fotoDeArquivo(fl); stopCam(); setFoto(ft); }catch(err){ alert("Foto: "+err.message); } }}/>
                  </label>
                </>
                : <><Btn variant="ghost" onClick={()=>{setFoto(null);startCam();}}>Refazer</Btn>
                    <Btn className="flex-1" icon={I.arrow} onClick={()=>{setStep(2);pegarGeo();}} variant={accent==="clt"?"primary":"free"}>Continuar</Btn></>}
            </div>
            <p className="text-[11px] text-slate-400 mt-2 text-center">No celular, "Foto" abre a câmera. Em arquivo local (file://) a câmera ao vivo pode ficar indisponível — use "Foto".</p>
          </div>}

          {step===2 && <div className="fade-in">
            <div className="rounded-2xl border border-slate-200 overflow-hidden">
              <div className="h-32 relative grad-brand grid place-items-center">
                <div className="text-white text-center"><div className="w-12 h-12 mx-auto rounded-full bg-white/20 grid place-items-center tick"><Icon d={I.pin} className="w-6 h-6"/></div>
                  <p className="text-sm mt-2 font-semibold">{geo?"Localização obtida":"Buscando GPS..."}</p></div>
              </div>
              <div className="p-4 text-sm space-y-2">
                <div className="flex justify-between"><span className="text-slate-500">Cerca</span><b>{unidade.raio} m</b></div>
                {geo && <div className="flex justify-between"><span className="text-slate-500">Distância</span><b>{Math.round(geo.dist)} m</b></div>}
                <div>{geo ? (geo.ok
                  ? <Badge tone="green"><Icon d={I.check} className="w-3 h-3"/> Dentro da cerca</Badge>
                  : <Badge tone="red"><Icon d={I.x} className="w-3 h-3"/> Fora da cerca — bloqueado</Badge>)
                  : <Badge tone="amber">Aguardando…</Badge>}</div>
              </div>
            </div>
            {geoErr && <p className="text-xs text-amber-600 mt-2">{geoErr}</p>}
            <div className="mb-3 mt-3 p-3 rounded-xl bg-slate-50 text-sm text-center">Você vai registrar: <b className="text-slate-900">{acaoLabel||rotuloAcao(acao)}</b></div>
            <div className="mt-2 flex gap-2">
              {!geo && <Btn variant="ghost" onClick={simGeo}>Simular GPS</Btn>}
              <Btn variant="ghost" onClick={()=>setStep(1)}>Voltar</Btn>
              <Btn className="flex-1" size="lg" disabled={!geo||!geo.ok} icon={I.check} onClick={registrarAcao} variant={accent==="clt"?"primary":"free"}>Bater ponto — {acaoLabel||rotuloAcao(acao)}</Btn>
            </div>
          </div>}
        </>}
      </Card>
      <p className="text-center text-white/50 text-xs mt-4 flex items-center justify-center gap-1"><Icon d={I.shield} className="w-3 h-3"/> Conforme Portaria 671/2021 · comprovante por e-mail</p>
    </div>
  </div>;
}

/* ============================ FORM DE COLABORADOR ============================ */
function ColabForm({ tipo, inicial, onSalvar, onClose, vinculo }) {
  const ehFixo = vinculo==="fixo" || inicial?.vinculo==="fixo";
  const ehConf = vinculo==="confianca" || inicial?.vinculo==="confianca"; // cargo de confiança: NÃO bate ponto, só salário na folha
  const { unidades, cargosFreela, cargosLista, cargoInfo } = useStore();
  const cg0 = cargosFreela[0];
  const [f,setF]=useState(inicial || (ehConf
    ? { nome:"", cargo:"Gerente", unidade:"todas", salario:0, sigiloso:false, cpf:"", tel:"", tipoPix:"CPF", pix:"", banco:"", foto:"" }
    : tipo==="clt"
    ? { nome:"", cargo:CARGOS[0], setor:"salao", escala:"6x1", folgaDia:6, unidade:unidades[0]?.id, admissao:"", salario:0, vt:0, cpf:"", tel:"", tipoPix:"CPF", pix:"", banco:"", foto:"", docs:{} }
    : { nome:"", cargo:cg0?.nome||"", setor:"salao", unidade:unidades[0]?.id, valor:cg0?.valor||0, cpf:"", tel:"", tipoPix:"CPF", pix:"", banco:"", foto:"" }));
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  // Foto do colaborador no CADASTRO (referência facial). Usa input de arquivo/câmera:
  // funciona em file://, no PC e abre a câmera no celular (capture="user").
  const upFoto=async(file)=>{ if(!file) return; try{ set("foto", await fotoDeArquivo(file)); }catch(e){ alert("Foto: "+e.message); } };
  const setCargoClt=(cg)=>setF(p=>{ const ci=cargoInfo(cg); return {...p,cargo:cg,setor:(ci&&ci.setor)||SETOR_POR_CARGO[cg]||p.setor, salario: (!Number(p.salario) && ci && Number(ci.salarioBase)) ? Number(ci.salarioBase) : p.salario}; });
  const setCargoFree=(nm)=>{ const c=cargosFreela.find(x=>x.nome===nm); setF(p=>({...p,cargo:nm,valor:c?c.valor:p.valor,setor:SETOR_POR_CARGO[nm]||p.setor})); };
  const upDoc=async(k,file)=>{ if(!file) return;
    try{ const r=await prepararArquivo(file,{max:640,q:0.62}); setF(p=>({...p,docs:{...(p.docs||{}),[k]:{nome:r.nome,dados:r.dados}}})); }
    catch(e){ alert(file.name+": "+e.message); } };
  const rmDoc=(k)=>setF(p=>{ const d={...(p.docs||{})}; delete d[k]; return {...p,docs:d}; });
  const [showDocs,setShowDocs]=useState(false);
  const nDocsUp=DOC_TIPOS.filter(([k])=>f.docs&&f.docs[k]).length;
  const nomeOk=f.nome.trim().length>=2;
  // Lista clara do que falta — evita "botão desativado sem explicação"
  const faltando=[];
  if(!nomeOk) faltando.push("nome");
  if(!ehConf && !f.foto) faltando.push("foto");           // confiança não bate ponto → foto não é obrigatória
  if(!ehConf && !(f.cpf||"").trim()) faltando.push("CPF");
  if(tipo==="free"){
    if(!f.cargo) faltando.push("cargo");
    if(!f.tipoPix) faltando.push("tipo Pix");
    if(!(f.pix||"").trim()) faltando.push("chave Pix");
    if(!(f.banco||"").trim()) faltando.push("nome do banco");
  }
  const valido = faltando.length===0;
  const req=(l)=> l+" *";
  return <div className="flex flex-col max-h-[85vh]">
    {/* Cabeçalho fixo com botão de VOLTAR intuitivo */}
    <div className="flex items-center gap-2 px-5 py-3 border-b border-slate-100 shrink-0">
      <button onClick={onClose} className="flex items-center gap-1 text-sm font-semibold text-slate-600 hover:text-slate-900 -ml-1 pr-2"><Icon d={I.arrow} className="w-4 h-4 rotate-180"/>Voltar</button>
      <h3 className="text-base font-bold text-slate-900 ml-1">{inicial?(ehConf?"Editar cargo de confiança":ehFixo?"Editar Freela Fixo":"Editar"):ehConf?"Novo cargo de confiança":ehFixo?"Contratar Freela Fixo":tipo==="clt"?"Contratar CLT":"Novo freelancer"}</h3>
      <button onClick={onClose} className="ml-auto text-slate-400 hover:text-slate-600"><Icon d={I.x}/></button>
    </div>
    {/* Corpo rolável */}
    <div className="overflow-y-auto px-5 py-4">
    {ehConf && <div className="mb-3 p-3 rounded-2xl border border-indigo-200 bg-indigo-50/50 text-sm text-indigo-800 flex items-start gap-2">
      <Icon d={I.shield} className="w-4 h-4 mt-0.5 shrink-0"/>
      <span>Cargo de confiança (gerente/diretor): <b>não bate ponto</b> e <b>não entra na escala</b>. Recebe salário mensal fixo e aparece na folha em “Gerência &amp; Diretoria”.</span>
    </div>}
    {/* Foto do colaborador (OBRIGATÓRIA) — referência facial do check-in */}
    {!ehConf && <div className={cx("flex items-center gap-3 mb-3 p-3 rounded-2xl border", f.foto?"border-emerald-200 bg-emerald-50/40":"border-rose-200 bg-rose-50/40")}>
      <div className="w-16 h-16 rounded-2xl overflow-hidden bg-white ring-1 ring-slate-200 grid place-items-center shrink-0">
        {f.foto ? <img src={f.foto} alt="foto" className="w-full h-full object-cover"/> : <Icon d={I.camera} className="w-6 h-6 text-slate-300"/>}
      </div>
      <div className="flex-1 min-w-0">
        <div className="text-sm font-semibold text-slate-800">Foto do colaborador <span className="text-rose-500">*</span></div>
        <div className="text-xs text-slate-500 mb-2">{f.foto?"Foto adicionada ✓":"Obrigatória — tire uma foto ou envie do dispositivo."}</div>
        <div className="flex gap-2">
          <label className="cursor-pointer">
            <span className="inline-flex items-center gap-1 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 px-3 py-1.5 rounded-lg"><Icon d={I.camera} className="w-3.5 h-3.5"/>{f.foto?"Trocar foto":"Tirar/enviar foto"}</span>
            <input type="file" accept="image/*" capture="user" className="hidden" onChange={e=>upFoto(e.target.files&&e.target.files[0])}/>
          </label>
          {f.foto && <button onClick={()=>set("foto","")} className="text-xs font-semibold text-slate-500 hover:text-rose-500 px-2">Remover</button>}
        </div>
      </div>
    </div>}
    <div className="grid sm:grid-cols-2 gap-3">
      <div className="sm:col-span-2"><Field label={req("Nome e sobrenome")}><Input value={f.nome} onChange={e=>set("nome",e.target.value)} placeholder="Ex.: João da Silva"/></Field></div>
      {ehConf ? <>
        <Field label="Cargo (confiança)"><Select value={f.cargo} onChange={e=>set("cargo",e.target.value)}>{["Gerente","Gerente geral","Diretor","Diretora Financeira","Coordenador","Sócio","Supervisor"].map(c=><option key={c}>{c}</option>)}</Select></Field>
        <Field label="Unidade (casa)"><Select value={f.unidade} onChange={e=>set("unidade",e.target.value==="todas"?"todas":Number(e.target.value))}>
          <option value="todas">Todas as casas</option>{unidades.map(u=><option key={u.id} value={u.id}>{u.nome}</option>)}
        </Select></Field>
        <Field label="Salário mensal (R$)"><Input type="number" value={f.salario||0} onChange={e=>set("salario",Number(e.target.value))} placeholder="Ex.: 6000"/></Field>
        <Field label="Telefone"><Input value={f.tel} onChange={e=>set("tel",e.target.value)} placeholder="(00) 00000-0000"/></Field>
      </> : tipo==="clt" ? <>
        <Field label="Cargo / função"><Select value={f.cargo} onChange={e=>setCargoClt(e.target.value)}>{[...new Set([...cargosLista, f.cargo].filter(Boolean))].map(c=><option key={c}>{c}</option>)}</Select></Field>
        <Field label="Setor"><Select value={f.setor} onChange={e=>set("setor",e.target.value)}>{SETORES.map(([k,l])=><option key={k} value={k}>{l}</option>)}</Select></Field>
        <Field label="Unidade (casa)"><Select value={f.unidade} onChange={e=>set("unidade",Number(e.target.value))}>{unidades.map(u=><option key={u.id} value={u.id}>{u.nome}</option>)}</Select></Field>
        <Field label="Escala fixa"><Select value={f.escala} onChange={e=>set("escala",e.target.value)}>{Object.entries(ESCALAS).map(([k,v])=><option key={k} value={k}>{v}</option>)}</Select></Field>
        <Field label="Dia da folga (referência)"><Select value={f.folgaDia==null?"":f.folgaDia} onChange={e=>set("folgaDia",e.target.value===""?null:Number(e.target.value))}>
          {DIAS.map((d,i)=><option key={i} value={i}>{["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"][i]}</option>)}
        </Select></Field>
        <Field label="Admissão / início na escala"><Input type="date" value={f.admissao} onChange={e=>set("admissao",e.target.value)}/></Field>
        <Field label="Válido até (fim do contrato, opcional)"><Input type="date" value={f.fimContrato||""} onChange={e=>set("fimContrato",e.target.value)}/></Field>
        {f.origem==="convite" && !f.admissao && <div className="sm:col-span-2 p-3 rounded-xl bg-amber-50 text-amber-800 text-sm flex items-start gap-2"><Icon d={I.calendar} className="w-4 h-4 mt-0.5 shrink-0"/><span>Cadastro recebido pelo convite. <b>Defina a data de admissão</b>: a pessoa só entra na escala (e só consegue bater ponto) a partir dessa data.</span></div>}
        <Field label="Salário mensal (R$)"><Input type="number" value={f.salario||0} onChange={e=>set("salario",Number(e.target.value))} placeholder="Ex.: 2200"/></Field>
        <Field label="Salário combinado c/ Diretoria (R$)"><Input type="number" value={f.salarioCombinado||""} onChange={e=>set("salarioCombinado",Number(e.target.value)||0)} placeholder="Ex.: 3500 (opcional)"/>
          <span className="block text-[11px] text-slate-400 mt-1 normal-case font-normal tracking-normal">Se salário + extras + gorjetas do mês não chegarem a esse valor, a folha mostra a reposição.</span></Field>
        <Field label="Vale Transporte (R$/mês)"><Input type="number" value={f.vt||0} onChange={e=>set("vt",Number(e.target.value))} placeholder="Ex.: 220"/></Field>
      </> : <>
        <Field label={req("Cargo")}><Select value={f.cargo} onChange={e=>setCargoFree(e.target.value)}>{cargosFreela.map(c=><option key={c.id} value={c.nome}>{c.nome}</option>)}</Select></Field>
        <Field label="Valor por jornada"><div className="px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm font-semibold text-slate-700">R$ {Number(f.valor||0).toLocaleString("pt-BR")} <span className="font-normal text-slate-400 text-xs">(do cargo)</span></div></Field>
        <Field label="Unidade (casa)"><Select value={f.unidade} onChange={e=>set("unidade",Number(e.target.value))}>{unidades.map(u=><option key={u.id} value={u.id}>{u.nome}</option>)}</Select></Field>
        <Field label="Telefone"><Input value={f.tel} onChange={e=>set("tel",e.target.value)} placeholder="(00) 00000-0000"/></Field>
      </>}
      <Field label={ehConf?"CPF":req("CPF")}><Input value={f.cpf} onChange={e=>set("cpf",e.target.value)} placeholder="000.000.000-00"/></Field>
      {tipo==="clt" && !ehConf && <Field label="Telefone"><Input value={f.tel} onChange={e=>set("tel",e.target.value)} placeholder="(00) 00000-0000"/></Field>}
      <Field label={ehConf?"Tipo de Pix":req("Tipo de Pix")}><Select value={f.tipoPix} onChange={e=>set("tipoPix",e.target.value)}>{PIX_TIPOS.map(t=><option key={t}>{t}</option>)}</Select></Field>
      <Field label={ehConf?"Chave Pix":req("Chave Pix")}><Input value={f.pix} onChange={e=>set("pix",e.target.value)} placeholder="conforme o tipo de Pix"/></Field>
      <Field label={ehConf?"Nome do Banco":req("Nome do Banco")}><Input value={f.banco} onChange={e=>set("banco",e.target.value)} placeholder="Ex.: Nubank, Itaú, Caixa"/></Field>
    </div>
    {ehConf && <div className="mt-4 p-3 rounded-2xl border border-slate-200 bg-slate-50/70">
      <label className="flex items-start gap-3 cursor-pointer">
        <button type="button" onClick={()=>set("sigiloso",!f.sigiloso)} className={cx("w-10 h-6 rounded-full inline-flex p-0.5 transition shrink-0 mt-0.5", f.sigiloso?"grad-brand":"bg-slate-300")}>
          <span className={cx("w-5 h-5 bg-white rounded-full transition", f.sigiloso&&"translate-x-4")}/>
        </button>
        <span className="text-sm text-slate-700"><b>Pagamento sigiloso (diretoria)</b><br/><span className="text-xs text-slate-500">Quando ligado, o valor deste salário na folha fica visível <b>apenas para o Diretor e a Diretora Financeira</b> — os demais gestores veem o nome, mas o valor aparece bloqueado.</span></span>
      </label>
    </div>}

    {tipo==="clt" && !ehConf && <div className="mt-4">
      <button onClick={()=>setShowDocs(v=>!v)} className="w-full flex items-center gap-2 text-xs font-semibold text-slate-600 hover:text-slate-900 py-2 px-3 rounded-xl bg-slate-50 border border-slate-200">
        <Icon d={I.doc} className="w-3.5 h-3.5"/> Documentos (opcional) {nDocsUp>0 && <Badge tone="green">{nDocsUp} enviado(s)</Badge>}
        <Icon d={I.arrow} className={cx("w-3.5 h-3.5 ml-auto transition", showDocs?"rotate-90":"rotate-0")}/>
      </button>
      {showDocs && <div className="grid sm:grid-cols-2 gap-2 mt-2">
        {DOC_TIPOS.map(([k,l])=>{ const arq=f.docs?.[k];
          return <div key={k} className={cx("flex items-center gap-2.5 p-2.5 rounded-xl border", arq?"border-emerald-200 bg-emerald-50/40":"border-slate-200")}>
            <div className={cx("w-8 h-8 rounded-lg grid place-items-center shrink-0", arq?"bg-emerald-100 text-emerald-600":"bg-slate-100 text-slate-400")}><Icon d={I.doc} className="w-4 h-4"/></div>
            <div className="flex-1 min-w-0"><div className="text-sm font-semibold text-slate-800">{l}</div>
              {arq ? <div className="text-xs text-emerald-700 truncate flex items-center gap-1"><Icon d={I.check} className="w-3 h-3"/>{docNome(arq)}</div>
                   : <div className="text-xs text-slate-400">Não enviado</div>}</div>
            {arq && <button onClick={()=>rmDoc(k)} className="text-slate-300 hover:text-rose-500 shrink-0"><Icon d={I.x} className="w-4 h-4"/></button>}
            <label className="cursor-pointer shrink-0">
              <span className="inline-flex items-center gap-1 text-xs font-semibold text-brand-700 bg-brand-50 hover:bg-brand-100 px-2.5 py-1.5 rounded-lg"><Icon d={I.upload} className="w-3.5 h-3.5"/>{arq?"Trocar":"Enviar"}</span>
              <input type="file" accept="image/*,application/pdf" capture="environment" className="hidden" onChange={e=>upDoc(k,e.target.files&&e.target.files[0])}/>
            </label>
          </div>;})}
      </div>}
    </div>}
    {tipo==="clt" && !ehConf && !inicial && <p className="text-xs text-slate-500 mt-3 flex items-center gap-1"><Icon d={I.calendar} className="w-3.5 h-3.5"/> Ao cadastrar, o {ehFixo?"Freela Fixo":"CLT"} entra automaticamente na escala ({f.escala}) da sua casa, com a folga no dia escolhido.</p>}
    </div>
    {/* Rodapé fixo — sempre visível, com o que falta */}
    <div className="border-t border-slate-100 px-5 py-3 shrink-0 bg-white rounded-b-3xl">
      {!valido && <p className="text-xs text-rose-500 mb-2 text-center">Falta preencher: <b>{faltando.join(", ")}</b></p>}
      <div className="flex gap-2">
        <Btn variant="ghost" onClick={onClose}>Voltar</Btn>
        <Btn className="flex-1" disabled={!valido} icon={I.check} variant={tipo==="clt"?"primary":"free"} onClick={()=>onSalvar(f)}>{inicial?"Salvar alterações":"Cadastrar"}</Btn>
      </div>
    </div>
  </div>;
}

/* ============================ COLABORADORES CLT ============================ */
function ColaboradoresCLT() {
  const { clts, salvarClt, excluirColab, unidades, registros, pontoHist, can } = useStore();
  const toast=useContext(ToastCtx);
  const apurCltTodos=useMemo(()=>apurarHoras([...pontoHist, ...(registros||[])]).filter(x=>x.tipo==="clt"&&x.completo),[pontoHist,registros]);
  const bancoDe=(c)=>{ const meus=apurCltTodos.filter(x=>x.nome===c.nome);
    const extras=meus.reduce((s,x)=>s+(x.extras||0)+(x.extras100||0),0), atraso=meus.reduce((s,x)=>s+(x.atraso||0),0), not=meus.reduce((s,x)=>s+minutosNoturnos(x.punches||[]),0);
    return {extras,atraso,not,saldo:extras-atraso}; };
  const [q,setQ]=useState("");
  const [form,setForm]=useState(null); // {inicial?} aberto p/ cadastro/edição
  const [pasta,setPasta]=useState(null); // colaborador aberto
  const [tab,setTab]=useState("dados");
  const [confirmar,setConfirmar]=useState(null);
  const [casa,setCasa]=useState("todas");
  const [vinc,setVinc]=useState("todos"); // filtro: todos | clt | fixo | confianca
  const ehFixo=(c)=>c.vinculo==="fixo";
  const ehConf=(c)=>c.vinculo==="confianca";
  const casaOk=(c)=> casa==="todas" || c.unidade===casa || (ehConf(c)&&(c.unidade==="todas"||c.unidade==null));
  const list=clts.filter(c=>c.nome.toLowerCase().includes(q.toLowerCase()) && casaOk(c)
    && (vinc==="todos" || (vinc==="confianca"?ehConf(c): vinc==="fixo"?ehFixo(c): (!ehFixo(c)&&!ehConf(c)))));

  return <div className="fade-in">
    <PageHeader title="Colaboradores CLT & Freela Fixo" sub="Escala fixa · salário mensal · cargos de confiança · pasta individual · cadastro, edição e exclusão">
      <Btn icon={I.plus} onClick={()=>setForm({})}>Contratar CLT</Btn>
      <Btn variant="free" icon={I.plus} onClick={()=>setForm({vinculo:"fixo"})}>Contratar Freela Fixo</Btn>
      <Btn variant="ghost" icon={I.shield} onClick={()=>setForm({vinculo:"confianca"})}>Cargo de confiança</Btn>
    </PageHeader>
    <div className="flex flex-wrap gap-2 mb-3">
      {[["todos","Todos"],["clt","CLT"],["fixo","Freela Fixo"],["confianca","Confiança"]].map(([k,l])=><button key={k} onClick={()=>setVinc(k)} className={cx("px-3 py-1.5 rounded-lg text-xs font-semibold border transition", vinc===k?"grad-brand text-white border-transparent":"bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>{l}</button>)}
    </div>
    <Card className="p-2 mb-3"><div className="flex items-center gap-2 px-3 py-2">
      <Icon d={I.search} className="w-4 h-4 text-slate-400"/>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar colaborador…" className="flex-1 outline-none text-sm bg-transparent"/>
    </div></Card>
    <FiltroCasa casa={casa} setCasa={setCasa} unidades={unidades}/>
    <Card className="overflow-hidden">
      <div className="overflow-x-auto"><table className="w-full text-sm min-w-[760px]">
        <thead><tr className="text-left text-slate-400 border-b border-slate-100">
          {["Colaborador","Cargo","Escala","Unidade","Banco","Docs",""].map(h=><th key={h} className="px-4 py-3 font-semibold">{h}</th>)}
        </tr></thead>
        <tbody className="divide-y divide-slate-50">
          {list.map(c=>{ const _docs=c.docs||{}; const docsOk=Object.values(_docs).filter(Boolean).length; const docsTot=Object.keys(_docs).length;
            return <tr key={c.id} className="hover:bg-slate-50/70">
              <td className="px-4 py-3"><button onClick={()=>{setPasta(c);setTab("dados");}} className="flex items-center gap-3 text-left"><Avatar name={c.nome} src={c.foto} tone={ehConf(c)?"slate":ehFixo(c)?"free":"brand"}/><span className="font-semibold text-slate-800">{c.nome}</span><BadgeVigencia p={c} tipo="clt"/>{ehConf(c)&&<Badge tone="slate">Confiança</Badge>}{ehFixo(c)&&<Badge tone="free">Freela Fixo</Badge>}</button></td>
              <td className="px-4 py-3 text-slate-600">{c.cargo}</td>
              <td className="px-4 py-3">{ehConf(c)?<Badge tone="slate">sem ponto</Badge>:<Badge tone="brand">{c.escala}</Badge>}</td>
              <td className="px-4 py-3 text-slate-600">{ehConf(c)&&(c.unidade==="todas"||c.unidade==null)?"Todas as casas":unidadeNome(c.unidade,unidades)}</td>
              <td className="px-4 py-3">{ehConf(c)?<span className="text-slate-400">—</span>:<span className={cx("font-semibold", (c.banco||"").startsWith("-")?"text-rose-600":"text-emerald-600")}>{c.banco}</span>}</td>
              <td className="px-4 py-3">{ehConf(c)?<span className="text-slate-400">—</span>:<Badge tone={docsOk===docsTot?"green":"amber"}>{docsOk}/{docsTot}</Badge>}</td>
              <td className="px-4 py-3"><div className="flex gap-1 justify-end">
                <button onClick={()=>setForm({inicial:c})} className="w-8 h-8 rounded-lg hover:bg-slate-100 grid place-items-center text-slate-500"><Icon d={I.edit} className="w-4 h-4"/></button>
                {can("excluir") && <button onClick={()=>setConfirmar(c)} className="w-8 h-8 rounded-lg hover:bg-rose-50 grid place-items-center text-slate-400 hover:text-rose-500"><Icon d={I.trash} className="w-4 h-4"/></button>}
              </div></td>
            </tr>;})}
          {list.length===0 && <tr><td colSpan="7" className="px-4 py-8 text-center text-slate-400">Nenhum colaborador. Clique em “Contratar CLT”.</td></tr>}
        </tbody>
      </table></div>
    </Card>

    <Modal open={!!form} onClose={()=>setForm(null)} wide>
      {form && <ColabForm tipo="clt" vinculo={form.vinculo||form.inicial?.vinculo} inicial={form.inicial} onClose={()=>setForm(null)}
        onSalvar={(dados)=>{ const vc=form.vinculo||form.inicial?.vinculo; const rec={...dados}; if(vc) rec.vinculo=vc; salvarClt(form.inicial?{...form.inicial,...rec}:rec); setForm(null); toast(form.inicial?"Colaborador atualizado":(vc==="confianca"?"Cargo de confiança cadastrado na folha":vc==="fixo"?"Freela Fixo cadastrado e escalado":"CLT contratado e escalado")); }}/>}
    </Modal>

    <Modal open={!!confirmar} onClose={()=>setConfirmar(null)}>
      {confirmar && <div className="p-6 text-center">
        <div className="w-14 h-14 mx-auto rounded-full bg-rose-50 text-rose-500 grid place-items-center mb-3"><Icon d={I.trash} className="w-7 h-7"/></div>
        <h3 className="text-lg font-bold text-slate-900">Excluir {confirmar.nome}?</h3>
        <p className="text-slate-500 text-sm mt-1">O colaborador e suas alocações na escala serão removidos.</p>
        <div className="flex gap-2 mt-5"><Btn variant="ghost" className="flex-1" onClick={()=>setConfirmar(null)}>Cancelar</Btn>
          <Btn variant="danger" className="flex-1" icon={I.trash} onClick={()=>{excluirColab(confirmar.id,"clt");setConfirmar(null);toast("Colaborador excluído");}}>Excluir</Btn></div>

// minuto pertence ao horário noturno (22:00–05:00, Art. 73 CLT)?
const ehMinNoturno=(m)=>{ const x=((m%1440)+1440)%1440; return x>=1320 || x<300; };
function minutosNoturnos(punches){ const g=a=>{ const p=punches.find(x=>x.acao===a); return p?p.min:null; };
  const ent=g("Entrada"), sai=g("Saída"); if(ent==null||sai==null) return 0;
  const fim=sai<ent?sai+1440:sai; let c=0; for(let m=ent;m<fim;m++){ if(ehMinNoturno(m)) c++; } return c; }
const fmtSaldo=(min)=> (min<0?"-":"+")+fmtHoras(min);
function Relatorios() {
  const { clts, freelas, unidades, registros, pontoHist, getDossie } = useStore();
  const toast=useContext(ToastCtx);
  const [f,setF]=useState("extras");
  const [casa,setCasa]=useState("todas");
  const filtros=[["extras","Horas extras"],["atrasos","Atrasos & faltas"],["banco","Banco de horas"],["noturno","Adicional noturno"]];
  const cols={extras:["Colaborador","Horas extras","Escala"],atrasos:["Colaborador","Atrasos & faltas","Escala"],banco:["Colaborador","Saldo de horas","Escala"],noturno:["Colaborador","Horas noturnas","Escala"]};
  // Apuração REAL das batidas (CLT) — extras, atraso e noturno vêm dos registros; faltas do dossiê.
  const apur=apurarHoras([...pontoHist, ...registros]).filter(x=>x.tipo==="clt" && x.completo);
  const dados = clts.filter(c=>casa==="todas"||c.unidade===casa).map(c=>{
    const meus=apur.filter(x=>x.nome===c.nome);
    const extrasMin=meus.reduce((s,x)=>s+(x.extras||0)+(x.extras100||0),0);
    const atrasoMin=meus.reduce((s,x)=>s+(x.atraso||0),0);
    const notMin=meus.reduce((s,x)=>s+minutosNoturnos(x.punches||[]),0);
    const dos=getDossie("clt-"+c.id);
    const faltasQtd=(dos.faltas||[]).filter(x=>x.tipo==="falta"&&x.descontar).length;
    const atrasosQtd=(dos.faltas||[]).filter(x=>x.tipo==="atraso").length;
    return { c, extrasMin, atrasoMin, notMin, faltasQtd, atrasosQtd, saldoMin: extrasMin-atrasoMin };
  });
  const val=(d)=> f==="extras" ? (d.extrasMin?fmtHoras(d.extrasMin):"—")
    : f==="atrasos" ? ((d.atrasoMin?fmtHoras(d.atrasoMin):"0h00")+(d.faltasQtd?` · ${d.faltasQtd} falta(s)`:""))
    : f==="banco" ? fmtSaldo(d.saldoMin)
    : (d.notMin?fmtHoras(d.notMin):"—");
  const neg=(d)=> f==="banco" ? d.saldoMin<0 : f==="atrasos" ? (d.atrasoMin>0||d.faltasQtd>0) : false;
  const exportar=()=>{
    const cab="Colaborador;Escala;Horas_extras;Atrasos;Faltas;Saldo_banco_horas;Horas_noturnas";
    const corpo=dados.map(d=>`${d.c.nome};${d.c.escala};${fmtHoras(d.extrasMin)};${fmtHoras(d.atrasoMin)};${d.faltasQtd};${fmtSaldo(d.saldoMin)};${fmtHoras(d.notMin)}`).join("\n");
    const blob=new Blob([cab+"\n"+corpo],{type:"text/csv"}); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="relatorio-clt.csv"; a.click(); URL.revokeObjectURL(url);
    toast("Relatório consolidado exportado");
  };
  return <div className="fade-in">
    <PageHeader title="Relatórios" sub="Cálculo conforme CLT e Portaria 671/2021 · consolidado para folha">
      <Btn variant="ghost" icon={I.download} onClick={exportar}>Exportar</Btn>
    </PageHeader>
    <div className="flex flex-wrap gap-2 mb-3">
      {filtros.map(([k,l])=><button key={k} onClick={()=>setF(k)} className={cx("px-4 py-2 rounded-xl text-sm font-semibold border transition", f===k?"grad-brand text-white border-transparent shadow-glow":"bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>{l}</button>)}
    </div>
    <FiltroCasa casa={casa} setCasa={setCasa} unidades={unidades}/>
    {f==="noturno" && <div className="mb-3 text-xs text-slate-400">Adicional noturno: horas trabalhadas entre 22h e 5h (Art. 73 CLT) — calculado das batidas reais.</div>}
    {f==="banco" && <div className="mb-3 text-xs text-slate-400">Saldo do banco de horas = horas extras − atrasos (das batidas reais).</div>}
    <Card className="overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm min-w-[520px]">
      <thead><tr className="text-left text-slate-400 border-b border-slate-100">{cols[f].map(h=><th key={h} className="px-4 py-3 font-semibold">{h}</th>)}</tr></thead>
      <tbody className="divide-y divide-slate-50">
        {dados.map((d,i)=><tr key={i} className="hover:bg-slate-50/70">
          <td className="px-4 py-3"><div className="flex items-center gap-2"><Avatar name={d.c.nome} src={d.c.foto} tone="brand" size="w-7 h-7"/><span className="font-semibold text-slate-800">{d.c.nome}</span></div></td>
          <td className={cx("px-4 py-3 font-semibold tabular-nums", neg(d)?"text-rose-600":"text-slate-700")}>{val(d)}</td>
          <td className="px-4 py-3"><Badge tone="brand">{d.c.escala}</Badge></td>
        </tr>)}
        {dados.length===0 && <tr><td colSpan="3" className="px-4 py-8 text-center text-slate-400">Nenhum colaborador CLT nesta casa.</td></tr>}
      </tbody></table></div></Card>
  </div>;
}

// Pagamentos de SALARIADOS (CLT ou Cargos de confiança) — parcelado/adiantamento + saldo, modelo dos freelancers.
function PagamentoSalariados({ modo, ini, fim, uni }){
  const { clts, pjs, unidades, registros, pontoHist, getDossie, cltExtraAjuste, gorjetasCLT, escala, escalaOv, atestados, acesso, pagamentosCLT, addPagamentoCLT, removePagamentoCLT, pagamentosPJ, addPagamentoPJ, removePagamentoPJ, faltaDescontoDesde } = useStore();
  const ehPJ = modo==="pj";
  const pagMap = ehPJ ? pagamentosPJ : pagamentosCLT;
  const addPag = ehPJ ? addPagamentoPJ : addPagamentoCLT;
  const removePag = ehPJ ? removePagamentoPJ : removePagamentoCLT;
  const toast=useContext(ToastCtx);
  const _clock=useClock(60000);
  const [aberto,setAberto]=useState(null);
  const [novoPag,setNovoPag]=useState({});
  const podeSigilo=!acesso||acesso.podeSigilo;
  const naData=(d)=> (!ini||d>=ini)&&(!fim||d<=fim);
  const ymRef=(ini||hojeStr()).slice(0,7);
  const _nowMin=_clock.getHours()*60+_clock.getMinutes();
  const apurCLT=apurarHoras([...pontoHist,...registros]).filter(x=>x.tipo==="clt"&&x.completo&&naData(x.dia));
  const faltasCtx={ escala, escalaOv, registros:[...pontoHist,...registros], atestados, ini, fim, hoje:hojeStr(), nowMin:_nowMin, desde:faltaDescontoDesde };
  const folhaCtx={ apurCLT, cltExtraAjuste, gorjetasCLT, ymRef, getDossie, naData, faltasCtx };
  const naCasa=(c)=> uni==="todas" || c.unidade===Number(uni) || ((modo==="confianca"||ehPJ) && (c.unidade==="todas"||c.unidade==null));
  const lista = (ehPJ
    ? (pjs||[]).filter(pj=>pjAtivoNoPeriodo(pj,ini,fim))
    : modo==="confianca"
    ? clts.filter(c=>c.vinculo==="confianca")
    : clts.filter(c=>c.vinculo!=="fixo" && c.vinculo!=="confianca")).filter(naCasa);
  const pagosDe=(id)=> (pagMap[String(id)]||[]).filter(p=>{ const r=p.ref||p.data; return (r||"").slice(0,7)===ymRef || naData(r); });
  const linhas=lista.map(c=>{
    let total, det=null;
    if(ehPJ){ const meses=pjMesesNoPeriodo(c,ini,fim); total=Number(c.valor||0)*meses.length;
      det={ meses, venc:pjVencimento(c,ymRef), forma:c.formaPagamento||"Pix", cnpj:c.cnpj }; }
    else if(modo==="confianca"){ total=Number(c.salario||0); }
    else { det=calcFolhaLinha(c,folhaCtx); total=det.liquido; }
    const oculto = modo==="confianca" && c.sigiloso && !podeSigilo;
    const pagos=pagosDe(c.id); const pago=pagos.reduce((s,p)=>s+Number(p.valor||0),0);
    return { id:c.id, nome:c.nome, foto:c.foto, pix:c.pix, cargo:ehPJ?(c.servico||"Prestador PJ"):c.cargo, sigiloso:!!c.sigiloso, oculto, total, pago, saldo:total-pago, pagos, det };
  }).sort((a,b)=>b.total-a.total);
  const vis=linhas.filter(l=>!l.oculto);
  const totalGeral=vis.reduce((s,l)=>s+l.total,0);
  const totalPago=vis.reduce((s,l)=>s+l.pago,0);
  const saldoGeral=totalGeral-totalPago;
  const confOcultos=linhas.filter(l=>l.oculto).length;
  const pagarTudo=(l)=>{ if(l.saldo<=0){ toast("Nada em aberto para "+l.nome); return; } addPag(l.id,{data:hojeStr(), ref:(ini||hojeStr()), valor:Math.round(l.saldo*100)/100, obs:(ehPJ?"Prestação de serviço ":modo==="confianca"?"Salário ":"Folha ")+ymRef}); toast("Pagamento registrado"); };
  const lancarPag=(l)=>{ const np=novoPag[l.id]||{}; const v=Number(np.valor||0); if(!v){ toast("Informe o valor do pagamento"); return; } addPag(l.id,{data:hojeStr(), ref:(ini||hojeStr()), valor:v, obs:np.obs||"Adiantamento"}); setNovoPag(p=>({...p,[l.id]:{valor:"",obs:""}})); toast("Pagamento registrado"); };
  const rot = ehPJ?"Prestadores PJ":modo==="confianca"?"Gerência & Diretoria":"CLT";
  const atrasado=(l)=> ehPJ && l.saldo>0 && l.det && l.det.venc && l.det.venc<hojeStr();
  return <>
    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
      <StatCard icon={I.wallet} label={"Total a pagar ("+rot+")"} value={fmtBRL(totalGeral)} tone="brand"/>
      <StatCard icon={I.check} label="Já pago" value={fmtBRL(totalPago)} tone="green"/>
      <StatCard icon={I.pix} label="Saldo restante" value={fmtBRL(saldoGeral)} tone={saldoGeral>0?"amber":"green"}/>
      <StatCard icon={I.user} label={rot} value={linhas.length} tone="slate"/>
    </div>
    {modo==="confianca" && confOcultos>0 && <div className="mb-3 p-3 rounded-xl bg-amber-50 text-amber-700 text-xs flex items-center gap-2"><Icon d={I.shield} className="w-4 h-4"/> {confOcultos} pagamento(s) de diretoria ocultos — valor visível apenas para o Diretor e a Diretora Financeira.</div>}
    <Card className="overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm min-w-[760px]">

      <tbody className="divide-y divide-slate-50">
        {linhas.map(l=>[
          <tr key={l.id} className={cx("hover:bg-slate-50/70", !l.oculto&&"cursor-pointer")} onClick={()=>{ if(!l.oculto) setAberto(aberto===l.id?null:l.id); }}>
          <td className="px-4 py-3"><div className="flex items-center gap-2">{!l.oculto&&<Icon d={aberto===l.id?I.x:I.plus} className="w-3.5 h-3.5 text-slate-400"/>}<Avatar name={l.nome} src={l.foto} tone={modo==="confianca"||ehPJ?"slate":"brand"} size="w-7 h-7"/><span className="font-semibold text-slate-800">{l.nome}</span>{l.sigiloso&&<Badge tone="amber">sigiloso</Badge>}{ehPJ&&<Badge tone="blue">PJ</Badge>}</div></td>
          <td className="px-4 py-3 text-slate-600">{l.cargo}</td>
          <td className="px-4 py-3 font-bold text-slate-900 tabular-nums">{l.oculto?<span className="inline-flex items-center gap-1 text-slate-400"><Icon d={I.shield} className="w-3.5 h-3.5"/>••••••</span>:fmtBRL(l.total)}</td>
          <td className="px-4 py-3 text-emerald-600 tabular-nums">{l.oculto?"—":(l.pago>0?fmtBRL(l.pago):"—")}</td>
          <td className={cx("px-4 py-3 font-semibold tabular-nums", l.oculto?"text-slate-400":l.saldo>0?"text-amber-600":"text-emerald-600")}>{l.oculto?"—":fmtBRL(l.saldo)}</td>
          <td className="px-4 py-3 font-mono text-xs text-slate-500">{ehPJ && l.det && l.det.venc && <div className={cx("font-sans font-semibold mb-0.5", atrasado(l)?"text-rose-600":l.saldo<=0?"text-emerald-600":"text-slate-600")}>{l.saldo<=0?"pago":atrasado(l)?"vencido "+fmtDataBR(l.det.venc):"vence "+fmtDataBR(l.det.venc)}</div>}{l.oculto?"—":(l.pix||"—")}</td>
        </tr>,
          aberto===l.id && !l.oculto && <tr key={l.id+"-d"} className="bg-slate-50/60"><td colSpan="6" className="px-4 py-4" onClick={e=>e.stopPropagation()}>
            <div className="grid lg:grid-cols-3 gap-4">
              <div className="lg:col-span-2">
                <div className="text-xs font-bold text-slate-500 uppercase mb-2">Resumo do mês</div>
                <div className="bg-white rounded-xl border border-slate-100 p-3 text-sm space-y-1">
                  {modo!=="confianca" && l.det && <>
                    <div className="flex justify-between"><span className="text-slate-500">Salário base</span><span className="tabular-nums">{fmtBRL(l.det.salario)}</span></div>
                    <div className="flex justify-between"><span className="text-slate-500">Horas extras</span><span className="tabular-nums text-emerald-600">+{fmtBRL(l.det.extrasVal)}</span></div>
                    {l.det.notVal>0 && <div className="flex justify-between"><span className="text-slate-500">Adic. noturno</span><span className="tabular-nums text-emerald-600">+{fmtBRL(l.det.notVal)}</span></div>}
                    {l.det.vt>0 && <div className="flex justify-between"><span className="text-slate-500">Vale Transporte ({fmtBRL(l.det.vt)}) − 6%</span><span className="tabular-nums text-rose-600">-{fmtBRL(l.det.vtDesconto)}</span></div>}
                    {(l.det.descontos-l.det.vtDesconto)>0 && <div className="flex justify-between"><span className="text-slate-500">Descontos ({l.det.faltasQtd} falta{l.det.dsrQtd?` +${l.det.dsrQtd} DSR`:""})</span><span className="tabular-nums text-rose-600">-{fmtBRL(l.det.descontos-l.det.vtDesconto)}</span></div>}
                  </>}
                  {modo==="confianca" && <div className="flex justify-between"><span className="text-slate-500">Salário mensal</span><span className="tabular-nums">{fmtBRL(l.total)}</span></div>}
                  {ehPJ && l.det && <>
                    <div className="flex justify-between"><span className="text-slate-500">Valor mensal × {l.det.meses.length} mês(es)</span><span className="tabular-nums">{fmtBRL(l.total)}</span></div>
                    <div className="flex justify-between"><span className="text-slate-500">Vencimento</span><span>{l.det.venc?fmtDataBR(l.det.venc):"—"} · {l.det.forma}</span></div>
                    {l.det.cnpj && <div className="flex justify-between"><span className="text-slate-500">CNPJ</span><span className="font-mono text-xs">{l.det.cnpj}</span></div>}
                  </>}
                  <div className="flex justify-between border-t border-slate-100 pt-1 font-bold"><span className="text-slate-700">{modo==="confianca"||ehPJ?"Total":"Líquido do mês"}</span><span className="tabular-nums text-slate-900">{fmtBRL(l.total)}</span></div>
                </div>
                <div className="text-[11px] font-bold text-slate-400 uppercase mt-3 mb-1.5">Pagamentos registrados</div>
                <div className="space-y-1.5">
                  {l.pagos.length===0 && <p className="text-xs text-slate-400">Nenhum pagamento registrado ainda.</p>}
                  {l.pagos.map(p=><div key={p.id} className="flex items-center gap-2 text-sm bg-white rounded-lg px-3 py-2 border border-slate-100">
                    <div className="min-w-0"><div className="font-semibold text-slate-800 tabular-nums">{fmtBRL(Number(p.valor||0))}</div><div className="text-[11px] text-slate-400 truncate">{fmtDataBR(p.data)} · {p.obs||"—"}</div></div>
                    <button onClick={()=>removePag(l.id,p.id)} className="ml-auto text-slate-300 hover:text-rose-500" title="Remover"><Icon d={I.trash} className="w-4 h-4"/></button>
                  </div>)}
                </div>
              </div>
              <div>
                <div className="bg-white rounded-xl border border-slate-100 p-3 space-y-2">
                  <div className="flex items-center justify-between text-sm"><span className="text-slate-500">Total do mês</span><span className="font-bold tabular-nums">{fmtBRL(l.total)}</span></div>
                  <div className="flex items-center justify-between text-sm"><span className="text-slate-500">Já pago</span><span className="font-bold text-emerald-600 tabular-nums">{fmtBRL(l.pago)}</span></div>
                  <div className="flex items-center justify-between text-sm border-t border-slate-100 pt-2"><span className="font-semibold text-slate-600">Saldo</span><span className={cx("font-extrabold tabular-nums", l.saldo>0?"text-amber-600":"text-emerald-600")}>{fmtBRL(l.saldo)}</span></div>
                  <button onClick={()=>pagarTudo(l)} disabled={l.saldo<=0} className={cx("w-full px-3 py-1.5 rounded-lg text-xs font-bold text-white", l.saldo>0?"grad-brand hover:opacity-90":"bg-slate-300 cursor-not-allowed")}>Pagar saldo do mês</button>
                </div>
                <div className="text-[11px] font-bold text-slate-400 uppercase mt-3 mb-1.5">Adiantamento / parcial</div>
                <div className="bg-white rounded-xl border border-slate-100 p-3 space-y-2">
                  <div className="flex items-center gap-1"><span className="text-slate-500 text-xs">R$</span><input type="number" placeholder="valor" value={(novoPag[l.id]||{}).valor||""} onChange={e=>setNovoPag(p=>({...p,[l.id]:{...(p[l.id]||{}),valor:e.target.value}}))} className="w-full px-2 py-1.5 rounded-lg border border-slate-200 text-sm"/></div>
                  <input type="text" placeholder="observação (ex.: adiantamento Pix)" value={(novoPag[l.id]||{}).obs||""} onChange={e=>setNovoPag(p=>({...p,[l.id]:{...(p[l.id]||{}),obs:e.target.value}}))} className="w-full px-2 py-1.5 rounded-lg border border-slate-200 text-sm"/>
                  <button onClick={()=>lancarPag(l)} className="w-full px-3 py-1.5 rounded-lg text-xs font-bold grad-brand text-white hover:opacity-90">Registrar pagamento</button>
                </div>
              </div>
            </div>
          </td></tr>
        ])}
        {linhas.length===0 && <tr><td colSpan="6" className="px-4 py-8 text-center text-slate-400">Nenhum {ehPJ?"prestador PJ ativo":modo==="confianca"?"cargo de confiança":"colaborador CLT"} nesta casa.</td></tr>}
      </tbody>
      {vis.length>0 && <tfoot><tr className="border-t-2 border-slate-100 bg-slate-50/60">
        <td className="px-4 py-3 font-bold" colSpan="2">Total {podeSigilo?"":"(visível)"}</td>
        <td className="px-4 py-3 font-extrabold text-slate-900 tabular-nums">{fmtBRL(totalGeral)}</td>
        <td className="px-4 py-3 font-bold text-emerald-600 tabular-nums">{fmtBRL(totalPago)}</td>
        <td className={cx("px-4 py-3 font-extrabold tabular-nums", saldoGeral>0?"text-amber-600":"text-emerald-600")}>{fmtBRL(saldoGeral)}</td><td/></tr></tfoot>}
    </table></div></Card>
    <p className="text-xs text-slate-400 mt-3">{ehPJ?"Valor mensal do contrato de cada prestador PJ (proporcional aos meses de vigência no período), com o vencimento no dia de pagamento cadastrado. ":modo==="confianca"?"Salário mensal fixo dos cargos de confiança. ":"Líquido do mês = salário + extras/adic. noturno − faltas/DSR (mesma conta da folha). "}Clique no nome para registrar pagamentos parciais, adiantamentos e o saldo restante.</p>
  </>;
}

function Pagamentos() {
  const { freelasComPagamentos:freelas, unidades, setFreelaAjuste, pagamentosFreela, addPagamentoFreela, removePagamentoFreela } = useStore();
  const toast=useContext(ToastCtx);
  const _mr=mesAtualRange();
  const [ini,setIni]=useState(_mr.ini);
  const [fim,setFim]=useState(_mr.fim);
  const [uni,setUni]=useState("todas");
  const [abaP,setAbaP]=useState("freela"); // freela | clt | confianca
  const [aberto,setAberto]=useState(null); // freelancer expandido
  const [novoPag,setNovoPag]=useState({}); // {fid:{valor,obs}}

  const dentro=(j)=> (!ini||j.data>=ini) && (!fim||j.data<=fim) && (uni==="todas"||j.unidade===Number(uni));
  const daCasa=(fr)=> uni==="todas" || Number(fr.unidade)===Number(uni);
  // agrupa jornadas por SEMANA (segunda-feira), para acumulado semanal e "pagar semana"
  const porSemana=(js)=>{ const m={}; js.forEach(j=>{ const [y,mo,d]=j.data.split("-").map(Number); const wk=ymd(segDaSemana(new Date(y,mo-1,d))); (m[wk]=m[wk]||[]).push(j); }); return Object.keys(m).sort().map(wk=>({wk, js:m[wk], total:m[wk].reduce((s,j)=>s+j.valor,0)})); };
  // Um pagamento é contado no período exibido se: (a) é "pagar semana" de uma das semanas exibidas
  // (a semana da Segunda pode cair no mês anterior, então casamos pela semana e não pela data),
  // ou (b) seu "ref"/data cai dentro do filtro (pagamentos manuais/adiantamentos).
  const pagosDe=(fid,wksVis)=> (pagamentosFreela[String(fid)]||[]).filter(p=>{
    if(p.semana && wksVis.has(p.semana)) return true;
    const r=p.ref||p.data; return (!ini||r>=ini)&&(!fim||r<=fim);
  });
  const linhas = freelas.map(fr=>{
    const js=(fr.jornadasHist||[]).filter(dentro).sort((a,b)=>(a.data<b.data?-1:1));
    const total=js.reduce((s,j)=>s+j.valor,0);
    const semanas=porSemana(js); const wksVis=new Set(semanas.map(s=>s.wk));
    const pagos=pagosDe(fr.id,wksVis); const pago=pagos.reduce((s,p)=>s+Number(p.valor||0),0);
    return { id:fr.id, nome:fr.nome, cargo:fr.cargo, pix:fr.pix, unidade:fr.unidade, jornadas:js.length, js,
      semanas, pagos, pago, saldo: total-pago,
      horas:js.reduce((s,j)=>s+(j.horas||0),0), total, casas:[...new Set(js.map(j=>j.unidade))] };
  // inclui também os freelancers cadastrados na casa (mesmo sem jornada no período)
  }).filter(l=> l.jornadas>0 || l.pago>0 || daCasa(l)).sort((a,b)=>b.total-a.total);
  const totalGeral=linhas.reduce((s,l)=>s+l.total,0);
  const totalPago=linhas.reduce((s,l)=>s+l.pago,0);
  const saldoGeral=totalGeral-totalPago;
  const horasGeral=linhas.reduce((s,l)=>s+l.horas,0);
  const pagarSemana=(l,s)=>{ addPagamentoFreela(l.id,{data:hojeStr(), ref:s.wk, valor:s.total, semana:s.wk, obs:"Semana "+fmtDataBR(s.wk)}); toast("Pagamento da semana registrado"); };
  const lancarPag=(l)=>{ const np=novoPag[l.id]||{}; const v=Number(np.valor||0); if(!v){ toast("Informe o valor do pagamento"); return; } addPagamentoFreela(l.id,{data:hojeStr(), ref:(ini||hojeStr()), valor:v, obs:np.obs||"Adiantamento"}); setNovoPag(p=>({...p,[l.id]:{valor:"",obs:""}})); toast("Pagamento registrado"); };

  const exportar=()=>{
    const cab="Freelancer;Funcao;Diarias;Horas;Valor_total_R$;Pago_R$;Saldo_R$;Chave_Pix";
    const corpo=linhas.map(l=>`${l.nome};${l.cargo};${l.jornadas};${l.horas};${l.total.toFixed(2)};${l.pago.toFixed(2)};${l.saldo.toFixed(2)};${l.pix}`).join("\n");
    const blob=new Blob([cab+"\n"+corpo],{type:"text/csv"}); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=`pagamentos-freelancers_${ini}_a_${fim}.csv`; a.click(); URL.revokeObjectURL(url);
    toast("CSV consolidado exportado para o financeiro");
  };

  return <div className="fade-in">
    <PageHeader title="Pagamentos" sub="Freelancers, CLT, gerência/diretoria e prestadores PJ · pagamento parcelado (adiantamentos), saldo do mês e filtro por período/casa">
      {abaP==="freela" && <Btn icon={I.download} onClick={exportar}>Exportar consolidado</Btn>}
    </PageHeader>

    <div className="flex flex-wrap gap-2 mb-3">
      {[["freela","Freelancers"],["clt","CLT"],["confianca","Gerência & Diretoria"],["pj","Prestadores PJ"]].map(([k,l])=>
        <button key={k} onClick={()=>{setAbaP(k);setAberto(null);}} className={cx("px-4 py-2 rounded-xl text-sm font-semibold border transition", abaP===k?"grad-brand text-white border-transparent shadow-glow":"bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>{l}</button>)}
    </div>

    <Card className="p-4 mb-4">
      <div className="flex flex-wrap items-end gap-3">
        <div className="flex items-center gap-2 text-slate-400"><Icon d={I.filter} className="w-4 h-4"/><span className="text-xs font-bold uppercase">Filtros</span></div>
        <Field label="De"><Input type="date" value={ini} onChange={e=>setIni(e.target.value)}/></Field>
        <Field label="Até"><Input type="date" value={fim} onChange={e=>setFim(e.target.value)}/></Field>
        <Field label="Casa (unidade)"><Select value={uni} onChange={e=>setUni(e.target.value)}>
          <option value="todas">Todas as casas</option>{unidades.map(u=><option key={u.id} value={u.id}>{u.nome}</option>)}
        </Select></Field>
      </div>
    </Card>

    {abaP!=="freela" ? <PagamentoSalariados modo={abaP} ini={ini} fim={fim} uni={uni}/> : <>
    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
      <StatCard icon={I.wallet} label="Total a pagar (mês)" value={fmtBRL(totalGeral)} tone="free"/>
      <StatCard icon={I.check} label="Já pago" value={fmtBRL(totalPago)} tone="green"/>
      <StatCard icon={I.pix} label="Saldo restante" value={fmtBRL(saldoGeral)} tone={saldoGeral>0?"amber":"green"}/>
      <StatCard icon={I.coffee} label="Freelancers" value={linhas.length} tone="brand"/>
    </div>

    <Card className="overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm min-w-[820px]">
      <thead><tr className="text-left text-slate-400 border-b border-slate-100">{["Freelancer","Função","Diárias","Acumulado","Pago","Saldo","Pix"].map(h=><th key={h} className="px-4 py-3 font-semibold">{h}</th>)}</tr></thead>
      <tbody className="divide-y divide-slate-50">
        {linhas.map(l=>[
          <tr key={l.id} className="hover:bg-slate-50/70 cursor-pointer" onClick={()=>setAberto(aberto===l.id?null:l.id)}>
          <td className="px-4 py-3"><div className="flex items-center gap-2"><Icon d={aberto===l.id?I.x:I.plus} className="w-3.5 h-3.5 text-slate-400"/><Avatar name={l.nome} tone="free" size="w-7 h-7"/><span className="font-semibold text-slate-800">{l.nome}</span></div></td>
          <td className="px-4 py-3 text-slate-600">{l.cargo}</td>
          <td className="px-4 py-3 tabular-nums">{l.jornadas}</td>
          <td className="px-4 py-3 font-bold text-slate-900 tabular-nums">{fmtBRL(l.total)}</td>
          <td className="px-4 py-3 text-emerald-600 tabular-nums">{l.pago>0?fmtBRL(l.pago):"—"}</td>
          <td className={cx("px-4 py-3 font-semibold tabular-nums", l.saldo>0?"text-amber-600":"text-emerald-600")}>{fmtBRL(l.saldo)}</td>
          <td className="px-4 py-3 font-mono text-xs text-slate-500">{l.pix||"—"}</td>
        </tr>,
          aberto===l.id && <tr key={l.id+"-det"} className="bg-slate-50/60"><td colSpan="7" className="px-4 py-4" onClick={e=>e.stopPropagation()}>
            <div className="grid lg:grid-cols-3 gap-4">
              {/* ---- Diárias agrupadas por SEMANA ---- */}
              <div className="lg:col-span-2">
                <div className="text-xs font-bold text-slate-500 uppercase mb-2">Diárias por semana — edite turnos (dobra) e valor</div>
                {l.semanas.length===0 && <p className="text-sm text-slate-400 bg-white rounded-lg px-3 py-3 border border-slate-100">Nenhuma diária registrada no período.</p>}
                <div className="space-y-3">
                  {l.semanas.map(s=>{ const pagaSemana=(l.pagos||[]).some(p=>p.semana===s.wk); return (
                    <div key={s.wk} className="bg-white rounded-xl border border-slate-100 overflow-hidden">
                      <div className="flex items-center justify-between gap-2 px-3 py-2 bg-slate-50/70 border-b border-slate-100">
                        <span className="text-xs font-bold text-slate-600">Semana de {fmtDataBR(s.wk)} · {s.js.length} diária(s)</span>
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-slate-900 tabular-nums text-sm">{fmtBRL(s.total)}</span>
                          {pagaSemana
                            ? <Badge tone="green">paga</Badge>
                            : <button onClick={()=>pagarSemana(l,s)} className="px-2.5 py-1 rounded-lg text-xs font-bold grad-brand text-white hover:opacity-90">Pagar semana</button>}
                        </div>
                      </div>
                      <div className="divide-y divide-slate-50">
                        {s.js.map((j,idx)=><div key={idx} className="flex flex-wrap items-center gap-2 text-sm px-3 py-2">
                          <span className="w-20 tabular-nums text-slate-600">{fmtDataBR(j.data)}</span>
                          <span className="w-14 text-slate-500 text-xs">{j.horas!=null?j.horas+"h":"—"}</span>
                          <span className="text-slate-400 text-xs">Turnos:</span>
                          <div className="inline-flex rounded-lg overflow-hidden border border-slate-200">
                            {[1,2].map(t=><button key={t} onClick={()=>setFreelaAjuste(l.id,j.data,{turnos:t})} className={cx("px-2.5 py-1 text-xs font-semibold", j.turnos===t?"grad-brand text-white":"bg-white text-slate-600 hover:bg-slate-50")}>{t===2?"2 (dobra)":"1"}</button>)}
                          </div>
                          <span className="text-slate-400 ml-1 text-xs">Valor/turno:</span>
                          <div className="inline-flex items-center gap-1"><span className="text-slate-500 text-xs">R$</span>
                            <input type="number" defaultValue={j.valorUnit} onBlur={e=>setFreelaAjuste(l.id,j.data,{valor:Number(e.target.value)})} className="w-20 px-2 py-1 rounded-lg border border-slate-200 text-sm"/></div>
                          <span className="ml-auto font-bold text-slate-900 tabular-nums">= {fmtBRL(j.total)}</span>
                          {j.dobra && <Badge tone="amber">dobra</Badge>}
                        </div>)}
                      </div>
                    </div>
                  );})}
                </div>
                <p className="text-[11px] text-slate-400 mt-2">Dobra automática quando a jornada tem ≥ {DOBRA_HORAS}h. Você pode ajustar turnos e o valor por turno manualmente.</p>
              </div>

              {/* ---- Controle de pagamentos ---- */}
              <div>
                <div className="text-xs font-bold text-slate-500 uppercase mb-2">Controle de pagamentos</div>
                <div className="bg-white rounded-xl border border-slate-100 p-3 space-y-2">
                  <div className="flex items-center justify-between text-sm"><span className="text-slate-500">Total do mês</span><span className="font-bold text-slate-900 tabular-nums">{fmtBRL(l.total)}</span></div>
                  <div className="flex items-center justify-between text-sm"><span className="text-slate-500">Já pago</span><span className="font-bold text-emerald-600 tabular-nums">{fmtBRL(l.pago)}</span></div>
                  <div className="flex items-center justify-between text-sm border-t border-slate-100 pt-2"><span className="font-semibold text-slate-600">Saldo restante</span><span className={cx("font-extrabold tabular-nums", l.saldo>0?"text-amber-600":"text-emerald-600")}>{fmtBRL(l.saldo)}</span></div>
                </div>

                <div className="text-[11px] font-bold text-slate-400 uppercase mt-3 mb-1.5">Lançar pagamento manual</div>
                <div className="bg-white rounded-xl border border-slate-100 p-3 space-y-2">
                  <div className="flex items-center gap-1"><span className="text-slate-500 text-xs">R$</span>

function UnidadeForm({ inicial, onSalvar, onClose }) {
  const [u,setU]=useState(()=>({ nome:"", end:"", lat:null, lng:null, raio:100, cor:"#2f6f2a", ...(inicial||{}) }));
  const numOuNulo=(v)=> v===""||v==null ? null : Number(v);
  const set=(k,v)=>setU(p=>({...p,[k]:v}));
  const cores=["#2f6f2a","#d39520","#6366f1","#f97316","#10b981","#0ea5e9","#e11d48","#8b5cf6"];
  const [geoMsg,setGeoMsg]=useState(null);      // {tone:'ok'|'erro'|'buscando', txt}
  const [buscando,setBuscando]=useState(false);
  // Usa a localização ATUAL do dispositivo (GPS/Wi-Fi) para preencher latitude/longitude.
  const usarLocalAtual=()=>{
    if(!navigator.geolocation){ setGeoMsg({tone:"erro",txt:"Seu dispositivo não suporta geolocalização."}); return; }
    setBuscando(true); setGeoMsg({tone:"buscando",txt:"Obtendo a localização do dispositivo…"});
    navigator.geolocation.getCurrentPosition(
      pos=>{ const {latitude,longitude,accuracy}=pos.coords;
        setU(p=>({...p, lat:Number(latitude.toFixed(6)), lng:Number(longitude.toFixed(6))}));
        setBuscando(false);
        setGeoMsg({tone:"ok",txt:"Localização capturada"+(accuracy?` (precisão ~${Math.round(accuracy)} m)`:"")+". Confira no mapa e ajuste a cerca se precisar."}); },
      err=>{ setBuscando(false);
        setGeoMsg({tone:"erro",txt: err && err.code===1 ? "Permissão de localização negada. Autorize o acesso no navegador e tente de novo." : "Não foi possível obter a localização agora. Tente novamente."}); },
      {enableHighAccuracy:true, timeout:10000, maximumAge:0});
  };
  const temCoord = temCoordenadas(u);
  // Mapa do Google embutido (sem chave de API) mostrando o ponto marcado.
  const mapSrc = temCoord ? `https://www.google.com/maps?q=${u.lat},${u.lng}&z=16&hl=pt-BR&output=embed` : null;
  const mapLink = temCoord ? `https://www.google.com/maps?q=${u.lat},${u.lng}` : null;
  return <div className="p-6">
    <div className="flex items-center justify-between mb-5">
      <h3 className="text-lg font-bold text-slate-900">{inicial?"Editar unidade":"Nova unidade (casa)"}</h3>
      <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon d={I.x}/></button>
    </div>
    <div className="space-y-4">
      <Field label="Nome da casa"><Input value={u.nome} onChange={e=>set("nome",e.target.value)} placeholder="Ex.: Caktus Osasco"/></Field>
      <Field label="Endereço"><Input value={u.end} onChange={e=>set("end",e.target.value)} placeholder="Rua, número — Cidade/UF"/></Field>

      <Btn variant="ghost" className="w-full" icon={I.gps} onClick={usarLocalAtual} disabled={buscando}>
        {buscando?"Obtendo localização…":"Usar minha localização atual"}
      </Btn>
      {geoMsg && <div className={cx("text-xs rounded-lg px-3 py-2 flex items-center gap-2",
        geoMsg.tone==="ok"?"bg-emerald-50 text-emerald-700":geoMsg.tone==="erro"?"bg-rose-50 text-rose-600":"bg-slate-50 text-slate-500")}>
        {geoMsg.tone==="buscando" && <span className="w-3.5 h-3.5 rounded-full border-2 border-slate-300 border-t-slate-500 animate-spin shrink-0"/>}
        <span>{geoMsg.txt}</span></div>}

      <div className="grid grid-cols-3 gap-3">
        <Field label="Latitude"><Input type="number" step="0.000001" value={u.lat??""} placeholder="-23.550000" onChange={e=>set("lat",numOuNulo(e.target.value))}/></Field>
        <Field label="Longitude"><Input type="number" step="0.000001" value={u.lng??""} placeholder="-46.630000" onChange={e=>set("lng",numOuNulo(e.target.value))}/></Field>
        <Field label="Cerca (m)"><Input type="number" value={u.raio??""} onChange={e=>set("raio",numOuNulo(e.target.value))}/></Field>
      </div>

      {mapSrc && <div>
        <div className="flex items-center justify-between mb-1.5">
          <span className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Localização no mapa</span>
          <a href={mapLink} target="_blank" rel="noopener" className="text-xs font-semibold text-brand-600 hover:underline flex items-center gap-1"><Icon d={I.link} className="w-3 h-3"/>Abrir no Google Maps</a>
        </div>
        <div className="rounded-xl overflow-hidden border border-slate-200 bg-slate-50">
          <iframe key={u.lat+","+u.lng} title="mapa" src={mapSrc} className="w-full" style={{height:220,border:0}} loading="lazy" referrerPolicy="no-referrer-when-downgrade"/>
        </div>
        <p className="text-[11px] text-slate-400 mt-1.5">O pino marca a coordenada. A cerca virtual ({u.raio} m) é o raio em volta desse ponto.</p>
      </div>}

      <Field label="Cor"><div className="flex gap-2">{cores.map(c=><button key={c} onClick={()=>set("cor",c)} className={cx("w-8 h-8 rounded-lg shadow", u.cor===c&&"ring-2 ring-offset-2 ring-slate-400")} style={{background:c}}/>)}</div></Field>
    </div>
    <div className="flex gap-2 mt-6"><Btn variant="ghost" className="flex-1" onClick={onClose}>Cancelar</Btn>
      <Btn className="flex-1" icon={I.check} disabled={!u.nome.trim()} onClick={()=>onSalvar({...u, nome:u.nome.trim(), raio:Number(u.raio)||100})}>{inicial?"Salvar":"Criar unidade"}</Btn></div>
    {!temCoord && <p className="text-xs text-amber-600 mt-3 text-center">Sem localização, a unidade é criada normalmente — defina as coordenadas depois para ativar a cerca virtual do ponto.</p>}
  </div>;
}
