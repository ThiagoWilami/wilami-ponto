// Painel do DONO: quem administra tudo (donos) e qual gerente entra em qual cliente.
function GerentesAcesso(){
  const { clientes, acessos, acessosOps, donos, setDonos, acesso, unidades } = useStore();
  const toast=useContext(ToastCtx);
  const [emailDono,setEmailDono]=useState("");
  // formulário de criação do gerente
  const [gNome,setGNome]=useState("");
  const [gEmail,setGEmail]=useState("");
  const [gSenha,setGSenha]=useState("");
  const [gTid,setGTid]=useState("");
  const [gUni,setGUni]=useState("todas");
  const [gPapel,setGPapel]=useState("gerente");
  const [criando,setCriando]=useState(false);
  const [feito,setFeito]=useState(null);        // {login, senha, cliente, jaExiste}
  const semBanco=!window.__WPDB;
  const nomeCliente=(t)=> (clientes.find(c=>c.id===t)||{}).nome || "Cliente";
  const controleAtivo = donos.length>0;
  const minhaChave = acesso&&acesso.minhaChave;
  const ativarControle=()=>{ if(semBanco){ toast("Recurso disponível no modo online (com banco)."); return; } setDonos(minhaChave?[minhaChave]:[]); toast("Controle de acesso ativado — você é o administrador."); };
  const addDono=()=>{ if(!emailDono.trim()){ toast("Informe o e-mail/usuário do administrador."); return; } const k=emailKey(emailDono); if(donos.includes(k)){ toast("Esse administrador já está na lista."); return; } setDonos([...donos,k]); setEmailDono(""); toast("Administrador adicionado."); };
  const removeDono=(k)=>{ if(k===minhaChave){ toast("Você não pode remover o seu próprio acesso de administrador."); return; } if(donos.length<=1){ toast("Deixe ao menos um administrador."); return; } setDonos(donos.filter(x=>x!==k)); };
  const gerarSenha=()=>{ const s=Math.random().toString(36).slice(2,8)+Math.floor(Math.random()*90+10); setGSenha(s); };
  // Cria a conta do gerente (sem deslogar o dono) e já vincula ao cliente. Sem e-mail: você entrega o login e a senha.
  const criarGerente=async()=>{
    if(semBanco){ toast("Recurso disponível no modo online (com banco)."); return; }
    if(!gEmail.trim()){ toast("Informe o e-mail ou usuário do gerente."); return; }
    if(gSenha && gSenha.length<6){ toast("A senha precisa ter ao menos 6 caracteres."); return; }
    setCriando(true); setFeito(null);
    try{
      let jaExiste=false;
      if(gSenha){ const r=await criarUsuarioAuth(gEmail,gSenha); jaExiste=!!r.jaExiste; }
      await acessosOps.set(gEmail,{tenant:gTid, unidade:gUni, nome:gNome, papel:gPapel});
      const casaNome = gUni==="todas" ? "Todas as casas" : ((unidades.find(u=>String(u.id)===String(gUni))||{}).nome||"");
      setFeito({ login:emailDeLogin(gEmail), senha:gSenha, cliente:nomeCliente(gTid), casa:casaNome, papel:gPapel, jaExiste, semSenha:!gSenha });
      toast(jaExiste?"Conta já existia — vínculo salvo":"Acesso do gerente criado");
      setGNome(""); setGEmail(""); setGSenha("");
    }catch(e){
      const cod=e&&e.code;
      toast(cod==="auth/invalid-email"?"E-mail inválido.":cod==="auth/weak-password"?"Senha muito fraca (mín. 6).":"Não foi possível criar o acesso agora.");
    }
    setCriando(false);
  };
  const copiarCred=()=>{ if(!feito) return; const casa=feito.casa?`\nCasa: ${feito.casa}`:""; copyText(`Acesso ao Wilami Ponto\nLink: ${location.origin}/\nLogin: ${feito.login}${feito.senha?`\nSenha: ${feito.senha}`:""}${casa}\n\nEntre em "Acesso do gestor" com esses dados.`); toast("Credenciais copiadas p/ WhatsApp"); };
  const nomeUni=(u)=> (u==null||u==="todas") ? "Todas as casas" : ((unidades.find(x=>String(x.id)===String(u))||{}).nome || "Casa");
  const desvincular=(a)=>{ acessosOps.remove(a.email||a.id); toast("Vínculo removido."); };
  return <div className="space-y-5 max-w-3xl">
    <Card className="p-5">
      <div className="flex items-start gap-3">
        <div className="w-10 h-10 rounded-xl grad-brand grid place-items-center text-white shrink-0"><Icon d={I.shield} className="w-5 h-5"/></div>
        <div>
          <h3 className="font-bold text-slate-900">Login independente por cliente</h3>
          <p className="text-sm text-slate-500 mt-1">Cada gerente entra apenas no <b>cliente vinculado a ele</b>, sem enxergar nem trocar para os outros. Os <b>administradores</b> (donos) continuam com acesso total: veem todos os clientes, criam novos e definem estes acessos.</p>
        </div>
      </div>
      {semBanco && <p className="text-xs text-amber-600 mt-3">Modo offline (sem banco): os acessos não são salvos. Publique/entre online para usar.</p>}
    </Card>

    <Card className="p-5">
      <div className="flex items-center justify-between mb-1">
        <h3 className="font-bold text-slate-900">Administradores (acesso total)</h3>
        <Badge tone={controleAtivo?"green":"amber"}>{controleAtivo?"Controle ativo":"Controle desativado"}</Badge>
      </div>
      {!controleAtivo ? <>
        <p className="text-sm text-slate-500">Hoje <b>qualquer conta de gestor</b> entra como administrador. Ative o controle para restringir: você vira o administrador e passa a definir quem é dono e qual gerente vê cada cliente.</p>
        <Btn className="mt-4" icon={I.shield} onClick={ativarControle}>Ativar controle e me tornar administrador</Btn>
      </> : <>
        <p className="text-sm text-slate-500 mb-3">Estes e-mails têm acesso total ao sistema.</p>
        <div className="space-y-2">
          {donos.map(k=><div key={k} className="flex items-center gap-3 p-2.5 rounded-xl bg-slate-50">
            <div className="w-8 h-8 rounded-lg bg-brand-50 text-brand-700 grid place-items-center shrink-0"><Icon d={I.user} className="w-4 h-4"/></div>
            <span className="flex-1 min-w-0 truncate text-sm font-medium text-slate-700">{(acessos.find(a=>a.id===k)||{}).email || k}{k===minhaChave && <span className="text-brand-600"> · você</span>}</span>
            <button onClick={()=>removeDono(k)} disabled={k===minhaChave} className="text-slate-400 hover:text-rose-500 disabled:opacity-30"><Icon d={I.trash} className="w-4 h-4"/></button>
          </div>)}
        </div>
        <div className="mt-4 flex flex-col sm:flex-row gap-2">
          <Input placeholder="E-mail ou usuário do novo administrador" value={emailDono} onChange={e=>setEmailDono(e.target.value)}/>
          <Btn variant="ghost" icon={I.plus} onClick={addDono}>Adicionar</Btn>
        </div>
      </>}
    </Card>

    <Card className="p-5">
      <h3 className="font-bold text-slate-900 mb-1">Criar acesso de gerente</h3>
      <p className="text-sm text-slate-500 mb-4">Crie o login e a senha do gerente aqui mesmo — <b>não é enviado e-mail</b>. Você cria e entrega o login e a senha para ele (pelo WhatsApp, por exemplo). Ele entra em “Acesso do gestor” e cai direto no cliente vinculado.</p>
      <div className="grid sm:grid-cols-2 gap-3">
        <Field label="Nome do gerente"><Input placeholder="Ex.: João Silva" value={gNome} onChange={e=>setGNome(e.target.value)}/></Field>
        <Field label="Login (e-mail ou usuário)"><Input placeholder="ex.: joao ou joao@email.com" value={gEmail} onChange={e=>setGEmail(e.target.value)}/></Field>
        <Field label="Senha (mín. 6)">
          <div className="flex gap-2">
            <Input value={gSenha} onChange={e=>setGSenha(e.target.value)} placeholder="defina uma senha"/>
            <Btn variant="ghost" size="sm" onClick={gerarSenha} title="Gerar senha">Gerar</Btn>
          </div>
        </Field>
        <Field label="Cliente"><Select value={gTid} onChange={e=>setGTid(e.target.value)}>{clientes.map(c=><option key={c.id||"p"} value={c.id}>{c.nome}</option>)}</Select></Field>
        <Field label="Casa (unidade) que ele cuida"><Select value={gUni} onChange={e=>setGUni(e.target.value)}>
          <option value="todas">Todas as casas</option>{unidades.map(u=><option key={u.id} value={u.id}>{u.nome}</option>)}
        </Select></Field>
        <div className="sm:col-span-2"><Field label="Papel (permissões)"><Select value={gPapel} onChange={e=>setGPapel(e.target.value)}>
          {Object.entries(PAPEIS).filter(([k])=>k!=="proprietario").map(([k,v])=><option key={k} value={k}>{v}</option>)}
        </Select></Field>
        <p className="text-[11px] text-slate-400 mt-1">Apenas <b>Diretor</b> e <b>Diretora Financeira</b> enxergam o valor dos pagamentos sigilosos da diretoria.</p></div>
      </div>
      <Btn className="mt-4" icon={I.user} onClick={criarGerente} disabled={criando}>{criando?"Criando…":"Criar acesso do gerente"}</Btn>
      {feito && <div className="mt-4 p-4 rounded-xl bg-emerald-50 border border-emerald-100">
        <div className="flex items-center gap-2 text-emerald-700 font-bold text-sm mb-2"><Icon d={I.check} className="w-4 h-4"/>{feito.jaExiste?"Conta já existia — vínculo salvo":feito.semSenha?"Vínculo salvo (sem criar senha)":"Acesso criado com sucesso"}</div>
        <div className="text-sm text-slate-700 space-y-0.5">
          <div>Link: <b>{location.origin}/</b></div>
          <div>Login: <b>{feito.login}</b></div>
          {feito.senha && <div>Senha: <b>{feito.senha}</b></div>}
          {feito.cliente && <div>Cliente: <b>{feito.cliente}</b></div>}
          {feito.casa && <div>Casa: <b>{feito.casa}</b></div>}
        </div>
        <Btn className="mt-3" size="sm" variant="soft" icon={I.copy} onClick={copiarCred}>Copiar credenciais p/ WhatsApp</Btn>
        {feito.jaExiste && <p className="text-xs text-slate-500 mt-2">Como a conta já existia, a senha não foi alterada. Se o gerente esqueceu a senha, ele pode entrar com a que já tinha.</p>}
      </div>}

      <div className="mt-6 border-t border-slate-100 pt-4">
        <h4 className="font-bold text-slate-800 text-sm mb-3">Gerentes vinculados</h4>
        {acessos.length===0 ? <p className="text-sm text-slate-400">Nenhum gerente vinculado ainda.</p>
         : <div className="space-y-2">
            {acessos.map(a=><div key={a.id} className="flex items-center gap-3 p-2.5 rounded-xl bg-slate-50">
              <div className="w-8 h-8 rounded-lg grid place-items-center shrink-0 text-white" style={{background:(clientes.find(c=>c.id===(a.tenant||""))||{}).cor||"#6366f1"}}><Icon d={I.user} className="w-4 h-4"/></div>
              <div className="flex-1 min-w-0">
                <div className="text-sm font-semibold text-slate-800 truncate">{a.nome||a.email||a.id}</div>
                <div className="text-xs text-slate-500 truncate">{a.email} · {nomeCliente(a.tenant||"")} · {nomeUni(a.unidade)}</div>
              </div>
              {a.papel && a.papel!=="gerente" && <Badge tone={a.papel==="diretor"||a.papel==="financeira"?"amber":"slate"}>{PAPEIS[a.papel]||a.papel}</Badge>}
              {donos.includes(a.id) && <Badge tone="brand">Administrador</Badge>}
              <button onClick={()=>desvincular(a)} className="text-slate-400 hover:text-rose-500"><Icon d={I.trash} className="w-4 h-4"/></button>
            </div>)}
          </div>}
      </div>
    </Card>
  </div>;
}

function Sidebar({view,setView,open,setOpen,onLogout}) {
  const { acesso } = useStore();
  const ehDono = !acesso || acesso.ehDono; // sem contexto (offline) → mostra tudo
  return <>
    {open && <div className="fixed inset-0 bg-black/30 z-30 lg:hidden" onClick={()=>setOpen(false)}/>}
    <aside className={cx("fixed lg:sticky top-0 z-40 h-screen w-64 shrink-0 grad-ink text-white flex flex-col transition-transform lg:translate-x-0", open?"translate-x-0":"-translate-x-full")}>
      <div className="p-5"><Logo light/></div>
      <div className="px-3 flex-1 overflow-y-auto">
        {NAV.map(g=>({...g, items:g.items.filter(it=>!it.dono||ehDono)})).filter(g=>g.items.length).map(g=>
          <div key={g.sec} className="mb-4">
            <div className="px-3 text-[11px] uppercase tracking-wider text-white/35 font-bold mb-1">{g.sec}</div>
            {g.items.map(it=>
              <button key={it.k} onClick={()=>{setView(it.k);setOpen(false);}}
                className={cx("w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition mb-0.5",
                  view===it.k?"bg-white/10 text-white ring-1 ring-white/10":"text-white/60 hover:text-white hover:bg-white/5")}>
                <Icon d={it.d} className="w-[18px] h-[18px]"/>{it.l}
                {view===it.k && <span className="ml-auto w-1.5 h-1.5 rounded-full bg-free-400"/>}
              </button>)}
          </div>)}
      </div>
      <div className="p-3 border-t border-white/10">
        <ClienteSwitcher/>
        <div className="flex items-center gap-3 px-2 py-2"><Avatar name={(acesso&&acesso.nome)||"Gestor"} tone="brand"/>
          <div className="flex-1 min-w-0"><div className="text-sm font-semibold truncate">{(acesso&&acesso.nome)||"Gestor"}</div><div className="text-xs text-white/50 truncate">{(acesso&&acesso.papel)||"Proprietário"}</div></div>
          {onLogout && <button onClick={onLogout} title="Sair" className="w-8 h-8 rounded-lg text-white/60 hover:text-white hover:bg-white/10 grid place-items-center"><Icon d={I.logout||I.arrow} className="w-4 h-4"/></button>}</div>
      </div>
    </aside>
  </>;
}

function TelaBloqueio({icone,titulo,texto,onLogout,spin}){
  return <div className="min-h-screen grad-ink grad-hero grid place-items-center p-6 text-white text-center">
    <div className="max-w-sm">
      <div className="flex justify-center mb-4"><Logo light/></div>
      {spin ? <div className="w-10 h-10 mx-auto rounded-full border-2 border-white/30 border-t-white animate-spin mb-4"/>
        : <div className="w-14 h-14 mx-auto rounded-2xl bg-white/10 grid place-items-center mb-4"><Icon d={icone||I.shield} className="w-7 h-7"/></div>}
      <h2 className="text-xl font-bold">{titulo}</h2>
      {texto && <p className="text-white/70 text-sm mt-2">{texto}</p>}
      {onLogout && <button onClick={onLogout} className="mt-6 px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-sm font-semibold">Sair</button>}
    </div>
  </div>;
}

function Shell({ onLogout }) {
  const [view,setView]=useState("dashboard");
  const [sbOpen,setSbOpen]=useState(false);
  const [toasts,setToasts]=useState([]);
  const { acesso, tenantAtual, trocarCliente, ajustes } = useStore();
  const ajustesPend=(ajustes||[]).filter(a=>a.status==="pendente").length;
  // Gerente vinculado a um cliente diferente do ativo → entra automaticamente no seu espaço.
  useEffect(()=>{
    if(acesso && acesso.pronto && acesso.tenantBind!=null && acesso.tenantBind!==tenantAtual){ trocarCliente(acesso.tenantBind); }
  },[acesso&&acesso.pronto, acesso&&acesso.tenantBind, tenantAtual]);
  const pushToast=(msg)=>{ const id=Math.random(); setToasts(t=>[...t,{id,msg}]); setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2600); };
  // Portões de acesso (login independente por cliente)
  if(acesso && !acesso.pronto) return <TelaBloqueio spin titulo="Carregando seu acesso…"/>;
  if(acesso && acesso.semAcesso) return <TelaBloqueio icone={I.shield} titulo="Sua conta ainda não tem acesso" texto="Peça ao administrador para vincular seu e-mail a um cliente. Assim que ele liberar, é só entrar novamente." onLogout={onLogout}/>;
  if(acesso && acesso.tenantBind!=null && acesso.tenantBind!==tenantAtual) return <TelaBloqueio spin titulo="Abrindo seu cliente…"/>;
  const views={ dashboard:<Dashboard go={setView}/>, escala:<EscalaVisual/>, ponto:<PontoLive/>, ajustes:<AjustesPonto/>, clt:<ColaboradoresCLT/>, freelas:<Freelancers/>,
    dossie:<Dossie/>, pjs:<PrestadoresPJ/>, cargos:<CargosPage/>, convites:<ConvitesPage/>, arquivos:<ArquivosPage/>, holerites:<HoleritesPage/>, termos:<TermosPage/>, modeloContrato:<ModeloContratoPage/>, equipe:<Equipe/>, relatorios:<Relatorios/>, financeiro:<Financeiro/>, pagamentos:<Pagamentos/>, unidades:<Unidades/>, links:<LinksQR/>, acessos:<GerentesAcesso/>, config:<Configuracoes/>, ajuda:<Ajuda/> };
  return <ToastCtx.Provider value={pushToast}>
    <div className="flex min-h-screen">
      <Sidebar view={view} setView={setView} open={sbOpen} setOpen={setSbOpen} onLogout={onLogout}/>
      <div className="flex-1 min-w-0 flex flex-col">
        <header className="sticky top-0 z-20 glass border-b border-slate-200/70 px-4 lg:px-8 py-1.5 flex items-center gap-3">
          <button className="lg:hidden text-slate-600" onClick={()=>setSbOpen(true)}><Icon d={I.menu}/></button>
          <div className="lg:hidden"><Logo size="text-base"/></div>
          <div className="hidden lg:flex items-center gap-2 text-sm text-slate-400"><Icon d={(NAV.flatMap(g=>g.items).find(it=>it.k===view)||{}).d||I.grid} className="w-4 h-4 text-brand-600"/><span>{(NAV.find(g=>g.items.some(it=>it.k===view))||{}).sec}</span><span>/</span><span className="text-slate-700 font-semibold">{TITULOS[view]}</span></div>
          <div className="ml-auto flex items-center gap-2">
            <button onClick={()=>setView("ajustes")} title={ajustesPend?ajustesPend+" ajuste(s) de ponto aguardando aprovação":"Sem pendências"} className="relative w-9 h-9 rounded-xl bg-white border border-slate-200 grid place-items-center text-slate-500 hover:bg-slate-50"><Icon d={I.bell} className="w-4 h-4"/>{ajustesPend>0 && <span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold grid place-items-center">{ajustesPend}</span>}</button>
          </div>
        </header>
        <main className="flex-1 px-4 lg:px-8 py-5"><ErroTela chave={view} onVoltar={()=>setView("dashboard")}>{views[view]}</ErroTela></main>
      </div>
    </div>
    <div className="fixed bottom-5 right-5 z-[60] space-y-2">
      {toasts.map(t=>
        <div key={t.id} className="fade-in bg-ink-900 text-white px-4 py-3 rounded-xl shadow-glow flex items-center gap-2 text-sm max-w-xs">
          <div className="w-6 h-6 rounded-full bg-emerald-500 grid place-items-center shrink-0"><Icon d={I.check} className="w-3.5 h-3.5" stroke={3}/></div>{t.msg}
        </div>)}
    </div>
  </ToastCtx.Provider>;
}

// Roteamento por hash para os LINKS de cadastro/ponto (CLT e Freelancer).
// Ex.: abrir  ...wilami-ponto-app.html#ponto-clt  já abre o quiosque CLT (público).
function usePontoHash() {
  const read=()=>{ const h=(window.location.hash||"").replace("#",""); return h==="ponto-clt"?"clt": h==="ponto-free"?"free": h==="meus-docs"?"docs": h.indexOf("convite/")===0?"convite": h.indexOf("termo/")===0?"termo": null; };
  const [mode,setMode]=useState(read());
  useEffect(()=>{ const on=()=>setMode(read()); window.addEventListener("hashchange",on); return ()=>window.removeEventListener("hashchange",on); },[]);
  return [mode, ()=>{ if(window.location.hash){ window.history.replaceState(null,"",window.location.pathname+window.location.search); } setMode(null); }];
}
// Instruções básicas no PRIMEIRO acesso
function Onboarding({ onClose }){
  const passos=[
    { d:I.user, t:"Colaborador registra por CPF", s:"Na tela inicial, o colaborador escolhe o vínculo e digita o CPF. Só quem está na escala do dia consegue bater o ponto." },
    { d:I.camera, t:"Foto + GPS no check-in", s:"O ponto é registrado com foto (selfie) e localização dentro da cerca da unidade — tudo conforme a Portaria 671/2021." },
    { d:I.calendar, t:"Gestor monta a escala", s:"Em “Acesso do gestor”, cadastre colaboradores (com foto) e monte a escala visual por unidade, com horários." },
    { d:I.broadcast, t:"Acompanhe ao vivo", s:"No painel “Ponto ao vivo” você vê quem está trabalhando, o tempo em jornada e a apuração de horas e extras." },
  ];
  return <div className="fixed inset-0 z-[60] bg-black/50 flex items-center justify-center p-4" onClick={onClose}>
    <div className="bg-white rounded-3xl w-full max-w-lg overflow-hidden" onClick={e=>e.stopPropagation()}>
      <div className="grad-ink grad-hero p-6 text-white text-center">
        <div className="flex justify-center mb-2"><Logo light/></div>
        <h2 className="text-2xl font-extrabold">Bem-vindo ao Wilami Ponto</h2>
        <p className="text-white/70 text-sm mt-1">Como funciona, em 4 passos:</p>
      </div>
      <div className="p-5 space-y-3">
        {passos.map((p,i)=><div key={i} className="flex items-start gap-3">
          <div className="w-9 h-9 rounded-xl grad-brand grid place-items-center text-white shrink-0"><Icon d={p.d} className="w-4 h-4"/></div>
          <div><div className="font-bold text-slate-900 text-sm">{i+1}. {p.t}</div><div className="text-sm text-slate-500">{p.s}</div></div>
        </div>)}
        <Btn className="w-full mt-2" size="lg" icon={I.arrow} onClick={onClose}>Começar</Btn>
      </div>
    </div>
  </div>;
}
function App() {
  const [localLogged,setLocalLogged]=useState(false);
  const [user,setUser]=useState(null);
  const [authReady,setAuthReady]=useState(()=>!window.__WPAUTH);
  const [pontoMode,fecharPonto]=usePontoHash();
  const [onboard,setOnboard]=useState(()=>{ try{ return !localStorage.getItem("wp_onboarded"); }catch{ return true; } });
  const fecharOnboard=()=>{ try{ localStorage.setItem("wp_onboarded","1"); }catch{} setOnboard(false); };
  useEffect(()=>{ const a=window.__WPAUTH; if(!a) return; return a.onAuthStateChanged(u=>{ setUser(u); setAuthReady(true); }); },[]);
  const logged = window.__WPAUTH ? !!user : localLogged;
  const logout=()=>{ try{ window.__WPAUTH&&window.__WPAUTH.signOut(); }catch(e){} setLocalLogged(false); };
  return <StoreProvider>
    {pontoMode==="convite" ? <ConviteCadastro onClose={fecharPonto}/>
     : pontoMode==="termo" ? <TermoAssinatura onClose={fecharPonto}/>
     : pontoMode==="docs" ? <PortalColab onClose={fecharPonto}/>
     : pontoMode ? <PontoKiosk mode={pontoMode} onClose={fecharPonto}/>
     : !authReady ? <div className="min-h-screen grad-ink grad-hero grid place-items-center text-white"><div className="text-center"><div className="w-10 h-10 mx-auto rounded-full border-2 border-white/30 border-t-white animate-spin mb-3"/><Logo light/></div></div>
     : logged ? <Shell onLogout={logout}/>
     : <LoginScreen onLogin={()=>setLocalLogged(true)}/>}
    {onboard && !pontoMode && !logged && <Onboarding onClose={fecharOnboard}/>}
  </StoreProvider>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
