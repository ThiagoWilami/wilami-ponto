const cx = (...a)=>a.filter(Boolean).join(" ");
const Card = ({className="", children, ...p}) =>

const Badge = ({children, tone="slate"}) => {
  const map = {
    slate:"bg-slate-100 text-slate-600", brand:"bg-brand-50 text-brand-700",
    free:"bg-free-100 text-free-700", green:"bg-emerald-50 text-emerald-700",
    red:"bg-rose-50 text-rose-700", amber:"bg-amber-50 text-amber-700", blue:"bg-sky-50 text-sky-700",
  };
  return <span className={cx("inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold", map[tone])}>{children}</span>;
};

const Btn = ({children, variant="primary", size="md", icon, className="", ...p}) => {
  const base="inline-flex items-center justify-center gap-2 font-semibold rounded-xl transition active:scale-[.98] disabled:opacity-50";
  const sizes={ sm:"text-sm px-3 py-1.5", md:"text-sm px-4 py-2.5", lg:"px-5 py-3" };
  const variants={
    primary:"grad-brand text-white shadow-glow hover:brightness-110",
    ghost:"bg-white text-slate-700 border border-slate-200 hover:bg-slate-50",
    soft:"bg-brand-50 text-brand-700 hover:bg-brand-100",
    free:"bg-free-500 text-white hover:bg-free-600",
    danger:"bg-rose-500 text-white hover:bg-rose-600",
    dark:"bg-ink-900 text-white hover:bg-ink-800",
  };
  return <button className={cx(base,sizes[size],variants[variant],className)} {...p}>
    {icon && <Icon d={icon} className="w-4 h-4"/>}{children}
  </button>;
};

const Avatar = ({name, tone="brand", size="w-10 h-10", src}) => {
  const init=(name||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
  const tones={ brand:"grad-brand", free:"bg-free-500", green:"bg-emerald-500", slate:"bg-slate-400" };
  return src
    ? <img src={src} className={cx(size,"rounded-full object-cover ring-2 ring-white shadow")} />
    : <div className={cx(size,tones[tone],"rounded-full text-white grid place-items-center font-bold text-xs ring-2 ring-white shadow")}>{init}</div>;
};

const Toggle = ({on, onChange}) =>
  <button onClick={()=>onChange(!on)} className={cx("w-11 h-6 rounded-full p-0.5 transition", on?"grad-brand":"bg-slate-300")}>
    <div className={cx("w-5 h-5 bg-white rounded-full shadow transition", on&&"translate-x-5")}/></button>;

const Modal = ({open, onClose, children, wide}) => {
  if(!open) return null;
  // Renderiza no <body> (portal): assim a janela fica sempre por cima do cabeçalho,
  // mesmo quando a tela que a abriu está dentro de um bloco com animação.
  return ReactDOM.createPortal(<div className="fixed inset-0 z-50 grid place-items-center p-4 bg-ink-900/40 backdrop-blur-sm" onClick={onClose}>
    <div className={cx("bg-white rounded-3xl shadow-2xl w-full max-h-[92vh] overflow-auto fade-in", wide?"max-w-3xl":"max-w-lg")} onClick={e=>e.stopPropagation()}>
      {children}
    </div></div>, document.body);
};

  </label>;

const Select = ({children, ...p}) => <select {...p} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-brand-400 text-sm bg-white">{children}</select>;

const BarChart = ({data, height=120, color="#2f6f2a"}) => {
  const max=Math.max(...data.map(d=>d.v),1); const w=100/data.length;
  return <svg viewBox={`0 0 100 ${height/2}`} preserveAspectRatio="none" className="w-full" style={{height}}>
    {data.map((d,i)=>{ const h=(d.v/max)*(height/2-14);
      return <g key={i}>
        <rect x={i*w+w*0.22} y={height/2-h-8} width={w*0.56} height={h} rx="1.4" fill={color} opacity={d.hl?1:.35}/>
        <text x={i*w+w/2} y={height/2-1} fontSize="2.6" textAnchor="middle" fill="#94a3b8">{d.l}</text>
      </g>;})}
  </svg>;
};
const Donut = ({segments, size=120, label="na escala"}) => {
  const total=segments.reduce((s,x)=>s+x.v,0)||1; let acc=0; const r=42, c=2*Math.PI*r;
  return <svg viewBox="0 0 100 100" style={{width:size,height:size}}>
    <circle cx="50" cy="50" r={r} fill="none" stroke="#eef2f7" strokeWidth="12"/>
    {segments.map((s,i)=>{ const len=(s.v/total)*c; const off=c-acc; acc+=len;
      return <circle key={i} cx="50" cy="50" r={r} fill="none" stroke={s.c} strokeWidth="12"
        strokeDasharray={`${len} ${c-len}`} strokeDashoffset={off} transform="rotate(-90 50 50)" strokeLinecap="round"/>;})}
    <text x="50" y="47" fontSize="15" fontWeight="800" textAnchor="middle" fill="#0f172a">{total}</text>
    <text x="50" y="60" fontSize="6.5" textAnchor="middle" fill="#94a3b8">{label}</text>

function usePersist(key, initial){
  const [v,setV]=useState(()=>{ try{ const s=localStorage.getItem(tKey(key)); return s!=null?JSON.parse(s):initial; }catch{ return initial; } });
  const [pronto,setPronto]=useState(()=>!window.__WPDB);   // true quando a 1ª leitura do SERVIDOR chegou
  useEffect(()=>{
    const db=window.__WPDB; if(!db) return;
    try{
      return tDoc(key).onSnapshot(function(snap){
        if(snap && snap.metadata && snap.metadata.hasPendingWrites) return; // ignora eco da própria escrita
        if(!(snap && snap.metadata && snap.metadata.fromCache)) setPronto(true);
        const d=snap && snap.exists ? snap.data() : null;
        if(d && Object.prototype.hasOwnProperty.call(d,"v")){ setV(d.v); }
      }, function(){ /* sem permissão/erro — segue com local */ });
    }catch(e){ return; }
  },[key]);
  const setBoth=(upd)=>{
    setV(prev=>{
      const nv = typeof upd==="function" ? upd(prev) : upd;
      try{ localStorage.setItem(tKey(key), JSON.stringify(nv)); }catch{}
      // Sempre grava no banco. (Antes, a 1ª alteração feita depois de uma atualização vinda de outro
      // aparelho NÃO era salva no servidor — edições "voltavam" e a escala acumulava marcações órfãs.)
      // Não há eco em loop: a atualização remota chega por setV direto e não passa por aqui.
      const db=window.__WPDB;
      if(db){ try{ tDoc(key).set({v:nv}); }catch(e){} }
      return nv;
    });
  };
  return [v,setBoth,pronto];
}

  },[]);

function haversine(la1,lo1,la2,lo2){
  const R=6371000, r=Math.PI/180, dLa=(la2-la1)*r, dLo=(lo2-lo1)*r;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function calcTrabalho(punches){ // punches: [{acao,min}]
  const g=a=>{ const p=punches.find(x=>x.acao===a); return p?p.min:null; };
  const ent=g("Entrada"), sai=g("Saída");
  if(ent==null||sai==null) return null;
  const fim = sai<ent ? sai+1440 : sai;
  const ii=g("Início intervalo"), fi=g("Fim intervalo");
  const interv = (ii!=null&&fi!=null) ? Math.max(0,(fi<ii?fi+1440:fi)-ii) : 0;
  return Math.max(0, fim-ent-interv);
}

function extrasDe(trabalhado, tipo, ehFolga){
  if(tipo!=="clt") return { extras:0, extras100:0, atraso:0 };
  if(ehFolga) return { extras:0, extras100:trabalhado, atraso:0 };   // folga trabalhada = 100%
  const saldo = trabalhado - JORNADA_CLT;
  return { extras: saldo>TOL?saldo:0, extras100:0, atraso: saldo<-TOL?-saldo:0 };
}

  return Object.values(grupos).map(g=>{ const t=calcTrabalho(g.punches);
    const folga = folgaDe ? !!folgaDe(g) : false;
    if(t==null) return {...g,trabalhado:null,extras:0,extras100:0,atraso:0,folga,completo:false};

  let pdf="%PDF-1.4\n"; const off=[];
  for(let i=1;i<=5;i++){ off[i]=pdf.length; pdf+=i+" 0 obj\n"+objs[i]+"\nendobj\n"; }
  const xref=pdf.length;

    if(aloc.marca==="faltou"){ dias.push(ds); return; }

// Calcula UMA linha da folha (salário + extras + adicional noturno − descontos, com falta automática e DSR)
function calcFolhaLinha(c, ctx){
  const {apurCLT, cltExtraAjuste, ymRef, getDossie, naData, faltasCtx}=ctx; const gorjetasCLT=ctx.gorjetasCLT||{};
  const meus=apurCLT.filter(x=>x.nome===c.nome);
  const extrasMin=meus.reduce((s,x)=>s+(x.extras||0),0);
  const extras100Min=meus.reduce((s,x)=>s+(x.extras100||0),0);
  const notMin=meus.reduce((s,x)=>s+minutosNoturnos(x.punches||[]),0);
  const salario=Number(c.salario||0);
  const vHora=salario? salario/220 : 0;              // hora normal (44h/sem → 220h/mês)
  const vDia =salario? salario/30  : 0;              // valor do dia (base da falta e do DSR)
  const extrasCalc=(extrasMin/60)*vHora*1.5 + (extras100Min/60)*vHora*2;
  const extraOverride = cltExtraAjuste[c.id+"|"+ymRef];
  const extrasVal = extraOverride!=null ? Number(extraOverride) : extrasCalc;
  const extrasEditado = extraOverride!=null;
  const notVal=(notMin/60)*vHora*0.2;               // adicional noturno 20% (Art. 73 CLT)
  const dos=getDossie("clt-"+c.id);
  const faltasManuais=(dos.faltas||[]).filter(x=>x.tipo==="falta" && x.descontar && naData(x.data)).map(x=>x.data);
  const atrasosD=(dos.faltas||[]).filter(x=>x.tipo==="atraso" && x.descontar && naData(x.data));
  const dossieDatas=new Set((dos.faltas||[]).map(x=>x.data));   // datas já tratadas manualmente (falta OU abono)
  const auto = faltasCtx ? faltasAutoDe(c, faltasCtx).filter(d=>!dossieDatas.has(d)) : [];
  const faltaDatas=[...new Set([...faltasManuais,...auto])].filter(naData);
  const nFaltas=faltaDatas.length;
  const semanasFalta=new Set(faltaDatas.map(d=>{ const [y,m,dd]=d.split("-").map(Number); return ymd(segDaSemana(new Date(y,m-1,dd))); }));
  const nDSR=semanasFalta.size;                      // política escolhida: perde 1 DSR por semana com falta
  const descFaltas=nFaltas*vDia, descDSR=nDSR*vDia;
  const descAtrasos=atrasosD.reduce((s,x)=>s+vHora*(Number(x.horas)||0),0);
  // Vale Transporte: benefício mensal fixo; desconto legal = menor entre 6% do salário base e o valor do VT (Lei 7.418/85).
  const vt=Number(c.vt||0);
  const vtDesconto = vt>0 ? Math.min(salario*0.06, vt) : 0;
  const descontos=descFaltas+descDSR+descAtrasos+vtDesconto;
  // Salário combinado com a Diretoria: se salário + extras + adicional noturno + gorjetas do mês não alcançarem o combinado, a diferença vira "reposição".
  const gorjeta=Number(gorjetasCLT[c.id+"|"+ymRef]||0);
  const combinado=Number(c.salarioCombinado||0);
  const recebido=salario+extrasVal+notVal+gorjeta;
  const reposicao=combinado>0 ? Math.max(0, Math.round((combinado-recebido)*100)/100) : 0;
  const liquido=salario+extrasVal+notVal+reposicao-descontos;
  return { id:c.id, nome:c.nome, foto:c.foto, pix:c.pix, escala:c.escala, salario, vHora, gorjeta, combinado, recebido, reposicao,
    extrasMin, extras100Min, extrasHoras:extrasMin+extras100Min, extrasVal, extrasEditado, notMin, notVal,
    faltasQtd:nFaltas, dsrQtd:nDSR, faltaDatas, descFaltas, descDSR, atrasosQtd:atrasosD.length,
    vt, vtDesconto, descontos, liquido, semSalario:!salario };
}

// Convites, arquivos (pastas/holerites), partes dos arquivos e PINs ficam na coleção "ajustes",
// cada tipo com um prefixo no id e o campo _t. Assim nada precisa ser alterado nas regras do Firebase.

const COL_HOSPEDEIRA="ajustes";

function nCol(nome){

  const snapDoc=(d)=>({ id:d.id.slice(pre.length), exists:d.exists && !(d.data()||{})._excluido, data:()=>_vSaida(d.data()) });

    where:(f,op,v)=>wrapQuery(q.where(f,op,v)),
    onSnapshot:(cb,err)=>q.onSnapshot(function(snap){ const docs=[]; snap.forEach(function(d){ const x=d.data()||{}; if(x._t===tipo && !x._excluido && d.id.indexOf(pre)===0) docs.push(snapDoc(d)); }); cb({ forEach:(fn)=>docs.forEach(fn), docs }); }, err),
  });

      get:()=>real.get().then(snapDoc),
      // apaga de verdade; se as regras não deixarem apagar, marca como excluído (some do sistema)
      delete:()=>real.delete().catch(()=>real.set(nome==="arquivos_partes"?{d:"",_excluido:true}:{_excluido:true},{merge:true})),
    }; };

  return { doc, onSnapshot:wrapQuery(host().where("_t","==",tipo)).onSnapshot, where:(f,op,v)=>wrapQuery(host().where(f,op,v)) };

const _scripts={};
function carregarScript(src){
  if(_scripts[src]) return _scripts[src];
  _scripts[src]=new Promise(function(res,rej){ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=function(){ delete _scripts[src]; rej(new Error("Falha ao carregar "+src)); }; document.head.appendChild(s); });
  return _scripts[src];
}

// Texto de cada página de um PDF
async function textoPaginasPdf(bytes){
  const pdfjs=await carregarPdfJs();
  const doc=await pdfjs.getDocument({data:bytes.slice()}).promise;
  const out=[];
  for(let i=1;i<=doc.numPages;i++){ const pg=await doc.getPage(i); const tc=await pg.getTextContent(); out.push(tc.items.map(it=>it.str).join(" ")); }
  return out;
}
// Novo PDF só com as páginas indicadas (índices 0-based)
async function extrairPaginasPdf(bytes, paginas){
  const PDFLib=await carregarPdfLib();
  const src=await PDFLib.PDFDocument.load(bytes.slice(),{ignoreEncryption:true});
  const out=await PDFLib.PDFDocument.create();
  const cop=await out.copyPages(src, paginas); cop.forEach(p=>out.addPage(p));
  return await out.save();
}

function acharPessoaNoTexto(texto, pessoas){
  const dig=soDigitos(texto); const nt=" "+normTxt(texto)+" ";
  const porCpf=pessoas.filter(p=>{ const c=soDigitos(p.cpf); return c.length===11 && dig.indexOf(c)>=0; });
  if(porCpf.length===1) return {pessoa:porCpf[0], por:"CPF"};
  const porNome=pessoas.filter(p=>{ const n=normTxt(p.nome); return n.split(" ").length>=2 && nt.indexOf(" "+n+" ")>=0; });

const fundoFolga=(cores)=>{ if(!cores.length) return null; if(cores.length===1) return cores[0]; const st=cores.map((c,i)=>`${c} ${Math.round(i*100/cores.length)}% ${Math.round((i+1)*100/cores.length)}%`).join(","); return `linear-gradient(135deg,${st})`; };

  const { escala, setEscala, escalaOv, setEscalaOv, clts, freelas, pjs, unidades, can } = useStore();
  const toast=useContext(ToastCtx);
  const [uSel,setUSel]=useState(unidades[0]?.id);
  // Semana visível (para editar POR DATA, sem replicar nas outras semanas)
  const [semanaBase,setSemanaBase]=useState(()=>segDaSemana(new Date())); // segunda-feira da semana exibida
  const datasSemana=[0,1,2,3,4,5,6].map(i=>addDias(semanaBase,i));
  const dataDe=(di)=>ymd(datasSemana[di]);   // "AAAA-MM-DD" da coluna
  // lista efetiva da coluna: exceção da data (se houver) ou o padrão semanal
  const diaDe=(di)=> diaEscala(escala, escalaOv, uSel, dataDe(di), di);
  // grava a exceção da data (semeando a partir do que está visível hoje, para não perder ninguém)
  const setDiaData=(di,fn)=> setEscalaOv(prev=>{
    const u={...(prev[uSel]||{})}; const ds=dataDe(di);
    const base = (u[ds]!=null) ? u[ds] : (diaEscala(escala, escalaOv, uSel, ds, di)||[]);
    u[ds]=fn(base.map(a=>({...a}))); return {...prev,[uSel]:u};
  });
  const [drag,setDrag]=useState(null);
  const [over,setOver]=useState(null);
  const [add,setAdd]=useState(null);
  const [setorF,setSetorF]=useState("todos");
  const [menu,setMenu]=useState(null); // {di,id}
  const editavel=can("escala");
  const nome=(pid,tipo)=>pessoaNome(pid,tipo,clts,freelas,pjs);
  const pessoaDe=(a)=>(a.tipo==="clt"?clts:a.tipo==="pj"?pjs:freelas).find(p=>String(p.id)===String(a.pid));
  const passaSetor=(a)=> setorF==="todos" || setorDe(pessoaDe(a))===setorF;
  // Esconde alocações órfãs (colaborador que não existe mais → aparecia como "—")
  const valido=(a)=> !alocOrfa(a,clts,freelas,pjs);

  // Todas as edições gravam SÓ na data da coluna (exceção), sem replicar nas outras semanas.
  const onDrop=(dia)=>{
    if(!drag||!editavel) return;
    setDiaData(drag.from, arr=>arr.filter(a=>a.id!==drag.aloc.id));
    setDiaData(dia, arr=>[...arr, {...drag.aloc}]);
    toast(`${nome(drag.aloc.pid,drag.aloc.tipo)} movido para ${labelDiaFull(dia)}`);
    setDrag(null); setOver(null);
  };
  const remover=(dia,id)=>setDiaData(dia, arr=>arr.filter(a=>a.id!==id));
  const setMarca=(dia,id,marca)=>setDiaData(dia, arr=>arr.map(a=>a.id===id?{...a,marca}:a));
  const setTurnoTo=(dia,id,turno)=>setDiaData(dia, arr=>arr.map(a=>a.id===id?{...a,turno,marca:turno==="folga"?null:a.marca}:a));
  const setHorario=(dia,id,h)=>setDiaData(dia, arr=>arr.map(a=>a.id===id?{...a,h}:a));
  const [editH,setEditH]=useState(null); // {di,id,hi,hf}
  const [addTurno,setAddTurno]=useState(null);   // turno sugerido pelo "+FL" da grade
  const addColab=(dia,pid,tipo,turnoForcado)=>{ const turno=turnoForcado||addTurno||(tipo==="free"?"noite":turnoPorDia(dia));
    setDiaData(dia, arr=>[...arr,{id:(tipo==="clt"?"c":tipo==="pj"?"p":"f")+Date.now()+Math.floor(Math.random()*1000),pid,tipo,turno}]); setAdd(null); setAddTurno(null); toast("Colaborador inserido na escala do dia "+labelDiaFull(dia)); };
  const [modo,setModo]=useState(()=>{ try{ return localStorage.getItem("wp_escala_modo")||"grade"; }catch(e){ return "grade"; } });
  const trocaModo=(m)=>{ setModo(m); setMenu(null); try{ localStorage.setItem("wp_escala_modo",m); }catch(e){} };

  const tot=[0,1,2,3,4,5,6].map(di=>diaDe(di)).flat().filter(valido);
  // Contagem por PESSOAS distintas (não por dia-slot): 8 CLTs escalados 6 dias = 8, não 48.
  const nClt=new Set(tot.filter(a=>a.tipo==="clt").map(a=>String(a.pid))).size;   // colaboradores CLT distintos na casa (semana)
  const nFree=new Set(tot.filter(a=>a.tipo==="free").map(a=>String(a.pid))).size; // freelancers distintos
  const nPj=new Set(tot.filter(a=>a.tipo==="pj").map(a=>String(a.pid))).size;     // prestadores PJ distintos
  const nFolga=tot.filter(a=>a.turno==="folga").length;                            // folgas (por dia)
  const nCob=tot.filter(a=>a.turno!=="folga").length;                              // turnos escalados na semana (coberturas)
  const uAtual=unidades.find(u=>u.id===uSel);
  // ===== Passador de datas: "hoje" real, rótulos e busca de data específica =====
  const ehHoje=(di)=> ymd(datasSemana[di])===hojeStr();
  const labelDiaFull=(di)=>{ const d=datasSemana[di]; return `${DIAS[di]} ${d.getDate()}/${String(d.getMonth()+1).padStart(2,"0")}`; };
  const semanaLabel=`${datasSemana[0].getDate()} ${MESES_CURTO[datasSemana[0].getMonth()]} – ${datasSemana[6].getDate()} ${MESES_CURTO[datasSemana[6].getMonth()]}`;
  const semanaAtual = ymd(semanaBase)===ymd(segDaSemana(new Date()));
  const irParaData=(v)=>{ if(!v) return; const [y,m,dd]=v.split("-").map(Number); setSemanaBase(segDaSemana(new Date(y,m-1,dd))); };

  // Menu de uma alocação (turno, horário, faltou/atrasou, remover) — usado no quadro e na grade
  const menuDe=(di,a,pos,estilo)=>{ const t=TURNOS[a.turno]||TURNOS.manha; return <div className={cx(pos,"w-44 bg-white rounded-xl shadow-2xl border border-slate-100 p-1.5 text-xs")} style={estilo} onClick={e=>e.stopPropagation()}>
                    <div className="px-2 py-1 text-[10px] font-bold text-slate-400 uppercase">Turno</div>
                    {[["manha","Manhã"],["tarde","Tarde"],["noite","Noite"],["folga","Folga"]].map(([k,l])=><button key={k} onClick={()=>{setTurnoTo(di,a.id,k);setMenu(null);}} className="w-full text-left px-2 py-1.5 rounded-lg hover:bg-slate-50">{l}</button>)}
                    {a.turno!=="folga" && <button onClick={()=>{ const cur=(a.h||t.h||"").split("–"); setEditH({di,id:a.id,hi:cur[0]||"08:00",hf:cur[1]||"16:00"}); setMenu(null); }} className="w-full text-left px-2 py-1.5 rounded-lg hover:bg-brand-50 text-brand-700 border-t border-slate-100 mt-1">Editar horário…</button>}
                    <div className="px-2 py-1 text-[10px] font-bold text-slate-400 uppercase border-t border-slate-100 mt-1">Marcar</div>
                    <button onClick={()=>{setMarca(di,a.id,"faltou");setMenu(null);}} className="w-full text-left px-2 py-1.5 rounded-lg hover:bg-rose-50 text-rose-600">Faltou</button>
                    <button onClick={()=>{setMarca(di,a.id,"atrasou");setMenu(null);}} className="w-full text-left px-2 py-1.5 rounded-lg hover:bg-amber-50 text-amber-600">Atrasou</button>
                    <button onClick={()=>{setMarca(di,a.id,null);setMenu(null);}} className="w-full text-left px-2 py-1.5 rounded-lg hover:bg-slate-50 text-slate-500">Limpar marca</button>
                    {can("excluir") && <button onClick={()=>{remover(di,a.id);setMenu(null);}} className="w-full text-left px-2 py-1.5 rounded-lg hover:bg-rose-50 text-rose-600 border-t border-slate-100 mt-1">Remover</button>}
                  </div>; };

  // ===== GRADE SEMANAL: setor → turno → pessoas × dias =====
  const semanaListas=[0,1,2,3,4,5,6].map(di=>(diaDe(di)||[]).filter(valido));
  const pessoasSemana={};
  semanaListas.forEach(arr=>arr.forEach(a=>{ const k=a.tipo+"-"+a.pid; const o=pessoasSemana[k]||(pessoasSemana[k]={k,tipo:a.tipo,pid:a.pid,p:pessoaDe(a),cont:{}}); if(a.turno!=="folga") o.cont[a.turno]=(o.cont[a.turno]||0)+1; }));
  const turnoBase=(o)=>{ const e=Object.entries(o.cont).sort((x,y)=>y[1]-x[1])[0]; return e?e[0]:"manha"; };
  const alocsDe=(o,di)=>semanaListas[di].filter(a=>a.tipo===o.tipo&&String(a.pid)===String(o.pid));
  const ordemTipo={clt:0,pj:1,free:2};
  const setoresGrade=SETORES.filter(([k])=>setorF==="todos"||setorF===k).map(([sk,sl,sc])=>{
    const doSetor=Object.values(pessoasSemana).filter(o=>setorDe(o.p)===sk);
    const grupos=GRUPOS_TURNO.map(([tk,tl,ti])=>({tk,tl,ti,rows:doSetor.filter(o=>turnoBase(o)===tk).sort((x,y)=>(ordemTipo[x.tipo]-ordemTipo[y.tipo])||String(nome(x.pid,x.tipo)).localeCompare(nome(y.pid,y.tipo)))})).filter(g=>g.rows.length);
    return {sk,sl,sc,grupos};
  }).filter(s=>s.grupos.length);
  const horaEntrada=(a)=> String(a.h||(TURNOS[a.turno]||{}).h||"").split("–")[0];
  const abrirMenuGrade=(e,di,a)=>{ e.stopPropagation(); if(!editavel) return; const r=e.currentTarget.getBoundingClientRect(); const x=Math.min(r.left, window.innerWidth-190), y=(r.bottom+300>window.innerHeight)? Math.max(8,r.top-300) : r.bottom+4; setMenu(menu&&menu.id===a.id&&menu.di===di?null:{di,id:a.id,grade:true,x,y}); };
  const alocMenu = menu&&menu.grade ? (semanaListas[menu.di]||[]).find(a=>a.id===menu.id) : null;
  useEffect(()=>{ if(!menu||!menu.grade) return; const f=()=>setMenu(null); window.addEventListener("click",f); window.addEventListener("scroll",f,true); return ()=>{ window.removeEventListener("click",f); window.removeEventListener("scroll",f,true); }; },[menu]);

  return <div className="fade-in">
    <PageHeader title="Escala por unidade" sub="Uma aba por casa · filtro por setor · layout compacto · menu (⋯) para turno, faltou, atrasou, folga">
      {editavel && <Btn icon={I.plus} onClick={()=>setAdd(HOJE_IDX)}>Incluir colaborador</Btn>}
    </PageHeader>

    <AvisoAguardandoInicio/>
    {/* Abas das casas */}
    <div className="flex gap-2 overflow-x-auto pb-1 mb-4">
      {unidades.map(u=>
        <button key={u.id} onClick={()=>setUSel(u.id)}
          className={cx("shrink-0 px-4 py-2.5 rounded-xl text-sm font-semibold border transition flex items-center gap-2",
            uSel===u.id?"grad-brand text-white border-transparent shadow-glow":"bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>
          <span className="w-2.5 h-2.5 rounded-full" style={{background:uSel===u.id?"#fff":u.cor}}/>{u.nome}</button>)}
    </div>

    {!editavel && <div className="mb-4 p-3 rounded-xl bg-amber-50 text-amber-700 text-sm flex items-center gap-2"><Icon d={I.shield} className="w-4 h-4"/> Seu perfil ({/* */}somente leitura) não tem permissão para editar a escala.</div>}

    <div className="grid grid-cols-5 gap-2 sm:gap-3 mb-4">
      {[["CLT",nClt,"brand",I.user],["Freelancers",nFree,"free",I.coffee],["PJ",nPj,"pj",I.briefcase],["Folgas",nFolga,"slate",I.sun],["Coberturas",nCob,"green",I.check]].map(([l,v,t,d])=>
        <Card key={l} className="p-2 sm:p-4 flex flex-col sm:flex-row items-center sm:items-center gap-1 sm:gap-3 text-center sm:text-left">
          <div className={cx("hidden sm:grid w-10 h-10 rounded-xl place-items-center text-white", t==="brand"?"grad-brand":t==="free"?"bg-free-500":t==="pj"?"bg-sky-600":t==="green"?"bg-emerald-500":"bg-slate-400")}><Icon d={d} className="w-5 h-5"/></div>
          <div><div className="text-lg sm:text-2xl font-extrabold text-slate-900 leading-none">{v}</div><div className="text-[10px] sm:text-xs text-slate-500 mt-0.5">{l}</div></div>
        </Card>)}
    </div>

    {/* Filtro por setor */}
    <div className="flex flex-wrap gap-2 mb-3">
      <span className="flex items-center gap-1 text-xs font-bold text-slate-400 uppercase mr-1 self-center"><Icon d={I.filter} className="w-3.5 h-3.5"/>Setor</span>
      <button onClick={()=>setSetorF("todos")} className={cx("px-3 py-1.5 rounded-lg text-xs font-semibold border transition", setorF==="todos"?"grad-brand text-white border-transparent":"bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>Todos</button>
      {SETORES.map(([k,l,c])=><button key={k} onClick={()=>setSetorF(k)} className={cx("px-3 py-1.5 rounded-lg text-xs font-semibold border transition flex items-center gap-1.5", setorF===k?"text-white border-transparent":"bg-white border-slate-200 text-slate-600 hover:bg-slate-50")} style={setorF===k?{background:c}:{}}><span className="w-2 h-2 rounded-full" style={{background:setorF===k?"#fff":c}}/>{l}</button>)}
    </div>

    {/* Passador de datas — navegar semanas, ir para uma data e ver o dia atual marcado */}
    <div className="flex flex-wrap items-center gap-2 mb-3">
      <div className="flex items-center gap-1 bg-white border border-slate-200 rounded-xl p-1">
        <button onClick={()=>setSemanaBase(s=>addDias(s,-7))} className="w-8 h-8 rounded-lg grid place-items-center text-slate-500 hover:bg-slate-50" title="Semana anterior"><Icon d={I.arrow} className="w-4 h-4 rotate-180"/></button>
        <span className="px-2 text-sm font-semibold text-slate-700 tabular-nums whitespace-nowrap">{semanaLabel}</span>
        <button onClick={()=>setSemanaBase(s=>addDias(s,7))} className="w-8 h-8 rounded-lg grid place-items-center text-slate-500 hover:bg-slate-50" title="Próxima semana"><Icon d={I.arrow} className="w-4 h-4"/></button>
      </div>
      <Btn variant={semanaAtual?"soft":"ghost"} icon={I.calendar} onClick={()=>setSemanaBase(segDaSemana(new Date()))}>Semana de hoje</Btn>
      <label className="flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-sm text-slate-600">
        <Icon d={I.search} className="w-4 h-4 text-slate-400"/><span className="hidden sm:inline">Ir para data</span>
        <input type="date" value={ymd(semanaBase)} onChange={e=>irParaData(e.target.value)} className="outline-none bg-transparent text-slate-800"/>
      </label>
    </div>

    <div className="flex flex-wrap items-center gap-2 mb-3">
      <div className="inline-flex p-1 bg-slate-100 rounded-xl">
        {[["grade","Grade semanal",I.grid],["quadro","Quadro (arrastar)",I.calendar]].map(([k,l,d])=><button key={k} onClick={()=>trocaModo(k)} className={cx("px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition", modo===k?"bg-white shadow-soft text-brand-700":"text-slate-500 hover:text-slate-700")}><Icon d={d} className="w-3.5 h-3.5"/>{l}</button>)}
      </div>
      {modo==="grade" && <Btn size="sm" variant="ghost" icon={I.download} onClick={()=>window.print()}>Imprimir / PDF</Btn>}
    </div>

    {modo==="grade" && <div id="escala-print">
      <div className="hidden print:block mb-2 text-lg font-bold">Escala {uAtual?.nome} — {semanaLabel}</div>
      {setoresGrade.length===0 && <Card className="p-10 text-center text-sm text-slate-400">Ninguém escalado nesta semana{setorF!=="todos"?" neste setor":""}. {editavel && "Use “Incluir colaborador” ou o quadro."}</Card>}
      {setoresGrade.map(s=><div key={s.sk} className="mb-6">
        <div className="flex items-center gap-2 mb-2 pb-1.5 border-b-2" style={{borderColor:s.sc+"55"}}>
          <span className="w-2.5 h-2.5 rounded-full" style={{background:s.sc}}/><h3 className="font-extrabold text-slate-800 uppercase tracking-wide text-sm">{s.sl}</h3>
          <span className="text-xs text-slate-400">{s.grupos.reduce((n,g)=>n+g.rows.length,0)} pessoa(s)</span>
        </div>
        {s.grupos.map(g=>{
          return <div key={g.tk} className="mb-3">
            <div className="text-[11px] font-bold uppercase tracking-wide text-slate-500 mb-1 flex items-center gap-1">{g.ti} {g.tl}</div>
            <div className="overflow-x-auto rounded-2xl border border-slate-200 bg-white">
              <table className="w-full min-w-[760px] border-collapse text-xs table-fixed">
                <thead><tr>
                  <th className="sticky left-0 z-10 bg-slate-50 w-[130px] sm:w-[170px] text-left px-2.5 py-2 font-semibold text-slate-500 border-b border-r border-slate-200">Colaborador</th>
                  {[0,1,2,3,4,5,6].map(di=>{ const folgas=g.rows.filter(o=>alocsDe(o,di).some(a=>a.turno==="folga")).map(o=>corPessoaEscala(o.p,o.tipo,o.pid));
                    const bg=fundoFolga(folgas); const trab=g.rows.filter(o=>alocsDe(o,di).some(a=>a.turno!=="folga")).length; const d=datasSemana[di];
                    const txt=bg?(folgas.length===1?textoSobreCor(folgas[0]):"#fff"):null;
                    return <th key={di} className={cx("relative px-1 py-1.5 border-b border-slate-200 font-semibold align-top", ehHoje(di)&&"ring-2 ring-inset ring-amber-400")} style={bg?{background:bg,color:txt}:{background:ehHoje(di)?"#fffbeb":"#f8fafc"}} title={folgas.length?"Folga: "+g.rows.filter(o=>alocsDe(o,di).some(a=>a.turno==="folga")).map(o=>nome(o.pid,o.tipo)).join(", "):""}>
                      <div className={cx("text-base font-extrabold leading-tight", !bg&&"text-slate-800")}>{d.getDate()}/{String(d.getMonth()+1).padStart(2,"0")}</div>
                      <div className={cx("text-[10px] uppercase", !bg&&"text-slate-400")}>{DIAS[di]}{ehHoje(di)?" · hoje":""}</div>
                      <div className={cx("text-[10px] font-normal", !bg&&"text-slate-400")}>{trab} na escala</div>
                      {editavel && <button onClick={()=>{ setAddTurno(g.tk); setAdd(di); }} title="Incluir freelancer neste turno" className="no-print mt-1 text-[9px] font-bold px-1.5 py-0.5 rounded-md bg-white/85 text-slate-600 hover:bg-white border border-slate-200">+FL</button>}
                    </th>; })}
                </tr></thead>
                <tbody>
                  {g.rows.map(o=>{ const cor=corPessoaEscala(o.p,o.tipo,o.pid); const tx=textoSobreCor(cor); const nm=nome(o.pid,o.tipo);
                    return <tr key={o.k} className="group">
                      <td className="sticky left-0 z-10 bg-white px-2 py-1.5 border-b border-r border-slate-100">
                        <span className="inline-block max-w-full truncate px-2 py-0.5 rounded-md text-[11px] font-bold" style={{background:cor,color:tx}} title={nm}>{nomeSobrenome(nm)}</span>
                        <div className="text-[10px] text-slate-400 truncate mt-0.5">{o.tipo==="free"?"Freela · ":o.tipo==="pj"?"PJ · ":""}{(o.p&&(o.p.cargo||o.p.servico))||""}</div>
                      </td>
                      {[0,1,2,3,4,5,6].map(di=>{ const as=alocsDe(o,di);
                        return <td key={di} className={cx("px-1 py-1.5 border-b border-slate-100 text-center align-middle", ehHoje(di)&&"bg-amber-50/50")}>
                          {as.length===0 ? (editavel ? <button onClick={()=>addColab(di,o.pid,o.tipo,g.tk)} title={"Escalar "+nm+" em "+labelDiaFull(di)} className="no-print w-full h-8 rounded-lg border border-dashed border-transparent text-slate-300 hover:border-slate-300 hover:text-slate-500 opacity-0 group-hover:opacity-100 focus:opacity-100 transition">+</button> : <span className="text-slate-200">—</span>)
                          : as.map(a=> a.turno==="folga"
                            ? <button key={a.id} onClick={e=>abrirMenuGrade(e,di,a)} className="inline-flex flex-col items-center px-2 py-0.5 rounded-md bg-rose-50 text-rose-500 font-bold leading-tight"><span className="text-[11px]">folga</span></button>
                            : <button key={a.id} onClick={e=>abrirMenuGrade(e,di,a)} className="inline-flex flex-col items-center leading-tight m-0.5">
                                <span className={cx("px-2 py-0.5 rounded-md text-[11px] font-bold", a.marca==="faltou"&&"line-through opacity-60")} style={{background:cor,color:tx}}>{String(nm).split(" ")[0]}</span>
                                <span className="text-[10px] text-slate-500 tabular-nums">{a.turno!==g.tk?(TURNOS[a.turno]||{}).l+" ":""}{horaEntrada(a)}</span>
                                {a.marca==="faltou" && <span className="text-[9px] font-bold text-rose-600">faltou</span>}
                                {a.marca==="atrasou" && <span className="text-[9px] font-bold text-amber-600">atrasou</span>}
                              </button>)}
                        </td>; })}
                    </tr>; })}
                </tbody>
              </table>
            </div>
          </div>; })}
      </div>)}
      <p className="no-print text-xs text-slate-400">Cada pessoa tem uma cor. Quando alguém está de <b>folga</b>, o cabeçalho do dia fica com a cor dessa pessoa. Clique no nome para trocar turno, horário, marcar falta/atraso ou remover; clique no espaço vazio para escalar; <b>+FL</b> inclui um freelancer no turno.</p>
      {alocMenu && ReactDOM.createPortal(menuDe(menu.di, alocMenu, "fixed z-[70]", {left:menu.x, top:menu.y}), document.body)}
    </div>}

    {modo==="quadro" && <Card className="p-3 overflow-x-auto">
      <div className="px-1 pb-2 text-sm font-semibold text-slate-500 flex items-center gap-2"><Icon d={I.pin} className="w-4 h-4" style={{color:uAtual?.cor}}/> Escala de <b className="text-slate-800">{uAtual?.nome}</b> · <span className="text-slate-400">{semanaLabel}</span></div>
      <div className="grid grid-cols-7 gap-3 min-w-[980px]">
        {DIAS.map((dia,di)=>
          <div key={di} onDragOver={e=>{e.preventDefault();setOver(di);}} onDragLeave={()=>setOver(o=>o===di?null:o)} onDrop={()=>onDrop(di)}
            className={cx("rounded-2xl p-2 min-h-[260px] bg-slate-50/70 transition", over===di&&"drag-over", ehHoje(di)&&"ring-2 ring-brand-300 bg-brand-50/40")}>
            <div className="flex items-center justify-between px-1 mb-2">
              <span className="text-sm font-bold text-slate-700">{labelDiaFull(di)}{ehHoje(di)&&<span className="ml-1 text-[10px] text-brand-600">• hoje</span>}</span>
              {editavel && <button onClick={()=>setAdd(di)} className="w-6 h-6 rounded-lg bg-white border border-slate-200 grid place-items-center text-slate-400 hover:text-brand-600 hover:border-brand-300"><Icon d={I.plus} className="w-3.5 h-3.5"/></button>}
            </div>
            <div className="space-y-1.5">
              {(diaDe(di)||[]).filter(valido).filter(passaSetor).map(a=>{ const t=TURNOS[a.turno]; const setor=SETOR_MAP[setorDe(pessoaDe(a))]; const aberto=menu&&menu.di===di&&menu.id===a.id;
                return <div key={a.id} className="relative">
                  <div draggable={editavel} onDragStart={()=>setDrag({aloc:a,from:di})} onDragEnd={()=>{setDrag(null);setOver(null);}}
                    className={cx("rounded-lg pl-2 pr-1 py-1.5 bg-white shadow-soft border border-slate-100 border-l-[3px]", editavel&&"cursor-grab", a.marca==="faltou"&&"opacity-70")}
                    style={{borderLeftColor:setor?.c||"#6366f1"}}>
                    <div className="flex items-center gap-1.5">
                      <Avatar name={nome(a.pid,a.tipo)} tone={a.tipo==="clt"?"brand":a.tipo==="pj"?"slate":"free"} size="w-5 h-5"/>
                      <span className="text-[11px] font-semibold text-slate-800 flex-1 min-w-0 leading-tight break-words" title={nome(a.pid,a.tipo)}>{nomeSobrenome(nome(a.pid,a.tipo))}</span>
                      {editavel && <button onClick={()=>setMenu(aberto?null:{di,id:a.id})} className="text-slate-400 hover:text-slate-700 font-bold px-1 leading-none">⋯</button>}
                    </div>
                    <div className="flex items-center gap-1 mt-1 flex-wrap">
                      <span className="text-[9px] font-bold px-1.5 py-0.5 rounded" style={{background:(setor?.c||"#6366f1")+"22",color:setor?.c}}>{t.l}</span>
                      {a.turno!=="folga" && <span className="text-[9px] font-semibold text-slate-500 tabular-nums">{a.h||t.h}</span>}
                      {a.tipo==="pj" && <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-sky-50 text-sky-700">PJ</span>}
                      {a.marca==="faltou" && <Badge tone="red">Faltou</Badge>}
                      {a.marca==="atrasou" && <Badge tone="amber">Atrasou</Badge>}
                    </div>
                  </div>
                  {aberto && menuDe(di,a,"absolute z-30 top-full left-0 mt-1")}
                </div>;})}
            </div>
          </div>)}
      </div>
    </Card>}

    <Modal open={!!editH} onClose={()=>setEditH(null)}>
      {editH && <div className="p-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-bold text-slate-900">Editar horário — {labelDiaFull(editH.di)}</h3>
          <button onClick={()=>setEditH(null)} className="text-slate-400 hover:text-slate-600"><Icon d={I.x}/></button>
        </div>
        <div className="flex items-end gap-3">
          <Field label="Entrada"><Input type="time" value={editH.hi} onChange={e=>setEditH({...editH,hi:e.target.value})}/></Field>
          <span className="pb-3 text-slate-400">até</span>
          <Field label="Saída"><Input type="time" value={editH.hf} onChange={e=>setEditH({...editH,hf:e.target.value})}/></Field>
        </div>
        <div className="flex gap-2 mt-5">
          <Btn variant="ghost" className="flex-1" onClick={()=>setEditH(null)}>Cancelar</Btn>
          <Btn className="flex-1" icon={I.check} onClick={()=>{ setHorario(editH.di,editH.id,`${editH.hi}–${editH.hf}`); setEditH(null); toast("Horário atualizado"); }}>Salvar horário</Btn>
        </div>
      </div>}
    </Modal>

    <Modal open={add!==null} onClose={()=>{ setAdd(null); setAddTurno(null); }}>
      <div className="p-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-bold text-slate-900">Incluir colaborador em {uAtual?.nome} {add!==null&&`— ${labelDiaFull(add)}`}</h3>
          <button onClick={()=>setAdd(null)} className="text-slate-400 hover:text-slate-600"><Icon d={I.x}/></button>
        </div>
        <p className="text-sm text-slate-500 mb-4">Inclua um freelancer (cobertura), um CLT auto-cadastrado ou um prestador PJ. CLT e freelancer registram ponto; o PJ aparece na escala sem bater ponto.</p>
        <div className="space-y-2 max-h-[50vh] overflow-y-auto">
          {[...freelas.filter(f=>f.status==="ativo").map(f=>({...f,_t:"free"})), ...clts.filter(c=>c._auto).map(c=>({...c,_t:"clt"})), ...(pjs||[]).filter(p=>p.status!=="encerrado").map(p=>({...p,_t:"pj",cargo:p.servico||"Prestador PJ"}))].map(f=>
            <button key={f._t+f.id} onClick={()=>addColab(add,f.id,f._t)} className={cx("w-full flex items-center gap-3 p-3 rounded-xl border border-slate-200 transition", f._t==="clt"?"hover:border-brand-400 hover:bg-brand-50/40":f._t==="pj"?"hover:border-sky-400 hover:bg-sky-50/40":"hover:border-free-400 hover:bg-free-50/40")}>
              <Avatar name={f.nome} src={f.foto} tone={f._t==="clt"?"brand":f._t==="pj"?"slate":"free"}/>
              <div className="text-left flex-1"><div className="font-semibold text-slate-800 flex items-center gap-2">{f.nome} <Badge tone={f._t==="clt"?"brand":f._t==="pj"?"blue":"free"}>{f._t==="clt"?"CLT":f._t==="pj"?"PJ":"Freela"}</Badge></div><div className="text-xs text-slate-500">{f.cargo} · casa base: {f.unidade==="todas"||f.unidade==null?"Todas as casas":unidadeNome(f.unidade,unidades)}</div></div>
              <Icon d={I.plus} className={cx("w-4 h-4", f._t==="clt"?"text-brand-500":f._t==="pj"?"text-sky-500":"text-free-500")}/>
            </button>)}
        </div>
      </div>
    </Modal>
  </div>;
}

/* ============================ PONTO AO VIVO (só registros reais) ============================ */
const STATUS = {
  trabalhando:{l:"Trabalhando",tone:"green",c:"#10b981"},
  pausa:{l:"Em almoço/pausa",tone:"amber",c:"#f59e0b"},
  encerrado:{l:"Encerrado",tone:"slate",c:"#94a3b8"},
  aguardando:{l:"Aguardando entrada",tone:"blue",c:"#0ea5e9"},
  faltou:{l:"Faltou",tone:"red",c:"#f43f5e"},
  folga:{l:"Folga",tone:"slate",c:"#cbd5e1"},
};
function PontoLive() {
  const { registros:registrosAll, clts, freelas, unidades, escala, escalaOv, pontoHist, valorFreela } = useStore();
  // Só os registros de HOJE alimentam o status ao vivo (a coleção persiste entre os dias).
  const _hoje=hojeStr();
  const registros = registrosAll.filter(r=>!r.data || r.data===_hoje);
  const [ambiente,setAmbiente]=useState("clt");   // 'clt' | 'free' — ambientes distintos
  const [casaFiltro,setCasaFiltro]=useState("todas"); // filtrar por unidade
  const [linkModal,setLinkModal]=useState(null); // null | 'clt' | 'free'
  const [detalhe,setDetalhe]=useState(null);     // modal de detalhe das abas (Trabalhando/Almoço/Faltas)
  const [abertoPid,setAbertoPid]=useState(null); // colaborador expandido (ver as 4 batidas do dia)
  const clock=useClock();
  // As 4 batidas do dia de um colaborador (em tempo real), na ordem canônica.
  const batidasDoDia=(nm)=>{ const meus=registros.filter(r=>r.nome===nm);
    const acoes = ambiente==="free" ? [["Entrada","Check-in"],["Saída","Checkout"]]
      : [["Entrada","Entrada"],["Início intervalo","Saída p/ almoço"],["Fim intervalo","Retorno do almoço"],["Saída","Saída final"]];
    return acoes.map(([canon,label])=>{ const r=meus.find(x=>x.acao===canon); return {label, hora:r?(r.hora||"").slice(0,5):null}; }); };
  const casaNome = casaFiltro==="todas" ? null : unidadeNome(casaFiltro,unidades);
  const toast=useContext(ToastCtx);
  const nome=(pid,tipo)=>pessoaNome(pid,tipo,clts,freelas);
  const ehFree=ambiente==="free";
  const hrefBase = (typeof window!=="undefined" ? window.location.href.split("#")[0] : "");
  const isLocalFile = hrefBase.startsWith("file:");
  // Endereço público do sistema (depois de publicado). Se estiver em arquivo local,
  // o gestor informa a URL pública para que o link funcione no celular do colaborador.
  const [pubUrl,setPubUrl]=useState("");
  const base = (pubUrl.trim() ? pubUrl.trim().replace(/#.*$/,"").replace(/\/+$/,"")+"/" : hrefBase);
  const linkDe=(m)=> comTenantUrl(base.replace(/#.*$/,""), "ponto-"+m);

  // turno de HOJE de uma pessoa (resolve exceção da data OU padrão semanal)
  const _hojeIdx=HOJE_IDX; const _hojeStr=hojeStr();
  const _uidsHoje=new Set([...Object.keys(escala||{}),...Object.keys(escalaOv||{})]);
  const turnoHojeDe=(pid,tipo)=>{ let t=null; _uidsHoje.forEach(uid=>{ diaEscala(escala,escalaOv,uid,_hojeStr,_hojeIdx).forEach(a=>{ if(a.pid===pid&&a.tipo===tipo) t=a.turno; }); }); return t; };

  // Escalados hoje do AMBIENTE + CASA selecionados (folga aparece marcada, mas não conta como falta)
  const escalados=[];
  _uidsHoje.forEach(uid=>{
    if(casaFiltro!=="todas" && Number(uid)!==casaFiltro) return;
    diaEscala(escala,escalaOv,uid,_hojeStr,_hojeIdx).forEach(a=>{ if(a.tipo!==ambiente) return; escalados.push({...a, unidadeId:Number(uid)}); });
  });
  // Casa os registros do dia com a pessoa escalada por pid → CPF → nome (robusto p/ status ao vivo)
  const cpfDe=(pid,tipo)=>{ const p=(tipo==="clt"?clts:freelas).find(x=>x.id===pid); return p?soDigitos(p.cpf):""; };
  const regsDe=(a)=>{ const nm=nome(a.pid,a.tipo); const idS=String(a.pid); const cpf=cpfDe(a.pid,a.tipo);
    return registros.filter(r=> (r.pid!=null && String(r.pid)===idS) || (cpf && r.cpf && String(r.cpf)===cpf) || r.nome===nm ); };
  // horário (em minutos do dia) de um registro — usa min; se faltar, converte de "HH:MM"
  const minDe=(r)=>{ if(r.min!=null) return Number(r.min); const m=/^(\d{1,2}):(\d{2})/.exec(r.hora||""); return m? Number(m[1])*60+Number(m[2]) : 0; };
  const statusDe=(a)=>{
    if(a.marca==="faltou") return "faltou";
    const regs=regsDe(a);
    if(!regs.length) return a.turno==="folga" ? "folga" : "aguardando";
    // Um CHECKOUT ("Saída") encerra o dia — mesmo que tenha entrado via ajuste aprovado,
    // e independentemente da ordem em que os registros chegaram no feed.
    if(regs.some(r=>r.acao==="Saída")) return "encerrado";
    // Caso contrário, decide pela batida MAIS RECENTE por HORÁRIO (não pela posição no array).
    const ord=regs.slice().sort((x,y)=>minDe(x)-minDe(y));
    const last=ord[ord.length-1].acao;
    return last==="Início intervalo"?"pausa":"trabalhando";
  };
  // Tempo em jornada em TEMPO REAL (desde a Entrada). Congela na Saída quando o dia é encerrado
  // (assim não fica "correndo horas" depois do checkout / ajuste aprovado).
  const nowSec = clock.getHours()*3600 + clock.getMinutes()*60 + clock.getSeconds();
  const tempoDe=(a)=>{
    const regs=regsDe(a);
    const ent=regs.find(r=>r.acao==="Entrada");
    if(!ent || ent.min==null) return null;
    const sai=regs.find(r=>r.acao==="Saída");
    const endSec=(sai && sai.min!=null) ? sai.min*60 : (sai ? minDe(sai)*60 : nowSec);
    let d=endSec - ent.min*60; if(d<0) d+=86400; return d; // segundos
  };
  // Ignora linhas "fantasma": escala com colaborador que não existe mais (nome não resolve → "—").
  const linhas=escalados.map(a=>({a, nm:nome(a.pid,a.tipo), st:statusDe(a), tempo:tempoDe(a), folgaTrab:a.turno==="folga"}))
    .filter(x=> x.nm && x.nm!=="—");
  const cont=(s)=>linhas.filter(x=>x.st===s).length;
  // Resolve FOLGA pela escala DEFINIDA PELO GERENTE (turno marcado como "folga"), nunca automática.
  const folgaDe=(g)=>{ if(g.tipo!=="clt") return false; const p=clts.find(x=>x.nome===g.nome); if(!p) return false;
    return turnoHojeDe(p.id,"clt")==="folga"; };
  // Apuração de horas (histórico + registros reais de hoje), filtrada pelo ambiente
  const apuracao=apurarHoras([...pontoHist, ...registros], folgaDe).filter(x=>x.completo && x.tipo===ambiente && (!casaNome||x.unidade===casaNome));
  const freelaValorDe=(x)=>{ const f=freelas.find(ff=>ff.nome===x.nome); return f?valorFreela(f):0; };
  const totalValorFree=ehFree?apuracao.reduce((s,x)=>s+freelaValorDe(x),0):0;
  // abre o modal de detalhe de uma aba (lista de quem está naquele status)
  const abrirDetalhe=(st)=>{ const grupo=linhas.filter(x=>x.st===st); if(!grupo.length){ toast("Ninguém "+(STATUS[st]?.l||st).toLowerCase()+" agora"); return; }
    setDetalhe({ titulo:STATUS[st]?.l||st, itens:grupo.map(x=>({nm:x.nm, sub:unidadeNome(x.a.unidadeId,unidades), badge:x.a.tipo==="clt"?"CLT":"Freela", tone:x.a.tipo==="clt"?"brand":"free", extra:(st==="trabalhando"&&x.tempo!=null)?fmtHMS(x.tempo):null})) }); };
  // Comprovante do dia (todas as batidas de hoje) — imprimir/salvar PDF para enviar
  const comprovanteDoDia=()=>{
    const rows=registros.slice().reverse().map(r=>`<tr><td>${r.hora||""}</td><td>${r.nome||""}</td><td>${r.tipo==="clt"?"CLT":"Freela"}</td><td>${r.acao||""}</td><td>${r.unidade||""}</td></tr>`).join("")
      || `<tr><td colspan="5" style="text-align:center;color:#94a3b8">Nenhuma batida registrada hoje.</td></tr>`;
    if(imprimirDoc("Comprovante do dia", `<h1>Comprovante de Registros de Ponto</h1><div class="sub">${new Date().toLocaleDateString("pt-BR")} · todas as batidas do dia</div>
      <table><thead><tr><th>Hora</th><th>Colaborador</th><th>Vínculo</th><th>Registro</th><th>Unidade</th></tr></thead><tbody>${rows}</tbody></table>`)) toast("Comprovante do dia gerado");
  };
  // Folha de ponto mensal consolidada por colaborador (com campo de assinatura)
  const folhaDoMes=()=>{
    const mes=hojeStr().slice(0,7);
    const apur=apurarHoras([...pontoHist, ...registrosAll], folgaDe).filter(x=>x.completo && String(x.dia||"").slice(0,7)===mes);
    const porNome={};
    apur.forEach(x=>{ const g=(porNome[x.nome]=porNome[x.nome]||{nome:x.nome,tipo:x.tipo,dias:0,min:0,extra:0,extra100:0}); g.dias++; g.min+=x.trabalhado||0; g.extra+=x.extras||0; g.extra100+=x.extras100||0; });
    const rows=Object.values(porNome).map(g=>`<tr><td>${g.nome}</td><td>${g.tipo==="clt"?"CLT":"Freela"}</td><td>${g.dias}</td><td>${fmtHoras(g.min)}</td><td>${g.extra?fmtHoras(g.extra):"—"}</td><td>${g.extra100?fmtHoras(g.extra100):"—"}</td></tr>`).join("")
      || `<tr><td colspan="6" style="text-align:center;color:#94a3b8">Sem jornadas concluídas neste mês.</td></tr>`;
    if(imprimirDoc("Folha de ponto mensal", `<h1>Folha de Ponto — ${mes.split("-").reverse().join("/")}</h1><div class="sub">Consolidado mensal por colaborador · para conferência e assinatura</div>
      <table><thead><tr><th>Colaborador</th><th>Vínculo</th><th>Dias</th><th>Horas trabalhadas</th><th>Extras</th><th>Extra 100%</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="sign"><div>Assinatura do colaborador</div><div>Assinatura do gestor / responsável</div></div>`)) toast("Folha mensal gerada");
  };

  return <div className="fade-in">
    <PageHeader title="Ponto ao vivo" sub="Status em tempo real · ambientes separados CLT e Freela · o colaborador registra pelo link (WhatsApp)">
      <Btn variant="ghost" icon={I.doc} onClick={comprovanteDoDia}>Comprovante do dia</Btn>
      <Btn variant="ghost" icon={I.download} onClick={folhaDoMes}>Folha do mês</Btn>
      <Btn variant="ghost" icon={I.link} onClick={()=>setLinkModal("clt")}>Gerar link CLT</Btn>
      <Btn variant="free" icon={I.link} onClick={()=>setLinkModal("free")}>Gerar link Freelancer</Btn>
    </PageHeader>

    {/* Seletor de AMBIENTE: CLT | Freela (acompanhamento em tempo real separado) */}
    <div className="inline-flex p-1 bg-slate-100 rounded-xl mb-3">
      {[["clt","CLT","brand"],["free","Freela","free"]].map(([k,l,t])=>
        <button key={k} onClick={()=>setAmbiente(k)}
          className={cx("px-5 py-2 rounded-lg text-sm font-semibold transition", ambiente===k?(k==="clt"?"grad-brand text-white shadow-glow":"bg-free-500 text-white shadow"):"text-slate-500 hover:text-slate-700")}>
          {l}</button>)}
    </div>

    {/* Filtro por CASA */}
    <FiltroCasa casa={casaFiltro} setCasa={setCasaFiltro} unidades={unidades}/>

    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      <Card className="p-4 flex items-center gap-3">
        <span className="relative w-3 h-3"><span className="absolute inset-0 rounded-full bg-emerald-500 live-dot"/></span>
        <div><div className="text-sm font-bold text-slate-800">AO VIVO · {ehFree?"Freela":"CLT"}</div><div className="text-xs text-slate-400 tabular-nums">{clock.toLocaleTimeString("pt-BR")}</div></div>
      </Card>
      <Card className="p-4 cursor-pointer hover:shadow-glow hover:-translate-y-0.5 transition" onClick={()=>abrirDetalhe("trabalhando")}><div className="text-2xl font-extrabold text-emerald-600">{cont("trabalhando")}</div><div className="text-xs text-slate-500 flex items-center gap-1">Trabalhando <Icon d={I.arrow} className="w-3 h-3 text-slate-300"/></div></Card>
      <Card className="p-4 cursor-pointer hover:shadow-glow hover:-translate-y-0.5 transition" onClick={()=>abrirDetalhe("pausa")}><div className="text-2xl font-extrabold text-amber-600">{cont("pausa")}</div><div className="text-xs text-slate-500 flex items-center gap-1">Em almoço/pausa <Icon d={I.arrow} className="w-3 h-3 text-slate-300"/></div></Card>
      <Card className="p-4 cursor-pointer hover:shadow-glow hover:-translate-y-0.5 transition" onClick={()=>abrirDetalhe("faltou")}><div className="text-2xl font-extrabold text-rose-600">{cont("faltou")}</div><div className="text-xs text-slate-500 flex items-center gap-1">Faltas <Icon d={I.arrow} className="w-3 h-3 text-slate-300"/></div></Card>
    </div>

    <div className="grid lg:grid-cols-5 gap-4">
      {/* Painel de status */}
      <Card className="lg:col-span-3 overflow-hidden">
        <div className="px-5 py-3 border-b border-slate-100"><h3 className="font-bold text-slate-900 flex items-center gap-2"><Icon d={I.users} className="w-4 h-4 text-brand-500"/> Escalados de hoje — {ehFree?"Freelancers":"CLT"} · status ao vivo</h3></div>
        {linhas.length===0
          ? <div className="p-10 text-center text-slate-400">Nenhum {ehFree?"freelancer":"CLT"} escalado para hoje.</div>
          : <div className="divide-y divide-slate-50 max-h-[460px] overflow-auto">
              {linhas.map(({a,nm,st,tempo})=>{ const s=STATUS[st]; const aberto=abertoPid===a.id;
                return <div key={a.id}>
                  <div className="flex items-center gap-3 py-3 px-5 cursor-pointer hover:bg-slate-50/70" onClick={()=>setAbertoPid(aberto?null:a.id)}>
                  <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{background:s.c}}/>
                  <Avatar name={nm} tone={a.tipo==="clt"?"brand":"free"} size="w-9 h-9"/>
                  <div className="min-w-0"><div className="font-semibold text-slate-800 truncate">{nm}</div>
                    <div className="text-xs text-slate-500">{unidadeNome(a.unidadeId,unidades)} · {SETOR_MAP[setorDe((a.tipo==="clt"?clts:freelas).find(p=>p.id===a.pid))]?.l}</div></div>
                  <div className="ml-auto flex items-center gap-2">
                    {st==="trabalhando" && tempo!=null && <span className="flex items-center gap-1 text-xs font-bold text-emerald-600 tabular-nums" title="Tempo em jornada (ao vivo)"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 live-dot"/>{fmtHMS(tempo)}</span>}
                    <Badge tone={a.tipo==="clt"?"brand":"free"}>{a.tipo==="clt"?"CLT":"Freela"}</Badge>
                    <Badge tone={s.tone}>{s.l}</Badge>
                    <Icon d={aberto?I.x:I.plus} className="w-3.5 h-3.5 text-slate-300"/>
                  </div>
                </div>
                {aberto && <div className="px-5 pb-3 -mt-1">
                  <div className={cx("grid gap-2", ambiente==="free"?"grid-cols-2":"grid-cols-2 sm:grid-cols-4")}>
                    {batidasDoDia(nm).map((b,i)=><div key={i} className={cx("rounded-lg p-2 text-center border", b.hora?"bg-emerald-50 border-emerald-100":"bg-slate-50 border-slate-100")}>
                      <div className="text-[10px] uppercase tracking-wide text-slate-400 font-bold">{b.label}</div>
                      <div className={cx("text-sm font-bold tabular-nums", b.hora?"text-emerald-700":"text-slate-300")}>{b.hora||"—"}</div>
                    </div>)}
                  </div>
                </div>}
                </div>;})}
            </div>}
      </Card>

      {/* Feed de registros reais (do ambiente selecionado) */}
      <Card className="lg:col-span-2 overflow-hidden">
        <div className="px-5 py-3 border-b border-slate-100"><h3 className="font-bold text-slate-900 flex items-center gap-2"><Icon d={I.broadcast} className="w-4 h-4 text-emerald-500"/> Registros reais · {ehFree?"Freela":"CLT"}</h3></div>
        {registros.filter(r=>r.tipo===ambiente && (!casaNome||r.unidade===casaNome)).length===0

          </div>}

    {/* Modal de DETALHE das abas (Trabalhando / Almoço / Faltas) — clique nos cards */}

              <Badge tone={it.tone}>{it.badge}</Badge>

}

/* ============================ QUIOSQUE DE PONTO ============================ */
function PontoKiosk({ mode, onClose }) {
  const { unidades, clts, freelas, escala, escalaOv, registros, freelancerEscaladoHoje, addRegistro, salvarClt, salvarFreela, cadastrarPublico, enviarAtestado, enviarAjuste } = useStore();
  const ativos = mode==="clt" ? clts : freelas.filter(f=>f.status==="ativo");
  const [fluxo,setFluxo]=useState("escolha"); // escolha | registro | cadastro
  const [unidadeId,setUnidadeId]=useState(unidades[0]?.id);
  const [pid,setPid]=useState(null);
  const [cpf,setCpf]=useState("");
  const [cpfErr,setCpfErr]=useState("");
  const soDigitos=(s)=>(s||"").replace(/\D/g,"");
  // Escalado hoje? Comparação ROBUSTA: casa por id (string) OU por CPF (resolve o escalado→pessoa),
  // aceita qualquer casa e qualquer turno de trabalho (só bloqueia FOLGA). Assim, cadastrado + na escala = bate ponto.
  const escaladoHojePid=(p)=>{
    if(!p) return false;
    const hoje=hojeStr();
    const alvoId=String(p.id); const alvoCpf=soDigitos(p.cpf); const lista=mode==="clt"?clts:freelas;
    const alvoNome=(p.nome||"").trim().toLowerCase();
    const uids=new Set([...Object.keys(escala||{}), ...Object.keys(escalaOv||{})]);
    for(const uid of uids){
      const arr=diaEscala(escala, escalaOv, uid, hoje, HOJE_IDX);  // exceção da data OU padrão semanal
      const ok=(arr||[]).some(a=>{
        if(a.turno==="folga") return false;
        if(a.tipo && a.tipo!==mode) return false;
        if(String(a.pid)===alvoId) return true;
        const pes=lista.find(x=>String(x.id)===String(a.pid));      // fallback por CPF e por NOME
        if(!pes) return false;
        if(alvoCpf.length===11 && soDigitos(pes.cpf)===alvoCpf) return true;
        return !!(alvoNome && (pes.nome||"").trim().toLowerCase()===alvoNome);
      });
      if(ok) return true;
    }
    return false;
  };
  const buscarCpf=()=>{
    const d=soDigitos(cpf);
    if(d.length<11){ setCpfErr("Digite os 11 números do CPF."); return; }
    const p=ativos.find(x=>soDigitos(x.cpf)===d);
    if(!p){
      // Já cadastrado no OUTRO vínculo? Orienta a abrir o link certo (em vez de pedir novo cadastro).
      const outra = mode==="clt" ? freelas : clts;
      const pOutro = outra.find(x=>soDigitos(x.cpf)===d);
      if(pOutro){ const ehFixo=pOutro.vinculo==="fixo"; const rot = mode==="clt" ? "Freelancer" : (ehFixo?"CLT (Freela Fixo)":"CLT");
        setCpfErr(pOutro.nome.split(" ")[0]+", seu cadastro é "+rot+". Abra o link de "+(mode==="clt"?"Freelancer":"CLT")+" para bater o ponto — não precisa cadastrar de novo."); return; }
      setCpfErr("CPF não encontrado. Use “Fazer cadastro (1º acesso)”."); return;
    }
    if(!escaladoHojePid(p)){ setCpfErr(p.nome.split(" ")[0]+", você não está na escala de hoje — não é possível registrar ponto."); return; }
    setPid(p.id); setUnidadeId(p.unidade||unidades[0]?.id); setCpfErr("");
    setPainel(true); // vai para o PAINEL DE STATUS do colaborador (mostra estado + ações certas do tipo)
  };
  const [step,setStep]=useState(0); // 0 CPF · 1 selfie · 2 gps
  const [foto,setFoto]=useState(null);
  const [camErr,setCamErr]=useState(null);
  const [geo,setGeo]=useState(null);
  const [geoErr,setGeoErr]=useState(null);
  const [acao,setAcao]=useState("Entrada");     // ação canônica escolhida
  const [acaoLabel,setAcaoLabel]=useState("");  // rótulo amigável (ex.: "Saída para almoço")
  const [painel,setPainel]=useState(false);     // painel de status do colaborador
  const [comprovante,setComprovante]=useState(null); // comprovante digital da marcação
  const [cadOk,setCadOk]=useState(false);
  const [cadEnviando,setCadEnviando]=useState(false);
  const [cadErro,setCadErro]=useState("");
  // Envio de atestado pelo colaborador
  const [at,setAt]=useState({cpf:"",data:hojeStr(),horas:8,obs:"",arquivo:null,nomeArq:""});
  const [atStatus,setAtStatus]=useState(""); // "" | enviando | ok | erro
  const upAtestado=(file)=>{ if(!file) return; const rd=new FileReader(); rd.onload=async()=>{ const dados=file.type&&file.type.indexOf("image")===0?await compressImg(rd.result):rd.result; setAt(p=>({...p,arquivo:dados,nomeArq:file.name})); }; rd.readAsDataURL(file); };
  const enviarAtestadoColab=()=>{
    const d=(at.cpf||"").replace(/\D/g,"");
    const pessoa=(mode==="clt"?clts:freelas).find(x=>(x.cpf||"").replace(/\D/g,"")===d);
    if(d.length<11){ setAtStatus("cpf"); return; }
    if(!pessoa){ setAtStatus("naoencontrado"); return; }
    if(!at.arquivo){ setAtStatus("semarquivo"); return; }
    setAtStatus("enviando");
    Promise.resolve(enviarAtestado({ pid:String(pessoa.id), cpf:d, nome:pessoa.nome, tipo:"atestado", data:at.data, horas:Number(at.horas)||8, obs:at.obs, anexo:{nome:at.nomeArq,dados:at.arquivo}, ts:new Date().getTime() }))
      .then(()=>setAtStatus("ok")).catch(()=>setAtStatus("erro"));
  };
  // ---- Solicitação de AJUSTE de ponto pelo colaborador ----
  const acoesAjuste = mode==="free" ? [["Entrada","Check-in"],["Saída","Checkout"]]
    : [["Entrada","Entrada"],["Início intervalo","Saída para almoço"],["Fim intervalo","Retorno do almoço"],["Saída","Saída final"]];
  const [aj,setAj]=useState({cpf:"",data:hojeStr(),acao:"Entrada",hora:"08:00",motivo:""});
  const [ajStatus,setAjStatus]=useState(""); // "" | cpf | naoencontrado | semmotivo | enviando | ok | erro
  const enviarAjusteColab=()=>{
    const d=(aj.cpf||"").replace(/\D/g,"");
    const pessoa=(mode==="clt"?clts:freelas).find(x=>(x.cpf||"").replace(/\D/g,"")===d);
    if(d.length<11){ setAjStatus("cpf"); return; }
    if(!pessoa){ setAjStatus("naoencontrado"); return; }
    if(!(aj.motivo||"").trim()){ setAjStatus("semmotivo"); return; }
    const [hh,mm]=(aj.hora||"08:00").split(":").map(Number); const min=(hh||0)*60+(mm||0);
    const uni=(unidades.find(u=>u.id===pessoa.unidade)||unidades[0]||{}).nome||"";
    const rot=(acoesAjuste.find(a=>a[0]===aj.acao)||[])[1]||aj.acao;
    setAjStatus("enviando");
    Promise.resolve(enviarAjuste({ pid:String(pessoa.id), cpf:d, nome:pessoa.nome, tipo:mode, unidade:uni,
      acao:aj.acao, acaoLabel:rot, data:aj.data, hora:aj.hora, min, motivo:aj.motivo.trim(), status:"pendente", ts:new Date().getTime() }))
      .then(()=>setAjStatus("ok")).catch(()=>setAjStatus("erro"));
  };
  const videoRef=useRef(null); const streamRef=useRef(null);
  const clock=useClock();
  const accent = mode==="clt"?"brand":"free";
  const pSel=(mode==="clt"?clts:freelas).find(x=>x.id===pid);
  // LOCAL DINÂMICO: a casa vem do cadastro do colaborador identificado pelo CPF (não é fixo).
  const unidade=(pSel && unidades.find(u=>u.id===pSel.unidade)) || unidades.find(u=>u.id===unidadeId) || unidades[0];
  const escalado = mode==="clt" || (pid && freelancerEscaladoHoje(pid));

  const startCam=async()=>{ setCamErr(null);
    try{ const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}); streamRef.current=s; if(videoRef.current){videoRef.current.srcObject=s; await videoRef.current.play();} }
    catch{ setCamErr("Câmera indisponível neste ambiente. Use 'Simular selfie' para continuar a demonstração."); } };
  const stopCam=()=>{ streamRef.current?.getTracks().forEach(t=>t.stop()); streamRef.current=null; };
  useEffect(()=>{ if(fluxo==="registro"&&step===1&&!foto) startCam(); return stopCam; },[step,fluxo]);

  const capturar=()=>{ const v=videoRef.current;
    if(v&&v.videoWidth){ const c=document.createElement("canvas"); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext("2d").drawImage(v,0,0); compressImg(c.toDataURL("image/jpeg",0.8)).then(setFoto); }
    else setFoto("data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect width='300' height='300' fill='#1e1b4b'/><circle cx='150' cy='120' r='55' fill='${accent==="clt"?"#6366f1":"#f97316"}'/><rect x='80' y='190' width='140' height='90' rx='45' fill='${accent==="clt"?"#6366f1":"#f97316"}'/><text x='150' y='285' font-size='16' fill='#fff' text-anchor='middle' font-family='sans-serif'>selfie simulada</text></svg>`));
    stopCam(); };
  const pegarGeo=()=>{ setGeoErr(null);
    if(!navigator.geolocation){ setGeoErr("Geolocalização não suportada."); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>{ if(!temCoordenadas(unidade)){ setGeoErr("A unidade "+(unidade&&unidade.nome||"")+" ainda não tem localização cadastrada — avise o gestor. Registro liberado sem cerca."); setGeo({dist:0,ok:true}); return; }
        const {latitude,longitude}=pos.coords; const dist=haversine(latitude,longitude,Number(unidade.lat),Number(unidade.lng)); setGeo({dist,ok:dist<=(Number(unidade.raio)||100)}); },
      ()=>{ setGeoErr("Permissão de GPS negada. Simulando posição dentro da cerca."); setGeo({dist:38,ok:true}); }, {enableHighAccuracy:true,timeout:8000}); };
  const simGeo=()=>setGeo({dist:42,ok:true});

  // ===== Estado do colaborador hoje (deriva das batidas reais) — casa por pid/CPF/nome =====
  const _hojeK=hojeStr();
  const meusRegs=(registros||[]).filter(r=> (r.pid&&pSel&&String(r.pid)===String(pSel.id)) || (r.cpf&&pSel&&soDigitos(r.cpf)===soDigitos(pSel.cpf)) || (pSel&&r.nome===pSel.nome))
    .filter(r=>!r.data||r.data===_hojeK); // mais recente primeiro
  const ultimaAcao=meusRegs[0]?.acao;
  const estado = !ultimaAcao ? "aguardando" : (ultimaAcao==="Saída"?"encerrado" : ultimaAcao==="Início intervalo"?"pausa" : "trabalhando");
  const segStartMin = meusRegs[0]?.min; // início do estado atual (para cronômetro)
  const entradaHoje = meusRegs.slice().reverse().find(r=>r.acao==="Entrada");
  // rótulos amigáveis por tipo
  const rotuloAcao=(a)=> mode==="free"
    ? (a==="Entrada"?"Check-in":a==="Saída"?"Checkout":a)
    : ({ "Entrada":"Entrada","Início intervalo":"Saída para almoço","Fim intervalo":"Retorno do almoço","Saída":"Saída final" }[a]||a);
  // ações disponíveis conforme TIPO + estado
  const acoesDisponiveis = mode==="free"
    ? (estado==="aguardando"?["Entrada"] : estado==="trabalhando"?["Saída"] : [])
    : (estado==="aguardando"?["Entrada"] : estado==="trabalhando"?["Início intervalo","Saída"] : estado==="pausa"?["Fim intervalo"] : []);

  // inicia uma marcação (selfie+GPS) para a ação escolhida no painel
  const iniciarAcao=(canon)=>{ setAcao(canon); setAcaoLabel(rotuloAcao(canon)); setFoto(null); setGeo(null); setGeoErr(null); setPainel(false); setStep(1); };
  // registra a ação escolhida e gera COMPROVANTE digital
  const registrarAcao=()=>{
    const now=new Date();
    const hora=now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    const protocolo=(soDigitos(pSel?.cpf).slice(-4)||"0000")+"-"+now.getTime().toString(36).slice(-5).toUpperCase();
    addRegistro({ nome: pSel?.nome || "Colaborador", pid: pSel?.id!=null?String(pSel.id):null, cpf: soDigitos(pSel?.cpf), tipo:mode, acao, unidade:unidade.nome, hora, geo:true, selfie:true, foto, protocolo });
    setComprovante({ acao, label:acaoLabel||rotuloAcao(acao), hora, unidade:unidade.nome, nome:pSel?.nome, protocolo, encerrou:acao==="Saída" });
    setStep(0);
  };
  const registrarCadastro=(dados)=>{
    // Grava no BANCO CENTRAL e só libera após confirmar a sincronização
    setCadEnviando(true); setCadErro("");
    Promise.resolve(cadastrarPublico({...dados, tipo:mode, status:"ativo"}))
      .then(()=>{ setCadEnviando(false); setCadOk(true); })
      .catch(()=>{ setCadEnviando(false); setCadErro("Não foi possível salvar seu cadastro no servidor. Verifique sua internet e tente novamente."); });
  };

  return <div className="fixed inset-0 z-50 grad-ink grad-hero flex items-center justify-center p-4">

            <p className="text-slate-500 mt-1">Comprovante digital do seu ponto</p>
            <div className="mt-4 mx-auto max-w-xs text-left rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm">
              <div className="flex justify-between py-1"><span className="text-slate-500">Colaborador</span><b className="text-slate-800">{comprovante.nome}</b></div>
              <div className="flex justify-between py-1"><span className="text-slate-500">Registro</span><b className="text-slate-800">{comprovante.label}</b></div>
              <div className="flex justify-between py-1"><span className="text-slate-500">Horário</span><b className="text-slate-800 tabular-nums">{comprovante.hora}</b></div>
              <div className="flex justify-between py-1"><span className="text-slate-500">Unidade</span><b className="text-slate-800">{comprovante.unidade}</b></div>

            </div>
            {comprovante.encerrou
              ? <Btn className="w-full mt-4" variant={accent==="clt"?"primary":"free"} onClick={onClose}>Concluir</Btn>

            <Btn variant="ghost" className="w-full mt-2" onClick={onClose}>Fechar</Btn>
          </div>
        : painel ? <div className="fade-in">
            <div className="text-center mb-4">

              <div className="text-xs font-bold uppercase tracking-wide mb-1" style={{color: estado==="trabalhando"?"#059669":estado==="pausa"?"#d97706":estado==="encerrado"?"#64748b":"#0284c7"}}>
                {estado==="trabalhando"?"Em período de trabalho":estado==="pausa"?"Em pausa / almoço":estado==="encerrado"?"Jornada encerrada":"Aguardando entrada"}</div>
              {(estado==="trabalhando"||estado==="pausa") && segStartMin!=null &&
                <div className="text-4xl font-extrabold tabular-nums" style={{color:estado==="trabalhando"?"#059669":"#d97706"}}>{fmtHMS((()=>{let d=(clock.getHours()*3600+clock.getMinutes()*60+clock.getSeconds())-segStartMin*60;if(d<0)d+=86400;return d;})())}</div>}
              <div className="text-xs text-slate-500 mt-1">{estado==="trabalhando"?"trabalhando agora · comprovação de jornada":estado==="pausa"?"em pausa agora":estado==="encerrado"?"até a próxima!":"bata sua entrada para começar"}</div>
            </div>
            <div className="space-y-2">
              {acoesDisponiveis.map(a=>{ const isSaida=a==="Saída"; const isPausa=a==="Início intervalo";
                return <Btn key={a} className="w-full" size="lg" variant={isSaida?"danger":isPausa?"ghost":(accent==="clt"?"primary":"free")} icon={isPausa?I.utensils:I.clock} onClick={()=>iniciarAcao(a)}>{rotuloAcao(a)}</Btn>; })}
              {acoesDisponiveis.length===0 && <p className="text-center text-slate-400 text-sm py-2">Sua jornada de hoje já foi encerrada. 👍</p>}

        : cadEnviando ? <div className="py-12 text-center fade-in">

            <div className="space-y-3">
              <button onClick={()=>{setFluxo("registro");setStep(0);}} className="w-full p-4 rounded-2xl border border-slate-200 hover:border-brand-400 hover:bg-brand-50/40 flex items-center gap-4 text-left transition">
                <div className={cx("w-11 h-11 rounded-xl grid place-items-center text-white", accent==="clt"?"grad-brand":"bg-free-500")}><Icon d={I.clock}/></div>
                <div className="flex-1"><div className="font-bold text-slate-900">Registrar ponto</div><div className="text-sm text-slate-500">Entrada/saída com selfie + GPS</div></div><Icon d={I.arrow} className="w-4 h-4 text-slate-400"/></button>

                <div className="flex-1"><div className="font-bold text-slate-900">Fazer cadastro (1º acesso)</div><div className="text-sm text-slate-500">Preencher dados e enviar documentos</div></div><Icon d={I.arrow} className="w-4 h-4 text-slate-400"/></button>

                <div className="w-11 h-11 rounded-xl bg-sky-500 grid place-items-center text-white"><Icon d={I.doc}/></div>

                <div className="flex-1"><div className="font-bold text-slate-900">Solicitar ajuste de ponto</div><div className="text-sm text-slate-500">Esqueceu de bater? Peça a correção ao gestor</div></div><Icon d={I.arrow} className="w-4 h-4 text-slate-400"/></button>
              <button onClick={()=>{ window.location.hash="meus-docs"; }} className="w-full p-4 rounded-2xl border border-slate-200 hover:border-brand-400 hover:bg-brand-50/40 flex items-center gap-4 text-left transition">
